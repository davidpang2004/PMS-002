// Uncontrolled input that supports Chinese IME without React resetting the DOM value mid-composition.
const ImeInput = ({ value, onCommit, placeholder, className }) => {
  const ref = React.useRef(null);
  const composing = React.useRef(false);
  const lastExternal = React.useRef(value);

  React.useEffect(() => {
    if (ref.current && !composing.current && value !== lastExternal.current) {
      ref.current.value = value;
    }
    lastExternal.current = value;
  }, [value]);

  return (
    <input
      ref={ref}
      type="text"
      defaultValue={value}
      placeholder={placeholder}
      className={className}
      onCompositionStart={() => { composing.current = true; }}
      onCompositionEnd={(e) => { composing.current = false; onCommit(e.target.value); }}
      onChange={(e) => { if (!composing.current) onCommit(e.target.value); }}
    />
  );
};

const MetadataEditor = ({ metadata, onChange, keyParameters = [] }) => {
  const { t } = useLang();
  const entries = Object.entries(metadata || {});
  const suggestions = normalizeKeyParameters(keyParameters);

  const updateKey = (oldKey, newKey) => {
    const clean = (newKey || "").trim();
    if (!clean || clean === oldKey) return;
    const m = { ...(metadata || {}) };
    m[clean] = m[oldKey];
    delete m[oldKey];
    onChange(m);
  };
  // Both "design" and "actual" are stored as a composed display string PLUS
  // their own value/unit/description parts (design's parts are prefixed
  // "design" to not collide with actual's). PART_FIELDS maps which part-field
  // names go with which composed string.
  const PART_FIELDS = {
    actual: { value: "value", unit: "unit", description: "description" },
    design: { value: "designValue", unit: "designUnit", description: "designDescription" },
  };
  const partsOf = (valObj, composedKey) => {
    const pf = PART_FIELDS[composedKey];
    return (valObj[pf.value] || valObj[pf.unit] || valObj[pf.description])
      ? { value: valObj[pf.value] || "", unit: valObj[pf.unit] || "", description: valObj[pf.description] || "" }
      : splitActualString(valObj[composedKey]);
  };

  // Update one part (value/unit/description) of either the design or the
  // actual composed string, keeping the composed string (the plain text
  // search/display everywhere else in the app reads) recomposed from them.
  // Falls back to splitting the existing composed text the first time an
  // older entry (saved before this split existed) is edited, so its content
  // isn't lost.
  const updatePart = (key, composedKey, field, val) => {
    const prev = (metadata || {})[key];
    const prevObj = (prev && typeof prev === "object")
      ? prev
      : { design: typeof prev === "string" ? prev : "", actual: "" };
    const pf = PART_FIELDS[composedKey];
    const nextParts = { ...partsOf(prevObj, composedKey), [field]: val };
    onChange({
      ...(metadata || {}),
      [key]: {
        ...prevObj,
        [pf.value]: nextParts.value,
        [pf.unit]: nextParts.unit,
        [pf.description]: nextParts.description,
        [composedKey]: composeActualString(nextParts.value, nextParts.unit, nextParts.description),
      },
    });
  };

  const nextUnusedKey = () => {
    const used = new Set(Object.keys(metadata || {}).map((k) => k.toLowerCase()));
    const suggested = suggestions.find((k) => !used.has(k.toLowerCase()));
    if (suggested) return suggested;
    let key = "field"; let i = 1;
    while ((metadata || {})[key] !== undefined) key = `field_${++i}`;
    return key;
  };

  const addField = () => {
    const key = nextUnusedKey();
    onChange({ ...(metadata || {}), [key]: { design: "", actual: "" } });
  };
  const removeField = (key) => {
    const m = { ...(metadata || {}) }; delete m[key]; onChange(m);
  };

  const FieldKeyPicker = ({ currentKey }) => {
    const matchedSuggestion = suggestions.find((k) => k.toLowerCase() === currentKey.toLowerCase());
    const isListed = !!matchedSuggestion;
    const selectValue = isListed ? matchedSuggestion : "__current_custom__";

    const renameCustom = () => {
      const next = window.prompt(t("请输入新的字段/关键参数名称：", "Enter the new field/key parameter name:"), isListed ? "" : currentKey);
      if (next === null) return;
      const clean = (next || "").trim();
      if (!clean) return;
      updateKey(currentKey, clean);
    };

    return (
      <select
        value={selectValue}
        onChange={(e) => {
          const v = e.target.value;
          if (v === "__enter_new__") {
            renameCustom();
            return;
          }
          if (v === "__current_custom__") return;
          updateKey(currentKey, v);
        }}
        onDoubleClick={() => {
          if (!isListed) renameCustom();
        }}
        title={isListed
          ? t("从全局关键参数列表中选择，或选择\"自定义/新增\"", "Choose from the global key parameter list, or select \"Custom / add\"")
          : t("自定义字段。打开列表选择全局键，或双击重命名此自定义字段。", "Custom field. Open the list to pick a global key, or double-click to rename this custom field.")
        }
        className={`text-xs px-2 py-1 border rounded w-1/3 min-w-[220px] font-mono bg-stone-50 focus:outline-none focus:border-amber-600 ${
          isListed ? "border-stone-300" : "border-amber-400 text-amber-800"
        }`}
      >
        {!isListed && <option value="__current_custom__">{currentKey}</option>}
        {suggestions.map((k) => <option key={k} value={k}>{k}</option>)}
        <option value="__enter_new__">{t("自定义 / 新增...", "Custom / add...")}</option>
      </select>
    );
  };

  return (
    <div className="space-y-1.5">
      <div className="text-[10px] text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1">
        {t("字段名称使用全局关键参数下拉列表。从列表中选择，或选择\"自定义/新增\"以输入不在列表中的字段。", "Field names use the global key parameter dropdown. Choose from the list, or select \"Custom/add\" to enter a field not on the list.")}
      </div>

      {entries.length === 0 && (
        <div className="text-xs text-stone-500 italic py-2">
          {t("暂无元数据。点击\"添加字段\"，从下拉列表中选择或输入自定义关键参数。", "No metadata yet. Click \"Add field\" and choose from the dropdown or enter a custom key parameter.")}
        </div>
      )}

      {entries.map(([key, val]) => {
        const valObj = (val && typeof val === "object") ? val : { design: typeof val === "string" ? val : "", actual: "" };
        // The actual value is stored as three parts (value/unit/description)
        // alongside the composed "design"/"actual" strings -- same breakdown
        // as the "Extract key parameters" panel. Older/manually-typed
        // entries that only have the composed string get split on the fly
        // for display.
        const designParts = partsOf(valObj, "design");
        const actualParts = partsOf(valObj, "actual");
        return (
          <div key={key} className="space-y-1">
            <div className="flex gap-1.5 items-center">
              <FieldKeyPicker currentKey={key} />
              <button onClick={() => removeField(key)} className="text-stone-400 hover:text-red-600 p-1 ml-auto">
                <X size={12} />
              </button>
            </div>
            <div className="flex gap-1.5 items-start pl-1">
              <span className="text-[10px] text-stone-500 w-[90px] shrink-0 text-right pr-1 pt-1">{t("设计 / 要求", "Design / spec")}</span>
              <div className="flex-1 grid grid-cols-[2fr_1.2fr_3fr] gap-1">
                <ImeInput
                  value={designParts.value}
                  onCommit={(v) => updatePart(key, "design", "value", v)}
                  placeholder={t("值", "Value")}
                  className="text-xs px-2 py-1 border border-stone-300 rounded focus:outline-none focus:border-amber-600"
                />
                <ImeInput
                  value={designParts.unit}
                  onCommit={(v) => updatePart(key, "design", "unit", v)}
                  placeholder={t("单位", "Unit")}
                  className="text-xs px-2 py-1 border border-stone-300 rounded focus:outline-none focus:border-amber-600"
                />
                <ImeInput
                  value={designParts.description}
                  onCommit={(v) => updatePart(key, "design", "description", v)}
                  placeholder={t("描述", "Description")}
                  className="text-xs px-2 py-1 border border-stone-300 rounded focus:outline-none focus:border-amber-600"
                />
              </div>
            </div>
            <div className="flex gap-1.5 items-start pl-1 pb-1 border-b border-stone-100">
              <span className="text-[10px] text-stone-500 w-[90px] shrink-0 text-right pr-1 pt-1">{t("实测值", "Actual value")}</span>
              <div className="flex-1 grid grid-cols-[2fr_1.2fr_3fr] gap-1">
                <ImeInput
                  value={actualParts.value}
                  onCommit={(v) => updatePart(key, "actual", "value", v)}
                  placeholder={t("值", "Value")}
                  className="text-xs px-2 py-1 border border-stone-300 rounded focus:outline-none focus:border-amber-600"
                />
                <ImeInput
                  value={actualParts.unit}
                  onCommit={(v) => updatePart(key, "actual", "unit", v)}
                  placeholder={t("单位", "Unit")}
                  className="text-xs px-2 py-1 border border-stone-300 rounded focus:outline-none focus:border-amber-600"
                />
                <ImeInput
                  value={actualParts.description}
                  onCommit={(v) => updatePart(key, "actual", "description", v)}
                  placeholder={t("描述", "Description")}
                  className="text-xs px-2 py-1 border border-stone-300 rounded focus:outline-none focus:border-amber-600"
                />
              </div>
            </div>
          </div>
        );
      })}
      <button onClick={addField} className="text-[11px] text-stone-600 hover:text-amber-700 flex items-center gap-1 mt-1">
        <Plus size={11} /> {t("添加字段", "Add field")}
      </button>
    </div>
  );
};

/* =============================================================================
 * UI: SEARCH PANEL
 * =============================================================================
 */
const SearchPanel = ({ index, refMap, getPathFor, onOpenDoc, onJumpToNode, tree, scopeNodeId, onOpenAISettings }) => {
  const { t } = useLang();
  const [q, setQ] = useState("");
  const [showUnref, setShowUnref] = useState(false);
  const [scopeToFolder, setScopeToFolder] = useState(false);
  const [mode, setMode] = useState("keyword"); // "keyword" | "ai"

  // --- AI Q&A mode state ------------------------------------------------
  const [aiSettings, setAiSettings] = useState({ configured: false, library_installed: true });
  const [question, setQuestion] = useState("");
  const [asking, setAsking] = useState(false);
  const [aiAnswer, setAiAnswer] = useState(null); // { answer, citations, coverage } | null
  const [aiError, setAiError] = useState("");

  useEffect(() => {
    if (mode === "ai") StorageAdapter.getAISettings().then(setAiSettings).catch(() => {});
  }, [mode]);

  const scopeNode = useMemo(
    () => (tree && scopeNodeId ? findNode(tree, scopeNodeId) : null),
    [tree, scopeNodeId]
  );

  useEffect(() => { if (!scopeNode) setScopeToFolder(false); }, [scopeNode]);

  const askQuestion = async () => {
    if (!question.trim() || asking) return;
    setAsking(true); setAiError(""); setAiAnswer(null);
    try {
      const data = await StorageAdapter.askAI(question.trim(), scopeToFolder && scopeNode ? scopeNode.id : null);
      setAiAnswer(data);
    } catch (e) {
      setAiError(e.message || String(e));
    } finally {
      setAsking(false);
    }
  };

  const scopeDocIdSet = useMemo(() => {
    if (!scopeToFolder || !scopeNode) return null;
    return new Set(collectAllDocIds(scopeNode));
  }, [scopeToFolder, scopeNode]);

  const results = useMemo(() => {
    const words = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let pool = index;
    if (scopeDocIdSet) pool = pool.filter((d) => scopeDocIdSet.has(d.id));
    if (showUnref) pool = pool.filter((d) => !(refMap.get(d.id)?.length));
    if (!words.length) return pool;
    return pool.filter((entry) => {
      const haystack = [
        entry.id,
        entry.name || "",
        entry.sn || "",
        entry.ocrText || "",
        entry.description || "",
        ...Object.keys(entry.metadata || {}),
        ...Object.values(entry.metadata || {}).map((v) => {
          if (v && typeof v === "object") return `${v.design || ""} ${v.actual || ""}`;
          return String(v);
        }),
      ].join(" ").toLowerCase();
      return words.every((w) => haystack.includes(w));
    });
  }, [q, index, refMap, showUnref, scopeDocIdSet]);

  const unrefCount = useMemo(
    () => index.filter((d) => !(refMap.get(d.id)?.length)).length,
    [index, refMap]
  );

  const poolSize = useMemo(() => {
    let p = scopeDocIdSet ? index.filter((d) => scopeDocIdSet.has(d.id)) : index;
    if (showUnref) p = p.filter((d) => !(refMap.get(d.id)?.length));
    return p.length;
  }, [index, refMap, showUnref, scopeDocIdSet]);

  return (
    <div className="p-3 space-y-2">
      <div className="flex rounded overflow-hidden border border-stone-300 w-fit">
        <button
          onClick={() => setMode("keyword")}
          className={"text-[11px] px-2.5 py-1 flex items-center gap-1 " + (mode === "keyword"
            ? "bg-stone-700 text-white"
            : "bg-white text-stone-600 hover:bg-stone-100")}
        >
          <Search size={11} /> {t("关键词搜索", "Keyword search")}
        </button>
        <button
          onClick={() => setMode("ai")}
          className={"text-[11px] px-2.5 py-1 flex items-center gap-1 border-l border-stone-300 " + (mode === "ai"
            ? "bg-purple-700 text-white"
            : "bg-white text-stone-600 hover:bg-stone-100")}
        >
          <Sparkles size={11} /> {t("AI 问答", "Ask AI")}
        </button>
      </div>

      {scopeNode && (
        <label className="flex items-center gap-1.5 text-[11px] text-stone-600 cursor-pointer">
          <input
            type="checkbox"
            checked={scopeToFolder}
            onChange={(e) => setScopeToFolder(e.target.checked)}
          />
          <span>{t("仅限此节点及子节点：", "This node and its children only:")}</span>
          <span className="font-medium text-amber-700 truncate max-w-[100px]" title={scopeNode.name}>
            {scopeNode.name}
          </span>
        </label>
      )}

      {mode === "ai" ? (
        <div className="space-y-2">
          <div className="relative">
            <Sparkles size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-purple-500" />
            <input
              type="text"
              value={question}
              onChange={(e) => setQuestion(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") askQuestion(); }}
              placeholder={t("用一句话提问，AI 会跨文档查找答案…", "Ask a question in plain language — AI will search across documents…")}
              disabled={!aiSettings.configured}
              className="w-full pl-8 pr-3 py-1.5 text-xs border border-stone-300 rounded focus:outline-none focus:border-purple-600 disabled:bg-stone-50 disabled:text-stone-400"
            />
          </div>

          {!aiSettings.configured ? (
            <div className="text-[11px] text-stone-600 bg-purple-50 border border-purple-200 rounded p-2 flex items-center gap-1.5">
              <Sparkles size={11} className="text-purple-600 shrink-0" />
              {t("需要先配置 Gemini API Key 才能使用 AI 问答。", "AI Q&A needs a Gemini API Key configured first.")}
              {onOpenAISettings && (
                <button onClick={onOpenAISettings} className="text-purple-700 hover:underline font-medium shrink-0">
                  {t("配置 API Key", "Configure API Key")}
                </button>
              )}
            </div>
          ) : (
            <button
              onClick={askQuestion}
              disabled={asking || !question.trim()}
              className="text-xs px-3 py-1.5 rounded flex items-center gap-1.5 border border-purple-300 text-purple-800 bg-purple-50 hover:bg-purple-100 disabled:opacity-40"
            >
              {asking
                ? (<><Loader size={13} className="animate-spin" /> {t("正在查找…", "Searching…")}</>)
                : (<><Sparkles size={13} /> {t("提问", "Ask")}</>)}
            </button>
          )}

          {aiError && (
            <div className="text-xs bg-red-50 border border-red-200 rounded p-2 text-red-700">{aiError}</div>
          )}

          {aiAnswer && (
            <div className="space-y-2">
              <div className="text-xs bg-purple-50 border border-purple-200 rounded p-3 text-stone-800 whitespace-pre-wrap leading-relaxed">
                {aiAnswer.answer}
              </div>
              <div className="text-[10px] text-stone-400">
                {t(
                  `基于 ${aiAnswer.coverage.total} 篇候选文档，其中 ${aiAnswer.coverage.withText} 篇有可提取文字`,
                  `Based on ${aiAnswer.coverage.total} candidate document(s), ${aiAnswer.coverage.withText} with extractable text`
                )}
              </div>
              {aiAnswer.citations.length > 0 && (
                <div className="space-y-1">
                  <div className="text-[10px] uppercase tracking-wider text-stone-500">{t("来源文档", "Source documents")}</div>
                  {aiAnswer.citations.map((c) => {
                    const refs = refMap.get(c.docId) || [];
                    return (
                      <div
                        key={c.docId}
                        className="border border-stone-200 rounded p-2 text-xs hover:bg-purple-50 hover:border-purple-300 cursor-pointer flex items-center gap-1.5"
                        title={t("单击打开 · 双击跳转到节点", "Click to open · double-click to jump to node")}
                        onClick={() => onOpenDoc(c.docId)}
                        onDoubleClick={(e) => { e.preventDefault(); refs[0] && onJumpToNode(refs[0]); }}
                      >
                        <FileText size={12} className="text-stone-400 shrink-0" />
                        <span className="font-medium text-stone-800 truncate">{c.name}</span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </div>
      ) : (
      <>
      <div className="relative">
        <Search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-stone-400" />
        <input
          type="text"
          value={q}
          onChange={(e) => setQ(e.target.value)}
          placeholder={t("按编号、名称、描述或元数据搜索…", "Search by number, name, description, or metadata…")}
          className="w-full pl-8 pr-3 py-1.5 text-xs border border-stone-300 rounded focus:outline-none focus:border-amber-600"
        />
      </div>
      <div className="flex items-center justify-between">
        <label className="flex items-center gap-1.5 text-[11px] text-stone-600 cursor-pointer">
          <input
            type="checkbox"
            checked={showUnref}
            onChange={(e) => setShowUnref(e.target.checked)}
          />
          {t("仅显示未引用", "Show unreferenced only")}
          {unrefCount > 0 && (
            <span className="text-[10px] tabular-nums px-1 bg-amber-100 text-amber-800 rounded">
              {unrefCount}
            </span>
          )}
        </label>
        <span className="text-[11px] text-stone-500">
          {q.trim()
            ? t(`共 ${poolSize} 条，匹配 ${results.length} 条`, `${poolSize} total, ${results.length} matched`)
            : t(`共 ${results.length} 份文档`, `${results.length} documents total`)}
        </span>
      </div>
      <div className="space-y-1 max-h-[60vh] overflow-auto">
        {results.map((r) => {
          const refs = refMap.get(r.id) || [];
          return (
            <div
              key={r.id}
              className="border border-stone-200 rounded p-2 text-xs hover:bg-amber-50 hover:border-amber-300 cursor-pointer"
              title={t("单击打开 · 双击跳转到节点", "Click to open · double-click to jump to node")}
              onClick={() => onOpenDoc(r.id)}
              onDoubleClick={(e) => { e.preventDefault(); refs[0] && onJumpToNode(refs[0]); }}
            >
              <div className="font-medium text-stone-800 truncate">{r.name}</div>
              <div className="font-mono text-[10px] text-stone-500 mt-0.5">{r.id}</div>
              {r.description && (
                <div className="text-[10px] text-stone-600 mt-0.5 line-clamp-2">{r.description}</div>
              )}
              {refs.length === 0 && (
                <div className="text-[10px] text-amber-700 mt-0.5 italic">{t("未引用", "Unreferenced")}</div>
              )}
              {refs.map((nodeId) => (
                <div
                  key={nodeId}
                  className="text-[10px] text-amber-700 mt-0.5 truncate hover:underline"
                  onClick={(e) => { e.stopPropagation(); onJumpToNode(nodeId); }}
                >
                  📁 {getPathFor(nodeId)}
                </div>
              ))}
              {Object.keys(r.metadata || {}).length > 0 && (
                <div className="flex flex-wrap gap-1 mt-1">
                  {Object.entries(r.metadata).map(([k, v]) => {
                    const valObj = (v && typeof v === "object") ? v : { design: String(v), actual: "" };
                    return (
                      <span key={k} className="text-[9px] bg-stone-100 px-1.5 py-0.5 rounded font-mono">
                        {k}: {valObj.design || "—"} / {valObj.actual || "—"}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
      </>
      )}
    </div>
  );
};

/* =============================================================================
 * UI: DATABOOK PANEL
 * ---------------------------------------------------------------------------
 * A third sidebar tab. Renders the entire tree with checkboxes for every
 * document. Lets the user pick what to include, then generates a PDF.
 *
 * Selection state is held as: Map<nodeId, Set<docId>>
 *   — a doc selected at multiple linked nodes counts separately, so the
 *     databook will include it once per linked node (matching how the user
 *     organized them).
 * =============================================================================
 */
const DatabookPanel = ({ tree, docIndex, getPathFor, formatBytes, onOpenDoc }) => {
  const { t } = useLang();
  // Map<nodeId, Set<docId>>
  const [selection, setSelection] = useState(new Map());
  const [expanded, setExpanded] = useState(new Set());
  const [generating, setGenerating] = useState(false);
  const [showTitleDialog, setShowTitleDialog] = useState(false);
  const [title, setTitle] = useState("Engineering Databook");
  const [subtitle, setSubtitle] = useState("");
  const [error, setError] = useState(null);
  const [frontPageFile, setFrontPageFile] = useState(null);
  const [generated, setGenerated] = useState(false);
  const [savedPath, setSavedPath] = useState(null);

  const docsById = useMemo(() => new Map(docIndex.map((d) => [d.id, d])), [docIndex]);

  // Auto-expand the root node once the tree is available
  useEffect(() => {
    if (tree && tree.id && !expanded.has(tree.id)) {
      setExpanded((prev) => new Set([...prev, tree.id]));
    }
  }, [tree?.id]);

  // Load persisted selection (so iterating on a databook is easy)
  useEffect(() => {
    try {
      const saved = localStorage.getItem("dms:databook-selection");
      if (saved) {
        const obj = JSON.parse(saved);
        const m = new Map();
        for (const [nid, docs] of Object.entries(obj)) m.set(nid, new Set(docs));
        setSelection(m);
      }
      const t = localStorage.getItem("dms:databook-title");
      if (t) setTitle(t);
      const s = localStorage.getItem("dms:databook-subtitle");
      if (s) setSubtitle(s);
    } catch {}
  }, []);

  // Persist selection on change
  useEffect(() => {
    const obj = {};
    for (const [nid, docs] of selection) obj[nid] = Array.from(docs);
    try {
      localStorage.setItem("dms:databook-selection", JSON.stringify(obj));
    } catch {}
  }, [selection]);

  const toggleExpand = (id) =>
    setExpanded((prev) => {
      const n = new Set(prev);
      if (n.has(id)) n.delete(id);
      else n.add(id);
      return n;
    });

  const isDocSelected = (nodeId, docId) =>
    !!selection.get(nodeId)?.has(docId);

  const toggleDoc = (nodeId, docId) => {
    setSelection((prev) => {
      const next = new Map(prev);
      const set = new Set(next.get(nodeId) || []);
      if (set.has(docId)) set.delete(docId);
      else set.add(docId);
      if (set.size === 0) next.delete(nodeId);
      else next.set(nodeId, set);
      return next;
    });
  };

  // Node-level selection state: returns "all" | "some" | "none"
  // considering the docs directly attached to this node (NOT descendants).
  const nodeOwnState = (node) => {
    const docs = node.documents || [];
    if (docs.length === 0) return "none";
    const sel = selection.get(node.id);
    if (!sel || sel.size === 0) return "none";
    const allSelected = docs.every((d) => sel.has(d.id));
    return allSelected ? "all" : "some";
  };

  const setNodeAll = (node, on) => {
    setSelection((prev) => {
      const next = new Map(prev);
      const allDocIds = (node.documents || []).map((d) => d.id);
      if (on) {
        next.set(node.id, new Set(allDocIds));
      } else {
        next.delete(node.id);
      }
      return next;
    });
  };

  // Recursive: select all (or none) in this node + all descendants
  const setSubtreeAll = (node, on) => {
    setSelection((prev) => {
      const next = new Map(prev);
      const walk = (n) => {
        const ids = (n.documents || []).map((d) => d.id);
        if (on && ids.length) next.set(n.id, new Set(ids));
        else if (!on) next.delete(n.id);
        (n.children || []).forEach(walk);
      };
      walk(node);
      return next;
    });
  };

  const totalSelected = useMemo(() => {
    let n = 0;
    for (const set of selection.values()) n += set.size;
    return n;
  }, [selection]);

  const clearAll = () => setSelection(new Map());
  const selectAll = () => tree && setSubtreeAll(tree, true);

  // Build the ordered selection payload: tree-order traversal, only include
  // nodes that have selected docs.
  const buildPayload = () => {
    if (!tree) return [];
    const out = [];
    const walk = (node) => {
      const set = selection.get(node.id);
      if (set && set.size) {
        // Preserve the original order of documents attached to this node
        const orderedIds = (node.documents || [])
          .map((d) => d.id)
          .filter((id) => set.has(id));
        if (orderedIds.length) out.push({ nodeId: node.id, docIds: orderedIds });
      }
      (node.children || []).forEach(walk);
    };
    walk(tree);
    return out;
  };

  const generate = async () => {
    setError(null);
    setGenerating(true);
    try {
      const payload = {
        title: title.trim() || "Engineering Databook",
        subtitle: subtitle.trim(),
        selection: buildPayload(),
      };
      try {
        localStorage.setItem("dms:databook-title", title);
        localStorage.setItem("dms:databook-subtitle", subtitle);
      } catch {}

      let res;
      if (frontPageFile) {
        const form = new FormData();
        form.append("payload", JSON.stringify(payload));
        form.append("front_page", frontPageFile);
        res = await fetch("/api/databook", { method: "POST", body: form });
      } else {
        res = await fetch("/api/databook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
      }

      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try { msg = (await res.json()).error || msg; } catch {}
        throw new Error(msg);
      }

      const savedHeader = res.headers.get("X-Databook-Saved-Path");
      setSavedPath(savedHeader ? decodeURIComponent(savedHeader) : null);

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = (title.trim() || "Databook") + ".pdf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setGenerated(true);
    } catch (e) {
      setError(e.message);
    } finally {
      setGenerating(false);
    }
  };

  // Render one node row
  const renderNode = (node, depth = 0) => {
    const isExpanded = expanded.has(node.id);
    const hasChildren = (node.children || []).length > 0;
    const docs = node.documents || [];
    const canExpand = hasChildren || docs.length > 0;
    const ownState = nodeOwnState(node);

    return (
      <div key={node.id}>
        <div
          onClick={() => canExpand && toggleExpand(node.id)}
          className={`flex items-center gap-1.5 py-1 pr-2 text-xs hover:bg-stone-50 ${
            canExpand ? "cursor-pointer" : ""
          }`}
          style={{ paddingLeft: `${depth * 14 + 4}px` }}
        >
          <span className="w-3.5 flex items-center justify-center text-stone-500">
            {canExpand ? (
              isExpanded ? <ChevronDown size={12} /> : <ChevronRight size={12} />
            ) : <span className="w-2.5" />}
          </span>

          <button
            onClick={(e) => {
              e.stopPropagation();
              setNodeAll(node, ownState !== "all");
            }}
            disabled={docs.length === 0}
            className={`shrink-0 p-0.5 ${
              docs.length === 0 ? "opacity-25 cursor-not-allowed text-stone-400"
                : "text-amber-700 hover:text-amber-900"
            }`}
            title={
              docs.length === 0
                ? t("此节点暂无直接附加文档", "This node has no directly attached documents")
                : ownState === "all" ? t("取消选择此节点的所有文档", "Deselect all documents on this node") : t("选择此节点的所有文档", "Select all documents on this node")
            }
          >
            {ownState === "all" ? <CheckSquare size={13} />
              : ownState === "some" ? <MinusSquare size={13} />
              : <Square size={13} />}
          </button>

          <Folder size={13} className="text-amber-700 shrink-0" />
          <span className="truncate flex-1 text-stone-800">{node.name}</span>

          {docs.length > 0 && (
            <span className="text-[10px] tabular-nums px-1 bg-stone-100 text-stone-600 rounded">
              {docs.length}
            </span>
          )}

          {hasChildren && (
            <button
              onClick={(e) => {
                e.stopPropagation();
                setSubtreeAll(node, true);
              }}
              className="text-[9px] uppercase tracking-wider text-stone-400 hover:text-amber-700 px-1"
              title={t("选择此子树下的所有文档", "Select all documents under this subtree")}
            >
              {t("全选↓", "Select all ↓")}
            </button>
          )}
        </div>

        {/* Documents at this node */}
        {isExpanded && docs.map((ref) => {
          const doc = docsById.get(ref.id);
          if (!doc) return null;
          const sel = isDocSelected(node.id, ref.id);
          return (
            <div
              key={node.id + ":" + ref.id}
              className={`flex items-center gap-1.5 py-0.5 pr-2 text-xs ${
                sel ? "bg-amber-50" : "hover:bg-stone-50"
              }`}
              style={{ paddingLeft: `${(depth + 1) * 14 + 12}px` }}
            >
              <span
                className="text-stone-400 shrink-0 cursor-pointer"
                onClick={() => toggleDoc(node.id, ref.id)}
                title={t("选择/取消选择", "Select/deselect")}
              >
                {sel ? <CheckSquare size={12} className="text-amber-700" /> : <Square size={12} />}
              </span>
              <span
                className="flex items-center gap-1.5 flex-1 min-w-0 cursor-pointer"
                onClick={() => onOpenDoc && onOpenDoc(doc.id)}
                title={t("查看此文档", "View this document")}
              >
                {doc.mime?.startsWith("image/")
                  ? <ImageIcon size={11} className="text-stone-500 shrink-0" />
                  : <FileText size={11} className="text-stone-500 shrink-0" />}
                <span className="truncate text-stone-700 hover:underline">{doc.name}</span>
              </span>
              <span className="text-[10px] text-stone-400 shrink-0 font-mono">
                {formatBytes(doc.size)}
              </span>
            </div>
          );
        })}

        {/* Children */}
        {isExpanded && (node.children || []).map((c) => renderNode(c, depth + 1))}
      </div>
    );
  };

  if (!tree) return null;

  return (
    <div className="flex flex-col h-full">
      {/* Toolbar */}
      <div className="border-b border-stone-200 p-2 space-y-2">
        <div className="flex gap-1">
          <button
            onClick={selectAll}
            className="flex-1 text-[11px] px-2 py-1 border border-stone-300 hover:bg-amber-50 hover:border-amber-400 rounded"
          >
            {t("全选", "Select all")}
          </button>
          <button
            onClick={clearAll}
            disabled={totalSelected === 0}
            className="flex-1 text-[11px] px-2 py-1 border border-stone-300 hover:bg-stone-100 rounded disabled:opacity-40"
          >
            {t("清除", "Clear")}
          </button>
        </div>
        <div className="text-[11px] text-stone-600 flex items-center justify-between">
          <span>
            {t("已选", "Selected")} <span className="font-mono tabular-nums">{totalSelected}</span> {t("份文档", "documents")}
          </span>
        </div>
      </div>

      {/* Tree */}
      <div className="flex-1 overflow-auto py-1">
        {renderNode(tree)}
      </div>

      {/* Generate button */}
      <div className="border-t border-stone-200 p-2">
        <button
          onClick={() => { setError(null); setGenerated(false); setSavedPath(null); setShowTitleDialog(true); }}
          disabled={totalSelected === 0}
          className="w-full px-3 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-medium rounded disabled:opacity-40 flex items-center justify-center gap-1.5"
        >
          <Download size={12} /> {t("生成数据手册", "Generate data book")}
        </button>
        <div className="text-[10px] text-stone-500 text-center mt-1.5 leading-tight">
          {t("生成包含封面、目录、章节标题、书签及页码的单一 PDF。", "Generates a single PDF with a cover page, table of contents, chapter headings, bookmarks, and page numbers.")}
        </div>
      </div>

      {/* Title/subtitle dialog */}
      {showTitleDialog && (
        <div
          className="fixed inset-0 bg-stone-900/70 z-50 flex items-center justify-center p-4"
          onClick={() => !generating && setShowTitleDialog(false)}
        >
          <div
            className="bg-white w-full max-w-md rounded shadow-2xl p-5"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="text-[10px] tracking-[0.2em] uppercase text-stone-500 mb-1">
              {t("生成数据手册", "Generate data book")}
            </div>
            <h2 className="text-lg font-semibold text-stone-900 mb-3">
              {t("封面信息", "Cover page info")}
            </h2>

            <label className="block text-xs uppercase tracking-wider text-stone-600 mb-1.5">
              {t("标题", "Title")}
            </label>
            <input
              type="text"
              autoFocus
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              placeholder={t("工程数据手册", "Engineering data book")}
              className="w-full px-2 py-1.5 text-sm border border-stone-300 rounded focus:outline-none focus:border-amber-600 mb-3"
            />

            <label className="block text-xs uppercase tracking-wider text-stone-600 mb-1.5">
              {t("副标题", "Subtitle")} <span className="text-stone-400 normal-case tracking-normal">{t("（可选）", "(optional)")}</span>
            </label>
            <input
              type="text"
              value={subtitle}
              onChange={(e) => setSubtitle(e.target.value)}
              placeholder={t("例如：项目编号、版次、客户名称", "e.g. project number, revision, client name")}
              className="w-full px-2 py-1.5 text-sm border border-stone-300 rounded focus:outline-none focus:border-amber-600 mb-3"
            />

            <label className="block text-xs uppercase tracking-wider text-stone-600 mb-1.5">
              {t("封面页", "Front page")} <span className="text-stone-400 normal-case tracking-normal">{t("（可选，PDF 或图片）", "(optional, PDF or image)")}</span>
            </label>
            {frontPageFile ? (
              <div className="flex items-center gap-2 mb-1 text-xs bg-stone-50 border border-stone-200 rounded px-2 py-1.5">
                <FileText size={12} className="text-stone-500 shrink-0" />
                <span className="truncate flex-1">{frontPageFile.name}</span>
                <button
                  onClick={() => setFrontPageFile(null)}
                  className="text-stone-400 hover:text-red-600 shrink-0"
                  title={t("移除", "Remove")}
                >
                  <X size={12} />
                </button>
              </div>
            ) : (
              <input
                type="file"
                accept="application/pdf,image/*"
                onChange={(e) => setFrontPageFile(e.target.files?.[0] || null)}
                className="w-full text-xs mb-1 file:mr-2 file:px-2 file:py-1 file:border file:border-stone-300 file:rounded file:bg-white file:text-xs file:cursor-pointer hover:file:bg-stone-50"
              />
            )}
            <div className="text-[10px] text-stone-500 mb-3 leading-tight">
              {t("将作为第 1 页插入，位于自动生成的封面/目录页之前。Word/Pages 文档请先导出为 PDF。", "Inserted as page 1, before the auto-generated cover/table-of-contents page. Export Word/Pages documents to PDF first.")}
            </div>

            <div className="text-xs text-stone-600 bg-stone-50 border border-stone-200 rounded p-2 mb-3">
              {t("包含", "Includes")} <strong>{totalSelected}</strong> {t("份文档，共", "documents,")} <strong>{buildPayload().length}</strong> {t("个章节。", "sections total.")}
            </div>

            {error && (
              <div className="text-xs text-red-700 bg-red-50 border border-red-200 rounded p-2 mb-3 whitespace-pre-wrap">
                {error}
              </div>
            )}

            {generated && (
              <div className="text-xs text-emerald-800 bg-emerald-50 border border-emerald-200 rounded p-2 mb-3">
                <div className="font-medium mb-1">{t("生成成功，下载已开始。", "Generated successfully — the download has started.")}</div>
                {savedPath ? (
                  <div className="break-all">
                    {t("副本已保存到项目文件夹：", "A copy was also saved to the project folder:")} <span className="font-mono">{savedPath}</span>
                  </div>
                ) : (
                  <div className="text-amber-700">
                    {t("未能保存副本到项目文件夹（浏览器下载仍可用）。", "Could not save a copy to the project folder (browser download still available).")}
                  </div>
                )}
              </div>
            )}

            <div className="flex gap-2 justify-end">
              {generated ? (
                <button
                  onClick={() => setShowTitleDialog(false)}
                  className="px-4 py-1.5 text-xs bg-amber-600 hover:bg-amber-700 text-white rounded"
                >
                  {t("关闭", "Close")}
                </button>
              ) : (
                <>
                  <button
                    onClick={() => setShowTitleDialog(false)}
                    disabled={generating}
                    className="px-4 py-1.5 text-xs border border-stone-300 hover:bg-stone-100 rounded disabled:opacity-60"
                  >
                    {t("取消", "Cancel")}
                  </button>
                  <button
                    onClick={generate}
                    disabled={generating}
                    className="px-4 py-1.5 text-xs bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-60 flex items-center gap-1.5"
                  >
                    {generating ? t("生成中…", "Generating…") : (<><Download size={11} /> {t("生成并下载", "Generate and download")}</>)}
                  </button>
                </>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const CombineFolderModal = ({ node, docIndex, formatBytes, onClose, onSaved }) => {
  const { t } = useLang();
  const [includeSubfolders, setIncludeSubfolders] = useState(false);
  const [title, setTitle] = useState(node.name || "Combined Documents");
  const [selectedKeys, setSelectedKeys] = useState(new Set());
  const [generating, setGenerating] = useState(false);
  const [error, setError] = useState(null);

  const docsById = useMemo(() => new Map(docIndex.map((d) => [d.id, d])), [docIndex]);

  const docEntries = useMemo(() => {
    const entries = [];
    for (const d of (node.documents || [])) {
      entries.push({ nodeId: node.id, docId: d.id, nodeName: node.name });
    }
    if (includeSubfolders) {
      const walkChildren = (n) => {
        for (const child of (n.children || [])) {
          for (const d of (child.documents || [])) {
            entries.push({ nodeId: child.id, docId: d.id, nodeName: child.name });
          }
          walkChildren(child);
        }
      };
      walkChildren(node);
    }
    return entries;
  }, [node, includeSubfolders]);

  useEffect(() => {
    setSelectedKeys(new Set(docEntries.map((e) => e.nodeId + ":" + e.docId)));
  }, [docEntries]);

  const toggle = (nodeId, docId) => {
    const k = nodeId + ":" + docId;
    setSelectedKeys((prev) => {
      const n = new Set(prev);
      if (n.has(k)) n.delete(k); else n.add(k);
      return n;
    });
  };

  const generate = async () => {
    setError(null);
    setGenerating(true);
    try {
      const nodeDocMap = new Map();
      for (const e of docEntries) {
        if (selectedKeys.has(e.nodeId + ":" + e.docId)) {
          if (!nodeDocMap.has(e.nodeId)) nodeDocMap.set(e.nodeId, []);
          nodeDocMap.get(e.nodeId).push(e.docId);
        }
      }
      const selection = Array.from(nodeDocMap.entries()).map(([nodeId, docIds]) => ({ nodeId, docIds }));
      if (!selection.length) { setError(t("请至少选择一份文档", "Select at least one document")); setGenerating(false); return; }

      const res = await fetch("/api/docs/combine-to-folder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          node_id: node.id,
          title: title.trim() || node.name,
          selection,
        }),
      });
      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try { msg = (await res.json()).error || msg; } catch {}
        throw new Error(msg);
      }
      await res.json();
      onSaved();
    } catch (e) {
      setError(e.message);
    } finally {
      setGenerating(false);
    }
  };

  return (
    <div
      className="fixed inset-0 bg-stone-900/70 z-50 flex items-center justify-center p-4"
      onClick={() => !generating && onClose()}
    >
      <div
        className="bg-white w-full max-w-lg rounded shadow-2xl flex flex-col max-h-[88vh]"
        onClick={(e) => e.stopPropagation()}
      >
        {/* Header */}
        <div className="flex items-center justify-between px-5 pt-5 pb-3 border-b border-stone-200">
          <div>
            <div className="text-[10px] tracking-[0.2em] uppercase text-stone-500 mb-0.5">{t("合并文档", "Merge documents")}</div>
            <h2 className="text-base font-semibold text-stone-900">{node.name}</h2>
          </div>
          <button onClick={onClose} disabled={generating} className="text-stone-400 hover:text-stone-700 p-1">
            <X size={16} />
          </button>
        </div>

        {/* Options */}
        <div className="px-5 py-3 border-b border-stone-200 space-y-3">
          <div>
            <label className="text-[10px] uppercase tracking-wider text-stone-500 block mb-1">{t("输出文件名", "Output filename")}</label>
            <input
              type="text"
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              className="w-full text-sm border border-stone-300 rounded px-2 py-1.5 focus:outline-none focus:border-amber-500"
              placeholder={t("合并文档标题", "Merged document title")}
            />
          </div>
          <label className="flex items-center gap-2 text-sm text-stone-700 cursor-pointer select-none">
            <input
              type="checkbox"
              checked={includeSubfolders}
              onChange={(e) => setIncludeSubfolders(e.target.checked)}
              className="accent-amber-600"
            />
            {t("包含子文件夹中的文档", "Include documents in subfolders")}
          </label>
        </div>

        {/* Document list */}
        <div className="flex-1 overflow-auto px-5 py-2">
          {docEntries.length === 0 ? (
            <div className="text-sm text-stone-500 py-6 text-center">
              {includeSubfolders ? t("此文件夹及子文件夹中暂无文档", "No documents in this folder or its subfolders") : t("此文件夹中暂无文档", "No documents in this folder")}
            </div>
          ) : (
            <>
              <div className="flex items-center justify-between mb-2">
                <span className="text-[11px] text-stone-500">
                  {t("已选", "Selected")} <span className="font-mono tabular-nums">{selectedKeys.size}</span> / {docEntries.length} {t("份", "")}
                </span>
                <div className="flex gap-3">
                  <button
                    onClick={() => setSelectedKeys(new Set(docEntries.map((e) => e.nodeId + ":" + e.docId)))}
                    className="text-[11px] text-amber-700 hover:text-amber-900"
                  >{t("全选", "Select all")}</button>
                  <button
                    onClick={() => setSelectedKeys(new Set())}
                    className="text-[11px] text-stone-500 hover:text-stone-700"
                  >{t("清除", "Clear")}</button>
                </div>
              </div>
              <div className="space-y-0.5">
                {docEntries.map((entry) => {
                  const doc = docsById.get(entry.docId);
                  const k = entry.nodeId + ":" + entry.docId;
                  const checked = selectedKeys.has(k);
                  return (
                    <div
                      key={k}
                      onClick={() => toggle(entry.nodeId, entry.docId)}
                      className={`flex items-center gap-2 px-2 py-1.5 rounded cursor-pointer text-sm ${checked ? "bg-amber-50" : "hover:bg-stone-50"}`}
                    >
                      <span className="shrink-0">
                        {checked
                          ? <CheckSquare size={13} className="text-amber-700" />
                          : <Square size={13} className="text-stone-400" />}
                      </span>
                      {doc?.mime?.startsWith("image/")
                        ? <ImageIcon size={12} className="text-stone-400 shrink-0" />
                        : <FileText size={12} className="text-stone-400 shrink-0" />}
                      <span className="truncate flex-1 text-stone-700">{doc?.name || entry.docId}</span>
                      {includeSubfolders && entry.nodeName !== node.name && (
                        <span className="text-[10px] text-stone-400 shrink-0 italic">{entry.nodeName}</span>
                      )}
                      {doc && (
                        <span className="text-[10px] text-stone-400 shrink-0 font-mono">{formatBytes(doc.size)}</span>
                      )}
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>

        {/* Footer */}
        <div className="px-5 py-4 border-t border-stone-200">
          {error && (
            <div className="text-xs text-red-600 bg-red-50 border border-red-200 rounded px-3 py-2 mb-3">{error}</div>
          )}
          <button
            onClick={generate}
            disabled={generating || selectedKeys.size === 0}
            className="w-full px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white text-sm font-medium rounded disabled:opacity-40 flex items-center justify-center gap-2"
          >
            {generating ? <Loader size={14} className="animate-spin" /> : <Save size={14} />}
            {generating ? t("合并中…", "Merging…") : t(`合并 ${selectedKeys.size} 份文档并保存至此文件夹`, `Merge ${selectedKeys.size} documents and save to this folder`)}
          </button>
          <p className="text-[10px] text-stone-500 text-center mt-1.5">
            {t("合并后的 PDF 保存在当前文件夹，原始文档从文件夹中移除（文件仍保留在文件库中）", "The merged PDF is saved to the current folder; the original documents are removed from the folder (files remain in the library)")}
          </p>
        </div>
      </div>
    </div>
  );
};


const SendToPhoneDialog = ({ doc, onClose }) => {
  const { t } = useLang();
  const isMac = typeof navigator !== "undefined" && /Mac|iPhone|iPad/.test(navigator.platform);
  const saved = typeof localStorage !== "undefined" ? localStorage.getItem("pms_last_phone") || "" : "";
  const [phone, setPhone] = useState(saved);
  const [status, setStatus] = useState(null); // null | { ok, msg, url, method, local_ip, port, is_tunnel }
  const [busy, setBusy] = useState(false);
  const [urlCopied, setUrlCopied] = useState(false);
  const [showFirewallHelp, setShowFirewallHelp] = useState(false);

  const send = async () => {
    const p = phone.trim();
    if (!p) { setStatus({ ok: false, msg: t("请输入手机号码。", "Please enter a phone number.") }); return; }
    setBusy(true);
    setStatus({ pending: true, msg: t("正在建立安全通道，请稍候（约 15 秒）…", "Establishing a secure tunnel, please wait (about 15 seconds)…") });
    try {
      const r = await fetch("/api/send-to-phone", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ doc_id: doc.id, phone: p }),
      });
      const data = await r.json();
      if (data.ok) {
        localStorage.setItem("pms_last_phone", p);
        const methodMsg =
          data.method === "messages"   ? t(`已通过「信息」App 发送至 ${p}`, `Sent to ${p} via the Messages app`) :
          data.method === "phone_link" ? t(`已尝试通过 Phone Link 打开短信至 ${p}`, `Tried opening an SMS to ${p} via Phone Link`) :
                                         t("链接已生成，请手动复制发送：", "Link generated — please copy and send it manually:");
        setStatus({ ok: true, msg: methodMsg, url: data.url, method: data.method,
                    local_ip: data.local_ip, port: data.port, is_tunnel: data.is_tunnel });
      } else {
        setStatus({ ok: false, msg: data.error || t("发送失败。", "Send failed.") });
      }
    } catch (e) {
      setStatus({ ok: false, msg: t("网络错误：", "Network error: ") + e.message });
    } finally { setBusy(false); }
  };

  const copyUrl = async () => {
    if (!status?.url) return;
    try {
      await navigator.clipboard.writeText(status.url);
      setUrlCopied(true);
      setTimeout(() => setUrlCopied(false), 1500);
    } catch { /* clipboard blocked */ }
  };

  const openWeChat = async () => {
    if (!status?.url) return;
    try { await navigator.clipboard.writeText(status.url); } catch {}
    const a = document.createElement('a');
    a.href = 'weixin://';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setStatus(s => ({ ...s, msg: t("链接已复制，请在微信中粘贴发送给对方。", "Link copied — paste it in WeChat to send.") }));
  };

  return (
    <div className="fixed inset-0 bg-stone-900/60 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded shadow-2xl w-full max-w-md p-5" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2 text-stone-800">
            <Phone size={15} className="text-amber-600" />
            <span className="text-sm font-semibold">{t("发送至手机", "Send to phone")}</span>
          </div>
          <button onClick={onClose} className="text-stone-400 hover:text-stone-700"><X size={15} /></button>
        </div>
        <div className="text-xs text-stone-500 mb-3 truncate" title={doc.name}>{doc.name}</div>
        <label className="block text-[10px] uppercase tracking-wider text-stone-600 mb-1">{t("手机号码", "Phone number")}</label>
        <input
          autoFocus
          type="tel"
          value={phone}
          onChange={(e) => setPhone(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") send(); if (e.key === "Escape") onClose(); }}
          placeholder="+86 138 0000 0000"
          className="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-amber-500 mb-3"
        />

        {status && (
          <div className={`text-xs rounded px-3 py-2 mb-3 ${status.pending ? "bg-amber-50 text-amber-800 border border-amber-200" : status.ok ? "bg-green-50 text-green-800 border border-green-200" : "bg-red-50 text-red-700 border border-red-200"}`}>
            <div>{status.msg}</div>
            {status.ok && status.url && (
              <div className="mt-2 space-y-1.5">
                <div className="flex items-center gap-1.5">
                  <span className="font-mono text-[10px] truncate flex-1 text-green-900 select-all">{status.url}</span>
                  <button onClick={copyUrl} className="shrink-0 text-[10px] px-2 py-0.5 border border-green-400 rounded hover:bg-green-100">
                    {urlCopied ? t("已复制", "Copied") : t("复制", "Copy")}
                  </button>
                </div>
                {!isMac && (
                  <button onClick={openWeChat} className="w-full text-[10px] px-2 py-1 bg-green-600 text-white rounded hover:bg-green-700">
                    {t("复制链接并打开微信", "Copy link and open WeChat")}
                  </button>
                )}
              </div>
            )}
            {/* Show network requirement notice when using local IP */}
            {status.ok && !status.is_tunnel && status.local_ip && (
              <div className="mt-2 pt-2 border-t border-green-200 space-y-1">
                <div className="text-[10px] text-green-700">
                  {t("链接使用本地 IP", "The link uses the local IP")} <span className="font-mono font-bold">{status.local_ip}:{status.port}</span>{t("，需满足：", " — this requires:")}
                </div>
                <div className="text-[10px] text-green-700">{t("① 手机与此 Mac 连接在", "① The phone is connected to ")}<strong>{t("同一 Wi-Fi", "the same Wi-Fi")}</strong>{t(" ", " as this Mac")}</div>
                <div className="text-[10px] text-green-700">{t("② macOS 防火墙已允许 DMS.app 接受连接", "② The macOS firewall allows DMS.app to accept connections")}</div>
                <button
                  onClick={() => setShowFirewallHelp(!showFirewallHelp)}
                  className="text-[10px] text-amber-700 underline mt-0.5"
                >
                  {showFirewallHelp ? t("收起", "Collapse") : t("链接打不开？查看解决方法 ▾", "Link won't open? See troubleshooting ▾")}
                </button>
                {showFirewallHelp && (
                  <div className="mt-1 text-[10px] text-stone-700 bg-amber-50 border border-amber-200 rounded p-2 space-y-1.5 leading-relaxed">
                    <div className="font-semibold text-amber-800">{t("「找不到服务器」的常见原因：", "Common reasons for “server not found”:")}</div>
                    <div className="font-medium text-stone-800">{t("① 手机未连 Wi-Fi（最常见）", "① Phone isn't connected to Wi-Fi (most common)")}</div>
                    <div className="pl-2">{t("→ 打开手机「设置」→「Wi-Fi」，确认已连接且", "→ Open the phone's Settings → Wi-Fi, and confirm it's connected and ")}<strong>{t("与此 Mac 在同一网络", "on the same network as this Mac")}</strong>{t("，而非使用蜂窝数据。", ", not using cellular data.")}</div>
                    <div className="font-medium text-stone-800">{t("② macOS 防火墙拦截", "② Blocked by the macOS firewall")}</div>
                    <div className="pl-2">{t("→ 系统设置 → 网络 → 防火墙 → 选项…", "→ System Settings → Network → Firewall → Options…")}</div>
                    <div className="pl-2">{t("→ 找到", "→ Find")} <strong>DMS</strong>{t("，设为「允许传入连接」。若没有则点 + 添加。", ", and set it to “Allow incoming connections”. If it's not listed, click + to add it.")}</div>
                    <div className="font-medium text-stone-800">{t("③ Mac 连接了 VPN，IP 地址不对", "③ The Mac is connected to a VPN, giving the wrong IP address")}</div>
                    <div className="pl-2">{t("→ 上方显示的 IP 是否是", "→ Is the IP shown above")} <strong>192.168.x.x</strong> {t("或", "or")} <strong>10.x.x.x</strong>{t("（局域网）？若是 VPN IP，请先断开 VPN。", " (local network)? If it's a VPN IP, disconnect the VPN first.")}</div>
                    <div className="font-medium text-stone-800">{t("④ 路由器开启了 AP 隔离", "④ The router has AP/client isolation enabled")}</div>
                    <div className="pl-2">{t("→ 登录路由器管理页，关闭「AP 隔离」/「客户端隔离」。", "→ Log into the router's admin page and turn off “AP isolation” / “client isolation”.")}</div>
                    <div className="pt-1 text-amber-700 font-medium">{t("以上都试过还是不行？使用 Launcher 窗口中的「Remote Upload」，通过公网发送，不受 Wi-Fi 限制。", "Still not working after trying all of these? Use “Remote Upload” in the Launcher window to send over the public internet, unaffected by Wi-Fi restrictions.")}</div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        <div className="text-[10px] text-stone-400 mb-3">
          {isMac
            ? t("通过 Mac「信息」App 以 iMessage 或短信发送 1 小时有效的下载链接。", "Sends a download link valid for 1 hour via the Mac Messages app, as iMessage or SMS.")
            : t("点击「发送链接」生成下载链接，再点「复制链接并打开微信」粘贴发送给对方。", "Click “Send link” to generate a download link, then click “Copy link and open WeChat” to paste and send it.")}
        </div>
        <div className="flex gap-2">
          <button onClick={onClose} className="flex-1 px-3 py-1.5 text-xs border border-stone-300 hover:bg-stone-100 rounded">{t("取消", "Cancel")}</button>
          <button
            onClick={send}
            disabled={busy}
            className="flex-1 px-3 py-1.5 text-xs bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-50 flex items-center justify-center gap-1.5"
          >
            <Phone size={11} /> {busy ? t("发送中…", "Sending…") : t("发送链接", "Send link")}
          </button>
        </div>
      </div>
    </div>
  );
};

const SendEmailDialog = ({ doc, onClose, onOpenEmailSettings }) => {
  const { t } = useLang();
  const savedTo = typeof localStorage !== "undefined" ? localStorage.getItem("pms_last_email") || "" : "";
  const [to, setTo] = useState(savedTo);
  const [subject, setSubject] = useState(doc?.name || "");
  const [body, setBody] = useState("");
  const [status, setStatus] = useState(null); // null | {ok, msg}
  const [busy, setBusy] = useState(false);
  const [smtpConfigured, setSmtpConfigured] = useState(null); // null=loading, true/false
  const isMac = typeof navigator !== "undefined" && /Mac|iPhone|iPad/.test(navigator.platform);

  useEffect(() => {
    fetch("/api/email-settings")
      .then((r) => r.json())
      .then((d) => setSmtpConfigured(!!d.configured))
      .catch(() => setSmtpConfigured(false));
  }, []);

  const send = async () => {
    const addr = to.trim();
    if (!addr) { setStatus({ ok: false, msg: t("请输入收件人邮箱地址。", "Please enter the recipient's email address.") }); return; }
    if (!addr.includes("@")) { setStatus({ ok: false, msg: t("邮箱地址格式不正确。", "The email address format is invalid.") }); return; }
    setBusy(true); setStatus(null);
    try {
      const r = await fetch("/api/send-email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ doc_id: doc.id, to: addr, subject: subject.trim(), body: body.trim() }),
      });
      const data = await r.json();
      if (data.ok) {
        localStorage.setItem("pms_last_email", addr);
        const successMsg = data.method === "smtp"
          ? t("邮件已成功发送。", "Email sent successfully.")
          : t("已在 Mail 应用中打开新邮件，请检查并发送。", "A new email has been opened in Mail — please review and send it.");
        setStatus({ ok: true, msg: successMsg });
      } else {
        setStatus({ ok: false, msg: data.error || t("发送失败。", "Send failed.") });
      }
    } catch (e) {
      setStatus({ ok: false, msg: t("网络错误：", "Network error: ") + e.message });
    } finally { setBusy(false); }
  };

  const methodNote = smtpConfigured === null
    ? t("正在检查邮件设置…", "Checking email settings…")
    : smtpConfigured
      ? t("邮件将通过 SMTP 直接发送至收件人。", "The email will be sent directly to the recipient via SMTP.")
      : isMac
        ? t("未配置 SMTP，将在 Mail 应用中打开一封带附件的新邮件，您可以检查后手动发送。", "SMTP isn't configured — a new email with the attachment will open in Mail for you to review and send manually.")
        : t("未配置 SMTP 邮件设置，无法在 Windows 上发送邮件。", "SMTP email isn't configured, so email can't be sent on Windows.");

  const buttonLabel = smtpConfigured
    ? (busy ? t("正在发送…", "Sending…") : t("发送邮件", "Send email"))
    : (busy ? t("正在准备…", "Preparing…") : isMac ? t("通过 Mail App 准备", "Prepare via Mail app") : t("发送邮件", "Send email"));

  return (
    <div className="fixed inset-0 bg-stone-900/60 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded shadow-2xl w-full max-w-sm p-5" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2 text-stone-800">
            <Mail size={15} className="text-amber-600" />
            <span className="text-sm font-semibold">{t("通过邮件发送", "Send by email")}</span>
          </div>
          <button onClick={onClose} className="text-stone-400 hover:text-stone-700"><X size={15} /></button>
        </div>
        <div className="text-xs text-stone-500 mb-3 truncate" title={doc.name}>{doc.name}</div>

        <label className="block text-[10px] uppercase tracking-wider text-stone-600 mb-1">{t("收件人", "Recipient")}</label>
        <input
          autoFocus
          type="email"
          value={to}
          onChange={(e) => setTo(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") send(); if (e.key === "Escape") onClose(); }}
          placeholder="example@email.com"
          className="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-amber-500 mb-2"
        />

        <label className="block text-[10px] uppercase tracking-wider text-stone-600 mb-1">{t("主题", "Subject")}</label>
        <input
          type="text"
          value={subject}
          onChange={(e) => setSubject(e.target.value)}
          placeholder={t("邮件主题", "Email subject")}
          className="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-amber-500 mb-2"
        />

        <label className="block text-[10px] uppercase tracking-wider text-stone-600 mb-1">{t("正文（可选）", "Body (optional)")}</label>
        <textarea
          value={body}
          onChange={(e) => setBody(e.target.value)}
          placeholder={t("请见附件。", "Please see attached.")}
          rows={2}
          className="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-amber-500 mb-3 resize-none"
        />

        {status && (
          <div className={`text-xs rounded px-3 py-2 mb-3 ${status.ok ? "bg-green-50 text-green-800 border border-green-200" : "bg-red-50 text-red-700 border border-red-200"}`}>
            {status.msg}
          </div>
        )}
        <div className="text-[10px] text-stone-400 mb-3 flex items-center justify-between gap-2">
          <span>{methodNote}</span>
          {!smtpConfigured && onOpenEmailSettings && (
            <button
              onClick={() => { onClose(); onOpenEmailSettings(); }}
              className="text-amber-600 hover:underline whitespace-nowrap"
            >
              {t("配置 SMTP", "Configure SMTP")}
            </button>
          )}
        </div>
        <div className="flex gap-2">
          <button onClick={onClose} className="flex-1 px-3 py-1.5 text-xs border border-stone-300 hover:bg-stone-100 rounded">{t("取消", "Cancel")}</button>
          <button
            onClick={send}
            disabled={busy || (!smtpConfigured && !isMac)}
            className="flex-1 px-3 py-1.5 text-xs bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-50 flex items-center justify-center gap-1.5"
          >
            <Mail size={11} /> {buttonLabel}
          </button>
        </div>
      </div>
    </div>
  );
};

const EmailSettingsDialog = ({ onClose }) => {

    smtp_host: "", smtp_port: 587, smtp_user: "", smtp_pass: "",
    email_from: "", email_ssl: false,
  });
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [testing, setTesting] = useState(false);

  useEffect(() => {
    fetch("/api/email-settings")
      .then((r) => r.json())
      .then((d) => {
        setSettings({
          smtp_host: d.smtp_host || "",
          smtp_port: d.smtp_port || 587,
          smtp_user: d.smtp_user || "",
          smtp_pass: "",

          email_ssl: d.email_ssl || false,

      })

    setSaving(true); setStatus(null);

        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2">

            <span className="text-sm font-semibold text-stone-900">{t("邮件发送设置（SMTP）", "Email sending settings (SMTP)")}</span>

/* A small, draggable, non-blocking preview panel — unlike DocumentViewer
 * (a full modal) or window.open (a separate OS window), this floats over
 * the current page so a document stays visible while its metadata fields,
 * elsewhere in the same window, stay focusable and editable. */
const FLOATING_PREVIEW_MIN_W = 260;
const FLOATING_PREVIEW_MIN_H = 180;

const FloatingDocPreview = ({ doc, onClose }) => {
  const { t } = useLang();
  const [pos, setPos] = useState({ x: null, y: null }); // null = default corner position
  const [size, setSize] = useState({ w: 420, h: 520 });
  // True while a drag or resize is in progress — renders a transparent
  // overlay above the iframe so its own event handling can't swallow
  // mousemove/mouseup and freeze the drag mid-gesture.
  const [interacting, setInteracting] = useState(null); // null | "move" | "x" | "y" | "xy"
  const dragRef = useRef(null);

  if (!doc) return null;

  const isImage = doc.mime?.startsWith("image/");
  const isPdf = doc.mime === "application/pdf";
  const _ext = (doc.name || "").split(".").pop().toLowerCase();
  const isHeic = doc.mime === "image/heic" || doc.mime === "image/heif" || _ext === "heic" || _ext === "heif";
  const url = isHeic
    ? `${API_BASE}/api/docs/${doc.id}/preview`
    : `${API_BASE}/api/docs/${doc.id}`;

  const defaultLeft = typeof window !== "undefined" ? window.innerWidth - size.w - 20 : 100;
  const curLeft = pos.x != null ? pos.x : defaultLeft;
  const curTop = pos.y != null ? pos.y : 72;

  const onDragStart = (e) => {
    e.preventDefault();
    dragRef.current = { startX: e.clientX, startY: e.clientY, origX: curLeft, origY: curTop };
    setInteracting("move");
    const onMove = (ev) => {
      const d = dragRef.current;
      if (!d) return;
      setPos({ x: d.origX + (ev.clientX - d.startX), y: d.origY + (ev.clientY - d.startY) });
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      dragRef.current = null;
      setInteracting(null);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  // axis: "x" (right edge, width only), "y" (bottom edge, height only),
  // or "xy" (corner, both at once).
  const onResizeStart = (axis) => (e) => {
    e.preventDefault();
    e.stopPropagation();
    dragRef.current = { startX: e.clientX, startY: e.clientY, origW: size.w, origH: size.h };
    setInteracting(axis);
    const onMove = (ev) => {
      const d = dragRef.current;
      if (!d) return;
      const dx = ev.clientX - d.startX;
      const dy = ev.clientY - d.startY;
      setSize((prev) => ({
        w: axis !== "y" ? Math.max(FLOATING_PREVIEW_MIN_W, d.origW + dx) : prev.w,
        h: axis !== "x" ? Math.max(FLOATING_PREVIEW_MIN_H, d.origH + dy) : prev.h,
      }));
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      dragRef.current = null;
      setInteracting(null);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  const interactCursor = interacting === "x" ? "ew-resize"
    : interacting === "y" ? "ns-resize"
    : interacting === "xy" ? "nwse-resize"
    : interacting === "move" ? "grabbing"
    : "default";

  return (
    <div
      className="fixed z-[60] bg-white border border-stone-300 rounded shadow-2xl flex flex-col"
      style={{ top: curTop, left: curLeft, width: size.w, height: size.h }}
    >
      <div
        className="flex items-center justify-between px-3 py-2 border-b border-stone-200 bg-stone-50 cursor-move shrink-0 select-none"
        onMouseDown={onDragStart}
      >
        <div className="text-xs font-medium text-stone-700 truncate pr-2">{doc.name}</div>
        <div className="flex items-center gap-1 shrink-0">
          <a
            href={url}
            target="_blank"
            rel="noopener noreferrer"
            onMouseDown={(e) => e.stopPropagation()}
            className="text-stone-400 hover:text-stone-800 p-1"
            title={t("在新窗口打开", "Open in a new window")}
          >
            <ExternalLink size={13} />
          </a>
          <button
            onClick={onClose}
            onMouseDown={(e) => e.stopPropagation()}
            className="text-stone-400 hover:text-stone-800 p-1"
            title={t("关闭预览", "Close preview")}
          >
            <X size={14} />
          </button>
        </div>
      </div>
      <div className="flex-1 min-h-0 bg-stone-100 relative overflow-auto">
        {isPdf || isHeic ? (
          <iframe src={url} title={doc.name} className="w-full h-full border-0" />
        ) : isImage ? (
          <img src={url} alt={doc.name} className="w-full h-full object-contain bg-white" />
        ) : (
          <div className="w-full h-full flex flex-col items-center justify-center gap-2 text-xs text-stone-500 p-4 text-center">
            <div>{t("此文件类型无法直接预览。", "This file type can't be previewed inline.")}</div>
            <a href={url} target="_blank" rel="noopener noreferrer" className="text-amber-700 hover:text-amber-900 underline">
              {t("在新窗口打开", "Open in a new window")}
            </a>
          </div>
        )}
        {/* Captures mouse events over the iframe while dragging/resizing so
            the gesture can't get stuck mid-drag when the cursor crosses into
            the iframe's own (separate) event handling. */}
        {interacting && (
          <div className="absolute inset-0" style={{ cursor: interactCursor }} />
        )}
      </div>

      {/* Resize handles */}
      <div
        onMouseDown={onResizeStart("x")}
        className="absolute top-0 right-0 w-1.5 h-full cursor-ew-resize"
        title={t("水平拖动可调整宽度", "Drag to resize width")}
      />
      <div
        onMouseDown={onResizeStart("y")}
        className="absolute bottom-0 left-0 w-full h-1.5 cursor-ns-resize"
        title={t("垂直拖动可调整高度", "Drag to resize height")}
      />
      <div
        onMouseDown={onResizeStart("xy")}
        className="absolute bottom-0 right-0 w-4 h-4 cursor-nwse-resize"
        style={{
          background: "linear-gradient(135deg, transparent 0%, transparent 45%, #a8a29e 45%, #a8a29e 55%, transparent 55%, transparent 100%)",
        }}
        title={t("拖动可同时调整宽高", "Drag to resize both width and height")}
      />
    </div>
  );
};

              onClick={openDocForReference}

              <ExternalLink size={10} /> {t("查看文档", "View document")}

          <div className="flex gap-1.5">
            <input
              autoFocus
              type="date"
              value={dueDraft}
              onChange={(e) => setDueDraft(e.target.value)}

                if (e.key === "Enter") commitDue();
                if (e.key === "Escape") cancelDue();

              >
                <ExternalLink size={10} /> {t("查看文档", "View document")}
              </button>
            </span>
            <span className="text-stone-400 normal-case tracking-normal text-right">{t("对所有引用此文档的位置均生效", "Applies everywhere this document is referenced")}</span>
          </div>
