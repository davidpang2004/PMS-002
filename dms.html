function DMS({ storagePath, onChangeFolder }) {
  const { lang, t, setLang } = useLang();
  const importFileRef = useRef(null);

  const triggerImportAndRun = () => {
    if (importFileRef.current) {
      importFileRef.current.value = "";
      importFileRef.current.click();
    }
  };

  const isMacDMS = typeof navigator !== "undefined" && /Mac|iPhone|iPad/.test(navigator.platform);

  const [dmsImportDialog, setDmsImportDialog] = useState(null);
  // { file, sourcePath, currentPath, chosenPathMode, customPath, mode }
  // chosenPathMode: "source" | "current" | "custom"
  const [dmsImportBusy, setDmsImportBusy] = useState(false);
  const [dmsImportError, setDmsImportError] = useState(null);

  const onImportFileChosen = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    e.target.value = "";

    let sourcePath = "";
    try {
      const inspectForm = new FormData();
      inspectForm.append("file", file);
      const inspectRes = await fetch("/api/project/inspect-dms", { method: "POST", body: inspectForm });
      if (inspectRes.ok) {
        const inspectData = await inspectRes.json();
        sourcePath = inspectData.source_path || "";
      }
    } catch {}

    const currentPath = storagePath || "";
    const pathsDiffer = sourcePath && sourcePath !== currentPath;
    setDmsImportError(null);
    setDmsImportDialog({
      file,
      sourcePath,
      currentPath,
      chosenPathMode: pathsDiffer ? "source" : "current",
      customPath: "",
    });
  };

  const doImportFromDialog = async () => {
    if (!dmsImportDialog) return;
    const { file, sourcePath, currentPath, chosenPathMode, customPath } = dmsImportDialog;

    let targetPath = "";
    if (chosenPathMode === "source") targetPath = sourcePath;
    else if (chosenPathMode === "current") targetPath = currentPath;
    else targetPath = customPath;

    if (!targetPath.trim()) {
      setDmsImportError(t("请输入目标路径。", "Please enter a destination path."));
      return;
    }

    setDmsImportBusy(true);
    setDmsImportError(null);
    try {
      const form = new FormData();
      form.append("file", file);
      form.append("target_path", targetPath.trim());
      const res = await fetch("/api/project/import", { method: "POST", body: form });
      if (res.status === 413) { setDmsImportError(t("文件过大，服务器拒绝接收。请检查服务器配置。", "The file is too large and the server refused it. Please check the server configuration.")); return; }
      if (!res.ok && res.headers.get("content-type")?.includes("text/html")) { setDmsImportError(t(`服务器错误 (${res.status})，请检查终端日志。`, `Server error (${res.status}) — please check the terminal log.`)); return; }
      const data = await res.json();
      if (data.ok) {
        setDmsImportDialog(null);
        try {
          ["dms:databook-selection", "dms:databook-title", "dms:databook-subtitle"].forEach((k) => localStorage.removeItem(k));
        } catch {}
        window.location.reload();
      } else {
        setDmsImportError(data.error || t("导入失败。", "Import failed."));
      }
    } catch (err) {
      setDmsImportError(err.message || t("导入失败。", "Import failed."));
    } finally {
      setDmsImportBusy(false);
    }
  };

  const [tree, setTree] = useState(null);
  const [docIndex, setDocIndex] = useState([]);
  // Always-current mirror of docIndex, re-synced every render. Lets async
  // handlers (e.g. updateDocMetadata, fired once per keystroke) read the
  // latest index instead of a value captured in a stale closure, which
  // otherwise causes rapid successive edits to silently overwrite each other.
  const docIndexRef = useRef(docIndex);
  docIndexRef.current = docIndex;
  const [photoRootNodeId, setPhotoRootNodeId] = useState("");
  const [selectedId, setSelectedId] = useState(null);
  const [expandedIds, setExpandedIds] = useState(new Set());
  const [viewerDoc, setViewerDoc] = useState(null);
  const [loading, setLoading] = useState(true);
  const [editingNode, setEditingNode] = useState(false);
  const [loginPwDraft, setLoginPwDraft] = useState("");   // password being typed, never persisted to tree state
  const [credCopied, setCredCopied] = useState(null);     // "account" | "password" | null — transient copy feedback
  useEffect(() => { setLoginPwDraft(""); setEditingNode(false); }, [selectedId]);
  const [tab, setTab] = useState("tree");
  const [scheduleMode, setScheduleMode] = useState(false); // "日程" color-coding toggle
  const [showDueList, setShowDueList] = useState(false);   // due-documents list dialog
  const [quitConfirmed, setQuitConfirmed] = useState(false); // server shut down via "退出 DMS"

  // docId -> docIndex entry, for O(1) due-date lookups while walking the tree.
  const docIndexById = useMemo(() => new Map(docIndex.map((d) => [d.id, d])), [docIndex]);

  // nodeId -> most-urgent tier ("red" | "yellow" | "blue" | null) among that
  // node's OWN directly-attached documents only — deliberately NOT recursive
  // into subfolders, so a due date deep in the tree doesn't tint every
  // ancestor folder up to the root. Computed once per tree/docIndex change
  // rather than re-walked on every TreeNode render.
  const nodeUrgencyMap = useMemo(() => {
    const map = new Map();
    const walk = (node) => {
      if (!node) return;
      let worst = null;
      (node.documents || []).forEach((d) => {
        const t = urgencyTier(docIndexById.get(d.id)?.dueDate);
        if (t && (!worst || URGENCY_RANK[t] > URGENCY_RANK[worst])) worst = t;
      });
      map.set(node.id, worst);
      (node.children || []).forEach(walk);
    };
    if (tree) walk(tree);
    return map;
  }, [tree, docIndexById]);

  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [showTextTree, setShowTextTree] = useState(false);   // box-drawing tree view
  const [textTreeMeta, setTextTreeMeta] = useState(false);   // include SN + doc counts
  const [textTreeCopied, setTextTreeCopied] = useState(false);
  const [dupDialog, setDupDialog] = useState(null); // { duplicates, allFiles, targetNodeId }
  const [uploadStatus, setUploadStatus] = useState(null); // { done, total } or null
  // Face recognition state
  const [faceSelectMode, setFaceSelectMode] = useState(false);
  const [faceSelectedIds, setFaceSelectedIds] = useState(new Set());
  const [showFaceTag, setShowFaceTag] = useState(false);
  const [facePersonFilter, setFacePersonFilter] = useState(null); // personId or null
  const [personDocIds, setPersonDocIds] = useState(null); // Set of doc IDs for current person filter

  // Resizable sidebar — width in pixels, persisted in localStorage.
  // Min/max prevent absurdly small or huge sidebars.
  const SIDEBAR_MIN = 220;
  const SIDEBAR_MAX = 720;
  const SIDEBAR_DEFAULT = 320;
  const [sidebarWidth, setSidebarWidth] = useState(() => {
    try {
      const saved = parseInt(localStorage.getItem("dms:sidebar-width"), 10);
      if (saved && saved >= SIDEBAR_MIN && saved <= SIDEBAR_MAX) return saved;
    } catch {}
    return SIDEBAR_DEFAULT;
  });
  const [resizing, setResizing] = useState(false);

  // While dragging, listen on the window so movement outside the handle still works
  useEffect(() => {
    if (!resizing) return;
    const onMove = (e) => {
      const w = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, e.clientX));
      setSidebarWidth(w);
    };
    const onUp = () => {
      setResizing(false);
      try { localStorage.setItem("dms:sidebar-width", String(sidebarWidth)); } catch {}
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    // Prevent text selection while dragging
    document.body.style.userSelect = "none";
    document.body.style.cursor = "col-resize";
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      document.body.style.userSelect = "";
      document.body.style.cursor = "";
    };
  }, [resizing, sidebarWidth]);

  // Save width on every change after dragging ends
  useEffect(() => {
    if (resizing) return;
    try { localStorage.setItem("dms:sidebar-width", String(sidebarWidth)); } catch {}
  }, [sidebarWidth, resizing]);

  // Double-click on the handle resets to default width
  const resetSidebarWidth = () => setSidebarWidth(SIDEBAR_DEFAULT);
  const [renamingId, setRenamingId] = useState(null);
  const [addingChildToId, setAddingChildToId] = useState(null);
  const [contextMenu, setContextMenu] = useState(null);
  const [showLinkPicker, setShowLinkPicker] = useState(false);
  const [showProjectMenu, setShowProjectMenu] = useState(false);
  const [showKeyParameters, setShowKeyParameters] = useState(false);
  const [showHierarchyImport, setShowHierarchyImport] = useState(false);
  const [showZipImport, setShowZipImport] = useState(false);
  const [showEmailSettings, setShowEmailSettings] = useState(false);
  const [showAISettings, setShowAISettings] = useState(false);
  const [showCombineModal, setShowCombineModal] = useState(false);
  const [keyParameters, setKeyParameters] = useState(DEFAULT_KEY_PARAMETERS);
  const ctxUploadInputRef = useRef(null);
  const ctxUploadTargetRef = useRef(null);
  const [folderPickerOpen, setFolderPickerOpen] = useState(false);
  const [pendingFolderFiles, setPendingFolderFiles] = useState([]); // [{folderName, files}]
  const multiFolderInputRef = useRef(null);
  const [draggingId, setDraggingId] = useState(null);
  const [dropInfo, setDropInfo] = useState(null);
  const draggingIdRef = useRef(null);
  const dropInfoRef = useRef(null);

  // ---- MIGRATION ---------------------------------------------------------
  // Older DMS data stored full document records inside each node's documents[]
  // list. The new schema stores only {id} references in nodes, with the
  // canonical record living in docIndex. Detect old-format data and convert
  // it once on load.
  const migrateIfNeeded = (loadedTree, loadedIndex) => {
    if (!loadedTree) return { tree: loadedTree, index: loadedIndex, migrated: false };

    let migrated = false;
    const indexById = new Map(loadedIndex.map((e) => [e.id, e]));

    const walkNode = (node) => {
      const newDocs = [];
      for (const d of (node.documents || [])) {
        if (d && typeof d === "object" && d.id && Object.keys(d).length === 1) {
          // Already in new format: just an {id} reference
          newDocs.push(d);
          continue;
        }
        if (d && d.id) {
          // Old format: full record nested in node. Promote it to docIndex
          // (if not already there) and replace with a bare reference.
          migrated = true;
          if (!indexById.has(d.id)) {
            indexById.set(d.id, {
              id: d.id,
              name: d.name,
              mime: d.mime,
              size: d.size,
              uploadedAt: d.uploadedAt,
              originalNodeId: node.id,
              metadata: d.metadata || {},
            });
          }
          newDocs.push({ id: d.id });
        }
      }
      return {
        ...node,
        documents: newDocs,
        children: (node.children || []).map(walkNode),
      };
    };

    const newTree = walkNode(loadedTree);
    const newIndex = Array.from(indexById.values()).map((e) => {
      // Strip stale fields the old index used to carry (nodeId, nodePath)
      const { nodeId, nodePath, ...rest } = e;
      return {
        ...rest,
        // Preserve originalNodeId if present, else derive from the old nodeId
        originalNodeId: rest.originalNodeId || nodeId || null,
      };
    });

    if (migrated) {
      console.log("[DMS] Migrated existing data to linked-document schema.");
    }
    return { tree: newTree, index: newIndex, migrated };
  };

  useEffect(() => {
    (async () => {
      const treeResp = await StorageAdapter.getTree();
      let t = treeResp.tree;
      if (!t) {
        t = buildSeedTree();
        await StorageAdapter.saveTree(t);
      }
      setPhotoRootNodeId(treeResp.photoRootNodeId || "");

      const rawIdx = await StorageAdapter.listDocumentIndex();
      const savedKeyParameters = await StorageAdapter.getKeyParameters();
      setKeyParameters(savedKeyParameters);

      const { tree: migratedTree, index: migratedIndex, migrated } =
        migrateIfNeeded(t, rawIdx);

      if (migrated) {
        await StorageAdapter.saveTree(migratedTree);
        await StorageAdapter.saveDocumentIndex(migratedIndex);
      }

      setTree(migratedTree);
      setDocIndex(migratedIndex);
      setSelectedId(migratedTree.id);
      setExpandedIds(new Set([migratedTree.id]));
      setLoading(false);
    })();
  }, []);

  // Poll for remote uploads: if index.json changes on disk (e.g. phone uploaded
  // a file), reload tree + docIndex so the Mac UI reflects the new file.
  const _lastMtime = React.useRef(0);
  useEffect(() => {
    const poll = async () => {
      try {
        const r = await fetch("/api/index-mtime");
        if (!r.ok) return;
        const { mtime } = await r.json();
        if (_lastMtime.current === 0) { _lastMtime.current = mtime; return; }
        if (mtime <= _lastMtime.current) return;
        _lastMtime.current = mtime;
        const treeResp = await StorageAdapter.getTree();
        const freshIndex = await StorageAdapter.listDocumentIndex();
        if (treeResp.tree) setTree(treeResp.tree);
        setDocIndex(freshIndex);
      } catch (_) {}
    };
    const id = setInterval(poll, 5000);
    return () => clearInterval(id);
  }, []);

  const persistTree = useCallback(async (newTree) => {
    setTree(newTree);
    await StorageAdapter.saveTree(newTree);
    // Update known mtime so the poller doesn't treat our own write as an external change.
    fetch("/api/index-mtime").then(r => r.json()).then(d => { _lastMtime.current = d.mtime; }).catch(() => {});
  }, []);

  const persistIndex = useCallback(async (newIndex) => {
    setDocIndex(newIndex);
    await StorageAdapter.saveDocumentIndex(newIndex);
    fetch("/api/index-mtime").then(r => r.json()).then(d => { _lastMtime.current = d.mtime; }).catch(() => {});
  }, []);

  const persistKeyParameters = useCallback(async (newKeyParameters) => {
    const clean = normalizeKeyParameters(newKeyParameters);
    setKeyParameters(clean);
    await StorageAdapter.saveKeyParameters(clean);
  }, []);

  // Add a single new parameter to the global list (if not already present).
  // Returns the cleaned name so callers can select it immediately.
  const handleAddKeyParameter = useCallback(async (name) => {
    const clean = String(name || "").trim();
    if (!clean) return null;
    const exists = keyParameters.some((k) => k.toLowerCase() === clean.toLowerCase());
    if (!exists) {
      await persistKeyParameters([...keyParameters, clean]);
    }
    return clean;
  }, [keyParameters, persistKeyParameters]);

  const getNodePathFrom = (rootTree, nodeId) => {
    if (!rootTree) return "";
    const path = [];
    const walk = (n, trail) => {
      const t = [...trail, n.name];
      if (n.id === nodeId) { path.push(...t); return true; }
      for (const c of n.children || []) if (walk(c, t)) return true;
      return false;
    };
    walk(rootTree, []);
    return path.join(" / ");
  };

  const getNodePath = (nodeId) => getNodePathFrom(tree, nodeId);
  const selectedNode = tree && selectedId ? findNode(tree, selectedId) : null;

  // All documents with a due date within the "日程" urgency window, most
  // urgent first (red > yellow > blue), then soonest-due within a tier.
  // docIndex is already the flat, whole-project document list, so no
  // separate tree walk is needed — see `getNodePathFrom` above for the
  // per-row folder path.
  const dueDocsList = useMemo(() => {
    return docIndex
      .map((d) => ({ ...d, tier: urgencyTier(d.dueDate), folderId: d.originalNodeId || d.nodeId }))
      .filter((d) => d.tier)
      .sort((a, b) =>
        URGENCY_RANK[b.tier] - URGENCY_RANK[a.tier] ||
        (a.dueDate || "").localeCompare(b.dueDate || "")
      );
  }, [docIndex]);

  const toggleExpand = (id) => {
    setExpandedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const expandToNode = (nodeId) => {
    if (!tree) return;
    const ids = new Set(expandedIds);
    const walk = (n, trail) => {
      const t = [...trail, n.id];
      if (n.id === nodeId) { t.forEach((x) => ids.add(x)); return true; }
      for (const c of n.children || []) if (walk(c, t)) return true;
      return false;
    };
    walk(tree, []);
    setExpandedIds(ids);
    setSelectedId(nodeId);
    setTab("tree");
  };

  // Node operations
  const startAddChildFromToolbar = () => {
    if (!selectedNode) return;
    setAddingChildToId(selectedId);
    setExpandedIds((prev) => new Set([...prev, selectedId]));
  };

  const handleCommitAddChild = async (parentId, name) => {
    const parentNode = findNode(tree, parentId);
    const existing = (parentNode?.children || []).find(c => c.name === name);
    if (existing) {
      // Folder with this name already exists — navigate to it instead of creating a duplicate.
      setExpandedIds((prev) => new Set([...prev, parentId]));
      setAddingChildToId(null);
      setSelectedId(existing.id);
      return;
    }
    const newNode = { id: genNodeId(), name, description: "", children: [], documents: [] };
    const newTree = updateNodeInTree(tree, parentId, (n) => {
      const sorted = [...(n.children || []), newNode]
        .sort((a, b) => {
          const na = parseInt(a.name, 10), nb = parseInt(b.name, 10);
          if (!isNaN(na) && !isNaN(nb)) return na - nb;
          return a.name.localeCompare(b.name);
        });
      return { ...n, children: sorted };
    });
    await persistTree(newTree);
    setExpandedIds((prev) => new Set([...prev, parentId]));
    setAddingChildToId(null);
    setSelectedId(newNode.id);
  };

  const handleCommitRename = async (nodeId, newName) => {
    const parentNode = findParentNode(tree, nodeId);
    if (parentNode) {
      const siblings = (parentNode.children || []).filter(c => c.id !== nodeId);
      if (siblings.some(c => c.name === newName)) {
        alert(t(`同级节点下已存在名为"${newName}"的文件夹。`, `A folder named "${newName}" already exists at this level.`));
        setRenamingId(null);
        return;
      }
    }
    const newTree = updateNodeInTree(tree, nodeId, (n) => ({ ...n, name: newName }));
    await persistTree(newTree);
    const refreshedIndex = docIndex.map((entry) => ({
      ...entry, nodePath: getNodePathFrom(newTree, entry.nodeId),
    }));
    await persistIndex(refreshedIndex);
    setRenamingId(null);
  };

  const handleDeleteNode = async (nodeId) => {
    if (!tree || nodeId === tree.id) {
      alert(t("无法删除根节点。", "Cannot delete the root node."));
      return;
    }
    const target = findNode(tree, nodeId);
    if (!target) return;
    const childCount = (target.children || []).length;
    const docCount = collectAllDocIds(target).length;
    const detail = childCount || docCount
      ? t(`\n\n该文件夹包含 ${childCount} 个子文件夹、${docCount} 个文档。\n该文件夹及其下所有子文件夹和文件将从硬盘永久删除，无法恢复。`, `\n\nThis folder contains ${childCount} subfolder(s) and ${docCount} document(s).\nThis folder and everything inside it will be permanently deleted from disk and cannot be recovered.`)
      : t("\n\n该文件夹及其在硬盘上对应的目录将被永久删除。", "\n\nThis folder and its corresponding directory on disk will be permanently deleted.");
    if (!confirm(t(`确定删除文件夹"${target.name}"？${detail}\n\n此操作无法撤销。`, `Delete folder "${target.name}"? ${detail}\n\nThis cannot be undone.`))) return;

    try {
      const res = await fetch(`/api/nodes/${nodeId}`, { method: "DELETE" });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(t("删除失败：", "Delete failed: ") + (err.error || res.status));
        return;
      }
    } catch (e) {
      alert(t("删除失败：", "Delete failed: ") + e.message);
      return;
    }
    // Reload tree and index from server after server-side deletion.
    const { tree: freshTree } = await StorageAdapter.getTree();
    const freshIndex = await StorageAdapter.listDocumentIndex();
    setTree(freshTree);
    setDocIndex(freshIndex);
    if (selectedId === nodeId) setSelectedId(freshTree?.id);
  };

  const handleMoveNode = async (nodeId, direction) => {
    const newTree = moveNodeInTree(tree, nodeId, direction);
    setSelectedId(nodeId);
    await persistTree(newTree);
  };

  const handleDragStart = (nodeId) => {
    draggingIdRef.current = nodeId;
    dropInfoRef.current = null;
    setDraggingId(nodeId);
    setDropInfo(null);
  };

  const handleDragOver = (targetId, position) => {
    const did = draggingIdRef.current;
    if (!did || !targetId || targetId === did) {
      if (dropInfoRef.current) { dropInfoRef.current = null; setDropInfo(null); }
      return;
    }
    const newInfo = { targetId, position };
    const prev = dropInfoRef.current;
    if (prev?.targetId === targetId && prev?.position === position) return;
    dropInfoRef.current = newInfo;
    setDropInfo(newInfo);
  };

  const handleDragEnd = () => {
    draggingIdRef.current = null;
    dropInfoRef.current = null;
    setDraggingId(null);
    setDropInfo(null);
  };

  const handleDrop = async () => {
    const dragId = draggingIdRef.current;
    const info = dropInfoRef.current;
    handleDragEnd();
    if (!dragId || !info) return;

    // When dropping "into" a target, check for a same-named sibling and merge
    if (info.position === "into") {
      const dragged = findNode(tree, dragId);
      const target = findNode(tree, info.targetId);
      if (dragged && target) {
        const conflict = (target.children || []).find(
          (c) => c.name === dragged.name && c.id !== dragId
        );
        if (conflict) {
          const { mergedNode, docRemap } = mergeNodesDeep(conflict, dragged);
          let next = removeNodeFromTree(tree, dragId);
          next = updateNodeInTree(next, conflict.id, () => mergedNode);

          // Update originalNodeId in docIndex for all moved docs BEFORE saving
          // the tree, so the server's _sync_doc_files_to_tree_paths sees the
          // correct node IDs when it moves the files on disk.
          if (docRemap.size > 0) {
            const newDocIndex = docIndex.map((e) =>
              docRemap.has(e.id) ? { ...e, originalNodeId: docRemap.get(e.id) } : e
            );
            await persistIndex(newDocIndex);
          }
          await persistTree(next);
          setSelectedId(conflict.id);
          return;
        }
      }
    }

    const newTree = moveNodeToPosition(tree, dragId, info.targetId, info.position);
    await persistTree(newTree);
    setSelectedId(dragId);
  };

  const updateNodeMeta = async (updates) => {
    const newTree = updateNodeInTree(tree, selectedId, (n) => ({ ...n, ...updates }));
    await persistTree(newTree);
    // Note: we no longer maintain nodePath in docIndex (it was unreliable
    // anyway — documents can be linked from many places). The search panel
    // computes paths on the fly from the current tree.
  };

  // Saves (or, with an empty string, clears) a folder's website password. Sent
  // to the server once as plaintext (it encrypts before writing to disk), then
  // immediately scrubbed from client state — only a presence marker is kept
  // locally so the UI knows whether a password is saved, never the value.
  const saveNodePassword = async (nodeId, password) => {
    const treeToSend = updateNodeInTree(tree, nodeId, (n) => ({ ...n, password }));
    await StorageAdapter.saveTree(treeToSend);
    fetch("/api/index-mtime").then(r => r.json()).then(d => { _lastMtime.current = d.mtime; }).catch(() => {});
    setTree((prev) => updateNodeInTree(prev, nodeId, (n) => {
      const next = { ...n };
      delete next.password;
      if (password) next.passwordEnc = "•"; // presence marker only — real ciphertext lives server-side
      else delete next.passwordEnc;
      return next;
    }));
  };

  const normalizeWebsiteUrl = (url) => {
    const trimmed = (url || "").trim();
    if (!trimmed) return "";
    return /^[a-z][a-z0-9+.-]*:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
  };

  // "打开" — copies the saved account name to the clipboard and opens the site.
  const handleOpenLoginSite = async (node) => {
    try {
      const cred = await StorageAdapter.revealCredential(node.id);
      if (cred.accountName) {
        try {
          await navigator.clipboard.writeText(cred.accountName);
          setCredCopied("account");
          setTimeout(() => setCredCopied(null), 1500);
        } catch {/* clipboard blocked */}
      }
      const url = normalizeWebsiteUrl(cred.websiteUrl);
      if (url) window.open(url, "_blank", "noopener,noreferrer");
    } catch (e) {
      alert(t("无法获取登录信息：", "Could not retrieve login info: ") + e.message);
    }
  };

  // "复制密码" — copies the saved password to the clipboard.
  const handleCopyLoginPassword = async (node) => {
    try {
      const cred = await StorageAdapter.revealCredential(node.id);
      if (cred.password) {
        await navigator.clipboard.writeText(cred.password);
        setCredCopied("password");
        setTimeout(() => setCredCopied(null), 1500);
      }
    } catch (e) {
      alert(t("无法获取登录信息：", "Could not retrieve login info: ") + e.message);
    }
  };

  // Find a direct child of parentId named childName; create it if missing.
  // Returns [updatedTree, childNodeId].
  const getOrCreateChild = (currentTree, parentId, childName) => {
    const parent = findNode(currentTree, parentId);
    if (!parent) return [currentTree, parentId];
    const existing = (parent.children || []).find((c) => c.name === childName);
    if (existing) return [currentTree, existing.id];
    const newId = genNodeId();
    const newNode = { id: newId, name: childName, children: [], documents: [] };
    const newTree = updateNodeInTree(currentTree, parentId, (n) => {
      const sorted = [...(n.children || []), newNode]
        .sort((a, b) => {
          const na = parseInt(a.name, 10), nb = parseInt(b.name, 10);
          if (!isNaN(na) && !isNaN(nb)) return na - nb;
          return a.name.localeCompare(b.name);
        });
      return { ...n, children: sorted };
    });
    return [newTree, newId];
  };

  const uploadFilesToNode = async (
    targetNodeId,
    files,
    { skipDuplicates = false, routeMode = "year-month" } = {}
  ) => {
    console.log(`[DMS] uploadFilesToNode called, target=${targetNodeId}, files=${files.length}, mode=${routeMode}`);
    if (!files.length) return;

    // Duplicate detection — skipped when caller already handled it (dialog response).
    // Uses name+size only (no hash) to avoid reading all files into memory upfront,
    // which would cause memory pressure and break GPS extraction for large folder uploads.
    if (!skipDuplicates) {
      setUploadStatus({ done: 0, total: files.length, phase: "检查重复" });
      const nameSizeSet = new Set(docIndex.map((e) => `${e.name}::${e.size}`));
      const duplicates = [];
      for (const file of files) {
        if (nameSizeSet.has(`${file.name}::${file.size}`)) {
          const existing = docIndex.find((e) => e.name === file.name && e.size === file.size);
          duplicates.push({ file, existing });
        }
      }
      if (duplicates.length > 0) {
        setUploadStatus(null);
        setDupDialog({ duplicates, allFiles: files, targetNodeId });
        return;
      }
    }

    const filesToProcess = files;
    if (!filesToProcess.length) { setUploadStatus(null); return; }
    const baseTree = tree; // snapshot at the start of this (possibly long) upload
    let workingTree = tree;
    let workingIndex = [...docIndex];
    const newIndexEntries = [];
    setUploadStatus({ done: 0, total: filesToProcess.length, phase: "上传" });
    const failedFiles = [];

    for (const file of filesToProcess) {
      const docId = genDocId();

      // Auto-route: if filename is "FolderName#anything.pdf", place the doc
      // in the node whose name exactly matches the prefix before "#".
      const hashIdx = file.name.indexOf("#");
      let effectiveNodeId = targetNodeId;
      let autoSn;
      if (routeMode !== "current-folder" && hashIdx > 0) {
        const folderName = file.name.slice(0, hashIdx).trim();
        autoSn = folderName;
        const matched = findNodeByName(tree, folderName);
        if (matched) {
          effectiveNodeId = matched.id;
          console.log(`[DMS] Auto-routing "${file.name}" → node "${folderName}" (${matched.id})`);
        } else {
          console.warn(`[DMS] No node named "${folderName}" found; uploading to selected node`);
        }
      }

      let contentHash = null;
      try { contentHash = await computeFileHash(file); } catch (_) {}

      console.log(`[DMS] Processing file: ${file.name} (${file.size} bytes, ${file.type}) → ${docId}`);
      const _photoExts = new Set(["jpg","jpeg","png","heic","heif","tif","tiff","webp","gif","bmp"]);
      const _isPhoto = file.type.startsWith("image/") ||
        _photoExts.has(file.name.split(".").pop().toLowerCase());
      const photoDate = _isPhoto ? await readPhotoDate(file) : null;
      if (photoDate) console.log(`[DMS] Photo date: ${photoDate.year}/${photoDate.month} lat=${photoDate.lat} lon=${photoDate.lon} for ${file.name}`);

      // For photos, create year/month subfolders under the designated photo root
      // (or the upload target folder if no root is set), unless uploading to current folder.
      let finalNodeId = effectiveNodeId;
      let photoBaseNodeId = null;
      if (photoDate && routeMode !== "current-folder") {
        const baseId = photoRootNodeId || effectiveNodeId || workingTree.id;
        photoBaseNodeId = baseId;
        [workingTree, finalNodeId] = getOrCreateChild(workingTree, baseId, photoDate.year);
        [workingTree, finalNodeId] = getOrCreateChild(workingTree, finalNodeId, photoDate.month);
      }

      const doc = {
        id: docId, name: file.name, mime: file.type || "application/octet-stream",
        size: file.size, uploadedAt: new Date().toISOString(),
        file, nodeId: finalNodeId, routeMode, metadata: {},
        ...(photoDate ? {
          photoYear: photoDate.year, photoMonth: photoDate.month,
          ...(photoDate.lat != null ? { photoLat: photoDate.lat, photoLon: photoDate.lon } : {}),
        } : {}),
        ...(photoBaseNodeId ? { photoBaseNodeId } : {}),
      };
      let uploadResult = {};
      try {
        console.log(`[DMS] Posting to /api/docs ...`);
        uploadResult = await StorageAdapter.saveDocument(doc) || {};
      } catch (e) {
        console.error("[DMS] ✗ saveDocument failed:", e);
        failedFiles.push(file.name);
        setUploadStatus((s) => s ? { ...s, done: s.done + 1 } : s);
        continue;
      }

      workingTree = updateNodeInTree(workingTree, finalNodeId, (n) => ({
        ...n,
        documents: [...(n.documents || []), { id: docId }],
      }));

      const newEntry = {
        id: docId,
        name: file.name,
        mime: file.type,
        size: file.size,
        uploadedAt: doc.uploadedAt,
        originalNodeId: finalNodeId,
        ...(contentHash ? { contentHash } : {}),
        metadata: uploadResult.location ? { Location: { design: "", actual: uploadResult.location } } : {},
        ...(uploadResult.lat != null && uploadResult.lon != null
          ? { lat: uploadResult.lat, lon: uploadResult.lon } : {}),
        ...(autoSn ? { sn: autoSn } : {}),
      };
      workingIndex = [...workingIndex, newEntry];
      newIndexEntries.push(newEntry);
      setUploadStatus((s) => s ? { ...s, done: s.done + 1 } : s);
    }
    try {
      console.log("[DMS] Persisting updated tree and index ...");
      // Re-fetch the latest tree/index right before the final save and merge
      // in only what this upload actually added. A large upload can run for
      // minutes, and `tree`/`docIndex` were snapshotted at the start — if the
      // user creates a folder (or another action edits the index) while the
      // upload is still running, blindly persisting the stale snapshot would
      // silently overwrite (and delete) that concurrent change.
      let finalTree = workingTree;
      let finalIndex = workingIndex;
      try {
        const [freshTreeResp, freshIndex] = await Promise.all([
          StorageAdapter.getTree(),
          StorageAdapter.listDocumentIndex(),
        ]);
        if (freshTreeResp?.tree) finalTree = mergeTreeAdditions(baseTree, workingTree, freshTreeResp.tree);
        if (freshIndex) finalIndex = [...freshIndex, ...newIndexEntries];
      } catch (e) {
        console.warn("[DMS] Could not re-fetch latest tree/index before final save; using local snapshot", e);
      }
      await persistTree(finalTree);
      await persistIndex(finalIndex);
      console.log("[DMS] ✓ Upload complete");
    } catch (e) {
      console.error("[DMS] ✗ Failed to persist tree/index after upload:", e);
      alert(t("文件已上传，但无法保存索引：", "Files were uploaded, but the index could not be saved: ") + e.message);
    } finally {
      setUploadStatus(null);
      if (failedFiles.length > 0) {
        alert(t(`${failedFiles.length} 个文件上传失败（已跳过）：\n${failedFiles.join("\n")}`, `${failedFiles.length} file(s) failed to upload (skipped):\n${failedFiles.join("\n")}`));
      }
    }
  };

  const handleUpload = async (e) => {
    console.log("[DMS] handleUpload triggered, files=", e.target.files);
    const files = Array.from(e.target.files || []);
    if (!files.length) {
      console.log("[DMS] No files in event, aborting");
      return;
    }
    if (!selectedNode) {
      console.warn("[DMS] No node selected, cannot upload");
      alert(t("请先在装配树中点击选择一个文件夹。", "Please click to select a folder in the assembly tree first."));
      return;
    }
    console.log(`[DMS] Uploading ${files.length} file(s) to selected node ${selectedId}`);
    try {
      await uploadFilesToNode(selectedId, files);
    } catch (e) {
      console.error("[DMS] ✗ Top-level upload error:", e);
      alert(t("上传过程中发生意外错误：", "An unexpected error occurred during upload: ") + e.message);
    }
    e.target.value = "";
  };

  const handleFolderUpload = async (e) => {
    const photoExts = new Set(["jpg","jpeg","png","heic","heif","tif","tiff","webp","gif","bmp"]);
    const videoExts = new Set(["avi","mp4","mov","mkv","wmv","m4v","mpg","mpeg","3gp","flv","webm"]);
    const files = Array.from(e.target.files || []).filter((f) => {
      const ext = f.name.split(".").pop().toLowerCase();
      return f.type.startsWith("image/") || f.type.startsWith("video/") || photoExts.has(ext) || videoExts.has(ext);
    });
    if (!files.length) { e.target.value = ""; alert(t("所选文件夹中未找到照片或视频文件。", "No photo or video files were found in the selected folder.")); return; }
    if (!selectedNode) { e.target.value = ""; alert(t("请先在装配树中点击选择一个文件夹。", "Please click to select a folder in the assembly tree first.")); return; }
    try {
      await uploadFilesToNode(selectedId, files);
    } catch (err) {
      console.error("[DMS] ✗ Folder upload error:", err);
      alert(t("上传过程中发生意外错误：", "An unexpected error occurred during upload: ") + err.message);
    }
    e.target.value = "";
  };

  const openMultiFolderDialog = () => {
    if (!selectedNode) { alert(t("请先在装配树中点击选择一个文件夹。", "Please click to select a folder in the assembly tree first.")); return; }
    setPendingFolderFiles([]);
    setFolderPickerOpen(true);
  };

  const junkFileNames = new Set([".ds_store", "thumbs.db", "desktop.ini"]);
  const handleMultiFolderPickerChange = (e) => {
    const allFiles = Array.from(e.target.files || []);
    const files = allFiles.filter((f) => !junkFileNames.has(f.name.toLowerCase()));
    e.target.value = "";
    if (!files.length) { alert(t("所选文件夹中未找到文件。", "No files were found in the selected folder.")); return; }
    const folderName = files[0].webkitRelativePath.split("/")[0] || t("未知文件夹", "Unknown folder");
    setPendingFolderFiles((prev) => {
      if (prev.find((f) => f.folderName === folderName)) {
        alert(t(`文件夹 "${folderName}" 已添加，请选择其他文件夹。`, `Folder "${folderName}" has already been added — please choose a different folder.`));
        return prev;
      }
      return [...prev, { folderName, files }];
    });
  };

  const handleMultiFolderUpload = async () => {
    const allFiles = pendingFolderFiles.flatMap((f) => f.files);
    if (!allFiles.length) return;
    setFolderPickerOpen(false);
    setPendingFolderFiles([]);
    try {
      await uploadFilesToNode(selectedId, allFiles);
    } catch (err) {
      console.error("[DMS] ✗ Multi-folder upload error:", err);
      alert(t("上传过程中发生意外错误：", "An unexpected error occurred during upload: ") + err.message);
    }
  };

  const handleCurrentFolderUpload = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) {
      e.target.value = "";
      return;
    }
    if (!selectedNode) {
      e.target.value = "";
      alert(t("请先在装配树中点击选择一个文件夹。", "Please click to select a folder in the assembly tree first."));
      return;
    }
    try {
      await uploadFilesToNode(selectedId, files, { routeMode: "current-folder" });
    } catch (err) {
      console.error("[DMS] ✗ Current-folder upload error:", err);
      alert(t("上传过程中发生意外错误：", "An unexpected error occurred during upload: ") + err.message);
    }
    e.target.value = "";
  };

  const handleTreeUpload = async (nodeId, e) => {
    console.log(`[DMS] handleTreeUpload triggered for node ${nodeId}, files=`, e.target.files);
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    try {
      await uploadFilesToNode(nodeId, files);
    } catch (e2) {
      console.error("[DMS] ✗ Top-level tree upload error:", e2);
      alert("Unexpected error during upload: " + e2.message);
    }
    setSelectedId(nodeId);
    setExpandedIds((prev) => new Set([...prev, nodeId]));
    e.target.value = "";
  };

  const handlePanelDragOver = (e) => {
    if (e.dataTransfer.types.includes('Files')) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    }
  };

  const handlePanelDrop = (e) => {
    if (e.dataTransfer.files.length !== 0) {
      e.preventDefault();
      if (!selectedId) {
        alert(t("请先在左侧目录树中点击选择一个文件夹，再拖入文件。", "Please click to select a folder in the tree on the left before dropping files."));
        return;
      }
      uploadFilesToNode(selectedId, Array.from(e.dataTransfer.files), { routeMode: "current-folder" });
    }
  };

  const openDoc = (docId) => {
    const meta = docIndex.find((d) => d.id === docId);
    if (!meta) return;
    setViewerDoc({
      id: docId,
      name: meta.name,
      mime: meta.mime,
      size: meta.size,
      uploadedAt: meta.uploadedAt,
      originalNodeId: meta.originalNodeId || meta.nodeId,
      metadata: meta.metadata || {},
      ocrText: meta.ocrText || "",
      description: meta.description || "",
      lat: meta.lat != null ? meta.lat : null,
      lon: meta.lon != null ? meta.lon : null,
      localKeyParams: Array.isArray(meta.localKeyParams) ? meta.localKeyParams : [],
      dataUrl: API_BASE + "/api/docs/" + docId,
    });
  };

  const openDocNative = (docId) => {
    fetch(`/api/docs/${docId}/open`, { method: "POST" });
  };

  // Navigate to a document from the due-docs list: select its folder, open
  // the viewer, close the list, and push a history entry so the browser's
  // Back button returns to the list (and Forward returns to this document).
  const handleOpenDueItem = (doc) => {
    setShowDueList(false);
    expandToNode(doc.folderId);
    openDoc(doc.id);
    window.history.pushState({ dmsView: "doc", docId: doc.id, nodeId: doc.folderId }, "", "#doc-" + doc.id);
  };

  // Keep a ref to the latest popstate handler so the actual DOM listener
  // (registered once, below) never closes over stale tree/docIndex/state
  // setters from an earlier render.
  const popStateHandlerRef = useRef(null);
  popStateHandlerRef.current = (e) => {
    const state = e.state;
    if (state && state.dmsView === "dueList") {
      setViewerDoc(null);
      setShowDueList(true);
    } else if (state && state.dmsView === "doc") {
      setShowDueList(false);
      expandToNode(state.nodeId);
      openDoc(state.docId);
    } else {
      // Navigated past this feature's history entries — just close both.
      setShowDueList(false);
      setViewerDoc(null);
    }
  };
  useEffect(() => {
    const listener = (e) => popStateHandlerRef.current(e);
    window.addEventListener("popstate", listener);
    return () => window.removeEventListener("popstate", listener);
  }, []);

  const [pasteStatus, setPasteStatus] = useState(null); // null | "saving" | "done" | "error"

  const handlePasteScreenshot = async (imageBlob) => {
    if (!selectedId || !selectedNode) {
      alert(t("请先选择一个文件夹。", "Please select a folder first."));
      return;
    }
    setPasteStatus("saving");
    try {
      const reader = new FileReader();
      const dataUrl = await new Promise((res, rej) => {
        reader.onload = () => res(reader.result);
        reader.onerror = rej;
        reader.readAsDataURL(imageBlob);
      });
      const base64 = dataUrl.split(",")[1];

      const res = await fetch("/api/paste-screenshot", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image_data: base64,
          node_id: selectedId,
          folder_name: selectedNode.name,
        }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Unknown error");

      const docId = data.doc_id;
      const newTree = updateNodeInTree(tree, selectedId, (n) => ({
        ...n,
        documents: [...(n.documents || []), { id: docId }],
      }));
      const newIndex = [
        ...docIndex,
        {
          id: docId,
          name: data.name,
          mime: "application/pdf",
          size: data.size,
          uploadedAt: new Date().toISOString(),
          originalNodeId: selectedId,
          metadata: {},
        },
      ];
      await persistTree(newTree);
      await persistIndex(newIndex);
      setPasteStatus("done");
      setTimeout(() => setPasteStatus(null), 1500);
    } catch (e) {
      console.error("[DMS] paste screenshot error:", e);
      setPasteStatus("error");
      setTimeout(() => setPasteStatus(null), 3000);
      alert(t("截图保存失败：", "Failed to save the screenshot: ") + e.message);
    }
  };

  // Listen for Ctrl+V / Cmd+V paste events when a folder is selected
  useEffect(() => {
    const onPaste = (e) => {
      if (!selectedId) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.kind === "file" && item.type.startsWith("image/")) {
          e.preventDefault();
          const blob = item.getAsFile();
          if (blob) handlePasteScreenshot(blob);
          return;
        }
      }
    };
    document.addEventListener("paste", onPaste);
    return () => document.removeEventListener("paste", onPaste);
  }, [selectedId, selectedNode, tree, docIndex]);

  // ---- Face person filter: fetch docIds when filter changes ----------------
  useEffect(() => {
    if (!facePersonFilter) {
      setPersonDocIds(null);
      return;
    }
    fetch(`/api/faces/photos/${facePersonFilter}`)
      .then((r) => r.json())
      .then((d) => setPersonDocIds(new Set(d.docIds || [])))
      .catch(() => setPersonDocIds(null));
  }, [facePersonFilter]);

  // ---- DOCUMENT LINKAGE HELPERS -----------------------------------------
  // Compute, for every docId, the list of nodes that reference it.
  // Used to show "linked from N other nodes" badges and to drive deletion logic.
  const refMap = useMemo(() => {
    const map = new Map(); // docId -> Array<nodeId>
    if (!tree) return map;
    const walk = (node) => {
      for (const d of (node.documents || [])) {
        if (!d || !d.id) continue;
        if (!map.has(d.id)) map.set(d.id, []);
        map.get(d.id).push(node.id);
      }
      (node.children || []).forEach(walk);
    };
    walk(tree);
    return map;
  }, [tree]);

  // Given a node + a doc record from docIndex, return the rich object the
  // DocumentCard expects. (Card was designed for the old "full record"
  // format; we synthesize that shape from canonical record + reference.)
  const enrichDocsForNode = (node) => {
    if (!node) return [];
    return (node.documents || [])
      .map((ref) => docIndex.find((e) => e.id === ref.id))
      .filter(Boolean);
  };

  // Documents that exist in the index but aren't referenced by any node.
  // These show up in the search/picker so they can be re-linked.
  const unreferencedDocs = useMemo(() => {
    return docIndex.filter((d) => !refMap.has(d.id));
  }, [docIndex, refMap]);

  // Remove a link from a single node. If that was the last reference, the
  // document stays in docIndex (and on disk) as "unreferenced" — the user's
  // chosen behavior. They can re-link it later via the picker.
  const NOT_SHOW_FOLDER = "Not Show in Tree";

  // Find or create the "Not Show in Tree" folder directly under root.
  const getOrCreateNotShowNode = (currentTree) => {
    const existing = (currentTree.children || []).find(c => c.name === NOT_SHOW_FOLDER);
    if (existing) return [currentTree, existing.id];
    const newId = genNodeId();
    const newNode = { id: newId, name: NOT_SHOW_FOLDER, children: [], documents: [] };
    const updated = { ...currentTree, children: [...(currentTree.children || []), newNode] };
    return [updated, newId];
  };

  const unlinkDocFromNode = async (docId, nodeId) => {
    // If deleting from "Not Show in Tree", permanently delete from disk.
    const notShowNode = (tree.children || []).find(c => c.name === NOT_SHOW_FOLDER);
    if (notShowNode && notShowNode.id === nodeId) {
      if (!confirm(t(`此文档已在"${NOT_SHOW_FOLDER}"文件夹中。\n\n确定从磁盘永久删除？此操作无法撤销。`, `This document is already in the "${NOT_SHOW_FOLDER}" folder.\n\nPermanently delete it from disk? This cannot be undone.`))) return;
      await StorageAdapter.deleteDocument(docId);
      const { tree: freshTree } = await StorageAdapter.getTree();
      const freshIndex = await StorageAdapter.listDocumentIndex();
      setTree(freshTree);
      setDocIndex(freshIndex);
      return;
    }

    const refs = refMap.get(docId) || [];
    const otherRefs = refs.filter((id) => id !== nodeId);
    let confirmMsg;
    if (otherRefs.length === 0) {
      confirmMsg = t(
        `确定从此文件夹移除此文档？\n\n文档将被移至根目录下的"${NOT_SHOW_FOLDER}"文件夹，文件保留在磁盘上。`,
        `Remove this document from this folder?\n\nThe document will be moved to the "${NOT_SHOW_FOLDER}" folder at the root; the file stays on disk.`
      );
    } else {
      confirmMsg = t(
        `确定从此文件夹移除此文档的链接？\n\n该文档仍链接至其他 ${otherRefs.length} 个文件夹，文件不会从磁盘删除。`,
        `Remove this document's link from this folder?\n\nThe document is still linked to ${otherRefs.length} other folder(s); the file won't be deleted from disk.`
      );
    }
    if (!confirm(confirmMsg)) return;

    // Remove from current node.
    let workingTree = updateNodeInTree(tree, nodeId, (n) => ({
      ...n,
      documents: (n.documents || []).filter((d) => d.id !== docId),
    }));

    let updatedIndex = docIndex;
    if (otherRefs.length === 0) {
      // Last reference — move to "Not Show in Tree" instead of leaving orphaned.
      let notShowId;
      [workingTree, notShowId] = getOrCreateNotShowNode(workingTree);
      workingTree = updateNodeInTree(workingTree, notShowId, (n) => ({
        ...n,
        documents: [...(n.documents || []), { id: docId }],
      }));
      // Update originalNodeId so the server moves the physical file to the "Not Show in Tree" folder.
      updatedIndex = docIndex.map((e) =>
        e.id === docId ? { ...e, originalNodeId: notShowId } : e
      );
      // Save docIndex first so the server's file-sync reads the updated originalNodeId.
      await StorageAdapter.saveDocumentIndex(updatedIndex);
    }

    await StorageAdapter.saveTree(workingTree);
    // Reload from server to ensure UI reflects the saved state.
    const { tree: freshTree } = await StorageAdapter.getTree();
    const freshIndex = await StorageAdapter.listDocumentIndex();
    setTree(freshTree);
    setDocIndex(freshIndex);
  };

  // Hard delete: removes file from disk AND removes all references from the tree.
  // Used from the global "manage documents" view, not the per-node trash icon.
  const purgeDocument = async (docId) => {
    const refs = refMap.get(docId) || [];
    let confirmMsg;
    if (refs.length === 0) {
      confirmMsg = t("确定永久删除此文档？\n\n文件将从磁盘上删除。", "Permanently delete this document?\n\nThe file will be deleted from disk.");
    } else {
      confirmMsg = t(
        `此文档已被 ${refs.length} 个节点链接。\n\n确定永久删除？所有链接将被移除，文件将从磁盘上删除。`,
        `This document is linked from ${refs.length} node(s).\n\nPermanently delete it? All links will be removed and the file will be deleted from disk.`
      );
    }
    if (!confirm(confirmMsg)) return;

    await StorageAdapter.deleteDocument(docId);
    // Remove every reference from the tree
    const stripRefs = (node) => ({
      ...node,
      documents: (node.documents || []).filter((d) => d.id !== docId),
      children: (node.children || []).map(stripRefs),
    });
    const newTree = stripRefs(tree);
    await persistTree(newTree);
    const newIndex = docIndex.filter((e) => e.id !== docId);
    await persistIndex(newIndex);
  };

  // Add a link from an existing document to a node (idempotent — won't duplicate).
  const linkDocToNode = async (docId, nodeId) => {
    const target = findNode(tree, nodeId);
    if (!target) return;
    if ((target.documents || []).some((d) => d.id === docId)) {
      // Already linked — silently no-op
      return;
    }
    const newTree = updateNodeInTree(tree, nodeId, (n) => ({
      ...n,
      documents: [...(n.documents || []), { id: docId }],
    }));
    await persistTree(newTree);
  };

  // Update metadata GLOBALLY (the user's chosen behavior — one set per document).
  // Fires once per keystroke (via ImeInput's onCommit), so this must be fast
  // and must read the latest index — not a value snapshotted in a stale
  // closure — or rapid edits silently clobber each other.
  const updateDocMetadata = async (docId, metadata) => {
    // No tree change needed, and no file re-upload needed either — metadata
    // lives only in docIndex. (The server's /api/docs upload endpoint never
    // even reads a metadata field, so the old fetch-file+re-upload round trip
    // here was pure overhead — and, being slow, was exactly what widened the
    // race window that caused dropped characters while typing.)
    const newIndex = docIndexRef.current.map((e) => (e.id === docId ? { ...e, metadata } : e));
    await persistIndex(newIndex);
  };

  // Update document's own SN (empty string clears override → falls back to inheritance)
  const updateDocSn = async (docId, newSn) => {
    const trimmed = (newSn || "").trim();
    const newIndex = docIndex.map((e) =>
      e.id === docId ? { ...e, sn: trimmed || undefined } : e
    );
    await persistIndex(newIndex);
  };

  // Update a document's due date (used by the "日程" scheduling feature).
  // Empty string clears the due date.
  const updateDocDueDate = async (docId, dueDate) => {
    const newIndex = docIndex.map((e) =>
      e.id === docId ? { ...e, dueDate: dueDate || undefined } : e
    );
    await persistIndex(newIndex);
  };

  // Persist OCR-extracted text into the doc index so it becomes searchable.
  // We update the index only — no need to re-upload the binary file.
  const handleSaveOcr = async (docId, text) => {
    const ocrText = text || "";
    const newIndex = docIndex.map((e) =>
      e.id === docId ? { ...e, ocrText } : e
    );
    await persistIndex(newIndex);
    // Keep the open viewer in sync so its "indexed" state and seed update.
    setViewerDoc((cur) => (cur && cur.id === docId ? { ...cur, ocrText } : cur));
  };

  // Persist extracted key parameters into the document's metadata (the
  // extracted values land in each field's "actual" slot inside the metadata
  // object passed up from the viewer). Reuses the same persistence as manual
  // metadata edits, then syncs the open viewer so a re-save sees current data.
  const handleSaveParams = async (docId, metadata) => {
    await updateDocMetadata(docId, metadata);
    setViewerDoc((cur) => (cur && cur.id === docId ? { ...cur, metadata } : cur));
  };

  // Persist a user-written description/caption into the doc index so it
  // becomes searchable. Index-only update, like OCR text.
  const handleSaveDescription = async (docId, description) => {
    const clean = description || "";
    const newIndex = docIndex.map((e) =>
      e.id === docId ? { ...e, description: clean } : e
    );
    await persistIndex(newIndex);
    setViewerDoc((cur) => (cur && cur.id === docId ? { ...cur, description: clean } : cur));
  };

  // Persist this document's locally-added parameter keys (kept separate from
  // the global key-parameter list). Index-only update, like OCR text.
  const handleSaveLocalParams = async (docId, localKeyParams) => {
    const clean = normalizeKeyParameters(localKeyParams || []);
    const newIndex = docIndex.map((e) =>
      e.id === docId ? { ...e, localKeyParams: clean } : e
    );
    await persistIndex(newIndex);
    setViewerDoc((cur) => (cur && cur.id === docId ? { ...cur, localKeyParams: clean } : cur));
  };

  // Per-node trash button now means "unlink from this node only"
  const deleteDoc = async (docId) => {
    await unlinkDocFromNode(docId, selectedId);
  };

  const formatBytes = (n) => {
    if (!n) return "—";
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
    return `${(n / 1024 / 1024).toFixed(1)} MB`;
  };

  if (loading) {
    return <div className="h-screen flex items-center justify-center bg-stone-50 text-stone-500 text-sm">{t("正在加载文档库…", "Loading document library…")}</div>;
  }

  if (quitConfirmed) {
    // window.close() is blocked by the browser for tabs it didn't open
    // itself (true for essentially every real launch of this app), so it
    // can't be relied on to actually close the window. Show an explicit
    // confirmation instead — otherwise the page just sits there unchanged
    // after the server has already shut down, and clicking "退出 DMS"
    // looks like it did nothing.
    return (
      <div className="h-screen flex items-center justify-center bg-stone-50 text-stone-700 text-sm">
        <div className="text-center space-y-2">
          <div className="text-2xl">✓</div>
          <div className="font-medium">{t("DMS 服务器已停止", "DMS server stopped")}</div>
          <div className="text-stone-500 text-xs">{t("您现在可以关闭此浏览器标签页。", "You can now close this browser tab.")}</div>
        </div>
      </div>
    );
  }

            />
          </div>
        </div>

            const { duplicates, allFiles, targetNodeId } = dupDialog;

            // Build all links in one tree update so no call reads stale state.
            // Mirror the upload routing: if the original doc lived in a year/month
            // node, create the same year/month subfolder under the target and link there.
            let newTree = tree;
            for (const { existing } of duplicates) {
              let linkNodeId = targetNodeId;
              if (existing.originalNodeId) {
                const origPath = getNodePathFrom(newTree, existing.originalNodeId);
                const parts = origPath.split(" / ").map((s) => s.trim());
                const n = parts.length;
                if (
                  n >= 2 &&
                  /^\d{4}$/.test(parts[n - 2]) &&
                  /^\d{1,2}$/.test(parts[n - 1])

                  const year = parts[n - 2];
                  const month = parts[n - 1].padStart(2, "0");
                  [newTree, linkNodeId] = getOrCreateChild(newTree, targetNodeId, year);

              newTree = updateNodeInTree(newTree, linkNodeId, (n) => ({
                ...n,
                documents: [...(n.documents || []), { id: existing.id }],
              }));

            await persistTree(newTree);
            // Upload any non-duplicate files normally
            const nonDups = allFiles.filter((f) => !duplicates.some((d) => d.file === f));

                    name="dmsPathMode"
                    value="source"
                    checked={dmsImportDialog.chosenPathMode === "source"}
                    onChange={() => setDmsImportDialog({ ...dmsImportDialog, chosenPathMode: "source" })}
                    className="mt-0.5 accent-amber-600"
                  />
                  <div>
                    <div className="text-xs font-medium text-stone-800">{t("使用 .dms 文件中的原始路径", "Use the original path from the .dms file")}</div>
                    <div className="text-[11px] font-mono text-amber-700 break-all mt-0.5">
                      {dmsImportDialog.sourcePath}
                    </div>
                    <div className="text-[10px] text-stone-400 mt-0.5">{t("还原此项目至其原来保存的位置", "Restore this project to where it was originally saved")}</div>
                  </div>
                </label>
              )}

              <label className="flex items-start gap-2.5 cursor-pointer p-2.5 rounded border border-transparent hover:bg-stone-50 hover:border-stone-200">
                <input
                  type="radio"
                  name="dmsPathMode"
                  value="current"
                  checked={dmsImportDialog.chosenPathMode === "current"}
                  onChange={() => setDmsImportDialog({ ...dmsImportDialog, chosenPathMode: "current" })}
                  className="mt-0.5 accent-amber-600"
                />
                <div>
                  <div className="text-xs font-medium text-stone-800">
                    {dmsImportDialog.sourcePath && dmsImportDialog.sourcePath !== dmsImportDialog.currentPath
                      ? t("保留当前路径", "Keep the current path") : t("保存到当前路径", "Save to the current path")}
                  </div>
                  <div className="text-[11px] font-mono text-stone-500 break-all mt-0.5">
                    {dmsImportDialog.currentPath || t("（未配置）", "(not configured)")}
                  </div>
                </div>
              </label>

              <label className="flex items-start gap-2.5 cursor-pointer p-2.5 rounded border border-transparent hover:bg-stone-50 hover:border-stone-200">
                <input
                  type="radio"
                  name="dmsPathMode"
                  value="custom"
                  checked={dmsImportDialog.chosenPathMode === "custom"}
                  onChange={() => setDmsImportDialog({ ...dmsImportDialog, chosenPathMode: "custom" })}
                  className="mt-0.5 accent-amber-600"
                />
                <div className="flex-1 min-w-0">
                  <div className="text-xs font-medium text-stone-800 mb-1">{t("自定义路径", "Custom path")}</div>
                  <input
                    type="text"
                    placeholder={isMacDMS ? "/Users/yourname/DMS_Imported" : "C:\\DMS_Imported"}
                    value={dmsImportDialog.customPath}
                    onClick={() => setDmsImportDialog({ ...dmsImportDialog, chosenPathMode: "custom" })}
                    onChange={(e) => setDmsImportDialog({ ...dmsImportDialog, chosenPathMode: "custom", customPath: e.target.value })}
                    className="w-full px-2 py-1 text-xs border border-stone-300 rounded font-mono focus:outline-none focus:border-amber-500"
                  />
                </div>
              </label>
            </div>

            <div className="text-[11px] text-stone-400 bg-stone-50 border border-stone-200 rounded px-3 py-2 mb-4">
              {t("导入只恢复文件夹树结构（index），不会删除磁盘上已有的文件。", "Import only restores the folder tree structure (index); it doesn't delete any existing files on disk.")}
            </div>

            {dmsImportError && (
              <div className="text-xs text-red-700 bg-red-50 border border-red-200 rounded p-2 mb-3 whitespace-pre-wrap">
                {dmsImportError}
              </div>
            )}

            <div className="flex gap-2 justify-end">
              <button
                onClick={() => { setDmsImportDialog(null); setDmsImportError(null); }}
                disabled={dmsImportBusy}
                className="px-4 py-1.5 text-xs border border-stone-300 hover:bg-stone-100 rounded disabled:opacity-60"
              >
                {t("取消", "Cancel")}
              </button>
              <button
                onClick={doImportFromDialog}
                disabled={dmsImportBusy || (dmsImportDialog.chosenPathMode === "custom" && !dmsImportDialog.customPath.trim())}
                className="px-4 py-1.5 text-xs bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-60"
              >
                {dmsImportBusy ? t("导入中…", "Importing…") : t("导入并切换", "Import and switch")}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);

// Startup banner
console.log("%c[DMS] Document Management System loaded — build 2026-06-02-text-tree","color:#b45309;font-weight:bold;font-size:14px");
console.log("[DMS] Storage backend: REST API (Python server)");
console.log("[DMS] To diagnose storage, run: dmsDiag()");

// Global diagnostic helper — type dmsDiag() in console to inspect state
window.dmsDiag = async function() {
  console.group("[DMS] Diagnostic report");
  try {
    const settings = await StorageAdapter.getSettings();
    console.log("Settings:", settings);
    const res = await fetch("/api/diag");
    const diag = await res.json();
    console.log("Server diagnostic:", diag);
    if (diag.files_in_root && diag.files_in_root.length) {
      console.log("Files in storage root:", diag.files_in_root);
    }
    if (diag.files_in_docs && diag.files_in_docs.length) {
      console.log(`Files in docs/ subfolder (${diag.files_in_docs.length}):`, diag.files_in_docs);
    }
  } catch (e) {
    console.error("Diagnostic failed:", e);
  }
  console.groupEnd();
};
</script>
</body>
</html>
