    setSelection((prev) => {
      const next = new Map(prev);
      const allDocIds = (node.documents || []).map((d) => d.id);
      if (on) {
        next.set(node.id, new Set(allDocIds));
      } else {
        next.delete(node.id);
      }
      return next;
    });
  };

  // Recursive: select all (or none) in this node + all descendants
  const setSubtreeAll = (node, on) => {
    setSelection((prev) => {
      const next = new Map(prev);
      const walk = (n) => {
        const ids = (n.documents || []).map((d) => d.id);
        if (on && ids.length) next.set(n.id, new Set(ids));
        else if (!on) next.delete(n.id);
        (n.children || []).forEach(walk);
      };
      walk(node);
      return next;
    });
  };

  const totalSelected = useMemo(() => {
    let n = 0;
    for (const set of selection.values()) n += set.size;
    return n;
  }, [selection]);

  const clearAll = () => setSelection(new Map());
  const selectAll = () => tree && setSubtreeAll(tree, true);

  // Build the ordered selection payload: tree-order traversal, only include
  // nodes that have selected docs.
  const buildPayload = () => {
    if (!tree) return [];
    const out = [];
    const walk = (node) => {
      const set = selection.get(node.id);
      if (set && set.size) {
        // Preserve the original order of documents attached to this node
        const orderedIds = (node.documents || [])
          .map((d) => d.id)
          .filter((id) => set.has(id));
        if (orderedIds.length) out.push({ nodeId: node.id, docIds: orderedIds });
      }
      (node.children || []).forEach(walk);
    };
    walk(tree);
    return out;
  };

  const generate = async () => {
    setError(null);
    setGenerating(true);
    try {
      const payload = {
        title: title.trim() || "Engineering Databook",
        subtitle: subtitle.trim(),
        selection: buildPayload(),
      };
      try {
        localStorage.setItem("dms:databook-title", title);
        localStorage.setItem("dms:databook-subtitle", subtitle);
      } catch {}

      let res;
      if (frontPageFile) {
        const form = new FormData();
        form.append("payload", JSON.stringify(payload));
        form.append("front_page", frontPageFile);
        res = await fetch("/api/databook", { method: "POST", body: form });
      } else {
        res = await fetch("/api/databook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
      }

      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try { msg = (await res.json()).error || msg; } catch {}
        throw new Error(msg);
      }

      const savedHeader = res.headers.get("X-Databook-Saved-Path");
      setSavedPath(savedHeader ? decodeURIComponent(savedHeader) : null);

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = (title.trim() || "Databook") + ".pdf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setGenerated(true);
    } catch (e) {
      setError(e.message);
    } finally {
      setGenerating(false);
    }
  };

  // Render one node row
  const renderNode = (node, depth = 0) => {
    const isExpanded = expanded.has(node.id);
    const hasChildren = (node.children || []).length > 0;
    const docs = node.documents || [];
    const canExpand = hasChildren || docs.length > 0;
    const ownState = nodeOwnState(node);

    return (
      <div key={node.id}>
        <div
          onClick={() => canExpand && toggleExpand(node.id)}
          className={`flex items-center gap-1.5 py-1 pr-2 text-sm hover:bg-stone-50 ${
            canExpand ? "cursor-pointer" : ""
          }`}
          style={{ paddingLeft: `${depth * 14 + 4}px` }}
        >
          <span className="w-3.5 flex items-center justify-center text-stone-700">
            {canExpand ? (
              isExpanded ? <ChevronDown size={12} /> : <ChevronRight size={12} />
            ) : <span className="w-2.5" />}
          </span>

          <button
            onClick={(e) => {
              e.stopPropagation();
              setNodeAll(node, ownState !== "all");
            }}
            disabled={docs.length === 0}
            className={`shrink-0 p-0.5 ${
              docs.length === 0 ? "opacity-25 cursor-not-allowed text-stone-600"
                : "text-amber-700 hover:text-amber-900"
            }`}
            title={
              docs.length === 0
                ? t("此节点暂无直接附加文档", "This node has no directly attached documents")
                : ownState === "all" ? t("取消选择此节点的所有文档", "Deselect all documents on this node") : t("选择此节点的所有文档", "Select all documents on this node")
            }
          >
            {ownState === "all" ? <CheckSquare size={13} />
              : ownState === "some" ? <MinusSquare size={13} />
              : <Square size={13} />}
          </button>

          <Folder size={13} className="text-amber-700 shrink-0" />
          <span className="truncate flex-1 text-stone-800">{node.name}</span>

          {docs.length > 0 && (
            <span className="text-[12px] tabular-nums px-1 bg-stone-100 text-stone-700 rounded">
              {docs.length}
            </span>
          )}

          {hasChildren && (
            <button
              onClick={(e) => {
                e.stopPropagation();
                setSubtreeAll(node, true);
              }}
              className="text-[11px] uppercase tracking-wider text-stone-600 hover:text-amber-700 px-1"
              title={t("选择此子树下的所有文档", "Select all documents under this subtree")}
            >
              {t("全选↓", "Select all ↓")}
            </button>
          )}
        </div>

        {/* Documents at this node */}
        {isExpanded && docs.map((ref) => {
          const doc = docsById.get(ref.id);
          if (!doc) return null;
          const sel = isDocSelected(node.id, ref.id);
          return (
            <div
              key={node.id + ":" + ref.id}
              className={`flex items-center gap-1.5 py-0.5 pr-2 text-sm ${
                sel ? "bg-amber-50" : "hover:bg-stone-50"
              }`}
              style={{ paddingLeft: `${(depth + 1) * 14 + 12}px` }}
            >
              <span
                className="text-stone-600 shrink-0 cursor-pointer"
                onClick={() => toggleDoc(node.id, ref.id)}
                title={t("选择/取消选择", "Select/deselect")}
              >
                {sel ? <CheckSquare size={12} className="text-amber-700" /> : <Square size={12} />}
              </span>
              <span
                className="flex items-center gap-1.5 flex-1 min-w-0 cursor-pointer"
                onClick={() => onOpenDoc && onOpenDoc(doc.id)}
                title={t("查看此文档", "View this document")}
              >
                {doc.mime?.startsWith("image/")
                  ? <ImageIcon size={11} className="text-stone-700 shrink-0" />
                  : <FileText size={11} className="text-stone-700 shrink-0" />}
                <span className="truncate text-stone-700 hover:underline">{doc.name}</span>
              </span>
              <span className="text-[12px] text-stone-600 shrink-0 font-mono">
                {formatBytes(doc.size)}
              </span>
            </div>
          );
        })}

        {/* Children */}
        {isExpanded && (node.children || []).map((c) => renderNode(c, depth + 1))}
      </div>
    );
  };

  if (!tree) return null;

  return (
    <div className="flex flex-col h-full">
      {/* Toolbar */}
      <div className="border-b border-stone-200 p-2 space-y-2">
        <div className="flex gap-1">
          <button
            onClick={selectAll}
            className="flex-1 text-[13px] px-2 py-1 border border-stone-300 hover:bg-amber-50 hover:border-amber-400 rounded"
          >
            {t("全选", "Select all")}
          </button>
          <button
            onClick={clearAll}
            disabled={totalSelected === 0}
            className="flex-1 text-[13px] px-2 py-1 border border-stone-300 hover:bg-stone-100 rounded disabled:opacity-40"
          >
            {t("清除", "Clear")}
          </button>
        </div>
        <div className="text-[13px] text-stone-700 flex items-center justify-between">
          <span>
            {t("已选", "Selected")} <span className="font-mono tabular-nums">{totalSelected}</span> {t("份文档", "documents")}
          </span>
        </div>
      </div>

      {/* Tree */}
      <div className="flex-1 overflow-auto py-1">
        {renderNode(tree)}
      </div>

      {/* Generate button */}
      <div className="border-t border-stone-200 p-2">
        <button
          onClick={() => { setError(null); setGenerated(false); setSavedPath(null); setShowTitleDialog(true); }}
          disabled={totalSelected === 0}
          className="w-full px-3 py-2 bg-amber-600 hover:bg-amber-700 text-white text-sm font-medium rounded disabled:opacity-40 flex items-center justify-center gap-1.5"
        >
          <Download size={12} /> {t("生成数据手册", "Generate data book")}
        </button>
        <div className="text-[12px] text-stone-700 text-center mt-1.5 leading-tight">
          {t("生成包含封面、目录、章节标题、书签及页码的单一 PDF。", "Generates a single PDF with a cover page, table of contents, chapter headings, bookmarks, and page numbers.")}
        </div>
      </div>

      {/* Title/subtitle dialog */}
      {showTitleDialog && (
        <div
          className="fixed inset-0 bg-stone-900/70 z-50 flex items-center justify-center p-4"
          onClick={() => !generating && setShowTitleDialog(false)}
        >
          <div
            className="bg-white w-full max-w-md rounded shadow-2xl p-5"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="text-[12px] tracking-[0.2em] uppercase text-stone-700 mb-1">
              {t("生成数据手册", "Generate data book")}
            </div>
            <h2 className="text-xl font-semibold text-stone-900 mb-3">
              {t("封面信息", "Cover page info")}
            </h2>

            <label className="block text-sm uppercase tracking-wider text-stone-700 mb-1.5">
              {t("标题", "Title")}
            </label>
            <input
              type="text"
              autoFocus
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              placeholder={t("工程数据手册", "Engineering data book")}
              className="w-full px-2 py-1.5 text-base border border-stone-300 rounded focus:outline-none focus:border-amber-600 mb-3"
            />

            <label className="block text-sm uppercase tracking-wider text-stone-700 mb-1.5">
              {t("副标题", "Subtitle")} <span className="text-stone-600 normal-case tracking-normal">{t("（可选）", "(optional)")}</span>
            </label>
            <input
              type="text"
              value={subtitle}
              onChange={(e) => setSubtitle(e.target.value)}
              placeholder={t("例如：项目编号、版次、客户名称", "e.g. project number, revision, client name")}
              className="w-full px-2 py-1.5 text-base border border-stone-300 rounded focus:outline-none focus:border-amber-600 mb-3"
            />

            <label className="block text-sm uppercase tracking-wider text-stone-700 mb-1.5">
              {t("封面页", "Front page")} <span className="text-stone-600 normal-case tracking-normal">{t("（可选，PDF 或图片）", "(optional, PDF or image)")}</span>
            </label>
            {frontPageFile ? (
              <div className="flex items-center gap-2 mb-1 text-sm bg-stone-50 border border-stone-200 rounded px-2 py-1.5">
                <FileText size={12} className="text-stone-700 shrink-0" />
                <span className="truncate flex-1">{frontPageFile.name}</span>
                <button
                  onClick={() => setFrontPageFile(null)}
                  className="text-stone-600 hover:text-red-600 shrink-0"
                  title={t("移除", "Remove")}
                >
                  <X size={12} />
                </button>
              </div>
            ) : (
              <input
                type="file"
                accept="application/pdf,image/*"
                onChange={(e) => setFrontPageFile(e.target.files?.[0] || null)}
                className="w-full text-sm mb-1 file:mr-2 file:px-2 file:py-1 file:border file:border-stone-300 file:rounded file:bg-white file:text-sm file:cursor-pointer hover:file:bg-stone-50"
              />
            )}
            <div className="text-[12px] text-stone-700 mb-3 leading-tight">
              {t("将作为第 1 页插入，位于自动生成的封面/目录页之前。Word/Pages 文档请先导出为 PDF。", "Inserted as page 1, before the auto-generated cover/table-of-contents page. Export Word/Pages documents to PDF first.")}
            </div>

            <div className="text-sm text-stone-700 bg-stone-50 border border-stone-200 rounded p-2 mb-3">
              {t("包含", "Includes")} <strong>{totalSelected}</strong> {t("份文档，共", "documents,")} <strong>{buildPayload().length}</strong> {t("个章节。", "sections total.")}
            </div>

            {error && (
              <div className="text-sm text-red-700 bg-red-50 border border-red-200 rounded p-2 mb-3 whitespace-pre-wrap">
                {error}
              </div>
            )}

            {generated && (
              <div className="text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 rounded p-2 mb-3">
                <div className="font-medium mb-1">{t("生成成功，下载已开始。", "Generated successfully — the download has started.")}</div>
                {savedPath ? (
                  <div className="break-all">
                    {t("副本已保存到项目文件夹：", "A copy was also saved to the project folder:")} <span className="font-mono">{savedPath}</span>
                  </div>
                ) : (
                  <div className="text-amber-700">
                    {t("未能保存副本到项目文件夹（浏览器下载仍可用）。", "Could not save a copy to the project folder (browser download still available).")}
                  </div>
                )}
              </div>
            )}

            <div className="flex gap-2 justify-end">
              {generated ? (
                <button
                  onClick={() => setShowTitleDialog(false)}
                  className="px-4 py-1.5 text-sm bg-amber-600 hover:bg-amber-700 text-white rounded"
                >
                  {t("关闭", "Close")}
                </button>
              ) : (
                <>
                  <button
                    onClick={() => setShowTitleDialog(false)}
                    disabled={generating}
                    className="px-4 py-1.5 text-sm border border-stone-300 hover:bg-stone-100 rounded disabled:opacity-60"
                  >
                    {t("取消", "Cancel")}
                  </button>
                  <button
                    onClick={generate}
                    disabled={generating}
                    className="px-4 py-1.5 text-sm bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-60 flex items-center gap-1.5"
                  >
                    {generating ? t("生成中…", "Generating…") : (<><Download size={11} /> {t("生成并下载", "Generate and download")}</>)}
                  </button>
                </>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};


/* =============================================================================
 * PARAMETER-VS-TIME CHART — plain inline SVG, no charting library. A single
 * series (one parameter's value over time), so no legend is needed; the
 * dialog's own heading names what's plotted. See references/marks-and-anatomy
 * and interaction.md from the dataviz skill for the mark/hover spec this
 * follows: 2px line, >=8px ringed dots, hairline gridlines, crosshair +
 * tooltip, value labeled at the line's end.
 * =============================================================================
 */
// Classic "nice numbers" axis-tick algorithm (Paul Heckbert) — picks a clean
// step (1/2/5 x10^n) so ticks land on round numbers instead of raw fractions
// of the data range.
const _niceNum = (range, round) => {
  if (range <= 0) return 1;
  const exponent = Math.floor(Math.log10(range));
  const fraction = range / Math.pow(10, exponent);
  let niceFraction;
  if (round) {
    niceFraction = fraction < 1.5 ? 1 : fraction < 3 ? 2 : fraction < 7 ? 5 : 10;
  } else {
    niceFraction = fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10;
  }
  return niceFraction * Math.pow(10, exponent);
};

const niceTicks = (min, max, tickCount = 5) => {
  if (min === max) { min -= 1; max += 1; }
  const range = _niceNum(max - min, false);
  const step = _niceNum(range / (tickCount - 1), true);
  const niceMin = Math.floor(min / step) * step;
  const niceMax = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = niceMin; v <= niceMax + step * 0.5; v += step) {
    ticks.push(Math.round(v / step) * step);
  }
  return { min: niceMin, max: niceMax, ticks };
};

// Format a "YYYY-MM-DD" date for an axis tick, adapting precision to how
// wide a span the whole chart covers so ticks stay unambiguous without
// wasting space repeating a year that never changes across the chart.
const formatAxisDate = (iso, spanDays) => {
  const [y, m, d] = iso.split("-");
  if (spanDays > 800) return y;
  if (spanDays > 60) return `${y}-${m}`;
  return `${m}-${d}`;
};

const TimeSeriesChart = ({ points, paramName, unit, onPointClick, width = 680, height = 300, timeRange = null, valueRange = null }) => {
  const { t } = useLang();
  const svgRef = useRef(null);
  const [hoverIdx, setHoverIdx] = useState(null);
  const [tooltipPos, setTooltipPos] = useState(null); // {x, y} in SVG viewBox coords

  // Click a point to set it as the "base" for annualized-return %s shown
  // near every later point (points after it, chronologically). Reset
  // whenever the series itself changes (new parameter/field/scope) — `points`
  // is memoized by the caller, so this only fires on a real change, not on
  // every re-render.
  const [baseIdx, setBaseIdx] = useState(null);
  useEffect(() => { setBaseIdx(null); }, [points]);

  const margin = { top: 18, right: 24, bottom: 28, left: 60 };
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  if (!points || points.length === 0) return null;

  // A manually-set axis range (see AxisRangeControls) overrides the default
  // auto-fit-to-data domain below -- like setting axis min/max in a
  // spreadsheet chart. Data outside the range stays in the line path (so it
  // still reads as one continuous series) but ends up outside the SVG's own
  // 0..width / 0..height box, which browsers clip to by default -- no
  // explicit clipPath needed. Dots/hover/the end-of-line label are drawn
  // only for points actually inside the domain (see visiblePoints below),
  // so nothing interactive ever points at something the clip hid.
  const hasTimeRange = timeRange && Number.isFinite(timeRange.min) && Number.isFinite(timeRange.max) && timeRange.max > timeRange.min;
  const hasValueRange = valueRange && Number.isFinite(valueRange.min) && Number.isFinite(valueRange.max) && valueRange.max > valueRange.min;

  // `points` is already sorted chronologically by the caller, and min/max are
  // taken with a reduce rather than Math.min(...values) -- spreading into a
  // function call has a browser-dependent argument-count ceiling that a
  // folder with a few thousand documents could realistically hit.
  let tMin = hasTimeRange ? timeRange.min : points[0].t;
  let tMax = hasTimeRange ? timeRange.max : points[points.length - 1].t;
  if (tMin === tMax) { tMin -= 86400000; tMax += 86400000; } // pad 1 day so a single point isn't div-by-zero
  const spanDays = (tMax - tMin) / 86400000;

  let yMin, yMax, yTicks;
  if (hasValueRange) {
    yMin = valueRange.min; yMax = valueRange.max;
    yTicks = Array.from({ length: 5 }, (_, i) => yMin + (i / 4) * (yMax - yMin));
  } else {
    let vMin = Infinity, vMax = -Infinity;
    for (const p of points) { if (p.value < vMin) vMin = p.value; if (p.value > vMax) vMax = p.value; }
    ({ min: yMin, max: yMax, ticks: yTicks } = niceTicks(vMin, vMax, 5));
  }
  const yRange = (yMax - yMin) || 1;

  const xScale = (tms) => margin.left + ((tms - tMin) / (tMax - tMin)) * innerW;
  const yScale = (v) => margin.top + innerH - ((v - yMin) / yRange) * innerH;

  const linePath = points.map((p, i) => `${i === 0 ? "M" : "L"}${xScale(p.t)},${yScale(p.value)}`).join(" ");

  // Points actually inside the visible domain -- dots, hover targeting, and
  // the "value at line's end" label are all scoped to these, not the full
  // series, whenever a custom range is active.
  const visiblePoints = (hasTimeRange || hasValueRange)
    ? points.filter((p) => p.t >= tMin && p.t <= tMax && p.value >= yMin && p.value <= yMax)
    : points;

  if (visiblePoints.length === 0) {
    return (
      <div className="w-full h-full min-h-[120px] flex items-center justify-center text-center text-sm text-stone-600 border border-dashed border-stone-200 rounded p-4">
        {t("所选坐标轴范围内没有数据点。", "No data points fall within the selected axis range.")}
      </div>
    );
  }

  // A handful of evenly-spaced x ticks across the time domain (not one per
  // point — that would collide on any folder with more than a few documents).
  const xTickCount = Math.min(6, Math.max(2, visiblePoints.length));
  const xTicks = Array.from({ length: xTickCount }, (_, i) => tMin + (i / (xTickCount - 1)) * (tMax - tMin));

  const handleMove = (e) => {
    const svg = svgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const pt = ((e.clientX - rect.left) / rect.width) * width; // viewBox-space x
    // nearest visible point by x
    let nearest = 0, nearestDist = Infinity;
    visiblePoints.forEach((p, i) => {
      const dist = Math.abs(xScale(p.t) - pt);
      if (dist < nearestDist) { nearestDist = dist; nearest = i; }
    });
    setHoverIdx(nearest);
    setTooltipPos({ x: xScale(visiblePoints[nearest].t), y: yScale(visiblePoints[nearest].value) });
  };
  const handleLeave = () => { setHoverIdx(null); setTooltipPos(null); };

  const lastPoint = visiblePoints[visiblePoints.length - 1];
  const lastLabel = unit ? `${lastPoint.value} ${unit}` : `${lastPoint.value}`;

  const basePoint = baseIdx != null ? visiblePoints[baseIdx] : null;

  // Annualized return (CAGR) of point `p` relative to the base point:
  // (value/baseValue)^(365.25/daysElapsed) - 1. Only meaningful for points
  // strictly after the base and when both values are positive (a fractional
  // power of a non-positive ratio isn't a real percentage) — returns null
  // otherwise, so the caller just skips the label.
  const yearlyReturnPct = (p) => {
    if (!basePoint || p.t <= basePoint.t || basePoint.value === 0) return null;
    const ratio = p.value / basePoint.value;
    if (ratio <= 0) return null;
    const years = (p.t - basePoint.t) / 86400000 / 365.25;
    if (years <= 0) return null;
    return (Math.pow(ratio, 1 / years) - 1) * 100;
  };

  // Point-to-point (chained) annualized return: same CAGR math as
  // yearlyReturnPct, but measured from the *immediately preceding* point
  // instead of the fixed base — i.e. "how fast did this leg of the series
  // grow", as opposed to "how fast has it grown since the base overall".
  // Independent of which point is the base; only needs a predecessor to
  // exist, so it's shown for every point after the first.
  const chainedReturnPct = (i) => {
    if (i <= 0) return null;
    const prev = visiblePoints[i - 1], cur = visiblePoints[i];
    if (prev.value === 0) return null;
    const ratio = cur.value / prev.value;
    if (ratio <= 0) return null;
    const years = (cur.t - prev.t) / 86400000 / 365.25;
    if (years <= 0) return null;
    return (Math.pow(ratio, 1 / years) - 1) * 100;
  };

  return (
    <div className="relative w-full h-full">
      <svg
        ref={svgRef}
        viewBox={`0 0 ${width} ${height}`}
        className="w-full h-full touch-none"
        onMouseMove={handleMove}
        onMouseLeave={handleLeave}
        role="img"
        aria-label={`${paramName}${unit ? ` (${unit})` : ""} vs. time, ${visiblePoints.length} data point${visiblePoints.length === 1 ? "" : "s"}`}
      >
        {/* Gridlines + y-axis labels */}
        {yTicks.map((tv) => (
          <g key={`y-${tv}`}>
            <line
              x1={margin.left} x2={width - margin.right}
              y1={yScale(tv)} y2={yScale(tv)}
              stroke="#e7e5e4" strokeWidth="1"
            />
            <text x={margin.left - 8} y={yScale(tv)} textAnchor="end" dominantBaseline="middle"
              className="fill-stone-500" fontSize="10" fontFamily="ui-monospace, monospace">
              {tv.toLocaleString()}
            </text>
          </g>
        ))}

        {/* x-axis labels */}
        {xTicks.map((tv, i) => (
          <text key={`x-${i}`} x={xScale(tv)} y={height - margin.bottom + 16}
            textAnchor="middle" className="fill-stone-500" fontSize="10" fontFamily="ui-monospace, monospace">
            {formatAxisDate(new Date(tv).toISOString().slice(0, 10), spanDays)}
          </text>
        ))}

        {/* Crosshair */}
        {hoverIdx != null && (
          <line
            x1={xScale(visiblePoints[hoverIdx].t)} x2={xScale(visiblePoints[hoverIdx].t)}
            y1={margin.top} y2={height - margin.bottom}
            stroke="#a8a29e" strokeWidth="1"
          />
        )}

        {/* Persistent base-point marker (distinct dashed line, stays put
            regardless of hover) so it's clear which point the %/yr labels
            below are measured from. */}
        {basePoint && (
          <line
            x1={xScale(basePoint.t)} x2={xScale(basePoint.t)}
            y1={margin.top} y2={height - margin.bottom}
            stroke="#6366f1" strokeWidth="1" strokeDasharray="4 3"
          />
        )}

        {/* Line */}
        <path d={linePath} fill="none" stroke="#d97706" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />

        {/* Dots (>=8px, 2px surface ring) + hit targets. Click sets/clears the
            base point (for the %/yr labels); double-click still opens the
            source document, same as a plain click used to. */}
        {visiblePoints.map((p, i) => {
          const isBase = i === baseIdx;
          // Both labels only appear once a base is selected — keeps the
          // chart uncluttered by default and keeps the two %s scoped to the
          // same "following points" range, so they read as two answers to
          // the same question rather than two unrelated overlays.
          const pctVsBase = basePoint && i > baseIdx ? yearlyReturnPct(p) : null;
          const pctChained = basePoint && i > baseIdx ? chainedReturnPct(i) : null;
          return (
            <g key={p.docId + i} className="cursor-pointer"
              onClick={() => setBaseIdx((cur) => (cur === i ? null : i))}
              onDoubleClick={() => onPointClick && onPointClick(p.docId)}>
              <circle cx={xScale(p.t)} cy={yScale(p.value)} r="12" fill="transparent" />
              <circle cx={xScale(p.t)} cy={yScale(p.value)} r={isBase ? 7 : i === hoverIdx ? 6 : 5}
                fill={isBase ? "#4f46e5" : "#d97706"} stroke="#fff" strokeWidth="2" />
              {isBase && (
                <text x={xScale(p.t)} y={yScale(p.value) - 14} textAnchor="middle"
                  className="fill-indigo-700 font-semibold" fontSize="10" fontFamily="ui-monospace, monospace">
                  {t("基准", "Base")}
                </text>
              )}
              {/* vs. base (fixed reference, indigo) */}
              {pctVsBase != null && (
                <text x={xScale(p.t)} y={yScale(p.value) - 14} textAnchor="middle"
                  className="fill-indigo-700 font-medium" fontSize="10" fontFamily="ui-monospace, monospace">
                  {`${pctVsBase >= 0 ? "+" : ""}${pctVsBase.toFixed(1)}%/yr`}
                </text>
              )}
              {/* vs. previous point (chained, teal) — stacked above the base-relative label */}
              {pctChained != null && (
                <text x={xScale(p.t)} y={yScale(p.value) - 26} textAnchor="middle"
                  className="fill-teal-700 font-medium" fontSize="10" fontFamily="ui-monospace, monospace">
                  {`Δ ${pctChained >= 0 ? "+" : ""}${pctChained.toFixed(1)}%/yr`}
                </text>
              )}
            </g>
          );
        })}

        {/* Value at the line's end */}
        <text x={xScale(lastPoint.t) + 8} y={yScale(lastPoint.value) - 8}
          className="fill-amber-800 font-medium" fontSize="11" fontFamily="ui-monospace, monospace">
          {lastLabel}
        </text>
      </svg>

      {hoverIdx != null && tooltipPos && (
        <div
          className="absolute z-10 pointer-events-none bg-stone-900 text-white text-[13px] rounded px-2 py-1.5 shadow-lg"
          style={{
            left: `${(tooltipPos.x / width) * 100}%`,
            top: `${(tooltipPos.y / height) * 100}%`,
            transform: "translate(-50%, -130%)",
            maxWidth: "220px",
          }}
        >
          <div className="font-semibold">{unit ? `${visiblePoints[hoverIdx].value} ${unit}` : visiblePoints[hoverIdx].value}</div>
          {/* Light gray, not the app's usual dark-stone secondary-text color
              -- this box has a near-black background (bg-stone-900), so it
              needs a color that reads against dark, not light. */}
          <div className="text-stone-300 font-mono">{visiblePoints[hoverIdx].date}</div>
          <div className="text-stone-300 truncate">{visiblePoints[hoverIdx].docName}</div>
        </div>
      )}

      <div className="mt-1.5 text-[13px]">
        {basePoint ? (
          <span className="flex items-center gap-2 flex-wrap text-stone-700">
            <span className="text-indigo-700">
              {t(`基准：${basePoint.date} · ${unit ? `${basePoint.value} ${unit}` : basePoint.value}`,
                 `Base: ${basePoint.date} · ${unit ? `${basePoint.value} ${unit}` : basePoint.value}`)}
            </span>
            <span className="text-stone-600">·</span>
            <span className="text-indigo-700">{t("靛蓝 = 相对基准的年化收益率", "indigo = annualized return vs. base")}</span>
            <span className="text-stone-600">·</span>
            <span className="text-teal-700">{t("青色 Δ = 相对上一点的年化收益率（链式）", "teal Δ = annualized return vs. the previous point (chained)")}</span>
            <button onClick={() => setBaseIdx(null)} className="text-stone-600 hover:text-stone-700 underline shrink-0">
              {t("清除基准", "Clear base")}
            </button>
          </span>
        ) : (
          <span className="text-stone-600">
            {t("点击一个数据点将其设为基准，之后的数据点会显示相对该基准的年化收益率（双击数据点可打开对应文档）。",
               "Click a data point to set it as the base — later points will show their annualized return relative to it (double-click a point to open its document).")}
          </span>
        )}
      </div>
    </div>
  );
};

// Plain (not "nice"-rounded) min/max of a series -- used only to seed the
// custom-range inputs with real numbers the moment "Auto" is unchecked, so
// there's something to edit immediately instead of two empty boxes (see
// makeAxisToggleSetter below).
const autoValueBounds = (points) => {
  let min = Infinity, max = -Infinity;
  for (const p of points) { if (p.value < min) min = p.value; if (p.value > max) max = p.value; }
  return { min: points.length ? min : 0, max: points.length ? max : 0 };
};
const autoTimeBounds = (points) => ({
  min: points.length ? points[0].date : "",
  max: points.length ? points[points.length - 1].date : "",
});

// Wraps a setYAxis/setXAxis state setter so that unchecking "Auto" seeds
// min/max with the current auto-fit range instead of leaving them blank.
// A custom range only takes effect once BOTH fields are non-empty (see
// TimeSeriesChart's hasTimeRange/hasValueRange) -- without this, switching
// to custom and typing into just one box silently does nothing, since the
// other one is still blank.
const makeAxisToggleSetter = (setAxis, bounds) => (updater) => {
  setAxis((prev) => {
    const next = typeof updater === "function" ? updater(prev) : updater;
    if (prev.mode === "auto" && next.mode === "custom" && next.min === "" && next.max === "") {
      const { min, max } = bounds();
      return { mode: "custom", min: String(min), max: String(max) };
    }
    return next;
  });
};

/* =============================================================================
 * UI: AXIS RANGE CONTROLS — small "Auto"/custom min-max toggle for each axis
 * of a TimeSeriesChart, shared between the in-page FolderPlotDialog and the
 * popped-out chart window (see PlotPopoutApp). `xAxis`/`yAxis` are plain
 * { mode: "auto" | "custom", min, max } state objects owned by the caller.
 * =============================================================================
 */
const AxisRangeControls = ({ xAxis, setXAxis, yAxis, setYAxis, unit }) => {
  const { t } = useLang();
  const numInput = "w-20 text-sm border border-stone-300 rounded px-1.5 py-0.5 focus:outline-none focus:border-amber-600";
  return (
    <div className="flex items-center gap-4 flex-wrap text-[13px]">
      <div className="flex items-center gap-1.5">
        <span className="text-stone-700 uppercase tracking-wider">{t("纵轴", "Y axis")}{unit ? ` (${unit})` : ""}</span>
        <label className="flex items-center gap-1 cursor-pointer text-stone-700">
          <input
            type="checkbox"
            className="accent-amber-600"
            checked={yAxis.mode === "auto"}
            onChange={(e) => setYAxis((a) => ({ ...a, mode: e.target.checked ? "auto" : "custom" }))}
          />
          {t("自动", "Auto")}
        </label>
        {yAxis.mode === "custom" && (
          <>
            <input
              type="number" value={yAxis.min} placeholder={t("最小", "min")}
              onChange={(e) => setYAxis((a) => ({ ...a, min: e.target.value }))}
              className={numInput}
            />
            <span className="text-stone-600">–</span>
            <input
              type="number" value={yAxis.max} placeholder={t("最大", "max")}
              onChange={(e) => setYAxis((a) => ({ ...a, max: e.target.value }))}
              className={numInput}
            />
          </>
        )}
      </div>
      <div className="flex items-center gap-1.5">
        <span className="text-stone-700 uppercase tracking-wider">{t("横轴（时间）", "X axis (time)")}</span>
        <label className="flex items-center gap-1 cursor-pointer text-stone-700">
          <input
            type="checkbox"
            className="accent-amber-600"
            checked={xAxis.mode === "auto"}
            onChange={(e) => setXAxis((a) => ({ ...a, mode: e.target.checked ? "auto" : "custom" }))}
          />
          {t("自动", "Auto")}
        </label>
        {xAxis.mode === "custom" && (
          <>
            <input
              type="date" value={xAxis.min}
              onChange={(e) => setXAxis((a) => ({ ...a, min: e.target.value }))}
              className="text-sm border border-stone-300 rounded px-1.5 py-0.5 focus:outline-none focus:border-amber-600"
            />
            <span className="text-stone-600">–</span>
            <input
              type="date" value={xAxis.max}
              onChange={(e) => setXAxis((a) => ({ ...a, max: e.target.value }))}
              className="text-sm border border-stone-300 rounded px-1.5 py-0.5 focus:outline-none focus:border-amber-600"
            />
          </>
        )}
      </div>
    </div>
  );
};

/* =============================================================================
 * UI: FOLDER BROWSER DIALOG — server-side drive/folder explorer used to pick
 * a filesystem path (e.g. for the download-to-folder dialog) without having
 * to type it by hand. Purely for navigation: it only ever lists folders.
 * =============================================================================
 */
const FolderBrowserModal = ({ startPath, onSelect, onClose }) => {
  const { t } = useLang();
  const [state, setState] = useState({ loading: true, path: null, parent: null, entries: [], roots: [], error: "" });
  const [pathInput, setPathInput] = useState(startPath || "");

  const load = async (path) => {
    setState((s) => ({ ...s, loading: true, error: "" }));
    try {
      const r = await StorageAdapter.browseFolder(path);
      setState({ loading: false, path: r.path, parent: r.parent, entries: r.entries || [], roots: r.roots || [], error: "" });
      if (r.path) setPathInput(r.path);
    } catch (e) {
      setState((s) => ({ ...s, loading: false, error: e.message || String(e) }));
    }
  };

  useEffect(() => { load(startPath); }, []); // eslint-disable-line react-hooks/exhaustive-deps

  return (
    <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="bg-white rounded-lg shadow-xl w-[36rem] max-h-[32rem] flex flex-col">
        <div className="px-4 py-3 border-b border-stone-200 flex items-center gap-2 shrink-0">
          <h3 className="font-semibold text-base text-stone-800 flex-1">{t("选择文件夹", "Choose a folder")}</h3>
          <button onClick={onClose} className="text-stone-600 hover:text-stone-700 text-xl leading-none px-1">×</button>
        </div>
        <div className="flex flex-1 min-h-0">
          <div className="w-36 border-r border-stone-200 overflow-y-auto py-2 shrink-0">
            {state.roots.map((r) => (
              <button
                key={r.path}
                onClick={() => load(r.path)}
                className={`w-full text-left px-3 py-1.5 text-sm truncate hover:bg-stone-50 ${state.path === r.path ? "bg-amber-50 text-amber-800" : "text-stone-700"}`}
                title={r.path}
              >
                {r.name}
              </button>
            ))}
          </div>
          <div className="flex-1 flex flex-col min-w-0">
            <div className="px-3 py-2 border-b border-stone-100 flex items-center gap-1.5 shrink-0">
              <button
                onClick={() => state.parent && load(state.parent)}
                disabled={!state.parent}
                title={t("上一级", "Up one level")}
                className="text-sm px-2 py-1 rounded border border-stone-200 hover:bg-stone-50 disabled:opacity-30 disabled:cursor-not-allowed shrink-0"
              >
                ↑
              </button>
              <input
                type="text"
                value={pathInput}
                onChange={(e) => setPathInput(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") load(pathInput); }}
                className="flex-1 min-w-0 text-sm px-2 py-1 border border-stone-300 rounded font-mono"
              />
              <button onClick={() => load(pathInput)} className="text-sm px-2 py-1 rounded border border-stone-200 hover:bg-stone-50 shrink-0">
                {t("前往", "Go")}
              </button>
            </div>
            <div className="flex-1 overflow-y-auto py-1">
              {state.loading ? (
                <div className="text-sm text-stone-600 text-center py-6">{t("加载中…", "Loading…")}</div>
              ) : state.error ? (
                <div className="text-sm text-red-600 px-3 py-2">{state.error}</div>
              ) : state.entries.length === 0 ? (
                <div className="text-sm text-stone-600 text-center py-6">{t("此文件夹内没有子文件夹", "No subfolders here")}</div>
              ) : (
                state.entries.map((entry) => (
                  <button
                    key={entry.path}
                    onClick={() => setPathInput(entry.path)}
                    onDoubleClick={() => load(entry.path)}
                    className={`w-full text-left px-3 py-1.5 text-sm flex items-center gap-1.5 hover:bg-stone-50 ${pathInput === entry.path ? "bg-amber-50 text-amber-800" : "text-stone-700"}`}
                  >
                    <Folder size={12} className="shrink-0 text-stone-600" />
                    <span className="truncate">{entry.name}</span>
                  </button>
                ))
              )}
            </div>
          </div>
        </div>
        <div className="px-4 py-3 border-t border-stone-200 flex justify-end gap-2 shrink-0">
          <button onClick={onClose} className="text-sm px-3 py-1.5 rounded border border-stone-300 hover:bg-stone-50 text-stone-700">
            {t("取消", "Cancel")}
          </button>
          <button
            onClick={() => onSelect(pathInput)}
            disabled={!pathInput.trim()}
            className="text-sm px-3 py-1.5 rounded bg-amber-600 hover:bg-amber-700 text-white disabled:opacity-40 disabled:cursor-not-allowed"
          >
            {t("选择此文件夹", "Select this folder")}
          </button>
        </div>
      </div>
    </div>
  );
};

/* =============================================================================
 * UI: FOLDER PLOT DIALOG — "select a folder, select a parameter, plot time
 * vs. parameter". Time comes from each document's own date (see docDate —
 * user-entered, or an auto-detected value the user has verified/edited) or,
 * failing that, from a "YYYY-MM" folder it lives in (see resolveDocTime).
 * =============================================================================
 */
const PLOT_DIALOG_MIN_W = 480;
const PLOT_DIALOG_MIN_H = 380;
const FolderPlotDialog = ({ open, node, tree, docIndex, onClose, onOpenDoc, onOpenAISettings }) => {
  const { t, lang } = useLang();
  const [includeSub, setIncludeSub] = useState(true);
  const [field, setField] = useState("actual"); // "actual" | "design"
  const [param, setParam] = useState("");

  // --- Gemini trend fit/comment (opt-in) --------------------------------
  const [aiSettings, setAiSettings] = useState({ configured: false, library_installed: true });
  const [aiLoading, setAiLoading] = useState(false);
  const [aiComment, setAiComment] = useState("");
  const [aiError, setAiError] = useState("");

  // --- Custom axis ranges (see AxisRangeControls) ------------------------
  const AXIS_DEFAULT = { mode: "auto", min: "", max: "" };
  const [yAxis, setYAxis] = useState(AXIS_DEFAULT);
  const [xAxis, setXAxis] = useState(AXIS_DEFAULT);

  // --- Floating window geometry (drag to move, edges/corner to resize) --
  // This component stays mounted the whole time DMS is open (`open` just
  // toggles visibility, see the render call below), so position/size
  // persist across close/reopen for the session, like a real window that
  // stays where you left it -- same pattern as FloatingDocPreview.
  const [pos, setPos] = useState({ x: null, y: null }); // null = centered default
  const [size, setSize] = useState(() => ({
    w: typeof window !== "undefined" ? Math.min(880, window.innerWidth - 48) : 880,
    h: typeof window !== "undefined" ? Math.min(640, window.innerHeight - 48) : 640,
  }));
  const [interacting, setInteracting] = useState(null); // null | "move" | "x" | "y" | "xy"
  const dragRef = useRef(null);
  const [popoutError, setPopoutError] = useState("");

  // Clamped so the header (the only drag handle) always stays reachable --
  // recomputed every render, not just while dragging, so a position that
  // went bad (dragged off-screen, or the browser window later shrank) heals
  // itself the moment this reopens instead of staying stuck there for the
  // rest of the session (this component never unmounts, see above).
  const rawPos = pos.x != null ? pos : {
    x: (window.innerWidth - size.w) / 2,
    y: (window.innerHeight - size.h) / 2,
  };
  const curPos = {
    x: Math.min(Math.max(rawPos.x, -(size.w - 120)), window.innerWidth - 120),
    y: Math.min(Math.max(rawPos.y, 0), Math.max(0, window.innerHeight - 60)),
  };

  const onDragStart = (e) => {
    e.preventDefault();
    const start = curPos;
    dragRef.current = { startX: e.clientX, startY: e.clientY, origX: start.x, origY: start.y };
    setInteracting("move");
    const onMove = (ev) => {
      const d = dragRef.current;
      if (!d) return;
      setPos({ x: d.origX + (ev.clientX - d.startX), y: d.origY + (ev.clientY - d.startY) });
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      dragRef.current = null;
      setInteracting(null);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  // axis: "x" (right edge, width only), "y" (bottom edge, height only), or
  // "xy" (corner, both at once) -- stretchable independently either way.
  const onResizeStart = (axis) => (e) => {
    e.preventDefault();
    e.stopPropagation();
    dragRef.current = { startX: e.clientX, startY: e.clientY, origW: size.w, origH: size.h };
    setInteracting(axis);
    const onMove = (ev) => {
      const d = dragRef.current;
      if (!d) return;
      const dx = ev.clientX - d.startX;
      const dy = ev.clientY - d.startY;
      setSize((prev) => ({
        w: axis !== "y" ? Math.max(PLOT_DIALOG_MIN_W, d.origW + dx) : prev.w,
        h: axis !== "x" ? Math.max(PLOT_DIALOG_MIN_H, d.origH + dy) : prev.h,
      }));
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      dragRef.current = null;
      setInteracting(null);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  const interactCursor = interacting === "x" ? "ew-resize"
    : interacting === "y" ? "ns-resize"
    : interacting === "xy" ? "nwse-resize"
    : interacting === "move" ? "grabbing"
    : "default";

  // Chart area fills whatever room the resizable window currently gives it
  // (see the toolbar/table chrome this subtracts) so the plot itself
  // stretches both ways as the window is resized, not just its frame.
  const chartAreaHeight = Math.max(200, size.h - 300);
  const chartWrapRef = useRef(null);
  const [chartSize, setChartSize] = useState({ w: 680, h: chartAreaHeight });

  useEffect(() => {
    if (open) StorageAdapter.getAISettings().then(setAiSettings).catch(() => {});
  }, [open]);

  // The previous analysis (and any custom axis range) is about a different
  // series once the parameter, field, or scope changes -- drop it rather
  // than leaving a stale comment/range sitting under a chart it no longer
  // describes.
  useEffect(() => {
    setAiComment(""); setAiError("");
    setYAxis(AXIS_DEFAULT); setXAxis(AXIS_DEFAULT);
  }, [param, field, includeSub, node]);

  // Skip the (potentially large) scope/point computation entirely while the
  // dialog is closed -- it's mounted the whole time the app runs, and this
  // component re-renders on every docIndex change (any metadata edit,
  // upload, ...), which would otherwise mean scanning every document in the
  // selected folder on every keystroke elsewhere in the app.
  // One entry per (document, folder link) in scope, with that link's
  // per-folder metadata override already applied on top of the shared base
  // (see effectiveMetadata). A document linked into two folders in scope —
  // e.g. one summary report linked under two different accounts, each with
  // its own "Balance" — shows up here twice, once per folder, each with its
  // own effective value. Folders that never touched a given field just read
  // the shared base value, so a doc linked in several places with no
  // per-folder differences still resolves to the same value everywhere.
  const scopeDocs = useMemo(() => {
    if (!open || !node) return [];
    const refs = includeSub ? collectAllDocRefs(node) : (node.documents || []).map((d) => ({ id: d.id, nodeId: node.id }));
    const byId = new Map(docIndex.map((d) => [d.id, d]));
    return refs
      .map(({ id, nodeId }) => {
        const base = byId.get(id);
        if (!base) return null;
        const override = (base.metaOverrides || {})[nodeId];
        return override ? { ...base, metadata: effectiveMetadata(base.metadata, override) } : base;
      })
      .filter(Boolean);
  }, [open, node, includeSub, docIndex]);

  const availableParams = useMemo(() => {
    const set = new Set();
    for (const d of scopeDocs) {
      for (const [k, v] of Object.entries(d.metadata || {})) {
        if (getNumericParamValue(v, { field }) != null) set.add(k);
      }
    }
    return Array.from(set).sort((a, b) => a.localeCompare(b));
  }, [scopeDocs, field]);

  // Keep the selection valid as the folder / field / scope changes; default
  // to the first available parameter so the dialog isn't empty on open.
  useEffect(() => {
    if (!open) return;
    if (!availableParams.includes(param)) setParam(availableParams[0] || "");
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [open, availableParams.join("|")]);

  const unit = useMemo(() => {
    if (!param) return "";
    for (const d of scopeDocs) {
      const mv = (d.metadata || {})[param];
      if (mv && typeof mv === "object") {
        const u = field === "design" ? mv.designUnit : mv.unit;
        if (u) return u;
      }
    }
    return "";
  }, [scopeDocs, param, field]);

  const { points, undated } = useMemo(() => {
    if (!param) return { points: [], undated: [] };
    const pts = [];
    const undatedDocs = [];
    // A document linked into several folders in scope can appear in
    // scopeDocs more than once (see above). If every occurrence resolves to
    // the same value for THIS parameter, plot it once — it's the same fact
    // about the same file. Only occurrences that actually diverge (e.g. a
    // different account's balance) get their own point.
    const seenPerDoc = new Map(); // docId -> Set of values already plotted
    for (const d of scopeDocs) {
      const v = getNumericParamValue((d.metadata || {})[param], { field });
      if (v == null) continue; // this doc doesn't carry the parameter at all
      const seenValues = seenPerDoc.get(d.id) || new Set();
      if (seenValues.has(v)) continue;
      seenValues.add(v);
      seenPerDoc.set(d.id, seenValues);
      const date = resolveDocTime(d, tree);
      if (!date) { undatedDocs.push(d); continue; }
      // Parse as UTC (explicit "Z") so the point's position on the time axis
      // and formatAxisDate's toISOString() round-trip agree regardless of
      // the viewer's own timezone -- a local-time parse here would shift
      // dates by a day for anyone east/west of UTC.
      pts.push({ t: new Date(date + "T00:00:00Z").getTime(), date, value: v, docId: d.id, docName: d.name });
    }
    pts.sort((a, b) => a.t - b.t);
    return { points: pts, undated: undatedDocs };
  }, [scopeDocs, param, field, tree]);

  const fitWithGemini = async () => {
    if (aiLoading || points.length < 2) return;
    setAiLoading(true); setAiError(""); setAiComment("");
    try {
      const data = await StorageAdapter.aiFitTrend(
        param, unit,
        points.map((p) => ({ date: p.date, value: p.value })),
        lang
      );
      setAiComment(data.comment || "");
    } catch (e) {
      setAiError(e.message || String(e));
    } finally {
      setAiLoading(false);
    }
  };

  // Track the chart wrapper's actual rendered box (its height is set
  // explicitly from chartAreaHeight above; its width comes from the window's
  // current width) so TimeSeriesChart's viewBox always matches real pixels
  // in both dimensions instead of just scaling horizontally.
  const chartVisible = open && availableParams.length > 0 && points.length > 0;
  useEffect(() => {
    if (!chartVisible || !chartWrapRef.current) return;
    const el = chartWrapRef.current;
    const ro = new ResizeObserver((entries) => {
      const cr = entries[0].contentRect;
      if (cr.width > 40 && cr.height > 40) setChartSize({ w: Math.round(cr.width), h: Math.round(cr.height) });
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, [chartVisible]);

  const yRangeOverride = yAxis.mode === "custom" && yAxis.min !== "" && yAxis.max !== ""
    ? { min: Number(yAxis.min), max: Number(yAxis.max) } : null;
  const xRangeOverride = xAxis.mode === "custom" && xAxis.min && xAxis.max
    ? { min: new Date(xAxis.min + "T00:00:00Z").getTime(), max: new Date(xAxis.max + "T23:59:59Z").getTime() } : null;
  const setYAxisSeeded = makeAxisToggleSetter(setYAxis, () => autoValueBounds(points));
  const setXAxisSeeded = makeAxisToggleSetter(setXAxis, () => autoTimeBounds(points));

  // "Pop out" -- hand a snapshot of the current series off to a real,
  // separate browser window (via localStorage + a `?popout=plot` URL the
  // bootstrap at the bottom of this file recognizes) so it can be dragged
  // to another monitor, maximized, etc. using the OS/browser's own window
  // chrome, not anything DMS draws itself. See PlotPopoutApp.
  const popOut = () => {
    if (points.length === 0) return;
    const key = `dms_plot_popout_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    const payload = {
      points: points.map((p) => ({ t: p.t, date: p.date, value: p.value, docName: p.docName })),
      paramName: param,
      unit,
      nodeName: node ? node.name : "",
      lang,
    };
    try {
      localStorage.setItem(key, JSON.stringify(payload));
    } catch (e) {
      setPopoutError(t("无法打开新窗口（浏览器存储不可用）。", "Couldn't open a new window (browser storage unavailable)."));
      return;
    }
    const w = window.open(
      `${location.pathname}?popout=plot&key=${encodeURIComponent(key)}`,
      "_blank",
      "popup,width=860,height=560,menubar=no,toolbar=no,location=no,status=no"
    );
    if (!w) {
      try { localStorage.removeItem(key); } catch (e) {}
      setPopoutError(t("弹出窗口被浏览器拦截，请允许本站的弹出窗口后重试。", "The pop-up was blocked by the browser — please allow pop-ups for this site and try again."));
    } else {
      setPopoutError("");
    }
  };

  if (!open) return null;

  const openAndClose = (docId) => { onOpenDoc(docId); onClose(); };

  return (
    <>
      {/* Dim backdrop -- click it to close. The panel itself is a freely
          positioned/sized floating window (drag the header, resize from
          any edge/corner), not centered inside this, so it can be dragged
          off-center or resized without the backdrop constraining it. */}
      <div className="fixed inset-0 bg-stone-900/70 z-40" onClick={onClose} />

      <div
        className="fixed z-50 bg-white rounded shadow-2xl flex flex-col"
        style={{ left: curPos.x, top: curPos.y, width: size.w, height: size.h }}
        onClick={(e) => e.stopPropagation()}
      >
        <div
          className="px-5 py-4 border-b border-stone-200 flex items-center justify-between shrink-0 cursor-move select-none"
          onMouseDown={onDragStart}
        >
          <div>
            <div className="text-[12px] tracking-[0.2em] uppercase text-stone-700 mb-0.5">{t("图表", "Chart")}</div>
            <h2 className="text-base font-semibold text-stone-900">
              {t("参数-时间趋势图", "Parameter vs. time")}
              {node && <span className="text-stone-600 font-normal"> · {node.name}</span>}
            </h2>
          </div>
          <div className="flex items-center gap-1 shrink-0">
            <button
              onClick={popOut}
              onMouseDown={(e) => e.stopPropagation()}
              disabled={points.length === 0}
              className="text-stone-600 hover:text-stone-800 p-1 disabled:opacity-30 disabled:cursor-not-allowed"
              title={t("在新窗口中打开（可拖到其他显示器）", "Open in a new window (drag it to another monitor)")}
            >
              <ExternalLink size={14} />
            </button>
            <button onClick={onClose} onMouseDown={(e) => e.stopPropagation()} className="text-stone-600 hover:text-stone-800 p-1">
              <X size={16} />
            </button>
          </div>
        </div>

        {popoutError && (
          <div className="px-5 py-1.5 text-[13px] text-red-700 bg-red-50 border-b border-red-200 shrink-0">{popoutError}</div>
        )}

        <div className="px-5 py-3 border-b border-stone-100 flex items-center gap-3 flex-wrap shrink-0" onMouseDown={(e) => e.stopPropagation()}>
          <div className="flex items-center gap-1.5">
            <label className="text-[13px] text-stone-700 uppercase tracking-wider">{t("参数", "Parameter")}</label>
            <select
              value={param}
              onChange={(e) => setParam(e.target.value)}
              className="text-sm border border-stone-300 rounded px-2 py-1 focus:outline-none focus:border-amber-600"
            >
              {availableParams.length === 0 && <option value="">{t("（无可用数值参数）", "(no numeric parameters)")}</option>}
              {availableParams.map((p) => <option key={p} value={p}>{p}</option>)}
            </select>
          </div>
          <div className="flex items-center gap-1.5">
            <label className="text-[13px] text-stone-700 uppercase tracking-wider">{t("字段", "Field")}</label>
            <select
              value={field}
              onChange={(e) => setField(e.target.value)}
              className="text-sm border border-stone-300 rounded px-2 py-1 focus:outline-none focus:border-amber-600"
            >
              <option value="actual">{t("实测值", "Actual")}</option>
              <option value="design">{t("设计值", "Design")}</option>
            </select>
          </div>
          <label className="flex items-center gap-1.5 text-[13px] text-stone-700 cursor-pointer">
            <input type="checkbox" checked={includeSub} onChange={(e) => setIncludeSub(e.target.checked)} className="accent-amber-600" />
            {t("包含子文件夹", "Include subfolders")}
          </label>
          <span className="text-[13px] text-stone-600 ml-auto">{t(`共 ${scopeDocs.length} 个文档`, `${scopeDocs.length} document(s) in scope`)}</span>
          {points.length > 0 && (
            <div className="w-full">
              <AxisRangeControls xAxis={xAxis} setXAxis={setXAxisSeeded} yAxis={yAxis} setYAxis={setYAxisSeeded} unit={unit} />
            </div>
          )}
        </div>

        <div className="flex-1 min-h-0 overflow-auto p-5" onMouseDown={(e) => e.stopPropagation()}>
          {availableParams.length === 0 ? (
            <div className="text-center text-base text-stone-700 py-10">
              {t("此文件夹（含子文件夹）中的文档没有任何数值型参数。请先在文档元数据或关键字提取中填写参数值。",
                 "No document in this folder (including subfolders) has a numeric parameter value yet. Add one via document metadata or key extraction first.")}
            </div>
          ) : points.length === 0 ? (
            <div className="text-center text-base text-stone-700 py-10">
              {t(`没有文档同时具有 "${param}" 的数值和可用日期（文档日期或 "YYYY-MM" 文件夹名）。`,
                 `No document has both a numeric value for "${param}" and a usable date (document date, or a "YYYY-MM" folder name).`)}
            </div>
          ) : (
            <>
              <div ref={chartWrapRef} style={{ height: chartAreaHeight }} className="w-full">
                <TimeSeriesChart
                  points={points} paramName={param} unit={unit} onPointClick={openAndClose}
                  width={chartSize.w} height={chartSize.h}
                  timeRange={xRangeOverride} valueRange={yRangeOverride}
                />
              </div>

              {points.length > 1 && (
                <div className="mt-3 border border-purple-200 bg-purple-50/60 rounded p-3">
                  <div className="flex items-center justify-between gap-2 flex-wrap">
                    <div className="flex items-center gap-1.5 text-[13px] text-purple-800 font-medium">
                      <Sparkles size={12} /> {t("Gemini 趋势分析", "Gemini trend analysis")}
                    </div>
                    {aiSettings.configured ? (
                      <button
                        onClick={fitWithGemini}
                        disabled={aiLoading}
                        className="text-[13px] px-2.5 py-1 rounded flex items-center gap-1.5 border border-purple-300 text-purple-800 bg-white hover:bg-purple-100 disabled:opacity-40"
                      >
                        {aiLoading
                          ? (<><Loader size={11} className="animate-spin" /> {t("分析中…", "Analyzing…")}</>)
                          : (<><Sparkles size={11} /> {aiComment ? t("重新分析", "Re-analyze") : t("让 Gemini 拟合并点评", "Fit with Gemini")}</>)}
                      </button>
                    ) : (
                      <div className="flex items-center gap-1.5 text-[13px] text-stone-700">
                        {t("需要先配置 Gemini API Key。", "Needs a Gemini API Key configured first.")}
                        {onOpenAISettings && (
                          <button onClick={onOpenAISettings} className="text-purple-700 hover:underline font-medium">
                            {t("配置", "Configure")}
                          </button>
                        )}
                      </div>
                    )}
                  </div>
                  {aiError && (
                    <div className="mt-2 text-[13px] text-red-700 bg-red-50 border border-red-200 rounded p-2">{aiError}</div>
                  )}
                  {aiComment && (
                    <div className="mt-2 text-sm text-stone-800 whitespace-pre-wrap leading-relaxed">{aiComment}</div>
                  )}
                </div>
              )}

              <table className="w-full text-sm mt-4">
                <thead className="text-stone-700 text-left border-b border-stone-200">
                  <tr>
                    <th className="py-1 pr-2 font-medium w-28">{t("日期", "Date")}</th>
                    <th className="py-1 pr-2 font-medium w-24">{t("数值", "Value")}</th>
                    <th className="py-1 font-medium">{t("文档", "Document")}</th>
                  </tr>
                </thead>
                <tbody>
                  {points.map((p) => (
                    <tr key={p.docId} onClick={() => openAndClose(p.docId)} className="border-b border-stone-100 hover:bg-amber-50 cursor-pointer">
                      <td className="py-1 pr-2 font-mono">{p.date}</td>
                      <td className="py-1 pr-2 font-mono">{p.value}{unit ? ` ${unit}` : ""}</td>
                      <td className="py-1 truncate max-w-0" title={p.docName}>{p.docName}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </>
          )}

          {undated.length > 0 && (
            <details className="mt-4 text-[13px] text-stone-700">
              <summary className="cursor-pointer hover:text-stone-700">
                {t(`${undated.length} 个文档已排除（无可用日期）`, `${undated.length} document(s) excluded (no usable date)`)}
              </summary>
              <ul className="mt-1.5 ml-4 list-disc space-y-0.5">
                {undated.map((d) => (
                  <li key={d.id}>
                    <button onClick={() => openAndClose(d.id)} className="hover:underline hover:text-amber-700 text-left">{d.name}</button>
                  </li>
                ))}
              </ul>
            </details>
          )}
        </div>

        {/* Resize handles */}
        <div
          onMouseDown={onResizeStart("x")}
          className="absolute top-0 right-0 w-1.5 h-full cursor-ew-resize"
          title={t("水平拖动可调整宽度", "Drag to resize width")}
        />
        <div
          onMouseDown={onResizeStart("y")}
          className="absolute bottom-0 left-0 w-full h-1.5 cursor-ns-resize"
          title={t("垂直拖动可调整高度", "Drag to resize height")}
        />
        <div
          onMouseDown={onResizeStart("xy")}
          className="absolute bottom-0 right-0 w-4 h-4 cursor-nwse-resize"
          style={{
            background: "linear-gradient(135deg, transparent 0%, transparent 45%, #a8a29e 45%, #a8a29e 55%, transparent 55%, transparent 100%)",
          }}
          title={t("拖动可同时调整宽高", "Drag to resize both width and height")}
        />
        {interacting && (
          <div className="fixed inset-0 z-[55]" style={{ cursor: interactCursor }} />
        )}
      </div>
    </>
  );
};

/* =============================================================================
 * PLOT POP-OUT WINDOW — the page rendered in the separate browser
 * window/tab that FolderPlotDialog's "pop out" button opens (see popOut()
 * there). It's a fresh top-level browser window, so it can be dragged to
 * another monitor, maximized, etc. using the OS/browser's own chrome --
 * nothing DMS draws itself needs to support that.
 *
 * Deliberately reads a one-time snapshot (points, param, unit, ...) out of
 * localStorage rather than staying live-connected to the dialog that opened
 * it: DMS otherwise has no cross-window channel, and a snapshot is enough
 * for "look at this chart on my other monitor while I keep working in the
 * main window". Pop out again after changing the parameter/scope to get an
 * updated window.
 * =============================================================================
 */
const PlotPopoutApp = ({ storageKey }) => {
  const [data, setData] = useState(null);
  const [missing, setMissing] = useState(false);
  const containerRef = useRef(null);
  const [chartSize, setChartSize] = useState({ w: 760, h: 420 });
  const AXIS_DEFAULT = { mode: "auto", min: "", max: "" };
  const [yAxis, setYAxis] = useState(AXIS_DEFAULT);
  const [xAxis, setXAxis] = useState(AXIS_DEFAULT);

  useEffect(() => {
    try {
      const raw = storageKey && localStorage.getItem(storageKey);
      if (!raw) { setMissing(true); return; }
      const parsed = JSON.parse(raw);
      setData(parsed);
      // One-time handoff -- clear it now so it doesn't linger in
      // localStorage indefinitely once this window has read it.
      localStorage.removeItem(storageKey);
      document.title = `${parsed.paramName}${parsed.nodeName ? " · " + parsed.nodeName : ""} — DMS`;
    } catch (e) {
      setMissing(true);
    }
  }, [storageKey]);

  useEffect(() => {
    if (!data || !containerRef.current) return;
    const el = containerRef.current;
    const ro = new ResizeObserver((entries) => {
      const cr = entries[0].contentRect;
      if (cr.width > 40 && cr.height > 40) setChartSize({ w: Math.round(cr.width), h: Math.round(cr.height) });
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, [data]);

  const langCtxValue = useMemo(() => ({
    lang: data?.lang || "zh",
    t: (zh, en) => (data?.lang === "en" ? en : zh),
    setLang: () => {},
  }), [data]);

  if (missing) {
    return (
      <div className="h-full flex items-center justify-center text-base text-stone-700 p-6 text-center">
        This chart window has expired — go back to DMS and use "Pop out" again to open a fresh one.
      </div>
    );
  }
  if (!data) return null;

  const yRangeOverride = yAxis.mode === "custom" && yAxis.min !== "" && yAxis.max !== ""
    ? { min: Number(yAxis.min), max: Number(yAxis.max) } : null;
  const xRangeOverride = xAxis.mode === "custom" && xAxis.min && xAxis.max
    ? { min: new Date(xAxis.min + "T00:00:00Z").getTime(), max: new Date(xAxis.max + "T23:59:59Z").getTime() } : null;
  const setYAxisSeeded = makeAxisToggleSetter(setYAxis, () => autoValueBounds(data.points));
  const setXAxisSeeded = makeAxisToggleSetter(setXAxis, () => autoTimeBounds(data.points));

  return (
    <LangContext.Provider value={langCtxValue}>
      <div className="h-full flex flex-col bg-white">
        <div className="px-4 py-2.5 border-b border-stone-200 shrink-0">
          <div className="text-[12px] tracking-[0.2em] uppercase text-stone-700">{langCtxValue.t("图表", "Chart")}</div>
          <h1 className="text-base font-semibold text-stone-900">
            {data.paramName}
            {data.nodeName && <span className="text-stone-600 font-normal"> · {data.nodeName}</span>}
          </h1>
        </div>
        <div className="px-4 py-2 border-b border-stone-100 shrink-0">
          <AxisRangeControls xAxis={xAxis} setXAxis={setXAxisSeeded} yAxis={yAxis} setYAxis={setYAxisSeeded} unit={data.unit} />
        </div>
        <div ref={containerRef} className="flex-1 min-h-0 p-4">
          <TimeSeriesChart
            points={data.points} paramName={data.paramName} unit={data.unit}
            width={chartSize.w} height={chartSize.h}
            timeRange={xRangeOverride} valueRange={yRangeOverride}
          />
        </div>
      </div>
    </LangContext.Provider>
  );
};
