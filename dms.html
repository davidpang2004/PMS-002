/* =============================================================================
 * UI: SETTINGS SCREEN — text input for storage path
 * ---------------------------------------------------------------------------
 * Shown on first run (no path configured) or when the user clicks the
 * folder name in the header to change it.
 * =============================================================================
 */
const SettingsScreen = ({ initialPath, currentPath, isInitialSetup, onSaved, onCancel }) => {
  const { t } = useLang();
  const [pathValue, setPathValue] = useState(initialPath || "");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [info, setInfo] = useState(null);

  // Load current settings to show diagnostic info
  useEffect(() => {
    (async () => {
      try {
        const s = await StorageAdapter.getSettings();
        setInfo(s);
        if (!pathValue && s.storage_path) setPathValue(s.storage_path);
      } catch (e) {
        setError(t("无法连接到服务器：", "Could not connect to the server: ") + e.message);
      }
    })();
  }, []);

  const save = async () => {
    setError(null);
    setBusy(true);
    try {
      const trimmed = pathValue.trim();
      if (!trimmed) throw new Error(t("请输入路径。", "Please enter a path."));

      let copyCurrentData = false;
      if (!isInitialSetup) {
        const check = await StorageAdapter.checkStoragePath(trimmed);
        if (check.has_data) {
          const ok = window.confirm(
            t(
              `该文件夹已存在 DMS 数据（${check.doc_count} 份文档）。\n\n` +
              `切换后将显示该文件夹中的内容，当前工作内容不会丢失（仍保存在原文件夹）。\n\n` +
              `是否继续切换？`,
              `This folder already has DMS data (${check.doc_count} documents).\n\n` +
              `Switching will show that folder's contents; your current work isn't lost (it stays in the original folder).\n\n` +
              `Continue switching?`
            )
          );
          if (!ok) { setBusy(false); return; }
        } else {
          copyCurrentData = true;
        }
      }

      const r = await StorageAdapter.saveSettings(trimmed, copyCurrentData);
      onSaved(r.resolved_path);
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const isMac = typeof navigator !== "undefined" && /Mac|iPhone|iPad/.test(navigator.platform);
  const exampleAbs = isMac
    ? "/Users/yourname/Documents/Company01/DMS_Storage"
    : "C:\\Company01\\DMS_Storage";
  const exampleHome = isMac
    ? "~/Documents/Company01/DMS_Storage"
    : "%USERPROFILE%\\Documents\\Company01\\DMS_Storage";

  return (
    <div className="h-screen flex items-center justify-center bg-stone-50 p-6">
      <div className="max-w-xl w-full bg-white border border-stone-300 rounded shadow-sm p-6">
        <div className="text-xs tracking-[0.2em] uppercase text-stone-500 mb-1">
          {t("一个软件，管理所有文件", "One app to manage every file")}
        </div>
        <h1 className="text-2xl font-semibold text-stone-900 mb-3">
          {isInitialSetup ? t("设置存储位置", "Set storage location") : t("更改存储位置", "Change storage location")}
        </h1>
        <p className="text-sm text-stone-700 mb-4">
          {t("请输入 DMS 用于存储文件库的文件夹路径。上传的 PDF 和图片将作为实体文件保存在此文件夹中，装配树将存储为", "Enter the folder path DMS should use to store the document library. Uploaded PDFs and images are saved as real files in this folder, and the assembly tree is stored as")} <code className="text-xs bg-stone-100 px-1">index.json</code>{t("。如果文件夹不存在，系统将自动创建。", ". The folder will be created automatically if it doesn't exist.")}
        </p>

        <div className="text-xs text-stone-600 bg-stone-50 border border-stone-200 rounded p-3 mb-4 font-mono leading-relaxed">
          <div className="text-stone-500">{t("示例：", "Example:")}</div>
          <div className="text-stone-900 mt-1">{exampleAbs}</div>
          <div className="text-stone-900">{exampleHome}</div>
        </div>

        <label className="block text-xs uppercase tracking-wider text-stone-600 mb-1.5">
          {t("存储路径", "Storage path")}
        </label>
        <input
          type="text"
          value={pathValue}
          onChange={(e) => setPathValue(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") save(); }}
          placeholder={exampleAbs}
          autoFocus
          className="w-full px-3 py-2 border border-stone-300 rounded font-mono text-sm focus:outline-none focus:border-amber-600"
        />

        {info && info.configured && info.exists && (
          <div className="mt-3 text-xs text-stone-600 bg-amber-50 border border-amber-200 rounded p-2">
            <div>{t("当前使用中：", "Currently in use: ")}<strong className="font-mono">{info.resolved_path}</strong></div>
            <div className="text-stone-500 mt-1">
              {t(`磁盘上共 ${info.doc_count} 份文档`, `${info.doc_count} documents on disk`)}
              {info.writable ? t(" · 可写", " · writable") : t(" · 不可写", " · not writable")}
            </div>
          </div>
        )}

        <div className="flex gap-2 mt-4">
          <button
            onClick={save}
            disabled={busy}
            className="flex-1 px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white text-sm font-medium rounded disabled:opacity-60"
          >
            {busy ? t("保存中…", "Saving…") : isInitialSetup ? t("保存并继续", "Save and continue") : t("保存", "Save")}
          </button>
          {!isInitialSetup && onCancel && (
            <button
              onClick={onCancel}
              disabled={busy}
              className="px-4 py-2 border border-stone-300 hover:bg-stone-100 text-stone-700 text-sm rounded disabled:opacity-60"
            >
              {t("取消", "Cancel")}
            </button>
          )}
        </div>

        {error && (
          <div className="mt-3 text-xs text-red-700 bg-red-50 border border-red-200 rounded p-2 whitespace-pre-wrap">
            {error}
          </div>
        )}

        <div className="mt-5 pt-4 border-t border-stone-200 text-[11px] text-stone-500 leading-relaxed">
          <div className="font-medium text-stone-700 mb-1">{t("注意事项", "Notes")}</div>
          <ul className="list-disc pl-4 space-y-1">
            <li>{t("Mac/Linux 使用正斜杠", "Mac/Linux uses forward slashes")} <code>/</code>{t("，Windows 使用反斜杠", ", Windows uses backslashes")} <code>\</code>。</li>
            <li>{t("在 Mac/Linux 上可用", "On Mac/Linux you can use")} <code>~</code> {t("表示主目录。", "to represent the home directory.")}</li>
            <li>{t("在 Mac 上请勿选择 iCloud Drive 内的文件夹（如已同步的桌面或文稿）。", "On Mac, don't choose a folder inside iCloud Drive (such as a synced Desktop or Documents folder).")}</li>
            <li>{t("此设置将保存至服务器端", "This setting is saved server-side to")} <code>~/.dms_server_config.json</code>{t("，跨会话持久有效。", ", persisting across sessions.")}</li>
          </ul>
        </div>
      </div>
    </div>
  );
};

/* =============================================================================
 * UI: GLOBAL KEY PARAMETERS DIALOG
 * =============================================================================
 */
const KeyParametersDialog = ({ open, keyParameters, onSave, onClose }) => {
  const { t } = useLang();
  const [draft, setDraft] = useState([]);
  const [newItem, setNewItem] = useState("");

  useEffect(() => {
    if (open) {
      const list = normalizeKeyParameters(keyParameters?.length ? keyParameters : DEFAULT_KEY_PARAMETERS);
      setDraft(list);
      setNewItem("");
    }
  }, [open, keyParameters]);

  if (!open) return null;

  const add = () => {
    const item = newItem.trim();
    if (!item) return;
    setDraft((prev) => normalizeKeyParameters([...prev, item]));
    setNewItem("");
  };

  const remove = (idx) => setDraft((prev) => prev.filter((_, i) => i !== idx));
  const update = (idx, val) => {
    setDraft((prev) => prev.map((x, i) => i === idx ? val : x));
  };
  const move = (idx, delta) => {
    const next = [...draft];
    const j = idx + delta;
    if (j < 0 || j >= next.length) return;
    [next[idx], next[j]] = [next[j], next[idx]];
    setDraft(next);
  };

  const save = () => {
    const pending = newItem.trim();
    const items = pending ? [...draft, pending] : draft;
    onSave(normalizeKeyParameters(items));
  };

  return (
    <div
      className="fixed inset-0 bg-stone-900/70 z-50 flex items-center justify-center p-4"
      onClick={onClose}
    >
      <div
        className="bg-white w-full max-w-lg rounded shadow-2xl p-5"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="text-[10px] tracking-[0.2em] uppercase text-stone-500 mb-1">
          {t("项目设置", "Project settings")}
        </div>
        <h2 className="text-lg font-semibold text-stone-900 mb-2">
          {t("全局关键参数", "Global key parameters")}
        </h2>
        <p className="text-xs text-stone-600 mb-3">
          {t("这些名称将作为为附件添加元数据字段时的下拉建议项。", "These names appear as dropdown suggestions when adding metadata fields to an attachment.")}
          {t("用户仍可手动输入不在列表中的自定义字段名称。", "Users can still manually enter a custom field name not on the list.")}
        </p>

        <div className="flex gap-2 mb-3">
          <input
            type="text"
            value={newItem}
            onChange={(e) => setNewItem(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") add(); }}
            placeholder={t("例如：合同编号", "e.g. contract number")}
            className="flex-1 px-2 py-1.5 text-sm border border-stone-300 rounded font-mono focus:outline-none focus:border-amber-600"
            autoFocus
          />
          <button
            onClick={add}
            className="px-3 py-1.5 text-xs bg-amber-600 hover:bg-amber-700 text-white rounded flex items-center gap-1"
          >
            <Plus size={12} /> {t("添加", "Add")}
          </button>
        </div>

        <div className="border border-stone-200 rounded max-h-72 overflow-auto mb-3">
          {draft.length === 0 && (
            <div className="text-xs text-stone-500 italic p-3">{t("暂无关键参数。", "No key parameters yet.")}</div>
          )}
          {draft.map((item, idx) => (
            <div key={idx} className="flex items-center gap-1.5 p-2 border-b border-stone-100 last:border-b-0">
              <input
                type="text"
                value={item}
                onChange={(e) => update(idx, e.target.value)}
                className="flex-1 text-xs px-2 py-1 border border-stone-300 rounded font-mono focus:outline-none focus:border-amber-600"
              />
              <button
                onClick={() => move(idx, -1)}
                disabled={idx === 0}
                className="text-[10px] px-2 py-1 border border-stone-300 rounded disabled:opacity-30 hover:bg-stone-100"
                title={t("上移", "Move up")}
              >
                ↑
              </button>
              <button
                onClick={() => move(idx, 1)}
                disabled={idx === draft.length - 1}
                className="text-[10px] px-2 py-1 border border-stone-300 rounded disabled:opacity-30 hover:bg-stone-100"
                title={t("下移", "Move down")}
              >
                ↓
              </button>
              <button onClick={() => remove(idx)} className="text-stone-400 hover:text-red-600 p-1">
                <X size={13} />
              </button>
            </div>
          ))}
        </div>

        <div className="flex items-center justify-between gap-2">
          <button
            onClick={() => setDraft(DEFAULT_KEY_PARAMETERS)}
            className="px-3 py-1.5 text-xs border border-stone-300 hover:bg-stone-100 rounded"
          >
            {t("恢复默认值", "Restore defaults")}
          </button>
          <div className="flex gap-2">
            <button
              onClick={onClose}
              className="px-4 py-1.5 text-xs border border-stone-300 hover:bg-stone-100 rounded"
            >
              {t("取消", "Cancel")}
            </button>
            <button
              onClick={save}
              className="px-4 py-1.5 text-xs bg-amber-600 hover:bg-amber-700 text-white rounded"
            >
              {t("保存关键参数", "Save key parameters")}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

/* =============================================================================
 * UI: ZIP IMPORT DIALOG
 * =============================================================================
 */
const ZipImportDialog = ({ open, onClose, onImported }) => {
  const { t } = useLang();
  const [busy, setBusy]       = useState(false);
  const [file, setFile]       = useState(null);
  const [result, setResult]   = useState(null);   // { allocated, unmatched }
  const [error, setError]     = useState(null);
  const fileInputRef = useRef(null);

  useEffect(() => {
    if (open) { setFile(null); setResult(null); setError(null); setBusy(false); }
  }, [open]);

  if (!open) return null;

  const handleFile = (f) => {
    if (!f) return;
    setFile(f); setResult(null); setError(null);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    e.currentTarget.classList.remove("border-amber-500");
    handleFile(e.dataTransfer.files[0]);
  };

  const doImport = async () => {
    if (!file) return;
    setBusy(true); setError(null); setResult(null);
    try {
      const form = new FormData();
      form.append("file", file);
      const res = await fetch("/api/docs/import-zip", { method: "POST", body: form });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      setResult(data);
      onImported();
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div
      className="fixed inset-0 bg-stone-900/70 z-50 flex items-center justify-center p-4"
      onClick={onClose}
    >
      <div
        className="bg-white w-full max-w-xl rounded shadow-2xl flex flex-col max-h-[90vh]"
        onClick={(e) => e.stopPropagation()}
      >
        {/* Header */}
        <div className="px-5 py-4 border-b border-stone-200 flex items-center justify-between">
          <div>
            <div className="text-[10px] tracking-[0.2em] uppercase text-stone-500 mb-0.5">{t("批量导入", "Bulk import")}</div>
            <h2 className="text-sm font-semibold text-stone-900">{t("从 ZIP 文件自动分配文档", "Auto-allocate documents from a ZIP file")}</h2>
          </div>
          <button onClick={onClose} className="text-stone-400 hover:text-stone-800 p-1"><X size={16} /></button>
        </div>

        {/* Body */}
        <div className="flex-1 overflow-y-auto px-5 py-4 space-y-4">
          <p className="text-xs text-stone-500">
            {t("文件名格式：", "Filename format: ")}<code className="font-mono bg-stone-100 px-1 rounded">{t("文件夹名称#文件说明.pdf", "FolderName#FileDescription.pdf")}</code>
            {t("—— 系统将自动把文档分配到名称匹配的文件夹。", "— documents are automatically allocated to the folder whose name matches.")}
          </p>

          {/* Drop zone */}
          {!result && (
            <div
              className="border-2 border-dashed border-stone-300 rounded-lg p-6 text-center text-stone-500 text-xs cursor-pointer hover:border-amber-500 hover:bg-amber-50 transition-colors"
              onClick={() => fileInputRef.current?.click()}
              onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add("border-amber-500"); }}
              onDragLeave={(e) => e.currentTarget.classList.remove("border-amber-500")}
              onDrop={handleDrop}
            >
              <Upload size={22} className="mx-auto mb-2 opacity-50" />
              {file
                ? <div className="font-medium text-stone-700">{file.name}</div>
                : <><div><strong>{t("点击选择 ZIP 文件", "Click to choose a ZIP file")}</strong>{t("，或拖放至此", ", or drop it here")}</div>
                   <div className="text-[10px] mt-1 text-stone-400">.zip</div></>}
              <input
                ref={fileInputRef} type="file" className="hidden" accept=".zip,application/zip"
                onChange={(e) => handleFile(e.target.files?.[0])}
              />
            </div>
          )}

          {/* Error */}
          {error && (
            <div className="text-xs bg-red-50 border border-red-200 rounded p-3 text-red-700">
              {error}
            </div>
          )}

          {/* Results */}
          {result && (
            <div className="space-y-3">
              <div className="text-xs bg-green-50 border border-green-200 rounded p-3 text-green-800">
                <div className="font-semibold mb-1">
                  {t(`✓ 完成 — 已分配 ${result.allocated.length} 份文档`, `✓ Done — allocated ${result.allocated.length} documents`)}
                  {result.unmatched.length > 0 && <>{t(`，${result.unmatched.length} 份未匹配`, `, ${result.unmatched.length} unmatched`)}</>}
                </div>
                {result.allocated.length > 0 && (
                  <div className="font-mono text-[10px] max-h-36 overflow-auto mt-1 space-y-0.5">
                    {result.allocated.map((a, i) => (
                      <div key={i}>
                        <span className="text-green-600">+</span> <span className="text-stone-700">{a.filename}</span>
                        <span className="text-stone-400"> → </span>
                        <span className="font-semibold">{a.node_name}</span>
                      </div>
                    ))}

                <div className="text-xs bg-amber-50 border border-amber-200 rounded p-3 text-amber-800">

                    {result.unmatched.map((u, i) => (

                      </div>

        {/* Footer */}
        <div className="px-5 py-3 border-t border-stone-200 flex justify-end gap-2">

              {busy ? t("导入中…", "Importing…") : t("导入并分配", "Import and allocate")}

          )}
        </div>
      </div>
    </div>
  );
};

/* =============================================================================
 * UI: HIERARCHY IMPORT DIALOG
 * =============================================================================
 */
const HierarchyImportDialog = ({ open, onClose, onImported }) => {
  const { t } = useLang();
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [errors, setErrors] = useState([]);
  const [preview, setPreview] = useState(null);   // null | { root, count, order }
  const [result, setResult] = useState(null);     // null | { created, skipped }
  const [dedupeNames, setDedupeNames] = useState(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    if (open) {
      setText(""); setBusy(false); setErrors([]); setPreview(null); setResult(null);
      setDedupeNames(false);
    }
  }, [open]);

  if (!open) return null;

  const handleFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const buf = e.target.result;
      let decoded;
      try {
        decoded = new TextDecoder('utf-8', { fatal: true }).decode(buf);
      } catch {
        decoded = new TextDecoder('gbk').decode(buf);
      }
      setText(decoded);
      setErrors([]); setPreview(null); setResult(null);
    };
    reader.readAsArrayBuffer(file);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    e.currentTarget.classList.remove("border-amber-500");
    handleFile(e.dataTransfer.files[0]);
  };

  const buildAsciiTree = (order) => {
    const childrenMap = {};
    for (const n of order) childrenMap[n.id] = [];
    for (const n of order) if (n.parent) childrenMap[n.parent].push(n.id);
    const root = order.find((n) => !n.parent);
    if (!root) return "";
    const lines = [root.id];
    const walk = (id, prefix, isLast) => {
      lines.push(prefix + (isLast ? "└── " : "├── ") + id);
      const kids = childrenMap[id] || [];
      kids.forEach((kid, i) =>
        walk(kid, prefix + (isLast ? "    " : "│   "), i === kids.length - 1)
      );
    };
    (childrenMap[root.id] || []).forEach((kid, i) =>
      walk(kid, "", i === (childrenMap[root.id] || []).length - 1)
    );
    return lines.join("\n");
  };

  const doValidate = async () => {
    if (!text.trim()) return;
    setBusy(true); setErrors([]); setPreview(null); setResult(null);
    try {
      const data = await StorageAdapter.hierarchyPreview(text, dedupeNames);
      if (!data.ok) { setErrors(data.errors); }
      else { setPreview(data); }
    } catch (e) {
      setErrors([`Network error: ${e.message}`]);
    } finally { setBusy(false); }
  };

  const doCreate = async () => {
    if (!preview) return;
    if (!confirm(t(`即将在文档树中创建 ${preview.count} 个节点。确定继续？`, `About to create ${preview.count} nodes in the document tree. Continue?`))) return;
    setBusy(true); setErrors([]);
    try {
      const data = await StorageAdapter.hierarchyCreate(text, dedupeNames);
      if (!data.ok) { setErrors(data.errors); }
      else {
        setResult(data);
        onImported();
      }
    } catch (e) {
      setErrors([`Network error: ${e.message}`]);
    } finally { setBusy(false); }
  };

  return (
    <div
      className="fixed inset-0 bg-stone-900/70 z-50 flex items-center justify-center p-4"
      onClick={onClose}
    >
      <div
        className="bg-white w-full max-w-xl rounded shadow-2xl flex flex-col max-h-[90vh]"
        onClick={(e) => e.stopPropagation()}
      >
        {/* Header */}
        <div className="px-5 py-4 border-b border-stone-200 flex items-center justify-between">
          <div>
            <div className="text-[10px] tracking-[0.2em] uppercase text-stone-500 mb-0.5">
              {t("层级导入", "Hierarchy import")}
            </div>
            <h2 className="text-sm font-semibold text-stone-900">{t("从层级定义文件创建文件夹树", "Create a folder tree from a hierarchy definition file")}</h2>
          </div>
          <button onClick={onClose} className="text-stone-400 hover:text-stone-800 p-1"><X size={16} /></button>
        </div>

        {/* Body */}
        <div className="flex-1 overflow-y-auto px-5 py-4 space-y-4">

          {/* Drop zone */}
          <div
            className="border-2 border-dashed border-stone-300 rounded-lg p-5 text-center text-stone-500 text-xs cursor-pointer hover:border-amber-500 hover:bg-amber-50 transition-colors"
            onClick={() => fileInputRef.current?.click()}
            onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add("border-amber-500"); }}
            onDragLeave={(e) => e.currentTarget.classList.remove("border-amber-500")}
            onDrop={handleDrop}
          >
            <Upload size={22} className="mx-auto mb-2 opacity-50" />
            <div><strong>{t("点击选择文件", "Click to choose a file")}</strong>{t("，或拖放至此", ", or drop it here")}</div>
            <div className="text-[10px] mt-1 text-stone-400">{t(".txt 或任意纯文本格式", ".txt or any plain text format")}</div>
            <input
              ref={fileInputRef} type="file" className="hidden"
              accept=".txt,.csv,.tsv,.def,.hier,text/*"
              onChange={(e) => handleFile(e.target.files?.[0])}
            />
          </div>

          {/* Paste area */}
          <div>
            <label className="block text-[10px] uppercase tracking-wider text-stone-600 mb-1.5">
              {t("或直接粘贴层级文本", "Or paste hierarchy text directly")}
            </label>
            <textarea
              className="w-full h-36 text-xs font-mono border border-stone-300 rounded px-2.5 py-2 resize-y focus:outline-none focus:border-amber-600"
              placeholder={t("根文件夹\n子文件夹A, 根文件夹\n子文件夹B, 根文件夹\n孙文件夹, 子文件夹A", "Root folder\nSubfolder A, Root folder\nSubfolder B, Root folder\nGrandchild folder, Subfolder A")}
              value={text}
              onChange={(e) => { setText(e.target.value); setErrors([]); setPreview(null); setResult(null); }}
            />
            <div className="mt-1 text-[10px] text-stone-400">{t("格式：CSV，每行 2–3 列：文件夹名, 父文件夹名, 说明。第一行是根文件夹。", "Format: CSV, 2–3 columns per line: folder name, parent folder name, description. The first line is the root folder.")}</div>
          </div>

          {/* Duplicate-name handling */}
          <label className="flex items-start gap-2 text-xs text-stone-700 cursor-pointer">
            <input
              type="checkbox"
              className="mt-0.5"
              checked={dedupeNames}
              onChange={(e) => {
                setDedupeNames(e.target.checked);
                setErrors([]); setPreview(null); setResult(null);
              }}
            />
            <span>
              {t("自动为重复文件夹名添加编号（01、02、03…）", "Automatically number duplicate folder names (01, 02, 03…)")}
              <div className="text-[10px] text-stone-400 mt-0.5">
                {t("适用于同名文件夹出现在不同父文件夹下的情况（如物料清单）。不勾选时，重复的文件夹名会被视为错误。", "Useful when folders with the same name appear under different parent folders (e.g. a bill of materials). When unchecked, duplicate folder names are treated as an error.")}
              </div>
            </span>
          </label>

          {/* Error messages */}
          {errors.length > 0 && (
            <div className="text-xs bg-red-50 border border-red-200 rounded p-3 text-red-700">
              <div className="font-semibold mb-1">{t(`验证失败 — ${errors.length} 个问题：`, `Validation failed — ${errors.length} issue(s):`)}</div>
              <ul className="list-disc ml-4 space-y-0.5">
                {errors.map((e, i) => <li key={i}>{e}</li>)}
              </ul>
            </div>
          )}

          {/* Success preview */}
          {preview && !result && (
            <div className="text-xs bg-green-50 border border-green-200 rounded p-3 text-green-800">
              {t("✓ 验证通过 — 将创建", "✓ Validated — will create")} <strong>{preview.count}</strong> {t("个节点，根节点为", "node(s), with root node")} <code className="font-mono">{preview.root}</code>
              <div className="mt-2 font-semibold text-[10px] text-stone-600 uppercase tracking-wider">{t("树形预览：", "Tree preview:")}</div>
              <pre className="mt-1 text-[11px] font-mono bg-white border border-green-100 rounded p-2 max-h-40 overflow-auto whitespace-pre leading-5">
                {buildAsciiTree(preview.order)}
              </pre>
            </div>
          )}

          {/* Result after creation */}
          {result && (
            <div className="text-xs bg-green-50 border border-green-200 rounded p-3 text-green-800">
              {t("✓ 完成 — 已创建", "✓ Done — created")} <strong>{result.created.length}</strong> {t("个节点", "node(s)")}
              {result.skipped.length > 0 && <>{t(`，${result.skipped.length} 个已存在（已跳过）`, `, ${result.skipped.length} already existed (skipped)`)}</>}{t("。", ".")}
              <div className="mt-2 font-mono text-[10px] max-h-32 overflow-auto">
                {result.created.map((n) => <div key={n}>+ {n}</div>)}
                {result.skipped.map((n) => <div key={n} className="text-stone-500">  {t("（已跳过）", "(skipped) ")}{n}</div>)}
              </div>
            </div>
          )}
        </div>

        {/* Footer */}
        <div className="px-5 py-3 border-t border-stone-200 flex justify-end gap-2">
          <button
            onClick={onClose}
            className="px-4 py-1.5 text-xs border border-stone-300 hover:bg-stone-100 rounded"
          >
            {result ? t("关闭", "Close") : t("取消", "Cancel")}
          </button>
          {!result && (
            <button
              onClick={doValidate}
              disabled={busy || !text.trim()}
              className="px-4 py-1.5 text-xs border border-amber-400 text-amber-800 hover:bg-amber-50 rounded disabled:opacity-40"
            >
              {busy && !preview ? t("验证中…", "Validating…") : t("验证", "Validate")}
            </button>
          )}
          {!result && (
            <button
              onClick={doCreate}
              disabled={busy || !preview}
              className="px-4 py-1.5 text-xs bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-40"
            >
              {busy && preview ? t("创建中…", "Creating…") : t("创建节点树", "Create node tree")}
            </button>
          )}
        </div>
      </div>
    </div>
  );
};

// ---- Face Tagging Dialog ---------------------------------------------------
const FaceTaggingDialog = ({ open, onClose, docIds, onLabeled }) => {
  const { t } = useLang();
  const [detecting, setDetecting] = useState(false);
  const [results, setResults] = useState([]);
  const [people, setPeople] = useState([]);
  const [activeFace, setActiveFace] = useState(null); // {docId,faceIdx,embedding,bbox}
  const [nameInput, setNameInput] = useState("");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);
  const [deepfaceMissing, setDeepfaceMissing] = useState(false);
  const [installing, setInstalling] = useState(false);
  const [installError, setInstallError] = useState(null);
  const nameRef = React.useRef(null);

  useEffect(() => {
    if (!open) return;
    setResults([]);
    setError(null);
    setActiveFace(null);
    setNameInput("");
    setDetecting(true);
    Promise.all([
      fetch("/api/faces/detect", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ docIds }),
      }).then((r) => r.json()),
      fetch("/api/faces/people").then((r) => r.json()),
    ])
      .then(([detectData, peopleData]) => {
        if (detectData.error && detectData.deepfaceMissing) {
          setDeepfaceMissing(true);
        } else if (detectData.error) {
          setError(detectData.error);
        } else {
          setResults(detectData.results || []);
        }
        setPeople((peopleData.people || []));
      })
      .catch((e) => setError(t("请求失败: ", "Request failed: ") + e.message))
      .finally(() => setDetecting(false));
  }, [open, docIds.join(",")]);

  useEffect(() => {
    if (activeFace && nameRef.current) {
      nameRef.current.focus();
    }
  }, [activeFace]);

  if (!open) return null;

  const nameSuggestions = people
    .map((p) => p.name)
    .filter((n) => !nameInput || n.toLowerCase().includes(nameInput.toLowerCase()));

  const handleLabel = async (personName) => {
    if (!activeFace || !personName.trim()) return;
    setSaving(true);
    try {
      const res = await fetch("/api/faces/label", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          docId: activeFace.docId,
          faceIdx: activeFace.faceIdx,
          name: personName.trim(),
          embedding: activeFace.embedding,
          bbox: activeFace.bbox,
        }),
      });
      const d = await res.json();
      if (d.ok) {
        // Update results in-place
        setResults((prev) =>
          prev.map((r) => {
            if (r.docId !== activeFace.docId) return r;
            return {
              ...r,
              faces: r.faces.map((f) =>
                f.faceIdx === activeFace.faceIdx
                  ? { ...f, personId: d.personId, personName: d.personName }
                  : f
              ),
            };
          })
        );
        // Refresh people list
        fetch("/api/faces/people")
          .then((r) => r.json())
          .then((d) => setPeople(d.people || []));
        onLabeled && onLabeled();
        setActiveFace(null);
        setNameInput("");
      }
    } finally {
      setSaving(false);
    }
  };

  const handleUnlabel = async (docId, faceIdx) => {
    await fetch("/api/faces/label", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ docId, faceIdx }),
    });
    setResults((prev) =>
      prev.map((r) => {
        if (r.docId !== docId) return r;
        return {
          ...r,
          faces: r.faces.map((f) =>
            f.faceIdx === faceIdx ? { ...f, personId: null, personName: null } : f
          ),
        };
      })
    );
  };

  return (
    <div className="fixed inset-0 bg-stone-900/60 z-50 flex items-center justify-center p-4" onClick={(e) => { if (e.target === e.currentTarget) { setActiveFace(null); } }}>
      <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col">
        {/* Header */}
        <div className="flex items-center justify-between px-5 py-3 border-b border-stone-200">
          <div className="font-semibold text-stone-900 flex items-center gap-2">
            <ScanFace size={16} className="text-amber-600" />
            {t("标记人脸 · 选中", "Tag faces · selected")} {docIds.length} {t("张照片", "photos")}
          </div>
          <button onClick={onClose} className="text-stone-400 hover:text-stone-700"><X size={18} /></button>
        </div>

        {/* Body */}
        <div className="flex-1 overflow-y-auto p-4 space-y-4">
          {detecting && (
            <div className="flex items-center justify-center gap-2 py-8 text-stone-500">
              <Loader size={18} className="animate-spin" /> {t("正在检测人脸…", "Detecting faces…")}
            </div>
          )}
          {deepfaceMissing && (
            <div className="bg-amber-50 border border-amber-200 rounded p-3 text-sm text-amber-800 space-y-2">
              <p className="font-medium">{t("需要安装 deepface 才能检测人脸。", "deepface must be installed to detect faces.")}</p>
              {installError && (
                <div className="text-xs text-red-700 bg-red-50 border border-red-200 rounded px-2 py-1 break-all">{installError}</div>
              )}
              <button
                onClick={async () => {
                  setInstalling(true); setInstallError(null);
                  try {
                    const d = await installDeepfaceAndWait();
                    if (d.status === "needs_python312") {
                      setInstallError(d.message + t("\n\n点击下方按钮下载 Python 3.12，安装后重试。", "\n\nClick the button below to download Python 3.12, then retry after installing."));
                      window.open(d.downloadUrl, "_blank");
                    } else if (d.status === "done") {
                      setDeepfaceMissing(false);
                      setDetecting(true);
                      Promise.all([
                        fetch("/api/faces/detect", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ docIds }) }).then(r => r.json()),
                        fetch("/api/faces/people").then(r => r.json()),
                      ]).then(([detectData, peopleData]) => {
                        if (detectData.results) setResults(detectData.results);
                        if (peopleData.people) setPeople(peopleData.people);
                      }).catch(e => setError(e.message)).finally(() => setDetecting(false));
                    } else { setInstallError(d.error || t("安装失败", "Installation failed")); }
                  } catch (e) { setInstallError(e.message); }
                  finally { setInstalling(false); }
                }}
                disabled={installing}
                className="w-full py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs disabled:opacity-60 flex items-center justify-center gap-1.5"
              >
                {installing ? <><Loader size={11} className="animate-spin" /> {t("安装中，请稍候…", "Installing, please wait…")}</> : t("自动安装 deepface", "Auto-install deepface")}
              </button>
              <p className="text-[10px] text-amber-600">{t("首次安装需下载约 200 MB，请保持网络连接。", "First-time install downloads about 200 MB — please stay connected to the network.")}</p>
            </div>
          )}
          {error && (
            <div className="bg-red-50 border border-red-200 rounded p-3 text-sm text-red-700">
              {error}
            </div>
          )}
          {!detecting && !error && results.map((result) => (
            <div key={result.docId} className="border border-stone-200 rounded-lg p-3">
              <div className="flex items-start gap-3">
                {/* Thumbnail */}
                <img
                  src={`/api/docs/${result.docId}/preview`}
                  alt=""
                  className="w-16 h-16 object-cover rounded border border-stone-200 shrink-0"
                  onError={(e) => { e.target.style.display = "none"; }}
                />
                <div className="flex-1 min-w-0">
                  {result.error ? (
                    <div className="text-sm text-stone-500">{result.error}</div>
                  ) : result.faces.length === 0 ? (
                    <div className="text-sm text-stone-400">{t("未检测到人脸", "No faces detected")}</div>
                  ) : (
                    <div className="flex flex-wrap gap-2">
                      {result.faces.map((face) => {
                        const isActive = activeFace && activeFace.docId === result.docId && activeFace.faceIdx === face.faceIdx;
                        return (
                          <div key={face.faceIdx} className="relative flex flex-col items-center gap-1">
                            <div className="relative">
                              <img
                                src={`data:image/jpeg;base64,${face.crop_b64}`}
                                alt={t(`人脸 ${face.faceIdx + 1}`, `Face ${face.faceIdx + 1}`)}
                                className={`w-14 h-14 object-cover rounded cursor-pointer border-2 transition-colors ${
                                  isActive ? "border-amber-500 ring-2 ring-amber-300" :
                                  face.personId ? "border-green-400" : "border-stone-200 hover:border-amber-400"
                                }`}
                                onClick={() => {
                                  if (isActive) {
                                    setActiveFace(null);
                                  } else {
                                    setActiveFace({ docId: result.docId, faceIdx: face.faceIdx, embedding: face.embedding, bbox: face.bbox });
                                    setNameInput(face.personName || "");
                                  }
                                }}
                              />
                              {face.personId && (
                                <button
                                  onClick={(e) => { e.stopPropagation(); handleUnlabel(result.docId, face.faceIdx); }}
                                  className="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white rounded-full flex items-center justify-center text-[9px] hover:bg-red-600"
                                  title={t("取消标记", "Remove tag")}
                                >×</button>
                              )}
                            </div>
                            {face.personName ? (
                              <span className="text-[10px] bg-green-100 text-green-800 px-1.5 py-0.5 rounded max-w-[56px] truncate">{face.personName}</span>
                            ) : (
                              <span className="text-[10px] text-stone-400">{t("未标记", "Untagged")}</span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {/* Name input popover for active face in this result */}
                  {activeFace && activeFace.docId === result.docId && (
                    <div className="mt-2 flex flex-col gap-1">
                      <div className="flex gap-1">
                        <input
                          ref={nameRef}
                          value={nameInput}
                          onChange={(e) => setNameInput(e.target.value)}
                          onKeyDown={(e) => {
                            if (e.key === "Enter") { handleLabel(nameInput); }
                            if (e.key === "Escape") { setActiveFace(null); setNameInput(""); }
                          }}
                          placeholder={t("输入姓名…", "Enter name…")}
                          className="flex-1 text-xs border border-stone-300 rounded px-2 py-1 outline-none focus:border-amber-400"
                          disabled={saving}
                        />
                        <button
                          onClick={() => handleLabel(nameInput)}
                          disabled={saving || !nameInput.trim()}
                          className="text-xs px-2 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded disabled:opacity-40"
                        >
                          {saving ? "…" : t("标记", "Tag")}
                        </button>
                      </div>
                      {nameSuggestions.length > 0 && (
                        <div className="flex flex-wrap gap-1">
                          {nameSuggestions.slice(0, 8).map((n) => (
                            <button
                              key={n}
                              onClick={() => handleLabel(n)}
                              className="text-[10px] px-1.5 py-0.5 bg-stone-100 hover:bg-amber-100 text-stone-700 rounded border border-stone-200"
                            >{n}</button>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          ))}
        </div>

        {/* Footer */}
        <div className="px-5 py-3 border-t border-stone-200 flex justify-end">
          <button onClick={onClose} className="text-sm px-4 py-1.5 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded">
            {t("完成", "Done")}
          </button>
        </div>
      </div>
    </div>
  );
};

// ---- People Panel ----------------------------------------------------------
const PeoplePanel = ({ onFilterPerson, filteredPersonId, tree }) => {
  const { t } = useLang();
  const [people, setPeople] = useState([]);
  const [loading, setLoading] = useState(true);
  const [recognizing, setRecognizing] = useState(null); // personId or null
  const [error, setError] = useState(null);
  const [deepfaceAvailable, setDeepfaceAvailable] = useState(true);
  const [confirmDelete, setConfirmDelete] = useState(null); // personId
  const [scanDialog, setScanDialog] = useState(null);    // personId being scoped
  const [scanNodeIds, setScanNodeIds] = useState(new Set());
  const [scanExpanded, setScanExpanded] = useState(new Set());
  const [scanThreshold, setScanThreshold] = useState(0.70);
  const [installing, setInstalling] = useState(false);
  const [installError, setInstallError] = useState(null);
  const [gallery, setGallery] = useState(null); // { personName, docIds: [], folderCreated: false }
  const [galleryBusy, setGalleryBusy] = useState(false);

  const openGallery = (person) => {
    fetch(`/api/faces/photos/${person.id}`)
      .then((r) => r.json())
      .then((d) => setGallery({ personName: person.name, docIds: d.docIds || [], folderCreated: false }))
      .catch(() => {});
  };

  const createFaceFolder = async () => {
    if (!gallery) return;
    setGalleryBusy(true);
    try {
      const res = await fetch("/api/faces/create-folder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ personName: gallery.personName, docIds: gallery.docIds }),
      });
      const d = await res.json();
      if (d.ok) {
        setGallery((g) => ({ ...g, folderCreated: true, added: d.added }));
      }
    } catch (e) {
      // silent
    } finally {
      setGalleryBusy(false);
    }
  };

  const loadPeople = () => {
    setLoading(true);
    fetch("/api/faces/people")
      .then((r) => r.json())
      .then((d) => {
        setPeople(d.people || []);
        setDeepfaceAvailable(d.deepfaceAvailable !== false);
      })
      .catch((e) => setError(t("加载失败: ", "Load failed: ") + e.message))
      .finally(() => setLoading(false));
  };

  useEffect(() => { loadPeople(); }, []);

  const openScanDialog = (personId) => {
    setScanDialog(personId);
    setScanNodeIds(new Set());
    setScanExpanded(tree ? new Set([tree.id]) : new Set());
  };

  const toggleScanExpand = (id) =>
    setScanExpanded((prev) => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });

  const toggleScanFolder = (node) => {
    setScanNodeIds((prev) => {
      const next = new Set(prev);
      const on = !next.has(node.id);
      const walk = (n) => { on ? next.add(n.id) : next.delete(n.id); (n.children || []).forEach(walk); };
      walk(node);
      return next;
    });
  };

  const hasScanDescendant = (node) =>
    (node.children || []).some((c) => scanNodeIds.has(c.id) || hasScanDescendant(c));

  const renderScanTree = (node, depth = 0) => {
    const isExp = scanExpanded.has(node.id);
    const isChecked = scanNodeIds.has(node.id);
    const isPartial = !isChecked && hasScanDescendant(node);
    const hasChildren = (node.children || []).length > 0;
    return (
      <div key={node.id}>
        <div className="flex items-center gap-1 hover:bg-amber-50 rounded py-0.5 cursor-pointer"
             style={{ paddingLeft: `${6 + depth * 14}px` }}>
          <button onClick={() => toggleScanExpand(node.id)}
            className="shrink-0 w-4 flex items-center justify-center">
            {hasChildren ? (isExp ? <ChevronDown size={11} /> : <ChevronRight size={11} />) : null}
          </button>
          <input type="checkbox" checked={isChecked}
            ref={(el) => { if (el) el.indeterminate = isPartial; }}
            onChange={() => toggleScanFolder(node)}
            className="shrink-0 cursor-pointer" />
          <Folder size={12} className="text-amber-600 shrink-0 ml-0.5" />
          <span className="text-xs text-stone-800 truncate ml-0.5">{node.name}</span>
        </div>
        {isExp && hasChildren && (node.children || []).map((c) => renderScanTree(c, depth + 1))}
      </div>
    );
  };

  const handleRecognize = async (personId, nodeIds) => {
    setRecognizing(personId);
    setScanDialog(null);
    setError(null);
    try {
      const body = { personId, threshold: scanThreshold };
      if (nodeIds && nodeIds.length > 0) body.nodeIds = nodeIds;
      const res = await fetch("/api/faces/recognize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const d = await res.json();
      if (d.error) {
        setError(d.error);
      } else {
        const person = people.find(p => p.id === personId);
        const name = person ? person.name : "";
        const photoCount = d.photos != null ? d.photos : d.found;
        const msg = photoCount > 0
          ? t(`在 ${d.scanned} 张照片中识别到 ${photoCount} 张含有${name}的照片`, `Recognized ${photoCount} photo(s) containing ${name} out of ${d.scanned} scanned`)
          : t(`已扫描 ${d.scanned} 张照片，未发现新的匹配`, `Scanned ${d.scanned} photo(s), no new matches found`);
        setError("✅ " + msg);
        loadPeople();
      }
    } catch (e) {
      setError(t("识别失败: ", "Recognition failed: ") + e.message);
    } finally {
      setRecognizing(null);
    }
  };

  const handleDelete = async (personId) => {
    await fetch(`/api/faces/person/${personId}`, { method: "DELETE" });
    if (filteredPersonId === personId) onFilterPerson(null);
    setConfirmDelete(null);
    loadPeople();
  };

  return (
    <div className="flex flex-col h-full overflow-hidden">
      {/* Header */}
      <div className="flex items-center justify-between px-3 py-2 border-b border-stone-200 shrink-0">
        <span className="text-xs font-semibold text-stone-700 flex items-center gap-1.5">
          <Users size={12} /> {t("人脸识别", "Face recognition")}
        </span>
        <button onClick={loadPeople} className="text-stone-400 hover:text-stone-700" title={t("刷新", "Refresh")}>
          <Loader size={12} className={loading ? "animate-spin" : ""} />
        </button>
      </div>

      {recognizing !== null && (
        <div className="mx-2 mt-2 p-2 bg-amber-50 border border-amber-200 rounded text-xs text-amber-800 flex items-center gap-2">
          <Loader size={11} className="animate-spin shrink-0" />
          <span>{t("正在扫描照片，识别人脸中…可能需要几分钟，请耐心等待。", "Scanning photos and recognizing faces… this may take a few minutes, please be patient.")}</span>
        </div>
      )}

      {!deepfaceAvailable && (
        <div className="m-2 p-3 bg-amber-50 border border-amber-200 rounded text-xs text-amber-800 space-y-2">
          <p className="font-medium">{t("需要安装 deepface 才能使用人脸识别。", "deepface must be installed to use face recognition.")}</p>
          {installError && (
            <div className="text-red-700 bg-red-50 border border-red-200 rounded px-2 py-1 break-all">{installError}</div>
          )}
          <button
            onClick={async () => {
              setInstalling(true); setInstallError(null);
              try {
                const d = await installDeepfaceAndWait();
                if (d.status === "needs_python312") {
                  setInstallError(d.message);
                  window.open(d.downloadUrl, "_blank");
                } else if (d.status === "done") { loadPeople(); }
                else { setInstallError(d.error || t("安装失败", "Installation failed")); }
              } catch (e) { setInstallError(e.message); }
              finally { setInstalling(false); }
            }}
            disabled={installing}
            className="w-full py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-60 flex items-center justify-center gap-1.5"
          >
            {installing
              ? <><Loader size={11} className="animate-spin" /> {t("安装中，请稍候…", "Installing, please wait…")}</>
              : t("自动安装 deepface", "Auto-install deepface")}
          </button>
          <p className="text-[10px] text-amber-600">{t("首次安装需下载约 200 MB，请保持网络连接。", "First-time install downloads about 200 MB — please stay connected to the network.")}</p>
        </div>
      )}

      {error && (
        <div className={`mx-2 my-1 p-2 rounded text-xs flex items-start gap-1 ${error.startsWith("✅") ? "bg-green-50 border border-green-200 text-green-800" : "bg-red-50 border border-red-200 text-red-700"}`}>
          <span className="flex-1">{error}</span>
          <button onClick={() => setError(null)} className="ml-1 opacity-50 hover:opacity-100 shrink-0">×</button>
        </div>
      )}

      {filteredPersonId && (
        <div className="mx-2 mt-1 flex items-center justify-between">
          <span className="text-[10px] text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">
            {t("已筛选：", "Filtered: ")}{(people.find((p) => p.id === filteredPersonId) || {}).name || ""}
          </span>
          <button
            onClick={() => onFilterPerson(null)}
            className="text-[10px] text-stone-500 hover:text-stone-700 ml-1"
          >{t("清除筛选", "Clear filter")}</button>
        </div>
      )}

      {/* Scan scope dialog */}
      {scanDialog && (
        <div className="fixed inset-0 bg-stone-900/70 z-50 flex items-center justify-center p-4"
             onClick={() => setScanDialog(null)}>
          <div className="bg-white w-full max-w-sm rounded shadow-2xl flex flex-col"
               style={{ maxHeight: "75vh" }}
               onClick={(e) => e.stopPropagation()}>
            <div className="px-4 pt-4 pb-3 border-b border-stone-200 shrink-0">
              <div className="text-[10px] tracking-[0.2em] uppercase text-stone-500 mb-0.5">{t("识别范围", "Recognition scope")}</div>
              <h2 className="text-sm font-semibold text-stone-900">
                {t("选择要扫描的文件夹", "Choose folders to scan")}
              </h2>
              <p className="text-[11px] text-stone-500 mt-1">
                {t("扫描选中文件夹及其所有子文件夹中的照片。不选则扫描全库。", "Scans photos in the selected folders and all their subfolders. If none are selected, the whole library is scanned.")}
              </p>
            </div>
            <div className="overflow-y-auto flex-1 px-3 py-2">
              {tree ? renderScanTree(tree) : (
                <div className="text-xs text-stone-400 text-center py-4">{t("暂无文件夹树。", "No folder tree yet.")}</div>
              )}
            </div>
            <div className="px-4 py-2 border-t border-stone-100 shrink-0">
              <div className="flex items-center justify-between mb-0.5">
                <label className="text-[10px] text-stone-500">{t("匹配精度（相似度阈值）", "Match precision (similarity threshold)")}</label>
                <span className="text-[10px] font-medium text-stone-700">{Math.round(scanThreshold * 100)}%</span>
              </div>
              <input type="range" min="55" max="95" step="1"
                value={Math.round(scanThreshold * 100)}
                onChange={(e) => setScanThreshold(Number(e.target.value) / 100)}
                className="w-full h-1.5 accent-amber-500" />
              <div className="flex justify-between text-[9px] text-stone-400 mt-0.5">
                <span>{t("宽松（更多匹配）", "Loose (more matches)")}</span>
                <span>{t("严格（更少误匹配）", "Strict (fewer false matches)")}</span>
              </div>
            </div>
            <div className="px-4 py-3 border-t border-stone-200 flex gap-2 justify-end shrink-0">
              <button onClick={() => setScanDialog(null)}
                className="px-3 py-1.5 text-xs border border-stone-300 hover:bg-stone-100 rounded">
                {t("取消", "Cancel")}
              </button>
              <button
                onClick={() => handleRecognize(scanDialog, [])}
                disabled={recognizing !== null}
                className="px-3 py-1.5 text-xs border border-stone-300 hover:bg-stone-50 text-stone-700 rounded disabled:opacity-50">
                {t("扫描全库", "Scan whole library")}
              </button>
              <button
                onClick={() => handleRecognize(scanDialog, Array.from(scanNodeIds))}
                disabled={recognizing !== null || scanNodeIds.size === 0}
                className="px-3 py-1.5 text-xs bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-50">
                {t("扫描选中文件夹", "Scan selected folders")} {scanNodeIds.size > 0 ? `(${scanNodeIds.size})` : ""}
              </button>
            </div>
          </div>
        </div>
      )}

      <div className="flex-1 overflow-y-auto p-2 space-y-2">
        {loading && people.length === 0 && (
          <div className="flex items-center justify-center gap-1 py-6 text-stone-400 text-xs">
            <Loader size={12} className="animate-spin" /> {t("加载中…", "Loading…")}
          </div>
        )}
        {!loading && people.length === 0 && (
          <div className="text-center py-6 text-stone-400 text-xs">
            {t("尚无标记人脸。", "No tagged faces yet.")}<br />{t("选择照片后点击\"标记人脸\"开始。", "Select photos and click \"Tag faces\" to start.")}
          </div>
        )}
        {people.map((person) => (
          <div
            key={person.id}
            className={`border rounded-lg p-2 cursor-pointer transition-colors ${
              filteredPersonId === person.id
                ? "border-amber-400 bg-amber-50"
                : "border-stone-200 bg-white hover:border-stone-300 hover:bg-stone-50"
            }`}
            onClick={() => openGallery(person)}
          >
            {confirmDelete === person.id ? (
              <div className="text-xs text-red-700">
                <p>{t("确认删除", "Confirm deleting")} <b>{person.name}</b> {t("及其所有标记？", "and all their tags?")}</p>
                <div className="flex gap-2 mt-1">
                  <button onClick={(e) => { e.stopPropagation(); handleDelete(person.id); }} className="px-2 py-0.5 bg-red-500 text-white rounded text-[10px]">{t("确认删除", "Confirm delete")}</button>
                  <button onClick={(e) => { e.stopPropagation(); setConfirmDelete(null); }} className="px-2 py-0.5 bg-stone-100 rounded text-[10px]">{t("取消", "Cancel")}</button>
                </div>
              </div>
            ) : (
              <div className="flex items-center gap-2">
                {person.avatarCrop ? (
                  <img src={`data:image/jpeg;base64,${person.avatarCrop}`} alt={person.name}
                    className="w-10 h-10 rounded-full object-cover border-2 border-stone-200 shrink-0" />
                ) : (
                  <div className="w-10 h-10 rounded-full bg-stone-200 flex items-center justify-center shrink-0">
                    <User size={16} className="text-stone-500" />
                  </div>
                )}
                <div className="flex-1 min-w-0">
                  <div className="text-xs font-medium text-stone-900 truncate">{person.name}</div>
                  <div className="text-[10px] text-stone-500">{t(`${person.photoCount} 张照片`, `${person.photoCount} photos`)}</div>
                </div>
                <div className="flex gap-1 shrink-0" onClick={(e) => e.stopPropagation()}>
                  <button
                    onClick={() => openScanDialog(person.id)}
                    disabled={recognizing !== null}
                    className="text-[10px] px-1.5 py-0.5 border border-stone-300 rounded hover:bg-amber-50 hover:border-amber-400 disabled:opacity-40 flex items-center gap-0.5"
                    title={t("在指定文件夹中搜索此人", "Search for this person within a specific folder")}
                  >
                    {recognizing === person.id
                      ? <Loader size={9} className="animate-spin" />
                      : <ScanFace size={9} />
                    }
                    {t("识别", "Recognize")}
                  </button>
                  <button
                    onClick={() => setConfirmDelete(person.id)}
                    className="text-[10px] px-1 py-0.5 border border-stone-200 rounded text-stone-400 hover:bg-red-50 hover:border-red-300 hover:text-red-600"
                    title={t("删除此人及所有标记", "Delete this person and all their tags")}
                  >
                    <Trash2 size={9} />
                  </button>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>

      {/* Photo gallery modal */}
      {gallery && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50"
             onClick={() => setGallery(null)}>
          <div className="bg-white rounded-xl shadow-2xl w-[90vw] max-w-3xl max-h-[80vh] flex flex-col"
               onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between px-4 py-3 border-b border-stone-200 shrink-0">
              <span className="text-sm font-semibold text-stone-800">
                {gallery.personName} — {t(`${gallery.docIds.length} 张照片`, `${gallery.docIds.length} photos`)}
              </span>
              <div className="flex items-center gap-2">
                {gallery.folderCreated ? (
                  <span className="text-xs text-green-700 bg-green-50 border border-green-200 rounded px-2 py-0.5">
                    {t(`✓ 已创建"人脸匹配/${gallery.personName}"文件夹（${gallery.added} 张）`, `✓ Created folder "人脸匹配/${gallery.personName}" (${gallery.added} photos)`)}
                  </span>
                ) : (
                  <button
                    onClick={createFaceFolder}
                    disabled={galleryBusy}
                    className="text-xs px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded disabled:opacity-40"
                  >
                    {galleryBusy ? t("创建中…", "Creating…") : t("创建匹配文件夹", "Create matches folder")}
                  </button>
                )}
                <button onClick={() => setGallery(null)}
                  className="text-stone-400 hover:text-stone-700 text-lg leading-none ml-1">×</button>
              </div>
            </div>
            <div className="overflow-y-auto p-3 grid grid-cols-4 gap-2">
              {gallery.docIds.map((docId) => (
                <div key={docId} className="aspect-square rounded overflow-hidden bg-stone-100 border border-stone-200">
                  <img
                    src={`/api/docs/${docId}/preview`}
                    alt={docId}
                    className="w-full h-full object-cover"
                    loading="lazy"
                    onError={(e) => { e.target.style.display = "none"; }}
                  />
                </div>
              ))}
              {gallery.docIds.length === 0 && (
                <div className="col-span-4 text-center py-8 text-stone-400 text-sm">{t("暂无照片", "No photos yet")}</div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const ProjectMenu = ({ open, onClose, onProjectChanged, onOpenKeyParameters, onOpenHierarchyImport, onOpenZipImport, onTriggerImport, onOpenEmailSettings, onOpenAISettings, tree }) => {
  const { t } = useLang();
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [importDialog, setImportDialog] = useState(null); // { file, mode, target }
  const [newDialog, setNewDialog] = useState(null);       // { target }
  const [pwDialog, setPwDialog] = useState(null);         // { current, next, confirm, hasExisting }
  const [authStatus, setAuthStatus] = useState(null);
  const [exportSelDialog, setExportSelDialog] = useState(false);
  const [exportSelChecked, setExportSelChecked] = useState(new Set());
  const isMac = typeof navigator !== "undefined" && /Mac|iPhone|iPad/.test(navigator.platform);
  const exampleNew = isMac
    ? "/Users/yourname/DMS_Project_2"
    : "C:\\DMS_Project_2";

  // Load auth status when menu opens
  useEffect(() => {
    if (!open) return;
    fetch("/api/auth/status")
      .then((r) => r.json())
      .then((s) => setAuthStatus(s))
      .catch(() => setAuthStatus(null));
  }, [open]);

  const doExport = async () => {
    setError(null);
    setBusy(true);
    try {
      const res = await fetch("/api/project/export");
      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try { msg = (await res.json()).error || msg; } catch {}
        throw new Error(msg);
      }

};


function Root() {
  const [phase, setPhase] = useState("loading"); // 'loading' | 'setup' | 'change' | 'ready'
  const [storagePath, setStoragePath] = useState("");

  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem("dms_lang") || "zh"; }
    catch { return "zh"; }
  });
  useEffect(() => {
    try { localStorage.setItem("dms_lang", lang); } catch {}
    document.documentElement.lang = lang === "en" ? "en" : "zh";
    document.title = lang === "en" ? "Document Management System (DMS)" : "文件管理系统(DMS)";
  }, [lang]);
  const t = useCallback((zh, en) => (lang === "en" ? en : zh), [lang]);
  const langCtx = useMemo(() => ({ lang, t, setLang }), [lang, t]);

  useEffect(() => {
    (async () => {
      try {
        const s = await StorageAdapter.getSettings();
        if (s.configured && s.exists && s.writable) {
          setStoragePath(s.resolved_path);
          setPhase("ready");
        } else {
          setPhase("setup");
        }
      } catch (e) {
        console.error("Could not reach the DMS server:", e);
        // Show the setup screen anyway — it has clearer error feedback
        setPhase("setup");
      }
    })();
  }, []);

  const handleSaved = (resolvedPath) => {
    setStoragePath(resolvedPath);
    setPhase("ready");
  };

  const handleChangeFolder = () => setPhase("change");
  const cancelChange = () => setPhase("ready");

  let body;
  if (phase === "loading") {
    body = (
      <div className="h-screen flex items-center justify-center bg-stone-50 text-stone-500 text-sm">
        {t("正在连接 DMS 服务器…", "Connecting to the DMS server…")}
      </div>
    );
  } else if (phase === "setup") {
    body = <SettingsScreen isInitialSetup={true} onSaved={handleSaved} />;
  } else if (phase === "change") {
    body = (
      <SettingsScreen
        isInitialSetup={false}
        initialPath={storagePath}
        currentPath={storagePath}
        onSaved={handleSaved}
        onCancel={cancelChange}
      />
    );
  } else {
    body = <DMS storagePath={storagePath} onChangeFolder={handleChangeFolder} />;
  }

  return <LangContext.Provider value={langCtx}>{body}</LangContext.Provider>;
}

/* =============================================================================
 * UI: LINK PICKER MODAL
 * ---------------------------------------------------------------------------
 * Lets the user link an existing document to the current node. Two tabs:
 *   • Search — type a query, see matches across all documents
 *   • Browse — walk the tree and see what's attached to each node
 * Documents already linked to the current node are shown but disabled.
 * =============================================================================
 */
const LinkPicker = ({
  open, onClose, onLink,
  docIndex, tree, refMap, currentNodeId, currentNodeName,
  formatBytes, getPathFor,
}) => {
  const { t } = useLang();
  const [tab, setTab] = useState("search");
  const [q, setQ] = useState("");
  const [browseNodeId, setBrowseNodeId] = useState(null);
  const [selectedIds, setSelectedIds] = useState(new Set());

  useEffect(() => {
    if (open) {
      setQ("");
      setBrowseNodeId(tree?.id || null);
      setSelectedIds(new Set());
      setTab("search");
    }
  }, [open, tree]);

  if (!open) return null;

  // Documents already linked to the current node — shown but not selectable
  const alreadyLinkedHere = new Set(
    (findNode(tree, currentNodeId)?.documents || []).map((d) => d.id)
  );

  const matchesQuery = (entry, words) => {
    if (!words.length) return true;
    const haystack = [
      entry.id,
      entry.name || "",
      entry.ocrText || "",
      ...Object.keys(entry.metadata || {}),
      ...Object.values(entry.metadata || {}).map((v) => {
        if (v && typeof v === "object") return `${v.design || ""} ${v.actual || ""}`;
        return String(v);
      }),
    ].join(" ").toLowerCase();
    return words.every((w) => haystack.includes(w));
  };

  const searchWords = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const searchResults = docIndex.filter((d) => matchesQuery(d, searchWords));

  // Browse mode: docs attached to the currently-browsed node
  const browseNode = browseNodeId ? findNode(tree, browseNodeId) : null;
  const browseDocs = browseNode
    ? (browseNode.documents || [])
        .map((ref) => docIndex.find((e) => e.id === ref.id))
        .filter(Boolean)
    : [];

  const toggleSelect = (id) => {
    if (alreadyLinkedHere.has(id)) return;
    setSelectedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const commit = async () => {
    for (const id of selectedIds) await onLink(id);
    onClose();
  };

  const renderRow = (doc) => {
    const refs = refMap.get(doc.id) || [];
    const linkedHere = alreadyLinkedHere.has(doc.id);
    const selected = selectedIds.has(doc.id);
    return (
      <div
        key={doc.id}
        onClick={() => toggleSelect(doc.id)}
        className={`flex items-center gap-2 p-2 border rounded text-xs cursor-pointer transition-colors ${
          linkedHere
            ? "border-stone-200 bg-stone-50 opacity-60 cursor-not-allowed"
            : selected
              ? "border-amber-500 bg-amber-50"
              : "border-stone-200 hover:bg-stone-50 hover:border-stone-300"
        }`}
      >
        <input
          type="checkbox"
          readOnly
          disabled={linkedHere}
          checked={selected || linkedHere}
          className="shrink-0"
        />
        <div className="flex-1 min-w-0">
          <div className="font-medium text-stone-900 truncate">{doc.name}</div>
          <div className="text-[10px] font-mono text-stone-500 mt-0.5 flex flex-wrap gap-2">
            <span>{doc.id}</span>
            <span>· {formatBytes(doc.size)}</span>
            {refs.length === 0 && <span className="text-amber-700">· {t("未引用", "Unreferenced")}</span>}
            {refs.length > 0 && <span>· {t(`已链接至 ${refs.length} 个节点`, `Linked to ${refs.length} node(s)`)}</span>}
            {linkedHere && <span className="text-stone-700 font-semibold">· {t("已在此处链接", "Already linked here")}</span>}
          </div>
        </div>
      </div>
    );
  };

  // Recursive tree renderer for the Browse tab
  const renderBrowseTree = (node, depth = 0) => {
    const docCount = (node.documents || []).length;
    const isCurrent = node.id === browseNodeId;
    return (
      <div key={node.id}>
        <div
          onClick={() => setBrowseNodeId(node.id)}
          className={`flex items-center gap-1.5 py-1 px-2 cursor-pointer text-xs border-l-2 ${
            isCurrent
              ? "bg-amber-50 border-amber-600 text-stone-900"
              : "border-transparent text-stone-700 hover:bg-stone-100"
          }`}
          style={{ paddingLeft: `${depth * 12 + 8}px` }}
        >
          <Folder size={12} className="text-amber-700 shrink-0" />
          <span className="truncate flex-1">{node.name}</span>
          {docCount > 0 && (
            <span className="text-[9px] tabular-nums px-1 bg-stone-200 rounded">{docCount}</span>
          )}
        </div>
        {(node.children || []).map((c) => renderBrowseTree(c, depth + 1))}
      </div>
    );
  };

  return (
    <div
      className="fixed inset-0 bg-stone-900/70 z-50 flex items-center justify-center p-4"
      onClick={onClose}
    >
      <div
        className="bg-white w-full max-w-3xl h-[80vh] rounded shadow-2xl flex flex-col"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="px-4 py-3 border-b border-stone-200">
          <div className="flex items-center justify-between">
            <div>
              <div className="text-sm font-semibold text-stone-900">{t("链接现有文档", "Link an existing document")}</div>
              <div className="text-[11px] text-stone-500">
                {t("添加至：", "Add to: ")}<span className="font-mono">{currentNodeName}</span>
              </div>
            </div>
            <button
              onClick={onClose}
              className="text-stone-500 hover:text-stone-900 p-1"
            >
              <X size={16} />
            </button>
          </div>
          <div className="flex gap-1 mt-3 text-xs">
            <button
              onClick={() => setTab("search")}
              className={`px-3 py-1.5 rounded ${
                tab === "search"
                  ? "bg-stone-900 text-white"
                  : "border border-stone-300 text-stone-700 hover:bg-stone-100"
              }`}
            >
              {t("搜索", "Search")}
            </button>
            <button
              onClick={() => setTab("browse")}
              className={`px-3 py-1.5 rounded ${
                tab === "browse"
                  ? "bg-stone-900 text-white"
                  : "border border-stone-300 text-stone-700 hover:bg-stone-100"
              }`}
            >
              {t("浏览树", "Browse tree")}
            </button>
          </div>
        </div>

        <div className="flex-1 overflow-hidden flex">
          {tab === "search" && (
            <div className="flex-1 flex flex-col p-3 gap-2 overflow-hidden">
              <div className="relative shrink-0">
                <Search
                  size={14}
                  className="absolute left-2.5 top-1/2 -translate-y-1/2 text-stone-400"
                />
                <input
                  type="text"
                  autoFocus
                  value={q}
                  onChange={(e) => setQ(e.target.value)}
                  placeholder={t("按编号、文件名或元数据搜索…", "Search by number, filename, or metadata…")}
                  className="w-full pl-8 pr-3 py-1.5 text-xs border border-stone-300 rounded focus:outline-none focus:border-amber-600"
                />
              </div>
              <div className="text-[11px] text-stone-500 shrink-0">
                {t(`文件库中共 ${searchResults.length} 份文档`, `${searchResults.length} documents in the library`)}
              </div>
              <div className="flex-1 overflow-auto space-y-1.5">
                {searchResults.length === 0 && (
                  <div className="text-xs text-stone-500 italic text-center py-8">
                    {docIndex.length === 0
                      ? t("尚未上传任何文档。请先上传文档，再来此处链接到其他节点。", "No documents uploaded yet. Upload a document first, then come back here to link it to other nodes.")
                      : t("没有与搜索条件匹配的文档。", "No documents match your search.")}
                  </div>
                )}
                {searchResults.map(renderRow)}
              </div>
            </div>
          )}

          {tab === "browse" && (
            <>
              <div className="w-1/3 border-r border-stone-200 overflow-auto">
                {tree && renderBrowseTree(tree)}
              </div>
              <div className="flex-1 p-3 overflow-auto">
                {browseNode && (
                  <>
                    <div className="text-[11px] font-mono text-stone-500 mb-2">
                      {getPathFor(browseNode.id)}
                    </div>
                    <div className="text-xs uppercase tracking-wider text-stone-600 mb-2">
                      {t("已附加文档", "Attached documents")}
                    </div>
                    <div className="space-y-1.5">
                      {browseDocs.length === 0 && (
                        <div className="text-xs text-stone-500 italic">
                          {t("此节点暂无附加文档。", "No documents attached to this node yet.")}
                        </div>
                      )}
                      {browseDocs.map(renderRow)}
                    </div>
                  </>
                )}
              </div>
            </>
          )}
        </div>

        <div className="px-4 py-3 border-t border-stone-200 flex items-center justify-between">
          <div className="text-xs text-stone-600">
            {selectedIds.size > 0
              ? t(`已选择 ${selectedIds.size} 份文档`, `${selectedIds.size} documents selected`)
              : t("请选择一个或多个文档进行链接", "Select one or more documents to link")}
          </div>
          <div className="flex gap-2">
            <button
              onClick={onClose}
              className="px-4 py-1.5 text-xs border border-stone-300 hover:bg-stone-100 rounded"
            >
              {t("取消", "Cancel")}
            </button>
            <button
              onClick={commit}
              disabled={selectedIds.size === 0}
              className="px-4 py-1.5 text-xs bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-40"
            >
              {t("链接", "Link")} {selectedIds.size > 0 ? `(${selectedIds.size})` : ""}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};
