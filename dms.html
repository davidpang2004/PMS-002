/* =============================================================================
 * LANGUAGE (zh / en) — app-wide toggle, persisted in localStorage.
 * t(zh, en) returns whichever string matches the active language; call sites

// Recombine a {value, unit, description} extraction row into a single
// display/search string (used for the metadata "actual" field, which is
// read as plain text in many other places in this app -- search, databook,
// the general metadata editor, etc). The structured value/unit/description
// fields are stored ALONGSIDE this string, not instead of it.
const composeActualString = (value, unit, description) => {
  const v = (value || "").trim();
  const u = (unit || "").trim();
  const d = (description || "").trim();
  const head = v ? (u ? `${v} ${u}` : v) : u;
  return [head, d].filter(Boolean).join(" ").trim();
};

// JS mirror of pdf_extraction.split_value_unit_description (Python), used
// only so the metadata editor can show a value/unit/description breakdown
// for "actual" text that predates this field split (extraction-saved rows
// already carry the parts; this is the fallback for older/manually-typed
// entries). Same conservative rule: a value only comes out when the whole
// string is a bare number, or a number sits right next to a known unit.
const _UNIT_ALT_JS = "(?:kg/m\\^?3|kg/m³|g/cm\\^?3|g/cm³|lb/in\\^?3|lb/ft\\^?3|" +
  "m/s|ft/s|mph|kph|ft[-\\s]?lb(?:s)?|ft·lb|N·m|Nm|J|" +
  "GPa|MPa|kPa|ksi|psi|bar|Pa|HRC|HRB|HV|HB|BHN|Shore\\s?[A-D]?|" +
  "°C|°F|deg\\s?C|deg\\s?F|K|mm|cm|in(?:ch(?:es)?)?|ft|m|\"|" +
  "kg|lbf|lb(?:s)?|lbm|g|%|pct|MHz|kHz|Hz|kW|hp|V|A|W)";
const _NUMBER_JS = "[-+]?\\d{1,3}(?:,\\d{3})+(?:\\.\\d+)?|[-+]?\\d+(?:\\.\\d+)?";
const _BARE_NUMBER_RE_JS = new RegExp(`^(?:${_NUMBER_JS})$`);
const _NUMBER_UNIT_RE_JS = new RegExp(`(${_NUMBER_JS})\\s?(${_UNIT_ALT_JS})`, "i");

const splitActualString = (raw) => {
  const s = (raw || "").trim();
  if (!s) return { value: "", unit: "", description: "" };
  if (_BARE_NUMBER_RE_JS.test(s)) return { value: s.replace(/,/g, ""), unit: "", description: "" };
  const m = s.match(_NUMBER_UNIT_RE_JS);
  if (!m) return { value: "", unit: "", description: s };
  const value = m[1].replace(/,/g, "");
  const unit = m[2];
  const before = s.slice(0, m.index).trim();
  const after = s.slice(m.index + m[0].length).trim();
  return { value, unit, description: [before, after].filter(Boolean).join(" ") };
};

/* =============================================================================
 * STORAGE ADAPTER LAYER (REST API implementation)
 * ---------------------------------------------------------------------------
 * Talks to the Python Flask server (dms_server.py) running on the same host.
 * Tree + index live in <storage_root>/index.json on disk.
 * Documents live as real files in <storage_root>/docs/<DOC-ID>.<ext>.
 *
 * To migrate to a remote/production server later, just change API_BASE to
 * the remote URL — no other code in this file changes.
 * =============================================================================
 */
const API_BASE = ""; // same origin as the page (e.g. http://localhost:8000)

const DEFAULT_KEY_PARAMETERS = [
  "人物",
  "事件",
  "单位",
  "家人",
  "朋友",
  "旅游"
];

const normalizeKeyParameters = (items) => {
  const seen = new Set();
  const out = [];
  for (const raw of (items || [])) {
    const v = String(raw || "").trim();
    if (!v) continue;
    const k = v.toLowerCase();
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(v);
  }
  return out;
};

// Render the assembly tree as a box-drawing text tree (├── └── │), like a
// classic file-tree printout. Used by the "文本树" view for copy/export.
const buildTreeText = (root, { showMeta = false } = {}) => {
  if (!root) return "";
  const label = (n) => {
    let s = n.name || n.id || tOutsideReact("(未命名)", "(unnamed)");
    const docCount = (n.documents || []).length;
    if (showMeta && n.sn) s += `  [${n.sn}]`;
    if (docCount) s += tOutsideReact(`  (${docCount} 份文档)`, `  (${docCount} docs)`);
    return s;
  };
  const lines = [label(root)];
  const walk = (node, prefix) => {
    const kids = node.children || [];
    kids.forEach((kid, i) => {
      const last = i === kids.length - 1;
      lines.push(prefix + (last ? "└── " : "├── ") + label(kid));
      walk(kid, prefix + (last ? "    " : "│   "));
    });
  };
  walk(root, "");
  return lines.join("\n");
};

const readPhotoDate = async (file) => {
  const fallback = (lat = null, lon = null) => {
    const d = new Date(file.lastModified);
    return { year: String(d.getFullYear()), month: String(d.getMonth() + 1).padStart(2, "0"), lat, lon };
  };
  const _ext = file.name.split(".").pop().toLowerCase();
  const _isJpegLike = file.type.startsWith("image/jpeg") || file.type.startsWith("image/tiff") ||
    _ext === "jpg" || _ext === "jpeg" || _ext === "tif" || _ext === "tiff";
  if (!_isJpegLike) return fallback();
  try {
    const buf = await file.slice(0, 262144).arrayBuffer();
    const v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return fallback();
    let pos = 2;
    while (pos + 4 <= buf.byteLength) {
      if (v.getUint8(pos) !== 0xFF) break;
      const marker = v.getUint16(pos); pos += 2;
      if (marker === 0xFFD9 || marker === 0xFFDA) break;
      const segLen = v.getUint16(pos);
      if (marker === 0xFFE1 && segLen > 8 &&
          v.getUint32(pos + 2) === 0x45786966 && v.getUint16(pos + 6) === 0x0000) {
        const tiff = pos + 8;
        const le = v.getUint16(tiff) === 0x4949;
        const u16 = (o) => v.getUint16(tiff + o, le);
        const u32 = (o) => v.getUint32(tiff + o, le);
        if (u16(2) !== 42) { pos += segLen; continue; }
        const readDate = (off) => {
          if (tiff + off + 19 > buf.byteLength) return null;
          const s = new TextDecoder("ascii").decode(new Uint8Array(buf, tiff + off, 19));
          return /^\d{4}:\d{2}/.test(s) ? { year: s.slice(0, 4), month: s.slice(5, 7) } : null;
        };
        const readRational3 = (off) => {
          if (tiff + off + 24 > buf.byteLength) return null;
          const r = (o) => { const n = u32(o), d = u32(o + 4); return d ? n / d : 0; };
          return r(off) + r(off + 8) / 60 + r(off + 16) / 3600;
        };
        const ifd0 = u32(4);
        const n0 = u16(ifd0);
        let exifOff = null, gpsOff = null, ifd0Date = null;
        for (let i = 0; i < n0 && i < 256; i++) {
          const e = ifd0 + 2 + i * 12;
          if (tiff + e + 12 > buf.byteLength) break;
          const tag = u16(e);
          if (tag === 0x8769) exifOff = u32(e + 8);
          else if (tag === 0x8825) gpsOff = u32(e + 8);
          else if (tag === 0x0132) ifd0Date = readDate(u32(e + 8));
        }
        // Parse Exif IFD for shot date
        let foundDate = null;
        if (exifOff != null && exifOff + 2 <= buf.byteLength - tiff) {
          const nExif = u16(exifOff);
          for (let i = 0; i < nExif && i < 256; i++) {
            const e = exifOff + 2 + i * 12;
            if (tiff + e + 12 > buf.byteLength) break;
            const tag = u16(e);
            if (tag === 0x9003 || tag === 0x9004) {
              foundDate = readDate(u32(e + 8));
              if (foundDate) break;
            }
          }
        }
        if (!foundDate) foundDate = ifd0Date;
        // Parse GPS IFD
        let lat = null, lon = null;
        if (gpsOff != null && tiff + gpsOff + 2 <= buf.byteLength) {
          const nGps = u16(gpsOff);
          let latRef = "N", lonRef = "E", latVal = null, lonVal = null;
          for (let i = 0; i < nGps && i < 32; i++) {
            const ge = gpsOff + 2 + i * 12;
            if (tiff + ge + 12 > buf.byteLength) break;
            const gtag = u16(ge);
            if (gtag === 0x0001) latRef = String.fromCharCode(v.getUint8(tiff + ge + 8));
            else if (gtag === 0x0003) lonRef = String.fromCharCode(v.getUint8(tiff + ge + 8));
            else if (gtag === 0x0002) latVal = readRational3(u32(ge + 8));
            else if (gtag === 0x0004) lonVal = readRational3(u32(ge + 8));
          }
          if (latVal != null && lonVal != null) {
            lat = latRef === "S" ? -latVal : latVal;
            lon = lonRef === "W" ? -lonVal : lonVal;
          }
        }
        if (foundDate) return { ...foundDate, lat, lon };
        return fallback(lat, lon);
      }
      pos += segLen;
    }
  } catch {}
  return fallback();
};

  // Documents: upload as multipart, retrieve as URL
  async saveDocument(doc) {
    // New uploads pass the original File directly via doc.file, so we can
    // post it as-is — no base64 round trip, which used to blow past browser
    // memory/string limits on large files (e.g. video). Re-saves of an
    // already-stored document (e.g. metadata edits) still come through as
    // doc.dataUrl pointing at the server URL, with no doc.file — those
    // fetch the existing bytes and re-post them, unchanged from before.
    // NOTE: do NOT use `new File(...)` here — our React `File` icon component
    // shadows the global File constructor in this scope. FormData accepts a
    // Blob/File plus filename argument, which works the same way.
    const form = new FormData();
    if (doc.file) {
      form.append("file", doc.file, doc.name);
    } else {
      const response = await fetch(doc.dataUrl);
      const blob = await response.blob();
      form.append("file", blob, doc.name);
    }
    form.append("doc_id", doc.id);
    const _nodeId = doc.originalNodeId || doc.nodeId;
    if (_nodeId) form.append("node_id", _nodeId);
    if (doc.routeMode) form.append("route_mode", doc.routeMode);
    if (doc.photoYear) form.append("photo_year", doc.photoYear);
    if (doc.photoMonth) form.append("photo_month", doc.photoMonth);
    if (doc.photoLat != null) form.append("photo_lat", String(doc.photoLat));
    if (doc.photoLon != null) form.append("photo_lon", String(doc.photoLon));
    if (doc.photoBaseNodeId) form.append("photo_base_node_id", doc.photoBaseNodeId);
    const res = await fetch(API_BASE + "/api/docs", { method: "POST", body: form });
    let resData = {};
    try { resData = await res.json(); } catch {}
    if (!res.ok) {
      throw new Error(`Upload failed: HTTP ${res.status} ${resData.error || ""}`);

    console.log(`[DMS] ✓ Uploaded ${doc.name} → ${resData.path || resData.filename}${resData.location ? ` [${resData.location}]` : ""}`);
    return resData;

// Kicks off deepface installation and polls until it settles, instead of waiting on a
// single long-lived fetch — installing deepface/TensorFlow can take several minutes,
// long enough that the server's own connection timeout would kill an in-flight request
// and surface as a bare "Failed to fetch" with no real error message.
// Resolves to { status: "done" } | { status: "error", error } |
// { status: "needs_python312", message, downloadUrl }.
const installDeepfaceAndWait = async () => {
  await fetch("/api/install-deepface", { method: "POST" });
  while (true) {
    await new Promise((r) => setTimeout(r, 2000));
    const res = await fetch("/api/install-deepface/status");
    const data = await res.json();
    if (data.status !== "running") return data;
  }
};

const genDocId = () => {
  const d = new Date();
  const ymd =
    d.getFullYear().toString() +
    String(d.getMonth() + 1).padStart(2, "0") +
    String(d.getDate()).padStart(2, "0");
  const rand = Math.random().toString(36).slice(2, 8).toUpperCase();
  return `DOC-${ymd}-${rand}`;
};

const computeFileHash = async (file) => {
  const buf = await file.arrayBuffer();
  const hashBuf = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hashBuf)).map((b) => b.toString(16).padStart(2, "0")).join("");
};

const genNodeId = () => {
  const rand = Math.random().toString(36).slice(2, 8).toUpperCase();
  return `NODE-${rand}`;
};

/* =============================================================================
 * TREE OPERATIONS
 * =============================================================================
 */
const findNode = (root, nodeId) => {
  if (!root) return null;
  if (root.id === nodeId) return root;
  for (const child of root.children || []) {
    const found = findNode(child, nodeId);
    if (found) return found;
  }
  return null;
};

const findParentNode = (root, nodeId) => {
  if (!root) return null;
  for (const child of root.children || []) {
    if (child.id === nodeId) return root;
    const found = findParentNode(child, nodeId);
    if (found) return found;
  }
  return null;
};

const findNodeByName = (root, name) => {
  if (!root) return null;
  if (name.includes("/")) {
    // Path-qualified: walk down from root's children (root name not included in path)
    const parts = name.split("/").map(p => p.trim()).filter(Boolean);
    // Try matching from root's children first; if first part matches root, skip it
    const startChildren = (parts[0] === root.name)
      ? (root.children || [])
      : [root];
    const walk = (nodes, depth) => {
      if (depth >= parts.length) return null;
      for (const n of nodes) {
        if (n.name === parts[depth]) {
          if (depth === parts.length - 1) return n;
          const found = walk(n.children || [], depth + 1);
          if (found) return found;
        }
      }
      return null;
    };
    return walk(startChildren, parts[0] === root.name ? 1 : 0);
  }
  // Bare name: first global match
  if (root.name === name) return root;
  for (const child of root.children || []) {
    const found = findNodeByName(child, name);
    if (found) return found;
  }
  return null;
};

const collectAllDocIds = (node, acc = []) => {
  if (!node) return acc;
  (node.documents || []).forEach((d) => acc.push(d.id));
  (node.children || []).forEach((c) => collectAllDocIds(c, acc));
  return acc;
};

// Due-date urgency tiers for the "日程" (Schedule) color-coding mode.
// red: due within 1 day or overdue · yellow: within 1 week · blue: within 2 weeks.
// Colors were deliberately picked from very different hues (not a red→yellow
// ramp) since adjacent-hue tiers (e.g. red vs. orange) were hard to tell apart.
const urgencyTier = (dueDateStr) => {
  if (!dueDateStr) return null;
  const days = Math.ceil((new Date(dueDateStr + "T23:59:59") - new Date()) / 86400000);
  if (days <= 1) return "red";
  if (days <= 7) return "yellow";
  if (days <= 14) return "blue";
  return null;
};

const collectNodeIds = (node, acc = new Set()) => {
  if (!node) return acc;
  acc.add(node.id);
  (node.children || []).forEach((c) => collectNodeIds(c, acc));
  return acc;
};

// Replays additions made to `workingTree` (relative to `baseTree`) onto
// `freshTree`. Long-running operations (e.g. uploading thousands of files)
// hold a `tree` snapshot in memory for the whole run and only build new
// folders/documents on top of it; if the operation persists that snapshot
// wholesale at the end, it silently wipes out any concurrent edits (like a
// folder the user created by hand mid-upload) that had already been saved to
// the server. This merges in only what the operation actually added — new
// child nodes and new document references — so unrelated concurrent edits
// already present in `freshTree` are preserved.
const mergeTreeAdditions = (baseTree, workingTree, freshTree) => {
  if (!workingTree || !freshTree) return freshTree;
  const baseIds = collectNodeIds(baseTree);
  let result = freshTree;

  const mergeDocs = (workingNode, targetId) => {
    const target = findNode(result, targetId);
    if (!target) return;
    const existingDocIds = new Set((target.documents || []).map((d) => d.id));
    const newDocs = (workingNode.documents || []).filter((d) => !existingDocIds.has(d.id));
    if (newDocs.length) {
      result = updateNodeInTree(result, targetId, (n) => ({
        ...n, documents: [...(n.documents || []), ...newDocs],
      }));
    }
  };

  // freshParentId is the id, *in `result`*, that workingNode's parent was
  // ultimately merged into. It's threaded explicitly through the recursion
  // (rather than re-derived from workingNode's own possibly-never-persisted
  // id) so that a name-collision merge partway down the tree still lets
  // deeper new nodes attach in the right place.
  const walk = (workingNode, freshParentId) => {
    let targetId;
    if (baseIds.has(workingNode.id)) {
      // Node existed before this operation started — must still be present.
      if (!findNode(result, workingNode.id)) return;
      targetId = workingNode.id;
    } else if (freshParentId != null) {
      const parentInResult = findNode(result, freshParentId);
      if (!parentInResult) return;
      const sibling = (parentInResult.children || []).find((c) => c.name === workingNode.name);
      if (sibling) {
        // Same-named folder already exists (created concurrently elsewhere,
        // or by an earlier checkpoint) — merge into it instead of silently
        // dropping this node's documents/children on the floor.
        targetId = sibling.id;
      } else {
        // First time this node is being persisted — splice the whole
        // subtree (documents/children already on it) in one shot.
        result = updateNodeInTree(result, freshParentId, (n) => {
          const sorted = [...(n.children || []), workingNode].sort((a, b) => {
            const na = parseInt(a.name, 10), nb = parseInt(b.name, 10);
            if (!isNaN(na) && !isNaN(nb)) return na - nb;
            return a.name.localeCompare(b.name);
          });
          return { ...n, children: sorted };
        });
        return; // subtree included wholesale via the splice above
      }
    } else {
      return;
    }

    mergeDocs(workingNode, targetId);
    (workingNode.children || []).forEach((c) => walk(c, targetId));
  };

  walk(workingTree, null);
  return result;
};

const updateNodeInTree = (root, nodeId, updater) => {
  if (root.id === nodeId) return updater(root);
  return {
    ...root,
    children: (root.children || []).map((c) =>
      updateNodeInTree(c, nodeId, updater)
    ),
  };
};

const removeNodeFromTree = (root, nodeId) => {
  return {
    ...root,
    children: (root.children || [])
      .filter((c) => c.id !== nodeId)
      .map((c) => removeNodeFromTree(c, nodeId)),
  };
};

const moveNodeInTree = (root, nodeId, direction) => {
  const children = root.children || [];
  const idx = children.findIndex((c) => c.id === nodeId);
  if (idx !== -1) {
    const next = [...children];
    const swap = direction === "up" ? idx - 1 : idx + 1;
    if (swap >= 0 && swap < next.length) [next[idx], next[swap]] = [next[swap], next[idx]];
    return { ...root, children: next };
  }
  return { ...root, children: children.map((c) => moveNodeInTree(c, nodeId, direction)) };
};

const moveNodeToPosition = (root, dragId, targetId, position) => {
  const dragged = findNode(root, dragId);
  if (!dragged || dragId === targetId) return root;
  if (findNode(dragged, targetId)) return root; // can't drop into own descendant
  let next = removeNodeFromTree(root, dragId);
  if (position === "into") {
    next = updateNodeInTree(next, targetId, (n) => ({
      ...n, children: [...(n.children || []), dragged],
    }));
  } else {
    const insertAround = (node) => {
      const ch = node.children || [];
      const idx = ch.findIndex((c) => c.id === targetId);
      if (idx !== -1) {
        const at = position === "before" ? idx : idx + 1;
        const arr = [...ch];
        arr.splice(at, 0, dragged);
        return { ...node, children: arr };
      }
      return { ...node, children: ch.map(insertAround) };
    };
    next = insertAround(next);
  }
  return next;
};

// Deep-merge `dragged` node into `existing` node (same name).
// Returns { mergedNode, docRemap: Map<docId, newNodeId> } where docRemap
// holds every doc whose originalNodeId must be updated in the index.
const mergeNodesDeep = (existing, dragged) => {
  const docRemap = new Map();

  // dragged's direct documents move to existing
  const existingDocIds = new Set((existing.documents || []).map((d) => d.id));
  for (const d of (dragged.documents || [])) docRemap.set(d.id, existing.id);
  const addedDocs = (dragged.documents || []).filter((d) => !existingDocIds.has(d.id));

  // Merge children: recurse on name conflicts, append the rest
  const mergedChildren = [...(existing.children || [])];
  for (const dc of (dragged.children || [])) {
    const conflictIdx = mergedChildren.findIndex((c) => c.name === dc.name);
    if (conflictIdx >= 0) {
      const { mergedNode, docRemap: childRemap } = mergeNodesDeep(mergedChildren[conflictIdx], dc);
      mergedChildren[conflictIdx] = mergedNode;
      for (const [docId, nodeId] of childRemap) docRemap.set(docId, nodeId);
    } else {
      mergedChildren.push(dc);
    }
  }

  return {
    mergedNode: {
      ...existing,
      documents: [...(existing.documents || []), ...addedDocs],
      children: mergedChildren,
    },
    docRemap,
  };
};

/* =============================================================================
 * UI: TREE NODE
 * =============================================================================
 */
const TreeNode = ({
  node, depth, selectedId, expandedIds, isRoot,
  siblingIndex, siblingCount, parentLines,
  renamingId, addingChildToId,
  photoRootNodeId,
  scheduleMode, urgencyMap,
  onToggle, onSelect,
  onStartRename, onCommitRename, onCancelRename,
  onStartAddChild, onCommitAddChild, onCancelAddChild,
  onDelete, onMoveNode, onContextMenu, onUploadToNode, onFileDrop,
  draggingId, dropInfo, onDragStart, onDragOver, onDragEnd, onDrop,
}) => {
  const { t } = useLang();
  const isExpanded = expandedIds.has(node.id);
  const isSelected = selectedId === node.id;
  const isRenaming = renamingId === node.id;
  const isAddingChild = addingChildToId === node.id;
  const hasChildren = (node.children || []).length > 0;
  const docCount = (node.documents || []).length;
  const isLast = siblingIndex === siblingCount - 1;
  const isPhotoRoot = node.id === photoRootNodeId;
  const isRecycleBin = node.name === "Not Show in Tree";
  const currentParentLines = parentLines || [];
  const isDragging = draggingId === node.id;
  const isDropTarget = dropInfo?.targetId === node.id;
  const dropPosition = isDropTarget ? dropInfo.position : null;
  const [isFileDragOver, setIsFileDragOver] = useState(false);

  const [draftName, setDraftName] = useState(node.name);
  const [newChildName, setNewChildName] = useState("");
  const newChildInputRef = useRef(null);

  useEffect(() => { if (isRenaming) setDraftName(node.name); }, [isRenaming, node.name]);
  useEffect(() => {
    if (isAddingChild) {
      setNewChildName("");
      setTimeout(() => newChildInputRef.current?.focus(), 0);
    }
  }, [isAddingChild]);

  const commitRename = () => {
    const trimmed = draftName.trim();
    if (trimmed && trimmed !== node.name) onCommitRename(node.id, trimmed);
    else onCancelRename();
  };

  const commitAddChild = () => {
    const trimmed = newChildName.trim();
    if (trimmed) onCommitAddChild(node.id, trimmed);
    else onCancelAddChild();
  };

  return (
    <div>
      <div
        draggable={!isRoot}
        onClick={() => !isRenaming && onSelect(node.id)}
        onDoubleClick={(e) => { e.stopPropagation(); onStartRename(node.id); }}
        onContextMenu={(e) => {
          e.preventDefault();
          onSelect(node.id);
          onContextMenu(e.clientX, e.clientY, node.id);
        }}
        onDragStart={(e) => {
          if (isRoot) return;
          e.stopPropagation();
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", node.id);
          onDragStart(node.id);
        }}
        onDragOver={(e) => {
          e.preventDefault();
          e.stopPropagation();
          if (e.dataTransfer.types.includes("Files")) {
            setIsFileDragOver(true);
            e.dataTransfer.dropEffect = "copy";
          } else {
            const rect = e.currentTarget.getBoundingClientRect();
            const y = e.clientY - rect.top;
            const h = rect.height;
            const pos = isRoot ? "into" : (y < h * 0.3 ? "before" : y > h * 0.7 ? "after" : "into");
            onDragOver(node.id, pos);
            e.dataTransfer.dropEffect = "move";
          }
        }}
        onDragLeave={(e) => {
          if (!e.currentTarget.contains(e.relatedTarget)) {
            setIsFileDragOver(false);
            onDragOver(null, null);
          }
        }}
        onDrop={(e) => {
          e.preventDefault();
          e.stopPropagation();
          setIsFileDragOver(false);
          if (e.dataTransfer.files.length !== 0) {
            onFileDrop(node.id, e.dataTransfer.files);
          } else {
            onDrop();
          }
        }}
        onDragEnd={() => onDragEnd()}
        className={`group relative flex items-center gap-1.5 py-1.5 px-2 cursor-pointer text-sm border-l-2 transition-colors ${
          isDragging ? "opacity-40" :
          isFileDragOver ? "bg-amber-100 border-amber-500 text-stone-900" :
          isDropTarget && dropPosition === "into" ? "bg-blue-50 border-blue-400 text-stone-900" :
          isSelected ? "bg-amber-200 border-amber-600 text-stone-900 font-medium" :
          scheduleMode && urgencyMap && urgencyMap.get(node.id)
            ? `${URGENCY_ROW_CLASSES[urgencyMap.get(node.id)]} font-medium`
            : "border-transparent text-stone-700 hover:bg-stone-100"
        }`}
      >
        {isDropTarget && dropPosition === "before" && (
          <div className="absolute top-0 left-0 right-0 h-0.5 bg-blue-500 z-10 pointer-events-none" />
        )}
        {isDropTarget && dropPosition === "after" && (
          <div className="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-500 z-10 pointer-events-none" />
        )}
        {!isRoot && (
          <>
            <div aria-hidden="true" style={{position:"absolute",top:0,bottom:0,left:8,width:(currentParentLines.length+1)*16+22,pointerEvents:"none"}}>
              {currentParentLines.map((hasLine, i) => hasLine ? (
                <div key={i} style={{position:"absolute",top:0,bottom:0,left:i*16,width:1,background:"#94a3b8"}} />
              ) : null)}
              <div style={{position:"absolute",top:0,height:"50%",left:currentParentLines.length*16,width:1,background:"#94a3b8"}} />
              {!isLast && <div style={{position:"absolute",top:"50%",bottom:0,left:currentParentLines.length*16,width:1,background:"#94a3b8"}} />}
              <div style={{position:"absolute",top:"50%",left:currentParentLines.length*16,width:22,height:1,background:"#94a3b8"}} />
            </div>
            <div aria-hidden="true" style={{width:(currentParentLines.length+1)*16,flexShrink:0}} />
          </>
        )}
        <span
          onClick={(e) => { e.stopPropagation(); if (hasChildren) onToggle(node.id); }}
          className="w-4 flex items-center justify-center"
        >
          {hasChildren ? (
            isExpanded ? <ChevronDown size={14} /> : <ChevronRight size={14} />
          ) : <span className="w-3.5" />}
        </span>
        {isRecycleBin ? (
          <Trash2 size={15} className="text-stone-400 shrink-0" />
        ) : isExpanded && hasChildren ? (
          <FolderOpen size={15} className="text-amber-700 shrink-0" />
        ) : (
          <Folder size={15} className="text-amber-700 shrink-0" />
        )}

        {isRenaming ? (
          <input
            autoFocus
            type="text"
            value={draftName}
            onChange={(e) => setDraftName(e.target.value)}
            onClick={(e) => e.stopPropagation()}
            onBlur={commitRename}
            onKeyDown={(e) => {
              if (e.key === "Enter") commitRename();
              if (e.key === "Escape") onCancelRename();
            }}
            className="flex-1 text-sm px-1 py-0 border border-amber-500 rounded bg-white text-stone-900 focus:outline-none"
          />
        ) : (
          <span className={`truncate flex-1 ${isRecycleBin ? "italic text-stone-400" : ""}`} title={isRecycleBin ? t("已删除文件暂存于此 · 在此处删除则永久清除", "Deleted files are held here · deleting here erases them permanently") : t("双击重命名", "Double-click to rename")}>
            {isRecycleBin ? t("已删除文件 (Not Show in Tree)", "Deleted files (not shown in tree)") : node.name}
            {isPhotoRoot && (
              <Camera size={11} className="inline ml-1.5 text-amber-600 shrink-0" title={t("照片根目录", "Photo root folder")} />
            )}
            {node.sn && (
              <span className="ml-1.5 text-[10px] text-amber-700 font-mono">· {node.sn}</span>
            )}
            {docCount > 0 && (
              <span className={`ml-1.5 text-[10px] ${isRecycleBin ? "text-stone-400" : "text-stone-500"}`}>{t(`(${docCount} 份文档)`, `(${docCount} docs)`)}</span>
            )}
          </span>
        )}

        {!isRenaming && (
          <>
            <div className={`${isSelected ? "flex" : "hidden group-hover:flex"} items-center gap-0.5 ml-1`}>
              <button
                onClick={(e) => { e.stopPropagation(); onStartAddChild(node.id); }}
                title={t("新建子文件夹", "New subfolder")}
                className="text-stone-500 hover:text-amber-700 p-0.5 rounded hover:bg-white"
              >
                <Plus size={12} />
              </button>
              <label
                onClick={(e) => e.stopPropagation()}
                title={t("上传文档到此文件夹", "Upload documents to this folder")}
                className="text-stone-500 hover:text-amber-700 p-0.5 rounded hover:bg-white cursor-pointer"
              >
                <Upload size={12} />
                <input
                  type="file"
                  multiple
                  className="hidden"
                  onChange={(e) => onUploadToNode(node.id, e)}
                />
              </label>
              {!isRoot && siblingIndex > 0 && (
                <button
                  onClick={(e) => { e.stopPropagation(); onSelect(node.id); onMoveNode(node.id, "up"); }}
                  title={t("上移", "Move up")}
                  className="text-stone-500 hover:text-amber-700 p-0.5 rounded hover:bg-white"
                >
                  <ChevronUp size={12} />
                </button>
              )}
              {!isRoot && siblingIndex < siblingCount - 1 && (
                <button
                  onClick={(e) => { e.stopPropagation(); onSelect(node.id); onMoveNode(node.id, "down"); }}
                  title={t("下移", "Move down")}
                  className="text-stone-500 hover:text-amber-700 p-0.5 rounded hover:bg-white"
                >
                  <ChevronDown size={12} />
                </button>
              )}
              {!isRoot && (
                <button
                  onClick={(e) => { e.stopPropagation(); onDelete(node.id); }}
                  title={t("删除节点", "Delete node")}
                  className="text-stone-500 hover:text-red-600 p-0.5 rounded hover:bg-white"
                >
                  <Trash2 size={12} />
                </button>
              )}
            </div>
          </>
        )}
      </div>

      {isAddingChild && (
        <div className="relative flex items-center gap-1.5 py-1 px-2">
          <div aria-hidden="true" style={{position:"absolute",top:0,bottom:0,left:8,width:(isRoot?0:(currentParentLines.length+1))*16+22,pointerEvents:"none"}}>
            {(isRoot?[]:[...currentParentLines,!isLast]).map((hasLine,i) => hasLine ? (
              <div key={i} style={{position:"absolute",top:0,bottom:0,left:i*16,width:1,background:"#94a3b8"}} />
            ) : null)}
            <div style={{position:"absolute",top:0,height:"50%",left:(isRoot?0:(currentParentLines.length+1))*16,width:1,background:"#94a3b8"}} />
            <div style={{position:"absolute",top:"50%",left:(isRoot?0:(currentParentLines.length+1))*16,width:22,height:1,background:"#94a3b8"}} />
          </div>
          <div aria-hidden="true" style={{width:(isRoot?0:(currentParentLines.length+1))*16+16,flexShrink:0}} />
          <span className="w-4" />
          <Folder size={15} className="text-amber-400 shrink-0" />
          <input
            ref={newChildInputRef}
            type="text"
            value={newChildName}
            placeholder={t("新文件夹 / 子组件名称…", "New folder / sub-component name…")}
            onChange={(e) => setNewChildName(e.target.value)}
            onClick={(e) => e.stopPropagation()}
            onBlur={commitAddChild}
            onKeyDown={(e) => {
              if (e.key === "Enter") commitAddChild();
              if (e.key === "Escape") onCancelAddChild();
            }}
            className="flex-1 text-sm px-1 py-0 border border-amber-500 rounded bg-white text-stone-900 focus:outline-none"
          />
        </div>
      )}

      {isExpanded && (node.children || []).map((child, i) => (
        <TreeNode
          key={child.id}
          node={child}
          depth={depth + 1}
          selectedId={selectedId}
          expandedIds={expandedIds}
          isRoot={false}
          siblingIndex={i}
          siblingCount={(node.children || []).length}
          parentLines={isRoot ? [] : [...currentParentLines, !isLast]}
          renamingId={renamingId}
          addingChildToId={addingChildToId}
          photoRootNodeId={photoRootNodeId}
          scheduleMode={scheduleMode}
          urgencyMap={urgencyMap}
          onToggle={onToggle}
          onSelect={onSelect}
          onStartRename={onStartRename}
          onCommitRename={onCommitRename}
          onCancelRename={onCancelRename}
          onStartAddChild={onStartAddChild}
          onCommitAddChild={onCommitAddChild}
          onCancelAddChild={onCancelAddChild}
          onDelete={onDelete}
          onMoveNode={onMoveNode}
          onContextMenu={onContextMenu}
          onUploadToNode={onUploadToNode}
          onFileDrop={onFileDrop}
          draggingId={draggingId}
          dropInfo={dropInfo}
          onDragStart={onDragStart}
          onDragOver={onDragOver}
          onDragEnd={onDragEnd}
          onDrop={onDrop}
        />
      ))}
    </div>
  );
};

/* =============================================================================

const ContextMenu = ({
  x, y, isRoot, nodeName, isPhotoRoot, isDateFolder,
  onClose, onRename, onAddChild, onUpload, onDelete,
  onSetPhotoRoot, onClearPhotoRoot,
}) => {
  const { t } = useLang();
  useEffect(() => {
    const close = () => onClose();
    window.addEventListener("click", close);
    window.addEventListener("scroll", close, true);

      window.removeEventListener("click", close);

  return (
    <div
      style={{ position: "fixed", left: x, top: y, zIndex: 60 }}

        onClick={() => { onUpload(); onClose(); }}
        className="w-full text-left px-3 py-1.5 hover:bg-amber-50 flex items-center gap-2 text-stone-700"

      <div className="border-t border-stone-200 my-1" />
      <button
        onClick={() => { onRename(); onClose(); }}
        className="w-full text-left px-3 py-1.5 hover:bg-amber-50 flex items-center gap-2 text-stone-700"
      >
        <Edit2 size={13} /> {t("重命名", "Rename")}
      </button>
      {!isDateFolder && (
        <>
          <div className="border-t border-stone-200 my-1" />
          {isPhotoRoot ? (
            <button
              onClick={() => { onClearPhotoRoot(); onClose(); }}
              className="w-full text-left px-3 py-1.5 hover:bg-amber-50 flex items-center gap-2 text-amber-700"

              <Camera size={13} /> {t("取消照片根目录", "Unset photo root folder")}
            </button>
          ) : (
            <button
              onClick={() => { onSetPhotoRoot(); onClose(); }}
              className="w-full text-left px-3 py-1.5 hover:bg-amber-50 flex items-center gap-2 text-stone-700"

              <Camera size={13} /> {t("设为照片根目录", "Set as photo root folder")}
            </button>

      {!isRoot && (
        <>
          <div className="border-t border-stone-200 my-1" />
          <button
            onClick={() => { onDelete(); onClose(); }}
            className="w-full text-left px-3 py-1.5 hover:bg-red-50 flex items-center gap-2 text-red-600"
          >
            <Trash2 size={13} /> {t("删除文件夹", "Delete folder")}
          </button>
        </>
      )}
    </div>
  );

/* =============================================================================
 * UI: DOCUMENT VIEWER
 * =============================================================================
 */
const DocumentViewer = ({ doc, onClose, onSaveOcr, keyParameters = [], onAddKeyParameter, onSaveLocalParams, onSaveParams, onSaveDescription, onOpenAISettings }) => {
  const { t } = useLang();
  const isImage = doc?.mime?.startsWith("image/");
  const isPdf = doc?.mime === "application/pdf";
  const isText = doc?.mime?.startsWith("text/") || doc?.mime === "application/json";
  const ocrEligible = isImage || isPdf;

  // HEIC/HEIF files need server-side conversion to be viewable in the browser
  const _ext = (doc?.name || "").split(".").pop().toLowerCase();
  const isHeic = doc?.mime === "image/heic" || doc?.mime === "image/heif"
    || _ext === "heic" || _ext === "heif";
  const viewUrl = isHeic
    ? `${API_BASE}/api/docs/${doc.id}/preview`
    : doc?.dataUrl;

  const [imgLoadError, setImgLoadError] = useState(false);

  // OCR state
  const [ocrStatus, setOcrStatus] = useState(null);   // capability report
  const [ocrRunning, setOcrRunning] = useState(false);
  const [ocrText, setOcrText] = useState("");
  const [ocrInfo, setOcrInfo] = useState(null);
  const [ocrHint, setOcrHint] = useState("");
  const [ocrError, setOcrError] = useState("");
  // Side panel: null (closed) | "text" (OCR text) | "keys" (key-param extract) | "desc" (description)
  const [panelMode, setPanelMode] = useState(null);
  const [copied, setCopied] = useState(false);
  const [saved, setSaved] = useState(false);

  // Description / caption state
  const [description, setDescription] = useState("");
  const [descSaved, setDescSaved] = useState(false);

  // Voice-to-text dictation for the description field (Web Speech API).
  const [voiceLang, setVoiceLang] = useState("zh-CN");
  const [listening, setListening] = useState(false);
  const [voiceInterim, setVoiceInterim] = useState("");
  const [voiceError, setVoiceError] = useState("");
  const recognitionRef = useRef(null);
  const SpeechRecognitionCtor = typeof window !== "undefined"
    ? (window.SpeechRecognition || window.webkitSpeechRecognition)
    : null;
  const voiceSupported = !!SpeechRecognitionCtor;

  // Preferred online map provider for "view on map" (persisted across docs/sessions —
  // Google Maps is often unreachable in mainland China, so this is user-switchable).
  const [mapProvider, setMapProvider] = useState(() => {
    try { return localStorage.getItem("dms_map_provider") || DEFAULT_MAP_PROVIDER; }
    catch { return DEFAULT_MAP_PROVIDER; }
  });
  const changeMapProvider = (id) => {
    setMapProvider(id);
    try { localStorage.setItem("dms_map_provider", id); } catch {}
  };

  // Key-parameter extraction state
  const [localKeys, setLocalKeys] = useState([]);         // per-doc added keys
  const [selectedKeys, setSelectedKeys] = useState([]);   // which to extract
  const [newKeyInput, setNewKeyInput] = useState("");     // add-new box
  const [sameLineOnly, setSameLineOnly] = useState(true); // #4: same line default
  const [keyRows, setKeyRows] = useState(null);           // [{key, value, unit, description, found}]
  const [keyRunning, setKeyRunning] = useState(false);
  const [keyError, setKeyError] = useState("");
  const [keyHint, setKeyHint] = useState("");
  const [keyDiag, setKeyDiag] = useState(null);           // {charCount, preview,...}
  const [paramsSaved, setParamsSaved] = useState(false);
  const [useAI, setUseAI] = useState(false);               // opt-in Gemini extraction
  const [aiSettings, setAiSettings] = useState({ configured: false, library_installed: true });

  useEffect(() => {
    // Re-fetch whenever the extraction panel opens (not just on first mount)
    // so a key saved via the settings dialog is picked up without a reload.
    if (panelMode === "keys") {
      StorageAdapter.getAISettings().then(setAiSettings).catch(() => {});
    }
  }, [panelMode]);

  const panelOpen = panelMode !== null;

  // Global parameters (from the shared list) vs. this document's local adds.
  const globalKeys = useMemo(() => normalizeKeyParameters(keyParameters), [keyParameters]);
  const globalSet = useMemo(() => new Set(globalKeys.map((k) => k.toLowerCase())), [globalKeys]);
  // A key is "local" (deletable here) only if it's NOT a global parameter.
  const localOnlyKeys = useMemo(
    () => localKeys.filter((k) => !globalSet.has(k.toLowerCase())),
    [localKeys, globalSet]
  );
  // Display order: global parameters first, then this document's local adds.
  const availableKeys = useMemo(
    () => [...globalKeys, ...localOnlyKeys],
    [globalKeys, localOnlyKeys]
  );

  // Reset per-document and seed with any previously-saved OCR text.
  useEffect(() => {
    if (!doc) return;
    setOcrText(doc.ocrText || "");
    setOcrInfo(null); setOcrHint(""); setOcrError("");
    setPanelMode(doc.ocrText ? "text" : null);
    setCopied(false); setSaved(false);
    setImgLoadError(false);
    setDescription(doc.description || ""); setDescSaved(false);
    setVoiceInterim(""); setVoiceError(""); setListening(false);
    // Load this document's locally-added parameters; select NONE by default
    // (request: user explicitly picks what to extract for each document).
    setLocalKeys(normalizeKeyParameters(doc.localKeyParams || []));
    setSelectedKeys([]);
    setNewKeyInput(""); setSameLineOnly(true);
    setKeyRows(null); setKeyError(""); setKeyHint(""); setKeyDiag(null); setParamsSaved(false);
    // Stop any dictation still running from the previously-open document.
    return () => { try { recognitionRef.current && recognitionRef.current.stop(); } catch {} };
  }, [doc?.id]);

  // Probe OCR capability once when a viewer opens on an eligible file.
  useEffect(() => {
    if (!doc || !ocrEligible) return;
    let alive = true;
    StorageAdapter.ocrStatus().then((s) => { if (alive) setOcrStatus(s); });
    return () => { alive = false; };
  }, [doc?.id]);

  // For non-image types (PDF, text), verify the file exists via HEAD request.
  useEffect(() => {
    if (!doc || isImage) return;
    let alive = true;
    fetch(doc.dataUrl, { method: "HEAD" })
      .then((r) => { if (alive && !r.ok) setImgLoadError(true); })
      .catch(() => { if (alive) setImgLoadError(true); });
    return () => { alive = false; };
  }, [doc?.id]);

  if (!doc) return null;

  const runOcr = async ({ force = false } = {}) => {
    setOcrRunning(true); setOcrError(""); setOcrHint(""); setSaved(false);
    setPanelMode("text");
    try {
      const r = await StorageAdapter.runOcr(doc.id, { force });
      setOcrText(r.text || "");
      setOcrInfo(r.info || null);
      setOcrHint(r.hint || "");
    } catch (e) {
      setOcrError(e.message || String(e));
    } finally {
      setOcrRunning(false);
    }
  };

  const copyText = async () => {
    try {
      await navigator.clipboard.writeText(ocrText);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch {/* clipboard may be blocked; ignore */}
  };

  const saveText = async () => {
    if (!onSaveOcr) return;
    await onSaveOcr(doc.id, ocrText);
    setSaved(true);
    setTimeout(() => setSaved(false), 1800);
  };

  const saveDescription = async () => {
    if (!onSaveDescription) return;
    await onSaveDescription(doc.id, description);
    setDescSaved(true);
    setTimeout(() => setDescSaved(false), 1800);
  };

  // --- Voice-to-text dictation (description field) ---------------------------
  const stopListening = () => {
    try { recognitionRef.current && recognitionRef.current.stop(); } catch {}
  };

  const startListening = (lang) => {
    if (!SpeechRecognitionCtor) return;
    stopListening();
    const recognition = new SpeechRecognitionCtor();
    recognition.lang = lang;
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
      let finalChunk = "";
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        if (result.isFinal) finalChunk += result[0].transcript;
        else interim += result[0].transcript;
      }
      if (finalChunk) {
        setDescription((prev) => {
          const needsSpace = prev && !/[\s\n]$/.test(prev);
          return prev + (needsSpace ? " " : "") + finalChunk.trim();
        });
        setDescSaved(false);
      }
      setVoiceInterim(interim);
    };
    recognition.onerror = (event) => {
      setVoiceError(
        event.error === "not-allowed" ? t("麦克风权限被拒绝，请在浏览器设置中允许访问麦克风", "Microphone access denied — please allow microphone access in your browser settings")
        : event.error === "no-speech" ? t("未检测到语音，请再试一次", "No speech detected, please try again")
        : t(`语音识别出错：${event.error}`, `Speech recognition error: ${event.error}`)
      );
      setListening(false);
      setVoiceInterim("");
    };
    recognition.onend = () => {
      setListening(false);
      setVoiceInterim("");
    };

    recognitionRef.current = recognition;
    setVoiceError("");
    setVoiceInterim("");
    try {
      recognition.start();
      setListening(true);
    } catch {
      setListening(false);
    }
  };

  const toggleListening = () => {
    if (listening) { stopListening(); return; }
    startListening(voiceLang);
  };

  // --- Key-parameter extraction ---------------------------------------------
  const toggleKey = (key) => {
    setSelectedKeys((prev) =>
      prev.some((k) => k === key) ? prev.filter((k) => k !== key) : [...prev, key]);
  };
  const selectAllKeys = () => setSelectedKeys(availableKeys.slice());
  const selectNoneKeys = () => setSelectedKeys([]);

  // Add a new parameter under THIS document (local to the document, kept out
  // of the global list). It's persisted with the document and is deletable
  // here. If the typed name is already a global parameter, we just select it.
  const addNewKey = async () => {
    const clean = newKeyInput.trim();
    if (!clean) return;
    const existing = availableKeys.find((k) => k.toLowerCase() === clean.toLowerCase());
    const finalKey = existing || clean;
    const isGlobal = globalSet.has(finalKey.toLowerCase());
    if (!existing && !isGlobal) {
      const nextLocal = [...localKeys, finalKey];
      setLocalKeys(nextLocal);
      if (onSaveLocalParams) {
        try { await onSaveLocalParams(doc.id, nextLocal); } catch (e) { /* non-fatal */ }
      }
    }
    setSelectedKeys((prev) =>
      prev.some((k) => k.toLowerCase() === finalKey.toLowerCase()) ? prev : [...prev, finalKey]);
    setNewKeyInput("");
  };

  // Delete a document-local parameter (only locals, never global ones).
  const deleteLocalKey = async (key) => {
    if (globalSet.has(key.toLowerCase())) return;   // safety: never delete globals
    const nextLocal = localKeys.filter((k) => k.toLowerCase() !== key.toLowerCase());
    setLocalKeys(nextLocal);
    setSelectedKeys((prev) => prev.filter((k) => k.toLowerCase() !== key.toLowerCase()));
    if (onSaveLocalParams) {
      try { await onSaveLocalParams(doc.id, nextLocal); } catch (e) { /* non-fatal */ }
    }
  };

  const runExtract = async ({ force = false } = {}) => {
    const keys = selectedKeys.filter(Boolean);
    if (!keys.length) { setKeyError(t("请至少选择一个要提取的参数。", "Select at least one parameter to extract.")); return; }
    setKeyRunning(true); setKeyError(""); setKeyHint(""); setParamsSaved(false);
    try {
      // If OCR text is loaded (and possibly user-corrected), extract from it;
      // otherwise the server reads the file directly.
      const useText = ocrText && ocrText.trim() ? ocrText : null;
      const r = await StorageAdapter.extractKeys(doc.id, keys, { force, text: useText, sameLineOnly });
      // r.results may contain more entries than `keys`: a key found more than
      // once in the document comes back as "Key", "Key01", "Key02", ... (one
      // row per occurrence) -- include all of them, not just the originally
      // requested names, so repeated values are all shown and saved. Each
      // result is already split server-side into value/unit/description.
      const rows = Object.keys(r.results || {}).map((k) => {
        const res = r.results[k] || {};
        return {
          key: k,
          value: res.value || "",
          unit: res.unit || "",
          description: res.description || "",
          found: !!res.found,
        };
      });
      setKeyRows(rows);
      setKeyHint(r.hint || "");
      setKeyDiag({
        charCount: r.text_char_count || 0,
        preview: r.text_preview || "",
        foundCount: r.found_count || 0,
        usedText: !!useText,
        forced: force,
      });
    } catch (e) {
      setKeyError(e.message || String(e));
    } finally {
      setKeyRunning(false);
    }
  };

  // AI-assisted extraction (Gemini, opt-in): sends page images directly to
  // a multimodal model instead of regex-matching OCR text.
  const runExtractAI = async () => {
    const keys = selectedKeys.filter(Boolean);
    if (!keys.length) { setKeyError(t("请至少选择一个要提取的参数。", "Select at least one parameter to extract.")); return; }
    setKeyRunning(true); setKeyError(""); setKeyHint(""); setKeyDiag(null); setParamsSaved(false);
    try {
      const r = await StorageAdapter.extractKeysAI(doc.id, keys);
      const rows = Object.keys(r.results || {}).map((k) => {
        const res = r.results[k] || {};
        return {
          key: k,
          value: res.value || "",
          unit: res.unit || "",
          description: res.description || "",
          found: !!res.found,
        };
      });
      setKeyRows(rows);
      setKeyHint(r.pages_used ? t(`AI 已读取 ${r.pages_used} 页文档图像进行识别。`, `AI read ${r.pages_used} page image(s) of the document for recognition.`) : "");
    } catch (e) {
      setKeyError(e.message || String(e));
    } finally {
      setKeyRunning(false);
    }
  };

  // field is "value" | "unit" | "description".
  const editRowField = (idx, field, val) => {
    setKeyRows((rows) => rows.map((r, i) => {
      if (i !== idx) return r;
      const next = { ...r, [field]: val };
      next.found = [next.value, next.unit, next.description].some((s) => (s || "").trim() !== "");
      return next;
    }));
    setParamsSaved(false);
  };

  // Save extracted values into the document's parameter fields. Each row
  // lands in the "Actual (实测值)" slot as both a composed display string
  // AND its own value/unit/description fields, since these are the
  // document's reported/as-certified values. Existing "Design / Req."
  // values are kept.
  const saveParams = async ({ includeNF = true } = {}) => {
    if (!onSaveParams || !keyRows) return;
    const meta = { ...((doc.metadata) || {}) };
    for (const row of keyRows) {
      if (!includeNF && !row.found) continue;
      const prev = meta[row.key];
      const prevObj = (prev && typeof prev === "object")
        ? prev
        : { design: typeof prev === "string" ? prev : "", actual: "" };
      meta[row.key] = {
        ...prevObj,
        actual: row.found ? composeActualString(row.value, row.unit, row.description) : "NF",
        value: row.value || "",
        unit: row.unit || "",
        description: row.description || "",
      };
    }
    await onSaveParams(doc.id, meta);
    setParamsSaved(true);
    setTimeout(() => setParamsSaved(false), 1800);
  };

  const foundCount = keyRows ? keyRows.filter((r) => r.found).length : 0;

  // Human-readable summary of what the extraction did.
  const methodLabel = (() => {
    if (!ocrInfo) return "";
    const m = ocrInfo.method;
    if (m === "text-layer") return t("文本层（无需 OCR）", "Text layer (no OCR needed)");
    if (m === "ocr") return t("OCR 识别", "OCR recognition");
    if (m === "mixed") return t("文本层 + OCR", "Text layer + OCR");
    if (m === "garbage") return t("文本层损坏", "Text layer corrupted");
    return t("未能提取", "Extraction failed");
  })();

  // When the extracted text came straight from a text layer, offer a one-click
  // "force real OCR" path in case that layer is corrupt (renders fine, but the
  // characters are gibberish — common in re-OCR'd PDFs).
  const cameFromTextLayer = ocrInfo && ocrInfo.method === "text-layer";

  const ocrTitle = ocrStatus && !ocrStatus.tesseract_available
    ? t("未检测到 Tesseract OCR：有文本层的 PDF 仍可提取，扫描件/图片需安装 Tesseract", "Tesseract OCR not detected: PDFs with a text layer can still be extracted, but scans/images require Tesseract to be installed")
    : t("提取文档中的文字（自动选择文本层或 OCR）", "Extract text from the document (automatically picks text layer or OCR)");

  return (
    <div
      className="fixed inset-0 bg-stone-900/80 z-50 flex items-center justify-center p-4"
      onClick={onClose}
    >
      <div
        className="bg-white w-full max-w-6xl h-[90vh] flex flex-col rounded shadow-2xl"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between px-4 py-3 border-b border-stone-200">
          <div className="min-w-0">
            <div className="text-sm font-medium text-stone-900 truncate">{doc.name}</div>
            <div className="text-[11px] text-stone-500 font-mono">{doc.id}</div>
          </div>
          <div className="flex gap-2 shrink-0">
            <button
              onClick={() => setPanelMode(panelMode === "desc" ? null : "desc")}
              title={t("添加或编辑描述，描述内容可被搜索", "Add or edit a description — descriptions are searchable")}
              className={"text-xs px-3 py-1.5 rounded flex items-center gap-1.5 border " +
                (panelMode === "desc"
                  ? "border-sky-400 text-sky-800 bg-sky-100"
                  : "border-sky-300 text-sky-800 bg-sky-50 hover:bg-sky-100")}
            >
              <Edit2 size={13} /> {doc.description ? t("编辑描述", "Edit description") : t("添加描述", "Add description")}
            </button>
            {(() => {
              const hasCoords = doc.lat != null && doc.lon != null;
              const locObj = doc.metadata?.Location;
              const addr = locObj && typeof locObj === "object"
                ? (locObj.actual || locObj.design)
                : (typeof locObj === "string" ? locObj : null);
              const provider = MAP_PROVIDERS.find((p) => p.id === mapProvider) || MAP_PROVIDERS[0];
              const mapUrl = hasCoords
                ? provider.buildCoordUrl(doc.lat, doc.lon)
                : (addr ? provider.buildAddressUrl(addr) : null);
              return (
                <div className={"flex items-stretch rounded border overflow-hidden " +
                  (mapUrl ? "border-rose-300" : "border-stone-200")}>
                  <a
                    href={mapUrl || undefined}
                    target="_blank"
                    rel="noopener noreferrer"
                    onClick={(e) => { if (!mapUrl) e.preventDefault(); }}
                    title={mapUrl
                      ? (hasCoords ? t(`在${provider.label}中查看拍摄位置`, `View shooting location in ${provider.label}`) : t(`在${provider.label}中查看大致位置（无精确 GPS 坐标）`, `View approximate location in ${provider.label} (no precise GPS coordinates)`))
                      : t("此照片没有可用的位置信息", "No location information available for this photo")}
                    className={"text-xs px-2.5 py-1.5 flex items-center gap-1.5 " +
                      (mapUrl
                        ? "text-rose-800 bg-rose-50 hover:bg-rose-100"
                        : "text-stone-300 cursor-not-allowed")}
                  >
                    <MapPin size={13} /> {t("查看地图位置", "View map location")}
                  </a>
                  <select
                    value={mapProvider}
                    onChange={(e) => changeMapProvider(e.target.value)}
                    onClick={(e) => e.stopPropagation()}
                    title={t("选择地图服务商（中国大陆用户建议选择高德或百度地图，Google 地图在境内可能无法访问）", "Choose a map provider (users in mainland China should pick AMap or Baidu Maps — Google Maps may be unreachable there)")}
                    className={"text-[10px] border-l outline-none px-1 " +
                      (mapUrl ? "border-rose-300 bg-rose-50 text-rose-800" : "border-stone-200 bg-stone-50 text-stone-400")}
                  >
                    {MAP_PROVIDERS.map((p) => (
                      <option key={p.id} value={p.id}>{p.label}</option>
                    ))}
                  </select>
                </div>
              );
            })()}
            {ocrEligible && (
              <button
                onClick={() => runOcr({ force: false })}
                disabled={ocrRunning}
                title={ocrTitle}
                className={"text-xs px-3 py-1.5 rounded flex items-center gap-1.5 border " +
                  (ocrRunning
                    ? "border-stone-200 text-stone-400 cursor-wait"
                    : "border-amber-300 text-amber-800 bg-amber-50 hover:bg-amber-100")}
              >
                {ocrRunning
                  ? (<><Loader size={13} className="animate-spin" /> {t("识别中…", "Recognizing…")}</>)
                  : (<><ScanText size={13} /> {doc.ocrText ? t("重新 OCR", "Re-run OCR") : t("提取文字 (OCR)", "Extract text (OCR)")}</>)}
              </button>
            )}
            {ocrEligible && (
              <button
                onClick={() => { setPanelMode("keys"); }}
                title={t("按用户定义的关键字从文档中提取参数值", "Extract parameter values from the document using user-defined keywords")}
                className={"text-xs px-3 py-1.5 rounded flex items-center gap-1.5 border " +
                  (panelMode === "keys"
                    ? "border-emerald-400 text-emerald-800 bg-emerald-100"
                    : "border-emerald-300 text-emerald-800 bg-emerald-50 hover:bg-emerald-100")}
              >
                <ListChecks size={13} /> {t("提取关键参数", "Extract key parameters")}
              </button>
            )}
            {ocrEligible && ocrText && panelMode !== "text" && (
              <button
                onClick={() => setPanelMode("text")}
                className="text-xs px-3 py-1.5 border border-stone-300 text-stone-700 hover:bg-stone-100 rounded flex items-center gap-1.5"
              >
                <FileText size={13} /> {t("查看文字", "View text")}
              </button>
            )}
            <a
              href={doc.dataUrl}
              download={doc.name}
              className="text-xs px-3 py-1.5 border border-stone-300 text-stone-700 hover:bg-stone-100 rounded flex items-center gap-1.5"
            >
              <Download size={13} /> {t("下载", "Download")}
            </a>
            <button
              onClick={onClose}
              className="text-xs px-3 py-1.5 border border-stone-300 text-stone-700 hover:bg-stone-100 rounded flex items-center gap-1"
            >
              <X size={13} /> {t("关闭", "Close")}
            </button>
          </div>
        </div>

        <div className="flex-1 min-h-0 flex">
          {/* Preview pane */}
          <div className={"min-h-0 overflow-auto bg-stone-100 " + (panelOpen ? "flex-1 border-r border-stone-200" : "flex-1")}>
            {imgLoadError ? (
              <div className="h-full flex flex-col items-center justify-center text-stone-500 gap-3 p-6">
                <File size={52} className="text-stone-300" />
                <div className="text-sm font-medium text-stone-700 text-center">{doc.name}</div>
                <div className="text-xs text-red-500 bg-red-50 border border-red-200 rounded px-3 py-2 text-center max-w-xs">
                  {t("文件不存在或无法访问。", "The file doesn't exist or can't be accessed.")}<br/>{t("该文件可能已从磁盘中移走或删除。", "It may have been moved or deleted from disk.")}
                </div>
                <a
                  href={doc.dataUrl}
                  download={doc.name}
                  className="mt-1 flex items-center gap-2 px-4 py-2 border border-stone-300 text-stone-600 text-xs rounded hover:bg-stone-100"
                >
                  <Download size={13} /> {t("尝试下载", "Try downloading")}
                </a>
              </div>
            ) : isImage ? (
              <div className="h-full flex items-center justify-center p-4">
                <img src={viewUrl} alt={doc.name} className="max-w-full max-h-full object-contain"
                  onError={() => setImgLoadError(true)} />
              </div>
            ) : isPdf ? (
              <iframe src={doc.dataUrl} title={doc.name} className="w-full h-full border-0" />
            ) : isText ? (
              <iframe src={doc.dataUrl} title={doc.name} className="w-full h-full border-0 bg-white font-mono" />
            ) : (
              <div className="h-full flex flex-col items-center justify-center text-stone-500 gap-3 p-6">
                <File size={52} className="text-stone-400" />
                <div className="text-sm font-medium text-stone-700 text-center">{doc.name}</div>
                <div className="text-xs text-stone-400 font-mono">{doc.mime}</div>
                <a
                  href={doc.dataUrl}
                  download={doc.name}
                  className="mt-2 flex items-center gap-2 px-5 py-2.5 bg-amber-600 hover:bg-amber-700 text-white text-sm font-medium rounded-lg"
                >
                  <Download size={15} /> Download to open
                </a>
                <div className="text-xs text-stone-400 text-center max-w-xs">
                  This file type cannot be previewed in the browser.
                  Download it and open with the appropriate app.
                </div>
              </div>
            )}
          </div>

          {/* Description / caption panel */}
          {panelMode === "desc" && (
            <div className="w-[40%] max-w-md min-h-0 flex flex-col bg-white">
              <div className="flex items-center justify-between px-3 py-2 border-b border-stone-200 bg-stone-50">
                <div className="flex items-center gap-1.5 text-xs font-medium text-stone-700">
                  <Edit2 size={13} /> {t("描述", "Description")}
                </div>
                <button onClick={() => setPanelMode(null)} className="text-stone-400 hover:text-stone-700">
                  <X size={14} />
                </button>
              </div>

              <div className="px-3 py-1.5 border-b border-stone-200 flex items-center gap-2 flex-wrap">
                {voiceSupported ? (
                  <>
                    <div className="flex rounded overflow-hidden border border-stone-300 text-[10px] shrink-0">
                      <button
                        onClick={() => setVoiceLang("zh-CN")}
                        disabled={listening}
                        title={t("识别语言：中文", "Recognition language: Chinese")}
                        className={"px-1.5 py-0.5 " + (voiceLang === "zh-CN"
                          ? "bg-stone-700 text-white"
                          : "bg-white text-stone-600 hover:bg-stone-100")}
                      >
                        中文
                      </button>
                      <button
                        onClick={() => setVoiceLang("en-US")}
                        disabled={listening}
                        title="Recognition language: English"
                        className={"px-1.5 py-0.5 border-l border-stone-300 " + (voiceLang === "en-US"
                          ? "bg-stone-700 text-white"
                          : "bg-white text-stone-600 hover:bg-stone-100")}
                      >
                        EN
                      </button>
                    </div>
                    <button
                      onClick={toggleListening}
                      title={listening ? t("停止语音输入", "Stop voice input") : t("开始语音输入，识别结果会自动追加到描述中", "Start voice input — recognized text will be appended to the description automatically")}
                      className={"text-xs px-2 py-1 rounded flex items-center gap-1 border shrink-0 " +
                        (listening
                          ? "border-red-400 text-red-700 bg-red-50 animate-pulse"
                          : "border-stone-300 text-stone-600 hover:bg-stone-100")}
                    >
                      {listening ? <MicOff size={12} /> : <Mic size={12} />}
                      {listening ? t("正在聆听…", "Listening…") : t("语音输入", "Voice input")}
                    </button>
                    {voiceInterim && (
                      <span className="text-[10px] text-stone-400 italic truncate min-w-0">{voiceInterim}</span>
                    )}
                  </>
                ) : (
                  <span className="text-[10px] text-stone-400">{t("当前浏览器不支持语音输入（推荐使用 Chrome / Edge）", "This browser doesn't support voice input (Chrome / Edge recommended)")}</span>
                )}
              </div>
              {voiceError && (
                <div className="px-3 py-1 text-[10px] text-red-600 bg-red-50 border-b border-red-100">{voiceError}</div>
              )}

              <div className="flex-1 min-h-0 overflow-auto p-3">
                <textarea
                  value={description}
                  onChange={(e) => { setDescription(e.target.value); setDescSaved(false); }}
                  placeholder={t("为这张照片添加描述或备注，保存后可在搜索中找到…", "Add a description or note for this photo — once saved it's searchable…")}
                  spellCheck={false}
                  className="w-full h-full resize-none text-xs leading-relaxed text-stone-800 outline-none"
                />
              </div>

              <div className="px-3 py-2 border-t border-stone-200 bg-stone-50 flex items-center gap-2">
                {onSaveDescription && (
                  <button
                    onClick={saveDescription}
                    title={t("把描述存入文档索引，使其可被搜索", "Save the description into the document index so it's searchable")}
                    className="text-xs px-2.5 py-1 border border-emerald-300 text-emerald-800 bg-emerald-50 hover:bg-emerald-100 rounded flex items-center gap-1"
                  >
                    <Save size={12} /> {descSaved ? t("已保存", "Saved") : t("保存并可搜索", "Save and make searchable")}
                  </button>
                )}
                <span className="ml-auto text-[10px] text-stone-400">
                  {doc.description ? t("已索引", "Indexed") : t("未保存", "Not saved")}
                </span>
              </div>
            </div>
