/* =============================================================================
 * LANGUAGE (zh / en) — app-wide toggle, persisted in localStorage.
 * t(zh, en) returns whichever string matches the active language; call sites
 * keep the original Chinese text in place so this is a mechanical wrap, not a

// Recombine a {value, unit, description} extraction row into a single
// display/search string (used for the metadata "actual" field, which is
// read as plain text in many other places in this app -- search, databook,
// the general metadata editor, etc). The structured value/unit/description
// fields are stored ALONGSIDE this string, not instead of it.
const composeActualString = (value, unit, description) => {
  const v = (value || "").trim();
  const u = (unit || "").trim();
  const d = (description || "").trim();
  const head = v ? (u ? `${v} ${u}` : v) : u;
  return [head, d].filter(Boolean).join(" ").trim();
};

// JS mirror of pdf_extraction.split_value_unit_description (Python), used
// only so the metadata editor can show a value/unit/description breakdown
// for "actual" text that predates this field split (extraction-saved rows
// already carry the parts; this is the fallback for older/manually-typed
// entries). Same conservative rule: a value only comes out when the whole
// string is a bare number, or a number sits right next to a known unit.
const _UNIT_ALT_JS = "(?:kg/m\\^?3|kg/m³|g/cm\\^?3|g/cm³|lb/in\\^?3|lb/ft\\^?3|" +
  "m/s|ft/s|mph|kph|ft[-\\s]?lb(?:s)?|ft·lb|N·m|Nm|J|" +
  "GPa|MPa|kPa|ksi|psi|bar|Pa|HRC|HRB|HV|HB|BHN|Shore\\s?[A-D]?|" +
  "°C|°F|deg\\s?C|deg\\s?F|K|mm|cm|in(?:ch(?:es)?)?|ft|m|\"|" +
  "kg|lbf|lb(?:s)?|lbm|g|%|pct|MHz|kHz|Hz|kW|hp|V|A|W)";
const _NUMBER_JS = "[-+]?\\d{1,3}(?:,\\d{3})+(?:\\.\\d+)?|[-+]?\\d+(?:\\.\\d+)?";
const _BARE_NUMBER_RE_JS = new RegExp(`^(?:${_NUMBER_JS})$`);
const _NUMBER_UNIT_RE_JS = new RegExp(`(${_NUMBER_JS})\\s?(${_UNIT_ALT_JS})`, "i");

const splitActualString = (raw) => {
  const s = (raw || "").trim();
  if (!s) return { value: "", unit: "", description: "" };
  if (_BARE_NUMBER_RE_JS.test(s)) return { value: s.replace(/,/g, ""), unit: "", description: "" };
  const m = s.match(_NUMBER_UNIT_RE_JS);
  if (!m) return { value: "", unit: "", description: s };
  const value = m[1].replace(/,/g, "");
  const unit = m[2];
  const before = s.slice(0, m.index).trim();
  const after = s.slice(m.index + m[0].length).trim();
  return { value, unit, description: [before, after].filter(Boolean).join(" ") };
};

// ---- Per-folder metadata overrides (for documents linked into multiple
// folders) ---------------------------------------------------------------
// A document's `metadata` on its docIndex record is the shared/base value,
// same as before this feature existed. A doc that's linked into more than
// one folder can *additionally* carry `metaOverrides: { [nodeId]: {...} }`
// — small per-field overrides that only apply when viewing/editing the doc
// through that one folder. Folders with no override for a field just fall
// through to the shared base value (copy-on-write: nothing forks until
// someone actually edits a field while looking at a specific folder).
// A removed field is recorded as `{ __deleted: true }` so "this folder
// doesn't show this field" can be distinguished from "no override yet".
const effectiveMetadata = (baseMetadata, override) => {
  if (!override) return baseMetadata || {};
  const merged = { ...(baseMetadata || {}) };
  for (const [k, v] of Object.entries(override)) {
    if (v && v.__deleted) delete merged[k];
    else merged[k] = v;
  }
  return merged;
};

/* =============================================================================
 * STORAGE ADAPTER LAYER (REST API implementation)
 * ---------------------------------------------------------------------------
 * Talks to the Python Flask server (dms_server.py) running on the same host.
 * Tree + index live in <storage_root>/index.json on disk.
 * Documents live as real files in <storage_root>/docs/<DOC-ID>.<ext>.
 *
 * To migrate to a remote/production server later, just change API_BASE to
 * the remote URL — no other code in this file changes.
 * =============================================================================
 */
const API_BASE = ""; // same origin as the page (e.g. http://localhost:8000)

const DEFAULT_KEY_PARAMETERS = [
  "人物",
  "事件",
  "单位",
  "家人",
  "朋友",
  "旅游"
];

const normalizeKeyParameters = (items) => {
  const seen = new Set();
  const out = [];
  for (const raw of (items || [])) {
    const v = String(raw || "").trim();
    if (!v) continue;
    const k = v.toLowerCase();
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(v);
  }
  return out;
};

// Render the assembly tree as a box-drawing text tree (├── └── │), like a
// classic file-tree printout. Used by the "文本树" view for copy/export.
const buildTreeText = (root, { showMeta = false } = {}) => {
  if (!root) return "";
  const label = (n) => {
    let s = n.name || n.id || tOutsideReact("(未命名)", "(unnamed)");
    const docCount = (n.documents || []).length;
    if (showMeta && n.sn) s += `  [${n.sn}]`;
    if (docCount) s += tOutsideReact(`  (${docCount} 份文档)`, `  (${docCount} docs)`);
    return s;
  };
  const lines = [label(root)];
  const walk = (node, prefix) => {
    const kids = node.children || [];
    kids.forEach((kid, i) => {
      const last = i === kids.length - 1;
      lines.push(prefix + (last ? "└── " : "├── ") + label(kid));
      walk(kid, prefix + (last ? "    " : "│   "));
    });
  };
  walk(root, "");
  return lines.join("\n");
};

const readPhotoDate = async (file) => {
  const fallback = (lat = null, lon = null) => {
    const d = new Date(file.lastModified);
    return { year: String(d.getFullYear()), month: String(d.getMonth() + 1).padStart(2, "0"), lat, lon };
  };
  const _ext = file.name.split(".").pop().toLowerCase();
  const _isJpegLike = file.type.startsWith("image/jpeg") || file.type.startsWith("image/tiff") ||
    _ext === "jpg" || _ext === "jpeg" || _ext === "tif" || _ext === "tiff";
  if (!_isJpegLike) return fallback();
  try {
    const buf = await file.slice(0, 262144).arrayBuffer();
    const v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return fallback();
    let pos = 2;
    while (pos + 4 <= buf.byteLength) {
      if (v.getUint8(pos) !== 0xFF) break;
      const marker = v.getUint16(pos); pos += 2;
      if (marker === 0xFFD9 || marker === 0xFFDA) break;
      const segLen = v.getUint16(pos);
      if (marker === 0xFFE1 && segLen > 8 &&
          v.getUint32(pos + 2) === 0x45786966 && v.getUint16(pos + 6) === 0x0000) {
        const tiff = pos + 8;
        const le = v.getUint16(tiff) === 0x4949;
        const u16 = (o) => v.getUint16(tiff + o, le);
        const u32 = (o) => v.getUint32(tiff + o, le);
        if (u16(2) !== 42) { pos += segLen; continue; }
        const readDate = (off) => {
          if (tiff + off + 19 > buf.byteLength) return null;
          const s = new TextDecoder("ascii").decode(new Uint8Array(buf, tiff + off, 19));
          return /^\d{4}:\d{2}/.test(s) ? { year: s.slice(0, 4), month: s.slice(5, 7) } : null;
        };
        const readRational3 = (off) => {
          if (tiff + off + 24 > buf.byteLength) return null;
          const r = (o) => { const n = u32(o), d = u32(o + 4); return d ? n / d : 0; };
          return r(off) + r(off + 8) / 60 + r(off + 16) / 3600;
        };
        const ifd0 = u32(4);
        const n0 = u16(ifd0);
        let exifOff = null, gpsOff = null, ifd0Date = null;
        for (let i = 0; i < n0 && i < 256; i++) {
          const e = ifd0 + 2 + i * 12;
          if (tiff + e + 12 > buf.byteLength) break;
          const tag = u16(e);
          if (tag === 0x8769) exifOff = u32(e + 8);
          else if (tag === 0x8825) gpsOff = u32(e + 8);
          else if (tag === 0x0132) ifd0Date = readDate(u32(e + 8));
        }
        // Parse Exif IFD for shot date
        let foundDate = null;
        if (exifOff != null && exifOff + 2 <= buf.byteLength - tiff) {
          const nExif = u16(exifOff);
          for (let i = 0; i < nExif && i < 256; i++) {
            const e = exifOff + 2 + i * 12;
            if (tiff + e + 12 > buf.byteLength) break;
            const tag = u16(e);
            if (tag === 0x9003 || tag === 0x9004) {
              foundDate = readDate(u32(e + 8));
              if (foundDate) break;
            }
          }
        }
        if (!foundDate) foundDate = ifd0Date;
        // Parse GPS IFD
        let lat = null, lon = null;
        if (gpsOff != null && tiff + gpsOff + 2 <= buf.byteLength) {
          const nGps = u16(gpsOff);
          let latRef = "N", lonRef = "E", latVal = null, lonVal = null;
          for (let i = 0; i < nGps && i < 32; i++) {
            const ge = gpsOff + 2 + i * 12;
            if (tiff + ge + 12 > buf.byteLength) break;
            const gtag = u16(ge);
            if (gtag === 0x0001) latRef = String.fromCharCode(v.getUint8(tiff + ge + 8));
            else if (gtag === 0x0003) lonRef = String.fromCharCode(v.getUint8(tiff + ge + 8));
            else if (gtag === 0x0002) latVal = readRational3(u32(ge + 8));
            else if (gtag === 0x0004) lonVal = readRational3(u32(ge + 8));
          }
          if (latVal != null && lonVal != null) {
            lat = latRef === "S" ? -latVal : latVal;
            lon = lonRef === "W" ? -lonVal : lonVal;
          }
        }
        if (foundDate) return { ...foundDate, lat, lon };
        return fallback(lat, lon);
      }
      pos += segLen;
    }
  } catch {}
  return fallback();
};

    // already-stored document (e.g. metadata edits) still come through as

    // NOTE: do NOT use `new File(...)` here — our React `File` icon component

    const form = new FormData();
    if (doc.file) {
      form.append("file", doc.file, doc.name);
    } else {
      const response = await fetch(doc.dataUrl);
      const blob = await response.blob();
      form.append("file", blob, doc.name);

// Kicks off deepface installation and polls until it settles, instead of waiting on a
// single long-lived fetch — installing deepface/TensorFlow can take several minutes,
// long enough that the server's own connection timeout would kill an in-flight request
// and surface as a bare "Failed to fetch" with no real error message.
// Resolves to { status: "done" } | { status: "error", error } |
// { status: "needs_python312", message, downloadUrl }.
const installDeepfaceAndWait = async () => {
  await fetch("/api/install-deepface", { method: "POST" });
  while (true) {
    await new Promise((r) => setTimeout(r, 2000));
    const res = await fetch("/api/install-deepface/status");
    const data = await res.json();
    if (data.status !== "running") return data;
  }
};

/* =============================================================================
 * ID GENERATION
 * =============================================================================
 */
const genDocId = () => {
  const d = new Date();
  const ymd =
    d.getFullYear().toString() +
    String(d.getMonth() + 1).padStart(2, "0") +
    String(d.getDate()).padStart(2, "0");
  const rand = Math.random().toString(36).slice(2, 8).toUpperCase();
  return `DOC-${ymd}-${rand}`;
};

const computeFileHash = async (file) => {
  const buf = await file.arrayBuffer();
  const hashBuf = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hashBuf)).map((b) => b.toString(16).padStart(2, "0")).join("");
};

const genNodeId = () => {
  const rand = Math.random().toString(36).slice(2, 8).toUpperCase();
  return `NODE-${rand}`;
};

const genLoginId = () => {
  const rand = Math.random().toString(36).slice(2, 8).toUpperCase();
  return `LOGIN-${rand}`;
};

// A folder used to carry at most one website/username/password (plain
// websiteUrl/accountName/passwordEnc fields directly on the node). Folders
// can now carry any number, stored as node.logins. This reads either shape
// as a uniform array so the rest of the UI never has to care which one a
// given node happens to have -- older nodes are synthesized into a single
// "legacy"-id entry from their old top-level fields, on the fly, without
// touching the stored data until the user actually edits it (see
// updateNodeLogin/addNodeLogin, which write the migrated array back).
const LEGACY_LOGIN_ID = "legacy";
const getNodeLogins = (node) => {
  if (!node) return [];
  if (Array.isArray(node.logins)) return node.logins;
  if (node.websiteUrl || node.accountName || node.passwordEnc) {
    return [{
      id: LEGACY_LOGIN_ID,
      websiteUrl: node.websiteUrl || "",
      accountName: node.accountName || "",
      passwordEnc: node.passwordEnc || "",
    }];
  }
  return [];
};

/* =============================================================================
 * TREE OPERATIONS
 * =============================================================================
 */
const findNode = (root, nodeId) => {
  if (!root) return null;
  if (root.id === nodeId) return root;
  for (const child of root.children || []) {
    const found = findNode(child, nodeId);
    if (found) return found;
  }
  return null;
};

const findParentNode = (root, nodeId) => {
  if (!root) return null;
  for (const child of root.children || []) {
    if (child.id === nodeId) return root;
    const found = findParentNode(child, nodeId);
    if (found) return found;
  }
  return null;
};

const findNodeByName = (root, name) => {
  if (!root) return null;
  if (name.includes("/")) {
    // Path-qualified: walk down from root's children (root name not included in path)
    const parts = name.split("/").map(p => p.trim()).filter(Boolean);
    // Try matching from root's children first; if first part matches root, skip it
    const startChildren = (parts[0] === root.name)
      ? (root.children || [])
      : [root];
    const walk = (nodes, depth) => {
      if (depth >= parts.length) return null;
      for (const n of nodes) {
        if (n.name === parts[depth]) {
          if (depth === parts.length - 1) return n;
          const found = walk(n.children || [], depth + 1);
          if (found) return found;
        }
      }
      return null;
    };
    return walk(startChildren, parts[0] === root.name ? 1 : 0);
  }
  // Bare name: first global match
  if (root.name === name) return root;
  for (const child of root.children || []) {
    const found = findNodeByName(child, name);
    if (found) return found;
  }
  return null;
};

const collectAllDocIds = (node, acc = []) => {
  if (!node) return acc;
  (node.documents || []).forEach((d) => acc.push(d.id));
  (node.children || []).forEach((c) => collectAllDocIds(c, acc));
  return acc;
};

// Same walk, but keeps which node each reference came through — needed so a
// document linked into two folders in scope (e.g. one summary report linked
// under two different accounts) can resolve each occurrence's own
// per-folder metadata override rather than collapsing to a single doc id.
const collectAllDocRefs = (node, acc = []) => {
  if (!node) return acc;
  (node.documents || []).forEach((d) => acc.push({ id: d.id, nodeId: node.id }));
  (node.children || []).forEach((c) => collectAllDocRefs(c, acc));
  return acc;
};

/* =============================================================================
 * PARAMETER-VS-TIME PLOT — helpers shared by FolderPlotDialog and the
 * document-date verification flow.
 * =============================================================================
 */
// A folder literally named "YYYY-MM" (e.g. "2024-05").
const YEAR_MONTH_RE = /^(\d{4})-(0[1-9]|1[0-2])$/;
// A bare month folder ("1".."12"), used together with a bare-year parent
// below — this is the layout the app's own photo year/month auto-routing
// already creates, so it's supported as an equivalent to a literal "YYYY-MM"
// folder rather than only recognizing one specific naming convention.
const BARE_MONTH_RE = /^(0?[1-9]|1[0-2])$/;
const BARE_YEAR_RE = /^\d{4}$/;

// Walk from `nodeId` up to the root and return the nearest ancestor
// (including the node itself) whose name resolves to a "YYYY-MM" period --
// either a single "YYYY-MM" folder, or a bare month folder directly under a
// bare year folder. Returns null if nothing in the chain resolves. Used as
// the time-axis fallback for a document with no date of its own recorded.
const nearestYearMonthName = (root, nodeId) => {
  if (!root || !nodeId) return null;
  const trail = [];
  const walk = (n) => {
    trail.push(n);
    if (n.id === nodeId) return true;
    for (const c of n.children || []) {
      if (walk(c)) return true;
    }
    trail.pop();
    return false;
  };
  if (!walk(root)) return null;
  for (let i = trail.length - 1; i >= 0; i--) {
    const name = (trail[i].name || "").trim();
    const direct = name.match(YEAR_MONTH_RE);
    if (direct) return name;
    if (BARE_MONTH_RE.test(name) && i > 0) {
      const parentName = (trail[i - 1].name || "").trim();
      if (BARE_YEAR_RE.test(parentName)) {
        return `${parentName}-${name.padStart(2, "0")}`;
      }
    }
  }
  return null;
};

// Resolve the date to plot a document at: the document's own date (entered
// or verified by the user, or an unverified auto-detected guess -- see
// docDate) takes priority; otherwise fall back to the YYYY-MM folder it
// lives in, if any. Returns "YYYY-MM-DD" or null if neither source applies.
const resolveDocTime = (doc, tree) => {
  if (doc.docDate) return doc.docDate;
  const folderId = doc.originalNodeId || doc.nodeId;
  const ym = folderId ? nearestYearMonthName(tree, folderId) : null;
  return ym ? `${ym}-01` : null;
};

// Pull a plottable number out of one metadata field's value. Metadata values
// are either a plain legacy string, or the {design, actual, value, unit,
// description, ...} object the metadata editor and key-extraction both
// write (see composeActualString/splitActualString above). Prefers the
// already-split numeric `value`/`designValue`, falling back to splitting the
// composed "actual"/"design" text for older entries that predate the split.
const getNumericParamValue = (metaVal, { field = "actual" } = {}) => {
  if (metaVal == null) return null;
  if (typeof metaVal === "string") {
    const n = parseFloat(metaVal.replace(/,/g, ""));
    return Number.isFinite(n) ? n : null;
  }
  if (typeof metaVal !== "object") return null;
  const partKey = field === "design" ? "designValue" : "value";
  const composedKey = field === "design" ? "design" : "actual";
  const direct = metaVal[partKey];
  if (direct !== undefined && direct !== "") {
    const n = parseFloat(String(direct).replace(/,/g, ""));
    if (Number.isFinite(n)) return n;
  }
  const parts = splitActualString(metaVal[composedKey] || "");
  if (parts.value) {
    const n = parseFloat(parts.value.replace(/,/g, ""));
    if (Number.isFinite(n)) return n;
  }
  return null;
};

// Due-date urgency tiers for the "日程" (Schedule) color-coding mode.
// red: due within 1 day or overdue · yellow: within 1 week · blue: within 2 weeks.
// Colors were deliberately picked from very different hues (not a red→yellow
// ramp) since adjacent-hue tiers (e.g. red vs. orange) were hard to tell apart.
const urgencyTier = (dueDateStr) => {
  if (!dueDateStr) return null;
  const days = Math.ceil((new Date(dueDateStr + "T23:59:59") - new Date()) / 86400000);
  if (days <= 1) return "red";
  if (days <= 7) return "yellow";
  if (days <= 14) return "blue";
  return null;
};

// plain white background (the row backgrounds/borders in URGENCY_ROW_CLASSES

const URGENCY_TEXT_CLASSES = { red: "text-red-700", yellow: "text-yellow-700", blue: "text-blue-700" };

const collectNodeIds = (node, acc = new Set()) => {
  if (!node) return acc;
  acc.add(node.id);
  (node.children || []).forEach((c) => collectNodeIds(c, acc));
  return acc;
};

// Replays additions made to `workingTree` (relative to `baseTree`) onto
// `freshTree`. Long-running operations (e.g. uploading thousands of files)
// hold a `tree` snapshot in memory for the whole run and only build new
// folders/documents on top of it; if the operation persists that snapshot
// wholesale at the end, it silently wipes out any concurrent edits (like a
// folder the user created by hand mid-upload) that had already been saved to
// the server. This merges in only what the operation actually added — new
// child nodes and new document references — so unrelated concurrent edits
// already present in `freshTree` are preserved.
const mergeTreeAdditions = (baseTree, workingTree, freshTree) => {
  if (!workingTree || !freshTree) return freshTree;
  const baseIds = collectNodeIds(baseTree);
  let result = freshTree;

  const mergeDocs = (workingNode, targetId) => {
    const target = findNode(result, targetId);
    if (!target) return;
    const existingDocIds = new Set((target.documents || []).map((d) => d.id));
    const newDocs = (workingNode.documents || []).filter((d) => !existingDocIds.has(d.id));
    if (newDocs.length) {
      result = updateNodeInTree(result, targetId, (n) => ({
        ...n, documents: [...(n.documents || []), ...newDocs],
      }));
    }
  };

  // freshParentId is the id, *in `result`*, that workingNode's parent was
  // ultimately merged into. It's threaded explicitly through the recursion
  // (rather than re-derived from workingNode's own possibly-never-persisted
  // id) so that a name-collision merge partway down the tree still lets
  // deeper new nodes attach in the right place.
  const walk = (workingNode, freshParentId) => {
    let targetId;
    if (baseIds.has(workingNode.id)) {
      // Node existed before this operation started — must still be present.
      if (!findNode(result, workingNode.id)) return;
      targetId = workingNode.id;
    } else if (freshParentId != null) {
      const parentInResult = findNode(result, freshParentId);
      if (!parentInResult) return;
      const sibling = (parentInResult.children || []).find((c) => c.name === workingNode.name);
      if (sibling) {
        // Same-named folder already exists (created concurrently elsewhere,
        // or by an earlier checkpoint) — merge into it instead of silently
        // dropping this node's documents/children on the floor.
        targetId = sibling.id;
      } else {
        // First time this node is being persisted — splice the whole
        // subtree (documents/children already on it) in one shot.
        result = updateNodeInTree(result, freshParentId, (n) => {
          const sorted = [...(n.children || []), workingNode].sort((a, b) => {
            const na = parseInt(a.name, 10), nb = parseInt(b.name, 10);
            if (!isNaN(na) && !isNaN(nb)) return na - nb;
            return a.name.localeCompare(b.name);
          });
          return { ...n, children: sorted };
        });
        return; // subtree included wholesale via the splice above
      }
    } else {
      return;
    }

    mergeDocs(workingNode, targetId);
    (workingNode.children || []).forEach((c) => walk(c, targetId));
  };

  walk(workingTree, null);
  return result;
};

const updateNodeInTree = (root, nodeId, updater) => {
  if (root.id === nodeId) return updater(root);
  return {
    ...root,
    children: (root.children || []).map((c) =>
      updateNodeInTree(c, nodeId, updater)
    ),
  };
};

const removeNodeFromTree = (root, nodeId) => {
  return {
    ...root,
    children: (root.children || [])
      .filter((c) => c.id !== nodeId)
      .map((c) => removeNodeFromTree(c, nodeId)),
  };
};

const moveNodeInTree = (root, nodeId, direction) => {
  const children = root.children || [];
  const idx = children.findIndex((c) => c.id === nodeId);
  if (idx !== -1) {
    const next = [...children];
    const swap = direction === "up" ? idx - 1 : idx + 1;
    if (swap >= 0 && swap < next.length) [next[idx], next[swap]] = [next[swap], next[idx]];
    return { ...root, children: next };
  }
  return { ...root, children: children.map((c) => moveNodeInTree(c, nodeId, direction)) };
};

const moveNodeToPosition = (root, dragId, targetId, position) => {
  const dragged = findNode(root, dragId);
  if (!dragged || dragId === targetId) return root;
  if (findNode(dragged, targetId)) return root; // can't drop into own descendant
  let next = removeNodeFromTree(root, dragId);
  if (position === "into") {
    next = updateNodeInTree(next, targetId, (n) => ({
      ...n, children: [...(n.children || []), dragged],
    }));
  } else {
    const insertAround = (node) => {
      const ch = node.children || [];
      const idx = ch.findIndex((c) => c.id === targetId);
      if (idx !== -1) {
        const at = position === "before" ? idx : idx + 1;
        const arr = [...ch];
        arr.splice(at, 0, dragged);
        return { ...node, children: arr };
      }
      return { ...node, children: ch.map(insertAround) };
    };
    next = insertAround(next);
  }
  return next;
};

// The recycle bin ("Not Show in Tree" — shown to the user as "Deleted
// files") is a holding area, not a regular folder. It's always created as
// a direct child of root (see getOrCreateNotShowNode), but manual
// reordering or drag-and-drop could otherwise leave it anywhere among its
// siblings. Sorting it to the end at render time — rather than trying to
// block every mutation path that could move it — guarantees it always
// shows up last regardless of what order is actually stored.
const NOT_SHOW_FOLDER_NAME = "Not Show in Tree";
const sortRecycleBinLast = (children) => {
  const list = children || [];
  if (list.length < 2) return list;
  const bin = list.filter((c) => c.name === NOT_SHOW_FOLDER_NAME);
  if (!bin.length) return list;
  return [...list.filter((c) => c.name !== NOT_SHOW_FOLDER_NAME), ...bin];
};

// Deep-merge `dragged` node into `existing` node (same name).
// Returns { mergedNode, docRemap: Map<docId, newNodeId> } where docRemap
// holds every doc whose originalNodeId must be updated in the index.
const mergeNodesDeep = (existing, dragged) => {
  const docRemap = new Map();

  // dragged's direct documents move to existing
  const existingDocIds = new Set((existing.documents || []).map((d) => d.id));
  for (const d of (dragged.documents || [])) docRemap.set(d.id, existing.id);
  const addedDocs = (dragged.documents || []).filter((d) => !existingDocIds.has(d.id));

  // Merge children: recurse on name conflicts, append the rest
  const mergedChildren = [...(existing.children || [])];
  for (const dc of (dragged.children || [])) {
    const conflictIdx = mergedChildren.findIndex((c) => c.name === dc.name);
    if (conflictIdx >= 0) {
      const { mergedNode, docRemap: childRemap } = mergeNodesDeep(mergedChildren[conflictIdx], dc);
      mergedChildren[conflictIdx] = mergedNode;
      for (const [docId, nodeId] of childRemap) docRemap.set(docId, nodeId);
    } else {
      mergedChildren.push(dc);
    }
  }

  return {
    mergedNode: {
      ...existing,
      documents: [...(existing.documents || []), ...addedDocs],
      children: mergedChildren,
    },
    docRemap,
  };
};

          e.preventDefault();

            setIsFileDragOver(true);
            e.dataTransfer.dropEffect = "copy";

            // A document card is being dragged over this folder — always a
            // straight "move into this folder", no before/after reordering.
            setIsFileDragOver(true);
            e.dataTransfer.dropEffect = "move";
          } else {
            const rect = e.currentTarget.getBoundingClientRect();
            const y = e.clientY - rect.top;
            const h = rect.height;
            const pos = isRoot ? "into" : (y < h * 0.3 ? "before" : y > h * 0.7 ? "after" : "into");
            onDragOver(node.id, pos);
            e.dataTransfer.dropEffect = "move";

            setIsFileDragOver(false);
            onDragOver(null, null);

  onSetPhotoRoot, onClearPhotoRoot,
}) => {
  const { t } = useLang();
  useEffect(() => {
    const close = () => onClose();
    window.addEventListener("click", close);
    window.addEventListener("scroll", close, true);
    return () => {
      window.removeEventListener("click", close);
      window.removeEventListener("scroll", close, true);
    };
  }, [onClose]);

  return (
    <div
      style={{ position: "fixed", left: x, top: y, zIndex: 60 }}
      className="bg-white border border-stone-300 rounded shadow-lg py-1 min-w-[190px] text-base"
      onClick={(e) => e.stopPropagation()}
    >
      <button
        onClick={() => { onAddChild(); onClose(); }}
        className="w-full text-left px-3 py-1.5 hover:bg-amber-50 flex items-center gap-2 text-stone-700"
      >
        <Folder size={13} /> {t("新建子文件夹", "New subfolder")}
      </button>
      <button
        onClick={() => { onUpload(); onClose(); }}
        className="w-full text-left px-3 py-1.5 hover:bg-amber-50 flex items-center gap-2 text-stone-700"
      >
        <Upload size={13} /> {t("上传文档", "Upload document")}
      </button>
      <div className="border-t border-stone-200 my-1" />
      <button
        onClick={() => { onRename(); onClose(); }}
        className="w-full text-left px-3 py-1.5 hover:bg-amber-50 flex items-center gap-2 text-stone-700"
      >
        <Edit2 size={13} /> {t("重命名", "Rename")}
      </button>
      {!isDateFolder && (
        <>
          <div className="border-t border-stone-200 my-1" />
          {isPhotoRoot ? (
            <button
              onClick={() => { onClearPhotoRoot(); onClose(); }}
              className="w-full text-left px-3 py-1.5 hover:bg-amber-50 flex items-center gap-2 text-amber-700"
            >
              <Camera size={13} /> {t("取消照片根目录", "Unset photo root folder")}
            </button>
          ) : (
            <button
              onClick={() => { onSetPhotoRoot(); onClose(); }}
              className="w-full text-left px-3 py-1.5 hover:bg-amber-50 flex items-center gap-2 text-stone-700"
            >
              <Camera size={13} /> {t("设为照片根目录", "Set as photo root folder")}
            </button>
          )}
        </>
      )}
      {!isRoot && (
        <>
          <div className="border-t border-stone-200 my-1" />
          <button
            onClick={() => { onDelete(); onClose(); }}
            className="w-full text-left px-3 py-1.5 hover:bg-red-50 flex items-center gap-2 text-red-600"
          >
            <Trash2 size={13} /> {t("删除文件夹", "Delete folder")}
          </button>
        </>
      )}
    </div>
  );
};

// Online map providers for the "view on map" button. Google Maps is often
// unreachable in mainland China, so users can switch to a domestic provider;
// the choice is remembered (localStorage) for next time. Amap/Baidu both
// accept raw WGS84 coordinates directly (coordinate=wgs84 / coord_type=wgs84ll)
// and convert internally, so no manual GCJ-02/BD-09 transform is needed here.
const MAP_PROVIDERS = [
  {
    id: "amap",
    label: "高德地图",
    buildCoordUrl: (lat, lon) =>
      `https://uri.amap.com/marker?position=${lon},${lat}&name=${encodeURIComponent("拍摄位置")}&coordinate=wgs84&callnative=0`,
    buildAddressUrl: (addr) =>
      `https://uri.amap.com/search?keyword=${encodeURIComponent(addr)}&callnative=0`,
  },
  {
    id: "baidu",
    label: "百度地图",
    buildCoordUrl: (lat, lon) =>
      `https://api.map.baidu.com/marker?location=${lat},${lon}&title=${encodeURIComponent("拍摄位置")}&content=${encodeURIComponent("拍摄位置")}&coord_type=wgs84ll&output=html&src=webapp.dms.marker`,
    buildAddressUrl: (addr) =>
      `https://api.map.baidu.com/place/search?query=${encodeURIComponent(addr)}&output=html&src=webapp.dms.search`,
  },
  {
    id: "google",
    label: "Google 地图",
    buildCoordUrl: (lat, lon) => `https://www.google.com/maps?q=${lat},${lon}`,
    buildAddressUrl: (addr) => `https://www.google.com/maps?q=${encodeURIComponent(addr)}`,
  },
  {
    id: "bing",
    label: "Bing 地图",
    buildCoordUrl: (lat, lon) => `https://www.bing.com/maps?cp=${lat}~${lon}&lvl=16`,
    buildAddressUrl: (addr) => `https://www.bing.com/maps?q=${encodeURIComponent(addr)}`,
  },
  {
    id: "osm",
    label: "OpenStreetMap",
    buildCoordUrl: (lat, lon) => `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=16/${lat}/${lon}`,
    buildAddressUrl: (addr) => `https://www.openstreetmap.org/search?query=${encodeURIComponent(addr)}`,
  },
];
const DEFAULT_MAP_PROVIDER = "amap";

/* =============================================================================
 * UI: DOCUMENT VIEWER
 * =============================================================================
 */
const DocumentViewer = ({ doc, onClose, onSaveOcr, keyParameters = [], onAddKeyParameter, onSaveLocalParams, onSaveParams, onSaveDescription, onOpenAISettings }) => {
  const { t } = useLang();
  const isImage = doc?.mime?.startsWith("image/");
  const isPdf = doc?.mime === "application/pdf";
  const isText = doc?.mime?.startsWith("text/") || doc?.mime === "application/json";
  const ocrEligible = isImage || isPdf;

  // HEIC/HEIF files need server-side conversion to be viewable in the browser
  const _ext = (doc?.name || "").split(".").pop().toLowerCase();
  const isHeic = doc?.mime === "image/heic" || doc?.mime === "image/heif"
    || _ext === "heic" || _ext === "heif";
  const viewUrl = isHeic
    ? `${API_BASE}/api/docs/${doc.id}/preview`
    : doc?.dataUrl;

  const [imgLoadError, setImgLoadError] = useState(false);

  // OCR state
  const [ocrStatus, setOcrStatus] = useState(null);   // capability report
  const [ocrRunning, setOcrRunning] = useState(false);
  const [ocrText, setOcrText] = useState("");
  const [ocrInfo, setOcrInfo] = useState(null);
  const [ocrHint, setOcrHint] = useState("");
  const [ocrError, setOcrError] = useState("");
  // Side panel: null (closed) | "text" (OCR text) | "keys" (key-param extract) | "desc" (description)
  const [panelMode, setPanelMode] = useState(null);
  const [copied, setCopied] = useState(false);
  const [saved, setSaved] = useState(false);

  // Description / caption state
  const [description, setDescription] = useState("");
  const [descSaved, setDescSaved] = useState(false);

  // Voice-to-text dictation for the description field (Web Speech API).
  const [voiceLang, setVoiceLang] = useState("zh-CN");
  const [listening, setListening] = useState(false);
  const [voiceInterim, setVoiceInterim] = useState("");
  const [voiceError, setVoiceError] = useState("");
  const recognitionRef = useRef(null);
  const SpeechRecognitionCtor = typeof window !== "undefined"
    ? (window.SpeechRecognition || window.webkitSpeechRecognition)
    : null;
  const voiceSupported = !!SpeechRecognitionCtor;

  // Preferred online map provider for "view on map" (persisted across docs/sessions —
  // Google Maps is often unreachable in mainland China, so this is user-switchable).
  const [mapProvider, setMapProvider] = useState(() => {
    try { return localStorage.getItem("dms_map_provider") || DEFAULT_MAP_PROVIDER; }
    catch { return DEFAULT_MAP_PROVIDER; }
  });
  const changeMapProvider = (id) => {
    setMapProvider(id);
    try { localStorage.setItem("dms_map_provider", id); } catch {}
  };

  // Key-parameter extraction state
  const [localKeys, setLocalKeys] = useState([]);         // per-doc added keys
  const [selectedKeys, setSelectedKeys] = useState([]);   // which to extract
  const [newKeyInput, setNewKeyInput] = useState("");     // add-new box
  const [sameLineOnly, setSameLineOnly] = useState(true); // #4: same line default
  const [keyRows, setKeyRows] = useState(null);           // [{key, value, unit, description, found}]
  const [keyRunning, setKeyRunning] = useState(false);
  const [keyError, setKeyError] = useState("");
  const [keyHint, setKeyHint] = useState("");
  const [keyDiag, setKeyDiag] = useState(null);           // {charCount, preview,...}
  const [paramsSaved, setParamsSaved] = useState(false);
  const [useAI, setUseAI] = useState(false);               // opt-in Gemini extraction
  const [aiSettings, setAiSettings] = useState({ configured: false, library_installed: true });

  useEffect(() => {
    // Re-fetch whenever the extraction panel opens (not just on first mount)
    // so a key saved via the settings dialog is picked up without a reload.
    if (panelMode === "keys") {
      StorageAdapter.getAISettings().then(setAiSettings).catch(() => {});
    }
  }, [panelMode]);

  const panelOpen = panelMode !== null;

  // Global parameters (from the shared list) vs. this document's local adds.
  const globalKeys = useMemo(() => normalizeKeyParameters(keyParameters), [keyParameters]);
  const globalSet = useMemo(() => new Set(globalKeys.map((k) => k.toLowerCase())), [globalKeys]);
  // A key is "local" (deletable here) only if it's NOT a global parameter.
  const localOnlyKeys = useMemo(
    () => localKeys.filter((k) => !globalSet.has(k.toLowerCase())),
    [localKeys, globalSet]
  );
  // Display order: global parameters first, then this document's local adds.
  const availableKeys = useMemo(
    () => [...globalKeys, ...localOnlyKeys],
    [globalKeys, localOnlyKeys]
  );

  // Reset per-document and seed with any previously-saved OCR text.
  useEffect(() => {
    if (!doc) return;
    setOcrText(doc.ocrText || "");
    setOcrInfo(null); setOcrHint(""); setOcrError("");
    setPanelMode(doc.ocrText ? "text" : null);
    setCopied(false); setSaved(false);
    setImgLoadError(false);
    setDescription(doc.description || ""); setDescSaved(false);
    setVoiceInterim(""); setVoiceError(""); setListening(false);
    // Load this document's locally-added parameters; select NONE by default
    // (request: user explicitly picks what to extract for each document).
    setLocalKeys(normalizeKeyParameters(doc.localKeyParams || []));
    setSelectedKeys([]);
    setNewKeyInput(""); setSameLineOnly(true);
    setKeyRows(null); setKeyError(""); setKeyHint(""); setKeyDiag(null); setParamsSaved(false);
    // Stop any dictation still running from the previously-open document.
    return () => { try { recognitionRef.current && recognitionRef.current.stop(); } catch {} };
  }, [doc?.id]);

  // Probe OCR capability once when a viewer opens on an eligible file.
  useEffect(() => {
    if (!doc || !ocrEligible) return;
    let alive = true;
    StorageAdapter.ocrStatus().then((s) => { if (alive) setOcrStatus(s); });
    return () => { alive = false; };
  }, [doc?.id]);

  // For non-image types (PDF, text), verify the file exists via HEAD request.
  useEffect(() => {
    if (!doc || isImage) return;
    let alive = true;
    fetch(doc.dataUrl, { method: "HEAD" })
      .then((r) => { if (alive && !r.ok) setImgLoadError(true); })
      .catch(() => { if (alive) setImgLoadError(true); });
    return () => { alive = false; };
  }, [doc?.id]);

  if (!doc) return null;

  const runOcr = async ({ force = false } = {}) => {
    setOcrRunning(true); setOcrError(""); setOcrHint(""); setSaved(false);
    setPanelMode("text");
    try {
      const r = await StorageAdapter.runOcr(doc.id, { force });
      setOcrText(r.text || "");
      setOcrInfo(r.info || null);
      setOcrHint(r.hint || "");
    } catch (e) {
      setOcrError(e.message || String(e));
    } finally {
      setOcrRunning(false);
    }
  };

  const copyText = async () => {
    try {
      await navigator.clipboard.writeText(ocrText);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch {/* clipboard may be blocked; ignore */}
  };

  const saveText = async () => {
    if (!onSaveOcr) return;
    await onSaveOcr(doc.id, ocrText);
    setSaved(true);
    setTimeout(() => setSaved(false), 1800);
  };

  const saveDescription = async () => {
    if (!onSaveDescription) return;
    await onSaveDescription(doc.id, description);
    setDescSaved(true);
    setTimeout(() => setDescSaved(false), 1800);
  };

  // --- Voice-to-text dictation (description field) ---------------------------
  const stopListening = () => {
    try { recognitionRef.current && recognitionRef.current.stop(); } catch {}
  };

  const startListening = (lang) => {
    if (!SpeechRecognitionCtor) return;
    stopListening();
    const recognition = new SpeechRecognitionCtor();
    recognition.lang = lang;
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
      let finalChunk = "";
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        if (result.isFinal) finalChunk += result[0].transcript;
        else interim += result[0].transcript;
      }
      if (finalChunk) {
        setDescription((prev) => {
          const needsSpace = prev && !/[\s\n]$/.test(prev);
          return prev + (needsSpace ? " " : "") + finalChunk.trim();
        });
        setDescSaved(false);
      }
      setVoiceInterim(interim);
    };
    recognition.onerror = (event) => {
      setVoiceError(
        event.error === "not-allowed" ? t("麦克风权限被拒绝，请在浏览器设置中允许访问麦克风", "Microphone access denied — please allow microphone access in your browser settings")
        : event.error === "no-speech" ? t("未检测到语音，请再试一次", "No speech detected, please try again")
        : t(`语音识别出错：${event.error}`, `Speech recognition error: ${event.error}`)
      );
      setListening(false);
      setVoiceInterim("");
    };
    recognition.onend = () => {
      setListening(false);
      setVoiceInterim("");
    };

    recognitionRef.current = recognition;
    setVoiceError("");
    setVoiceInterim("");
    try {
      recognition.start();
      setListening(true);
    } catch {
      setListening(false);
    }
  };

  const toggleListening = () => {
    if (listening) { stopListening(); return; }
    startListening(voiceLang);
  };

  // --- Key-parameter extraction ---------------------------------------------
  const toggleKey = (key) => {
    setSelectedKeys((prev) =>
      prev.some((k) => k === key) ? prev.filter((k) => k !== key) : [...prev, key]);
  };
  const selectAllKeys = () => setSelectedKeys(availableKeys.slice());
  const selectNoneKeys = () => setSelectedKeys([]);

  // Add a new parameter under THIS document (local to the document, kept out
  // of the global list). It's persisted with the document and is deletable
  // here. If the typed name is already a global parameter, we just select it.
  const addNewKey = async () => {
    const clean = newKeyInput.trim();
    if (!clean) return;
    const existing = availableKeys.find((k) => k.toLowerCase() === clean.toLowerCase());
    const finalKey = existing || clean;
    const isGlobal = globalSet.has(finalKey.toLowerCase());
    if (!existing && !isGlobal) {
      const nextLocal = [...localKeys, finalKey];
      setLocalKeys(nextLocal);
      if (onSaveLocalParams) {
        try { await onSaveLocalParams(doc.id, nextLocal); } catch (e) { /* non-fatal */ }
      }
    }
    setSelectedKeys((prev) =>
      prev.some((k) => k.toLowerCase() === finalKey.toLowerCase()) ? prev : [...prev, finalKey]);
    setNewKeyInput("");
  };

  // Delete a document-local parameter (only locals, never global ones).
  const deleteLocalKey = async (key) => {
    if (globalSet.has(key.toLowerCase())) return;   // safety: never delete globals
    const nextLocal = localKeys.filter((k) => k.toLowerCase() !== key.toLowerCase());
    setLocalKeys(nextLocal);
    setSelectedKeys((prev) => prev.filter((k) => k.toLowerCase() !== key.toLowerCase()));
    if (onSaveLocalParams) {
      try { await onSaveLocalParams(doc.id, nextLocal); } catch (e) { /* non-fatal */ }
    }
  };

  const runExtract = async ({ force = false } = {}) => {
    const keys = selectedKeys.filter(Boolean);
    if (!keys.length) { setKeyError(t("请至少选择一个要提取的参数。", "Select at least one parameter to extract.")); return; }
    setKeyRunning(true); setKeyError(""); setKeyHint(""); setParamsSaved(false);
    try {
      // If OCR text is loaded (and possibly user-corrected), extract from it;
      // otherwise the server reads the file directly.
      const useText = ocrText && ocrText.trim() ? ocrText : null;
      const r = await StorageAdapter.extractKeys(doc.id, keys, { force, text: useText, sameLineOnly });
      // r.results may contain more entries than `keys`: a key found more than
      // once in the document comes back as "Key", "Key01", "Key02", ... (one
      // row per occurrence) -- include all of them, not just the originally
      // requested names, so repeated values are all shown and saved. Each
      // result is already split server-side into value/unit/description.
      const rows = Object.keys(r.results || {}).map((k) => {
        const res = r.results[k] || {};
        return {
          key: k,
          value: res.value || "",
          unit: res.unit || "",
          description: res.description || "",
          found: !!res.found,
        };
      });
      setKeyRows(rows);
      setKeyHint(r.hint || "");
      setKeyDiag({
        charCount: r.text_char_count || 0,
        preview: r.text_preview || "",
        foundCount: r.found_count || 0,
        usedText: !!useText,
        forced: force,
      });
    } catch (e) {
      setKeyError(e.message || String(e));
    } finally {
      setKeyRunning(false);
    }
  };

  // AI-assisted extraction (Gemini, opt-in): sends page images directly to
  // a multimodal model instead of regex-matching OCR text.
  const runExtractAI = async () => {
    const keys = selectedKeys.filter(Boolean);
    if (!keys.length) { setKeyError(t("请至少选择一个要提取的参数。", "Select at least one parameter to extract.")); return; }
    setKeyRunning(true); setKeyError(""); setKeyHint(""); setKeyDiag(null); setParamsSaved(false);
    try {
      const r = await StorageAdapter.extractKeysAI(doc.id, keys);
      const rows = Object.keys(r.results || {}).map((k) => {
        const res = r.results[k] || {};
        return {
          key: k,
          value: res.value || "",
          unit: res.unit || "",
          description: res.description || "",
          found: !!res.found,
        };
      });
      setKeyRows(rows);
      setKeyHint(r.pages_used ? t(`AI 已读取 ${r.pages_used} 页文档图像进行识别。`, `AI read ${r.pages_used} page image(s) of the document for recognition.`) : "");
    } catch (e) {
      setKeyError(e.message || String(e));
    } finally {
      setKeyRunning(false);
    }
  };

  // field is "value" | "unit" | "description".
  const editRowField = (idx, field, val) => {
    setKeyRows((rows) => rows.map((r, i) => {
      if (i !== idx) return r;
      const next = { ...r, [field]: val };
      next.found = [next.value, next.unit, next.description].some((s) => (s || "").trim() !== "");
      return next;
    }));
    setParamsSaved(false);
  };

  // Save extracted values into the document's parameter fields. Each row
  // lands in the "Actual (实测值)" slot as both a composed display string
  // AND its own value/unit/description fields, since these are the
  // document's reported/as-certified values. Existing "Design / Req."
  // values are kept.
  const saveParams = async ({ includeNF = true } = {}) => {
    if (!onSaveParams || !keyRows) return;
    const meta = { ...((doc.metadata) || {}) };
    for (const row of keyRows) {
      if (!includeNF && !row.found) continue;
      const prev = meta[row.key];
      const prevObj = (prev && typeof prev === "object")
        ? prev
        : { design: typeof prev === "string" ? prev : "", actual: "" };
      meta[row.key] = {
        ...prevObj,
        actual: row.found ? composeActualString(row.value, row.unit, row.description) : "NF",
        value: row.value || "",
        unit: row.unit || "",
        description: row.description || "",
      };
    }
    await onSaveParams(doc.id, meta);
    setParamsSaved(true);
    setTimeout(() => setParamsSaved(false), 1800);
  };

  const foundCount = keyRows ? keyRows.filter((r) => r.found).length : 0;

  // Human-readable summary of what the extraction did.
  const methodLabel = (() => {
    if (!ocrInfo) return "";
    const m = ocrInfo.method;
    if (m === "text-layer") return t("文本层（无需 OCR）", "Text layer (no OCR needed)");
    if (m === "ocr") return t("OCR 识别", "OCR recognition");
    if (m === "mixed") return t("文本层 + OCR", "Text layer + OCR");
    if (m === "garbage") return t("文本层损坏", "Text layer corrupted");
    return t("未能提取", "Extraction failed");
  })();

  // When the extracted text came straight from a text layer, offer a one-click
  // "force real OCR" path in case that layer is corrupt (renders fine, but the
  // characters are gibberish — common in re-OCR'd PDFs).
  const cameFromTextLayer = ocrInfo && ocrInfo.method === "text-layer";

  const ocrTitle = ocrStatus && !ocrStatus.tesseract_available
    ? t("未检测到 Tesseract OCR：有文本层的 PDF 仍可提取，扫描件/图片需安装 Tesseract", "Tesseract OCR not detected: PDFs with a text layer can still be extracted, but scans/images require Tesseract to be installed")
    : t("提取文档中的文字（自动选择文本层或 OCR）", "Extract text from the document (automatically picks text layer or OCR)");

  return (
    <div
      className="fixed inset-0 bg-stone-900/80 z-50 flex items-center justify-center p-4"
      onClick={onClose}
    >
      <div
        className="bg-white w-full max-w-6xl h-[90vh] flex flex-col rounded shadow-2xl"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between px-4 py-3 border-b border-stone-200">
          <div className="min-w-0">
            <div className="text-base font-medium text-stone-900 truncate">{doc.name}</div>
            <div className="text-[13px] text-stone-700 font-mono">{doc.id}</div>
          </div>
          <div className="flex gap-2 shrink-0">
            <button
              onClick={() => setPanelMode(panelMode === "desc" ? null : "desc")}
              title={t("添加或编辑描述，描述内容可被搜索", "Add or edit a description — descriptions are searchable")}
              className={"text-sm px-3 py-1.5 rounded flex items-center gap-1.5 border " +
                (panelMode === "desc"
                  ? "border-sky-400 text-sky-800 bg-sky-100"
                  : "border-sky-300 text-sky-800 bg-sky-50 hover:bg-sky-100")}
            >
              <Edit2 size={13} /> {doc.description ? t("编辑描述", "Edit description") : t("添加描述", "Add description")}
            </button>
            {(() => {
              const hasCoords = doc.lat != null && doc.lon != null;
              const locObj = doc.metadata?.Location;
              const addr = locObj && typeof locObj === "object"
                ? (locObj.actual || locObj.design)
                : (typeof locObj === "string" ? locObj : null);
              const provider = MAP_PROVIDERS.find((p) => p.id === mapProvider) || MAP_PROVIDERS[0];
              const mapUrl = hasCoords
                ? provider.buildCoordUrl(doc.lat, doc.lon)
                : (addr ? provider.buildAddressUrl(addr) : null);
              return (
                <div className={"flex items-stretch rounded border overflow-hidden " +
                  (mapUrl ? "border-rose-300" : "border-stone-200")}>
                  <a
                    href={mapUrl || undefined}
                    target="_blank"
                    rel="noopener noreferrer"
                    onClick={(e) => { if (!mapUrl) e.preventDefault(); }}
                    title={mapUrl
                      ? (hasCoords ? t(`在${provider.label}中查看拍摄位置`, `View shooting location in ${provider.label}`) : t(`在${provider.label}中查看大致位置（无精确 GPS 坐标）`, `View approximate location in ${provider.label} (no precise GPS coordinates)`))
                      : t("此照片没有可用的位置信息", "No location information available for this photo")}
                    className={"text-sm px-2.5 py-1.5 flex items-center gap-1.5 " +
                      (mapUrl
                        ? "text-rose-800 bg-rose-50 hover:bg-rose-100"
                        : "text-stone-600 cursor-not-allowed")}

                      <pre className="text-[12px] leading-snug font-mono text-stone-700 whitespace-pre-wrap max-h-32 overflow-auto bg-stone-50 rounded p-1.5 border border-stone-100">
{keyDiag.preview || t("（未读取到任何文字——可能是扫描件且无文本层。尝试上面的“用 OCR 重新提取”。）", " (No text was read — this may be a scanned page with no text layer. Try “Re-extract with OCR” above.)")}

                  <span className="text-[12px] text-stone-700">

                  </span>
                  {onSaveParams && (
                    <button
                      onClick={() => saveParams({ includeNF: false })}
                      title={t("仅把找到的值保存到文档字段的实测值", "Save only the found values to the document field's actual value")}
                      className="ml-auto text-sm px-2.5 py-1 border border-stone-300 text-stone-700 hover:bg-white rounded flex items-center gap-1"
                    >
                      <Save size={12} /> {t("仅保存找到的", "Save found only")}
                    </button>

                  {onSaveParams && (
                    <button
                      onClick={() => saveParams({ includeNF: true })}
                      title={t("把所有关键字（含 NF）保存到文档字段的实测值", "Save all keywords (including NF) to the document field's actual value")}
                      className="text-sm px-2.5 py-1 border border-emerald-300 text-emerald-800 bg-emerald-50 hover:bg-emerald-100 rounded flex items-center gap-1"
                    >
                      <Save size={12} /> {paramsSaved ? t("已保存", "Saved") : t("全部保存(含NF)", "Save all (incl. NF)")}
                    </button>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

// Uncontrolled input that supports Chinese IME without React resetting the DOM value mid-composition.
const ImeInput = ({ value, onCommit, placeholder, className }) => {
  const ref = React.useRef(null);
  const composing = React.useRef(false);
  const lastExternal = React.useRef(value);

  React.useEffect(() => {
    if (ref.current && !composing.current && value !== lastExternal.current) {
      ref.current.value = value;
    }
    lastExternal.current = value;
  }, [value]);

  return (
    <input
      ref={ref}
      type="text"
      defaultValue={value}
      placeholder={placeholder}
      className={className}
      onCompositionStart={() => { composing.current = true; }}
      onCompositionEnd={(e) => { composing.current = false; onCommit(e.target.value); }}
      onChange={(e) => { if (!composing.current) onCommit(e.target.value); }}
    />
  );
};

// `baseMetadata`: when set (doc is linked into other folders too), each
// field is compared against the doc's shared base value so a small
// "folder-specific" badge can be shown next to any field that has already
// forked away from the shared value for this folder. `null`/omitted means
// the doc isn't multi-linked (or we're not in a folder context) — no badges.
const MetadataEditor = ({ metadata, onChange, keyParameters = [], baseMetadata = null }) => {
  const { t } = useLang();
  const entries = Object.entries(metadata || {});
  const suggestions = normalizeKeyParameters(keyParameters);
  const isOverridden = (key, val) =>
    !!baseMetadata && JSON.stringify(baseMetadata[key]) !== JSON.stringify(val);

  const updateKey = (oldKey, newKey) => {
    const clean = (newKey || "").trim();
    if (!clean || clean === oldKey) return;
    const m = { ...(metadata || {}) };
    m[clean] = m[oldKey];
    delete m[oldKey];
    onChange(m);
  };
  // Both "design" and "actual" are stored as a composed display string PLUS
  // their own value/unit/description parts (design's parts are prefixed
  // "design" to not collide with actual's). PART_FIELDS maps which part-field
  // names go with which composed string.
  const PART_FIELDS = {
    actual: { value: "value", unit: "unit", description: "description" },
    design: { value: "designValue", unit: "designUnit", description: "designDescription" },
  };
  const partsOf = (valObj, composedKey) => {
    const pf = PART_FIELDS[composedKey];
    return (valObj[pf.value] || valObj[pf.unit] || valObj[pf.description])
      ? { value: valObj[pf.value] || "", unit: valObj[pf.unit] || "", description: valObj[pf.description] || "" }
      : splitActualString(valObj[composedKey]);
  };

  // Update one part (value/unit/description) of either the design or the
  // actual composed string, keeping the composed string (the plain text
  // search/display everywhere else in the app reads) recomposed from them.
  // Falls back to splitting the existing composed text the first time an
  // older entry (saved before this split existed) is edited, so its content
  // isn't lost.
  const updatePart = (key, composedKey, field, val) => {
    const prev = (metadata || {})[key];
    const prevObj = (prev && typeof prev === "object")
      ? prev
      : { design: typeof prev === "string" ? prev : "", actual: "" };
    const pf = PART_FIELDS[composedKey];
    const nextParts = { ...partsOf(prevObj, composedKey), [field]: val };
    onChange({
      ...(metadata || {}),
      [key]: {
        ...prevObj,
        [pf.value]: nextParts.value,
        [pf.unit]: nextParts.unit,
        [pf.description]: nextParts.description,
        [composedKey]: composeActualString(nextParts.value, nextParts.unit, nextParts.description),
      },
    });
  };

  const nextUnusedKey = () => {
    const used = new Set(Object.keys(metadata || {}).map((k) => k.toLowerCase()));
    const suggested = suggestions.find((k) => !used.has(k.toLowerCase()));
    if (suggested) return suggested;
    let key = "field"; let i = 1;
    while ((metadata || {})[key] !== undefined) key = `field_${++i}`;
    return key;
  };

  const addField = () => {
    const key = nextUnusedKey();
    onChange({ ...(metadata || {}), [key]: { design: "", actual: "" } });
  };
  const removeField = (key) => {
    const m = { ...(metadata || {}) }; delete m[key]; onChange(m);
  };

  const FieldKeyPicker = ({ currentKey }) => {
    const matchedSuggestion = suggestions.find((k) => k.toLowerCase() === currentKey.toLowerCase());
    const isListed = !!matchedSuggestion;
    const selectValue = isListed ? matchedSuggestion : "__current_custom__";

    const renameCustom = () => {
      const next = window.prompt(t("请输入新的字段/关键参数名称：", "Enter the new field/key parameter name:"), isListed ? "" : currentKey);
      if (next === null) return;
      const clean = (next || "").trim();
      if (!clean) return;
      updateKey(currentKey, clean);
    };

    return (
      <select
        value={selectValue}
        onChange={(e) => {
          const v = e.target.value;
          if (v === "__enter_new__") {
            renameCustom();
            return;
          }
          if (v === "__current_custom__") return;
          updateKey(currentKey, v);
        }}
        onDoubleClick={() => {
          if (!isListed) renameCustom();
        }}
        title={isListed
          ? t("从全局关键参数列表中选择，或选择\"自定义/新增\"", "Choose from the global key parameter list, or select \"Custom / add\"")
          : t("自定义字段。打开列表选择全局键，或双击重命名此自定义字段。", "Custom field. Open the list to pick a global key, or double-click to rename this custom field.")
        }
        className={`text-sm px-2 py-1 border rounded w-1/3 min-w-[220px] font-mono bg-stone-50 focus:outline-none focus:border-amber-600 ${
          isListed ? "border-stone-300" : "border-amber-400 text-amber-800"
        }`}
      >
        {!isListed && <option value="__current_custom__">{currentKey}</option>}
        {suggestions.map((k) => <option key={k} value={k}>{k}</option>)}
        <option value="__enter_new__">{t("自定义 / 新增...", "Custom / add...")}</option>
      </select>
    );
  };

  return (
    <div className="space-y-1.5">
      <div className="text-[12px] text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1">
        {t("字段名称使用全局关键参数下拉列表。从列表中选择，或选择\"自定义/新增\"以输入不在列表中的字段。", "Field names use the global key parameter dropdown. Choose from the list, or select \"Custom/add\" to enter a field not on the list.")}
      </div>

      {entries.length === 0 && (
        <div className="text-sm text-stone-700 italic py-2">
          {t("暂无元数据。点击\"添加字段\"，从下拉列表中选择或输入自定义关键参数。", "No metadata yet. Click \"Add field\" and choose from the dropdown or enter a custom key parameter.")}
        </div>
      )}

      {entries.map(([key, val]) => {
        const valObj = (val && typeof val === "object") ? val : { design: typeof val === "string" ? val : "", actual: "" };
        // The actual value is stored as three parts (value/unit/description)
        // alongside the composed "design"/"actual" strings -- same breakdown
        // as the "Extract key parameters" panel. Older/manually-typed
        // entries that only have the composed string get split on the fly
        // for display.
        const designParts = partsOf(valObj, "design");
        const actualParts = partsOf(valObj, "actual");
        return (
          <div key={key} className="space-y-1">
            <div className="flex gap-1.5 items-center">
              <FieldKeyPicker currentKey={key} />
              {isOverridden(key, val) && (
                <span
                  className="text-[11px] px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-700 border border-amber-300 shrink-0"
                  title={t("此字段的值仅对当前文件夹生效，其他链接此文档的文件夹不受影响", "This field's value only applies to the current folder — other folders linking this document are unaffected")}
                >
                  {t("本文件夹专属", "This folder only")}
                </span>
              )}
              <button onClick={() => removeField(key)} className="text-stone-600 hover:text-red-600 p-1 ml-auto">
                <X size={12} />
              </button>
            </div>
            <div className="flex gap-1.5 items-start pl-1">
              <span className="text-[12px] text-stone-700 w-[90px] shrink-0 text-right pr-1 pt-1">{t("设计 / 要求", "Design / spec")}</span>
              <div className="flex-1 grid grid-cols-[2fr_1.2fr_3fr] gap-1">
                <ImeInput
                  value={designParts.value}
                  onCommit={(v) => updatePart(key, "design", "value", v)}
                  placeholder={t("值", "Value")}
                  className="text-sm px-2 py-1 border border-stone-300 rounded focus:outline-none focus:border-amber-600"
                />
                <ImeInput
                  value={designParts.unit}
                  onCommit={(v) => updatePart(key, "design", "unit", v)}
                  placeholder={t("单位", "Unit")}
                  className="text-sm px-2 py-1 border border-stone-300 rounded focus:outline-none focus:border-amber-600"
                />
                <ImeInput
                  value={designParts.description}
                  onCommit={(v) => updatePart(key, "design", "description", v)}
                  placeholder={t("描述", "Description")}
                  className="text-sm px-2 py-1 border border-stone-300 rounded focus:outline-none focus:border-amber-600"
                />
              </div>
            </div>
            <div className="flex gap-1.5 items-start pl-1 pb-1 border-b border-stone-100">
              <span className="text-[12px] text-stone-700 w-[90px] shrink-0 text-right pr-1 pt-1">{t("实测值", "Actual value")}</span>
              <div className="flex-1 grid grid-cols-[2fr_1.2fr_3fr] gap-1">
                <ImeInput
                  value={actualParts.value}
                  onCommit={(v) => updatePart(key, "actual", "value", v)}
                  placeholder={t("值", "Value")}
                  className="text-sm px-2 py-1 border border-stone-300 rounded focus:outline-none focus:border-amber-600"
                />
                <ImeInput
                  value={actualParts.unit}
                  onCommit={(v) => updatePart(key, "actual", "unit", v)}
                  placeholder={t("单位", "Unit")}
                  className="text-sm px-2 py-1 border border-stone-300 rounded focus:outline-none focus:border-amber-600"
                />
                <ImeInput
                  value={actualParts.description}
                  onCommit={(v) => updatePart(key, "actual", "description", v)}
                  placeholder={t("描述", "Description")}
                  className="text-sm px-2 py-1 border border-stone-300 rounded focus:outline-none focus:border-amber-600"
                />
              </div>
            </div>
          </div>
        );
      })}
      <button onClick={addField} className="text-[13px] text-stone-700 hover:text-amber-700 flex items-center gap-1 mt-1">
        <Plus size={11} /> {t("添加字段", "Add field")}
      </button>
    </div>
  );
};

const SearchPanel = ({ index, refMap, getPathFor, onOpenDoc, onJumpToNode, tree, scopeNodeId, onOpenAISettings }) => {
  const { t } = useLang();
  const [q, setQ] = useState("");
  const [showUnref, setShowUnref] = useState(false);
  const [scopeToFolder, setScopeToFolder] = useState(false);
  const [mode, setMode] = useState("keyword"); // "keyword" | "ai"

  // --- AI Q&A mode state ------------------------------------------------
  const [aiSettings, setAiSettings] = useState({ configured: false, library_installed: true });
  const [question, setQuestion] = useState("");
  const [asking, setAsking] = useState(false);
  const [aiAnswer, setAiAnswer] = useState(null); // { answer, citations, coverage } | null
  const [aiError, setAiError] = useState("");

  useEffect(() => {
    if (mode === "ai") StorageAdapter.getAISettings().then(setAiSettings).catch(() => {});
  }, [mode]);

  const scopeNode = useMemo(
    () => (tree && scopeNodeId ? findNode(tree, scopeNodeId) : null),
    [tree, scopeNodeId]
  );

  useEffect(() => { if (!scopeNode) setScopeToFolder(false); }, [scopeNode]);

  const askQuestion = async () => {
    if (!question.trim() || asking) return;
    setAsking(true); setAiError(""); setAiAnswer(null);
    try {
      const data = await StorageAdapter.askAI(question.trim(), scopeToFolder && scopeNode ? scopeNode.id : null);
      setAiAnswer(data);
    } catch (e) {
      setAiError(e.message || String(e));
    } finally {
      setAsking(false);
    }
  };

  const scopeDocIdSet = useMemo(() => {
    if (!scopeToFolder || !scopeNode) return null;
    return new Set(collectAllDocIds(scopeNode));
  }, [scopeToFolder, scopeNode]);

  const results = useMemo(() => {
    const words = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let pool = index;
    if (scopeDocIdSet) pool = pool.filter((d) => scopeDocIdSet.has(d.id));
    if (showUnref) pool = pool.filter((d) => !(refMap.get(d.id)?.length));
    if (!words.length) return pool;
    return pool.filter((entry) => {
      const haystack = [
        entry.id,
        entry.name || "",
        entry.sn || "",
        entry.ocrText || "",
        entry.description || "",
        ...Object.keys(entry.metadata || {}),
        ...Object.values(entry.metadata || {}).map((v) => {
          if (v && typeof v === "object") return `${v.design || ""} ${v.actual || ""}`;
          return String(v);
        }),
      ].join(" ").toLowerCase();
      return words.every((w) => haystack.includes(w));
    });
  }, [q, index, refMap, showUnref, scopeDocIdSet]);

  const unrefCount = useMemo(
    () => index.filter((d) => !(refMap.get(d.id)?.length)).length,
    [index, refMap]
  );

  const poolSize = useMemo(() => {
    let p = scopeDocIdSet ? index.filter((d) => scopeDocIdSet.has(d.id)) : index;
    if (showUnref) p = p.filter((d) => !(refMap.get(d.id)?.length));
    return p.length;
  }, [index, refMap, showUnref, scopeDocIdSet]);

  return (
    <div className="p-3 space-y-2">
      <div className="flex rounded overflow-hidden border border-stone-300 w-fit">
        <button
          onClick={() => setMode("keyword")}
          className={"text-[13px] px-2.5 py-1 flex items-center gap-1 " + (mode === "keyword"
            ? "bg-stone-700 text-white"
            : "bg-white text-stone-700 hover:bg-stone-100")}
        >
          <Search size={11} /> {t("关键词搜索", "Keyword search")}
        </button>
        <button
          onClick={() => setMode("ai")}
          className={"text-[13px] px-2.5 py-1 flex items-center gap-1 border-l border-stone-300 " + (mode === "ai"
            ? "bg-purple-700 text-white"
            : "bg-white text-stone-700 hover:bg-stone-100")}
        >
          <Sparkles size={11} /> {t("AI 问答", "Ask AI")}
        </button>
      </div>

      {scopeNode && (
        <label className="flex items-center gap-1.5 text-[13px] text-stone-700 cursor-pointer">
          <input
            type="checkbox"
            checked={scopeToFolder}
            onChange={(e) => setScopeToFolder(e.target.checked)}
          />
          <span>{t("仅限此节点及子节点：", "This node and its children only:")}</span>
          <span className="font-medium text-amber-700 truncate max-w-[100px]" title={scopeNode.name}>
            {scopeNode.name}
          </span>
        </label>
      )}

      {mode === "ai" ? (
        <div className="space-y-2">
          <div className="relative">
            <Sparkles size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-purple-500" />
            <input
              type="text"
              value={question}
              onChange={(e) => setQuestion(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") askQuestion(); }}
              placeholder={t("用一句话提问，AI 会跨文档查找答案…", "Ask a question in plain language — AI will search across documents…")}
              disabled={!aiSettings.configured}
              className="w-full pl-8 pr-3 py-1.5 text-sm border border-stone-300 rounded focus:outline-none focus:border-purple-600 disabled:bg-stone-50 disabled:text-stone-600"
            />
          </div>

          {!aiSettings.configured ? (
            <div className="text-[13px] text-stone-700 bg-purple-50 border border-purple-200 rounded p-2 flex items-center gap-1.5">
              <Sparkles size={11} className="text-purple-600 shrink-0" />
              {t("需要先配置 Gemini API Key 才能使用 AI 问答。", "AI Q&A needs a Gemini API Key configured first.")}
              {onOpenAISettings && (
                <button onClick={onOpenAISettings} className="text-purple-700 hover:underline font-medium shrink-0">
                  {t("配置 API Key", "Configure API Key")}
                </button>
              )}
            </div>
          ) : (
            <button
              onClick={askQuestion}
              disabled={asking || !question.trim()}
              className="text-sm px-3 py-1.5 rounded flex items-center gap-1.5 border border-purple-300 text-purple-800 bg-purple-50 hover:bg-purple-100 disabled:opacity-40"
            >
              {asking
                ? (<><Loader size={13} className="animate-spin" /> {t("正在查找…", "Searching…")}</>)
                : (<><Sparkles size={13} /> {t("提问", "Ask")}</>)}
            </button>
          )}

          {aiError && (
            <div className="text-sm bg-red-50 border border-red-200 rounded p-2 text-red-700">{aiError}</div>
          )}

          {aiAnswer && (
            <div className="space-y-2">
              <div className="text-sm bg-purple-50 border border-purple-200 rounded p-3 text-stone-800 whitespace-pre-wrap leading-relaxed">
                {aiAnswer.answer}
              </div>
              <div className="text-[12px] text-stone-600">
                {t(
                  `基于 ${aiAnswer.coverage.total} 篇候选文档，其中 ${aiAnswer.coverage.withText} 篇有可提取文字`,
                  `Based on ${aiAnswer.coverage.total} candidate document(s), ${aiAnswer.coverage.withText} with extractable text`
                )}
              </div>
              {aiAnswer.citations.length > 0 && (
                <div className="space-y-1">
                  <div className="text-[12px] uppercase tracking-wider text-stone-700">{t("来源文档", "Source documents")}</div>
                  {aiAnswer.citations.map((c) => {
                    const refs = refMap.get(c.docId) || [];
                    return (
                      <div
                        key={c.docId}
                        className="border border-stone-200 rounded p-2 text-sm hover:bg-purple-50 hover:border-purple-300 cursor-pointer flex items-center gap-1.5"
                        title={t("单击打开 · 双击跳转到节点", "Click to open · double-click to jump to node")}
                        onClick={() => onOpenDoc(c.docId)}
                        onDoubleClick={(e) => { e.preventDefault(); refs[0] && onJumpToNode(refs[0]); }}
                      >
                        <FileText size={12} className="text-stone-600 shrink-0" />
                        <span className="font-medium text-stone-800 truncate">{c.name}</span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </div>
      ) : (
      <>
      <div className="relative">
        <Search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-stone-600" />
        <input
          type="text"
          value={q}
          onChange={(e) => setQ(e.target.value)}
          placeholder={t("按编号、名称、描述或元数据搜索…", "Search by number, name, description, or metadata…")}
          className="w-full pl-8 pr-3 py-1.5 text-sm border border-stone-300 rounded focus:outline-none focus:border-amber-600"
        />
      </div>
      <div className="flex items-center justify-between">
        <label className="flex items-center gap-1.5 text-[13px] text-stone-700 cursor-pointer">
          <input
            type="checkbox"
            checked={showUnref}
            onChange={(e) => setShowUnref(e.target.checked)}
          />
          {t("仅显示未引用", "Show unreferenced only")}
          {unrefCount > 0 && (
            <span className="text-[12px] tabular-nums px-1 bg-amber-100 text-amber-800 rounded">
              {unrefCount}
            </span>
          )}
        </label>
        <span className="text-[13px] text-stone-700">
          {q.trim()
            ? t(`共 ${poolSize} 条，匹配 ${results.length} 条`, `${poolSize} total, ${results.length} matched`)
            : t(`共 ${results.length} 份文档`, `${results.length} documents total`)}
        </span>
      </div>
      <div className="space-y-1 max-h-[60vh] overflow-auto">
        {results.map((r) => {
          const refs = refMap.get(r.id) || [];
          return (
            <div
              key={r.id}
              className="border border-stone-200 rounded p-2 text-sm hover:bg-amber-50 hover:border-amber-300 cursor-pointer"
              title={t("单击打开 · 双击跳转到节点", "Click to open · double-click to jump to node")}
              onClick={() => onOpenDoc(r.id)}
              onDoubleClick={(e) => { e.preventDefault(); refs[0] && onJumpToNode(refs[0]); }}
            >
              <div className="font-medium text-stone-800 truncate">{r.name}</div>
              <div className="font-mono text-[12px] text-stone-700 mt-0.5">{r.id}</div>
              {r.description && (
                <div className="text-[12px] text-stone-700 mt-0.5 line-clamp-2">{r.description}</div>
              )}
              {refs.length === 0 && (
                <div className="text-[12px] text-amber-700 mt-0.5 italic">{t("未引用", "Unreferenced")}</div>
              )}
              {refs.map((nodeId) => (
                <div
                  key={nodeId}
                  className="text-[12px] text-amber-700 mt-0.5 truncate hover:underline"
                  onClick={(e) => { e.stopPropagation(); onJumpToNode(nodeId); }}
                >
                  📁 {getPathFor(nodeId)}
                </div>
              ))}
              {Object.keys(r.metadata || {}).length > 0 && (
                <div className="flex flex-wrap gap-1 mt-1">
                  {Object.entries(r.metadata).map(([k, v]) => {
                    const valObj = (v && typeof v === "object") ? v : { design: String(v), actual: "" };
                    return (
                      <span key={k} className="text-[11px] bg-stone-100 px-1.5 py-0.5 rounded font-mono">
                        {k}: {valObj.design || "—"} / {valObj.actual || "—"}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
      </>
      )}
    </div>
  );
};

/* =============================================================================
 * UI: DATABOOK PANEL
 * ---------------------------------------------------------------------------
 * A third sidebar tab. Renders the entire tree with checkboxes for every
 * document. Lets the user pick what to include, then generates a PDF.
 *
 * Selection state is held as: Map<nodeId, Set<docId>>
 *   — a doc selected at multiple linked nodes counts separately, so the
 *     databook will include it once per linked node (matching how the user
 *     organized them).
 * =============================================================================
 */
const DatabookPanel = ({ tree, docIndex, getPathFor, formatBytes, onOpenDoc }) => {
  const { t } = useLang();
  // Map<nodeId, Set<docId>>
  const [selection, setSelection] = useState(new Map());
  const [expanded, setExpanded] = useState(new Set());
  const [generating, setGenerating] = useState(false);
  const [showTitleDialog, setShowTitleDialog] = useState(false);
  const [title, setTitle] = useState("Engineering Databook");
  const [subtitle, setSubtitle] = useState("");
  const [error, setError] = useState(null);
  const [frontPageFile, setFrontPageFile] = useState(null);
  const [generated, setGenerated] = useState(false);
  const [savedPath, setSavedPath] = useState(null);

  const docsById = useMemo(() => new Map(docIndex.map((d) => [d.id, d])), [docIndex]);

  // Auto-expand the root node once the tree is available
  useEffect(() => {
    if (tree && tree.id && !expanded.has(tree.id)) {
      setExpanded((prev) => new Set([...prev, tree.id]));
    }
  }, [tree?.id]);

  // Load persisted selection (so iterating on a databook is easy)
  useEffect(() => {
    try {
      const saved = localStorage.getItem("dms:databook-selection");
      if (saved) {
        const obj = JSON.parse(saved);
        const m = new Map();
        for (const [nid, docs] of Object.entries(obj)) m.set(nid, new Set(docs));
        setSelection(m);
      }
      const t = localStorage.getItem("dms:databook-title");
      if (t) setTitle(t);
      const s = localStorage.getItem("dms:databook-subtitle");
      if (s) setSubtitle(s);
    } catch {}
  }, []);

  // Persist selection on change
  useEffect(() => {
    const obj = {};
    for (const [nid, docs] of selection) obj[nid] = Array.from(docs);
    try {
      localStorage.setItem("dms:databook-selection", JSON.stringify(obj));
    } catch {}
  }, [selection]);

  const toggleExpand = (id) =>
    setExpanded((prev) => {
      const n = new Set(prev);
      if (n.has(id)) n.delete(id);
      else n.add(id);
      return n;
    });

  const isDocSelected = (nodeId, docId) =>
    !!selection.get(nodeId)?.has(docId);

  const toggleDoc = (nodeId, docId) => {
    setSelection((prev) => {
      const next = new Map(prev);
      const set = new Set(next.get(nodeId) || []);
      if (set.has(docId)) set.delete(docId);
      else set.add(docId);
      if (set.size === 0) next.delete(nodeId);
      else next.set(nodeId, set);
      return next;
    });
  };

  // Node-level selection state: returns "all" | "some" | "none"
  // considering the docs directly attached to this node (NOT descendants).
  const nodeOwnState = (node) => {
    const docs = node.documents || [];
    if (docs.length === 0) return "none";
    const sel = selection.get(node.id);
    if (!sel || sel.size === 0) return "none";
    const allSelected = docs.every((d) => sel.has(d.id));
    return allSelected ? "all" : "some";
  };

  const setNodeAll = (node, on) => {
