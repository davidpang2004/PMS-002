      {contextMenu && (() => {
        const ctxNode = findNode(tree, contextMenu.nodeId);
        const ctxName = ctxNode?.name || "";
        return (
          <ContextMenu
            x={contextMenu.x} y={contextMenu.y}
            isRoot={contextMenu.nodeId === tree?.id}
            nodeName={ctxName}
            isPhotoRoot={contextMenu.nodeId === photoRootNodeId}
            isDateFolder={isDateNode(ctxName)}
            onClose={() => setContextMenu(null)}
            onRename={() => setRenamingId(contextMenu.nodeId)}
            onAddChild={() => {
              setAddingChildToId(contextMenu.nodeId);
              setExpandedIds((prev) => new Set([...prev, contextMenu.nodeId]));
            }}
            onUpload={() => {
              ctxUploadTargetRef.current = contextMenu.nodeId;
              ctxUploadInputRef.current?.click();
            }}
            onDelete={() => handleDeleteNode(contextMenu.nodeId)}
            onSetPhotoRoot={async () => {
              const newId = contextMenu.nodeId;
              await StorageAdapter.savePhotoRootNodeId(newId);
              setPhotoRootNodeId(newId);
            }}
            onClearPhotoRoot={async () => {
              await StorageAdapter.savePhotoRootNodeId("");
              setPhotoRootNodeId("");
            }}
          />
        );
      })()}

      <input
        ref={ctxUploadInputRef}
        type="file" multiple
        className="hidden"
        onChange={(e) => {
          const targetId = ctxUploadTargetRef.current;
          if (targetId) handleTreeUpload(targetId, e);
          ctxUploadTargetRef.current = null;
        }}
      />

      {folderPickerOpen && (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center" onClick={(e) => { if (e.target === e.currentTarget) { setFolderPickerOpen(false); setPendingFolderFiles([]); setMirrorSubfolders(false); } }}>
          <div className="bg-white rounded-lg shadow-xl p-6 w-96 flex flex-col gap-4">
            <h3 className="font-semibold text-base text-stone-800">{t("上传多个文件夹", "Upload multiple folders")}</h3>
            <div className="min-h-[80px] space-y-1.5">
              {pendingFolderFiles.length === 0 ? (
                <div className="text-sm text-stone-600 text-center py-6">{t("尚未选择任何文件夹，请点击下方按钮添加。", "No folders selected yet — click the button below to add one.")}</div>
              ) : (
                pendingFolderFiles.map(({ folderName, files }) => (
                  <div key={folderName} className="flex items-center justify-between bg-stone-50 border border-stone-200 rounded px-3 py-1.5 text-sm">
                    <span className="font-medium text-stone-700 truncate flex-1 mr-2">{folderName}</span>
                    <span className="text-stone-600 shrink-0 mr-2">{t(`${files.length} 个文件`, `${files.length} files`)}</span>
                    <button onClick={() => setPendingFolderFiles((p) => p.filter((f) => f.folderName !== folderName))} className="text-stone-600 hover:text-red-500 text-lg leading-none shrink-0">×</button>
                  </div>
                ))
              )}
            </div>
            <label className="flex items-center justify-center gap-1.5 text-sm px-3 py-2 border border-dashed border-stone-400 rounded cursor-pointer text-stone-700 hover:bg-stone-50">
              {t("+ 添加文件夹", "+ Add folder")}
              <input ref={multiFolderInputRef} type="file" webkitdirectory="" multiple onChange={handleMultiFolderPickerChange} className="hidden" />
            </label>
            <label className="flex items-start gap-2 text-sm text-stone-700 border border-stone-200 rounded px-3 py-2 bg-stone-50 cursor-pointer">
              <input
                type="checkbox"
                checked={mirrorSubfolders}
                onChange={(e) => setMirrorSubfolders(e.target.checked)}
                className="accent-amber-600 mt-0.5"
              />
              <span>
                {t("按来源文件夹结构上传", "Upload files and subfolders as the sources")}
                <span className="block text-[12px] text-stone-600 mt-0.5">
                  {t("每个文件夹中的子文件夹将在此处原样创建；不按日期生成年/月文件夹。", "Subfolders in each picked folder are recreated here exactly as they are; no year/month folders are created based on file dates.")}
                </span>
              </span>
            </label>
            <div className="flex justify-end gap-2">
              <button onClick={() => { setFolderPickerOpen(false); setPendingFolderFiles([]); setMirrorSubfolders(false); }} className="text-sm px-3 py-1.5 rounded border border-stone-300 hover:bg-stone-50 text-stone-700">{t("取消", "Cancel")}</button>
              <button
                onClick={handleMultiFolderUpload}
                disabled={pendingFolderFiles.length === 0}
                className="text-sm px-3 py-1.5 rounded bg-amber-600 hover:bg-amber-700 text-white disabled:opacity-40 disabled:cursor-not-allowed"
              >
                {t("上传", "Upload")} {pendingFolderFiles.length > 0 ? t(`(${pendingFolderFiles.flatMap((f) => f.files).length} 个文件)`, `(${pendingFolderFiles.flatMap((f) => f.files).length} files)`) : ""}
              </button>
            </div>
          </div>
        </div>
      )}

      {downloadDialog && (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center" onClick={(e) => { if (e.target === e.currentTarget && !downloadDialog.busy) setDownloadDialog(null); }}>
          <div className="bg-white rounded-lg shadow-xl p-6 w-[28rem] flex flex-col gap-3">
            <h3 className="font-semibold text-base text-stone-800">
              {t(`下载 ${downloadSelectedIds.size} 份文档`, `Download ${downloadSelectedIds.size} document(s)`)}
            </h3>
            <label className="text-sm text-stone-700">
              {t("保存至文件夹", "Save to folder")}
              <div className="mt-1 flex gap-1.5">
                <input
                  type="text"
                  value={downloadDialog.path}
                  onChange={(e) => setDownloadDialog((d) => ({ ...d, path: e.target.value }))}
                  placeholder={t("例如：/Users/你/Downloads", "e.g. /Users/you/Downloads")}
                  className="flex-1 min-w-0 text-sm px-2 py-1.5 border border-stone-300 rounded font-mono"
                />
                <button
                  type="button"
                  onClick={() => setDownloadFolderBrowserOpen(true)}
                  className="shrink-0 flex items-center gap-1 text-sm px-2.5 py-1.5 border border-stone-300 rounded hover:bg-stone-50 text-stone-700"
                >
                  <FolderOpen size={12} /> {t("浏览…", "Browse…")}
                </button>
              </div>
            </label>
            <button
              onClick={openDownloadDialog}
              className="self-start text-[13px] text-amber-700 hover:underline"
            >
              {t("使用默认「下载」文件夹", "Use default Downloads folder")}
            </button>
            <label className="flex items-center gap-2 text-sm text-stone-700">
              <input
                type="checkbox"
                checked={downloadDialog.reveal}
                onChange={(e) => setDownloadDialog((d) => ({ ...d, reveal: e.target.checked }))}
                className="accent-amber-600"
              />
              {t("下载完成后打开该文件夹", "Open the folder after downloading")}
            </label>
            {downloadDialog.error && (
              <div className="text-sm text-red-600 bg-red-50 border border-red-200 rounded px-2 py-1.5">{downloadDialog.error}</div>
            )}
            <div className="flex justify-end gap-2 mt-1">
              <button
                onClick={() => setDownloadDialog(null)}
                disabled={downloadDialog.busy}
                className="text-sm px-3 py-1.5 rounded border border-stone-300 hover:bg-stone-50 text-stone-700 disabled:opacity-40"
              >{t("取消", "Cancel")}</button>
              <button
                onClick={confirmDownloadSelected}
                disabled={downloadDialog.busy || !downloadDialog.path.trim()}
                className="text-sm px-3 py-1.5 rounded bg-amber-600 hover:bg-amber-700 text-white disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5"
              >
                <Download size={12} /> {downloadDialog.busy ? t("下载中…", "Downloading…") : t("下载", "Download")}
              </button>
            </div>
          </div>
        </div>
      )}

      {downloadFolderBrowserOpen && (
        <FolderBrowserModal
          startPath={downloadDialog?.path || ""}
          onClose={() => setDownloadFolderBrowserOpen(false)}
          onSelect={(path) => {
            setDownloadDialog((d) => ({ ...d, path }));
            setDownloadFolderBrowserOpen(false);
          }}
        />
      )}

      {dupDialog && (
        <DuplicateDialog
          duplicates={dupDialog.duplicates}
          totalCount={dupDialog.allFiles.length}
          formatBytes={formatBytes}
          getPathFor={(id) => getNodePathFrom(tree, id)}
          onCancel={() => setDupDialog(null)}
          onUploadAll={() => {
            const { allFiles, targetNodeId, mirror } = dupDialog;
            setDupDialog(null);
            if (mirror) {
              runMirroredUpload(mirror.tree, mirror.fileNodeId, allFiles);
            } else {
              uploadFilesToNode(targetNodeId, allFiles, { skipDuplicates: true });
            }
          }}
          onLink={async () => {
            const { duplicates, allFiles, targetNodeId, mirror } = dupDialog;
            setDupDialog(null);

            if (mirror) {
              // Link each duplicate straight into the folder it would have
              // uploaded to (its resolved mirrored subfolder) instead of
              // storing a second copy of the file.
              let newTree = mirror.tree;
              for (const { file, existing } of duplicates) {
                const linkNodeId = mirror.fileNodeId.get(file) || targetNodeId;
                const target = findNode(newTree, linkNodeId);
                if (!target) continue;
                if ((target.documents || []).some((d) => d.id === existing.id)) continue;
                newTree = updateNodeInTree(newTree, linkNodeId, (n) => ({
                  ...n,
                  documents: [...(n.documents || []), { id: existing.id }],
                }));
              }
              await persistTree(newTree);
              const nonDups = allFiles.filter((f) => !duplicates.some((d) => d.file === f));
              if (nonDups.length) {
                const groups = new Map();
                for (const f of nonDups) {
                  const nid = mirror.fileNodeId.get(f) || targetNodeId;
                  if (!groups.has(nid)) groups.set(nid, []);
                  groups.get(nid).push(f);
                }
                for (const [nid, groupFiles] of groups) {
                  await uploadFilesToNode(nid, groupFiles, {
                    skipDuplicates: true, routeMode: "current-folder", baseTreeOverride: newTree,
                  });
                }
              }
              return;
            }

            // Build all links in one tree update so no call reads stale state.
            // Mirror the upload routing: if the original doc lived in a year/month
            // node, create the same year/month subfolder under the target and link there.
            let newTree = tree;
            for (const { existing } of duplicates) {
              let linkNodeId = targetNodeId;
              if (existing.originalNodeId) {
                const origPath = getNodePathFrom(newTree, existing.originalNodeId);
                const parts = origPath.split(" / ").map((s) => s.trim());
                const n = parts.length;
                if (
                  n >= 2 &&
                  /^\d{4}$/.test(parts[n - 2]) &&
                  /^\d{1,2}$/.test(parts[n - 1])
                ) {
                  const year = parts[n - 2];
                  const month = parts[n - 1].padStart(2, "0");
                  [newTree, linkNodeId] = getOrCreateChild(newTree, targetNodeId, year);
                  [newTree, linkNodeId] = getOrCreateChild(newTree, linkNodeId, month);
                }
              }
              const target = findNode(newTree, linkNodeId);
              if (!target) continue;
              if ((target.documents || []).some((d) => d.id === existing.id)) continue;
              newTree = updateNodeInTree(newTree, linkNodeId, (n) => ({
                ...n,
                documents: [...(n.documents || []), { id: existing.id }],
              }));
            }
            await persistTree(newTree);
            // Upload any non-duplicate files normally
            const nonDups = allFiles.filter((f) => !duplicates.some((d) => d.file === f));
            if (nonDups.length) {
              uploadFilesToNode(targetNodeId, nonDups, { skipDuplicates: true });
            }
          }}
          onSkip={() => {
            const { duplicates, allFiles, targetNodeId, mirror } = dupDialog;
            setDupDialog(null);
            const nonDups = allFiles.filter((f) => !duplicates.some((d) => d.file === f));
            if (mirror) {
              runMirroredUpload(mirror.tree, mirror.fileNodeId, nonDups);
            } else {
              uploadFilesToNode(targetNodeId, nonDups, { skipDuplicates: true });
            }
          }}
        />
      )}

      {showCombineModal && selectedNode && (
        <CombineFolderModal
          node={selectedNode}
          docIndex={docIndex}
          formatBytes={formatBytes}
          onClose={() => setShowCombineModal(false)}
          onSaved={async () => {
            setShowCombineModal(false);
            const r = await StorageAdapter.getTree();
            if (r.tree) setTree(r.tree);
            const idx = await StorageAdapter.listDocumentIndex();
            setDocIndex(idx);
          }}
        />
      )}

      {dmsImportDialog && dmsImportDialog.needsPassword && (
        <div
          className="fixed inset-0 bg-stone-900/70 z-50 flex items-center justify-center p-4"
          onClick={(e) => e.stopPropagation()}
        >
          <div className="bg-white w-full max-w-md rounded shadow-2xl p-5">
            <div className="text-[12px] tracking-[0.2em] uppercase text-stone-700 mb-1">
              {t("导入项目", "Import project")}
            </div>
            <h2 className="text-xl font-semibold text-stone-900 mb-2">
              {t("此文件受密码保护", "This file is password-protected")}
            </h2>
            <p className="text-sm text-stone-700 mb-4">
              <strong className="font-mono">{dmsImportDialog.file.name}</strong>
              {" "}{t("需要导出时设置的密码才能打开（与 DMS 应用登录密码无关）。", "needs the password it was exported with to open (unrelated to the DMS app's own login password).")}
            </p>

            <label className="block text-sm uppercase tracking-wider text-stone-700 mb-1.5">
              {t("密码", "Password")}
            </label>
            <input
              type="password"
              autoFocus
              value={dmsImportDialog.password}
              onChange={(e) => setDmsImportDialog({ ...dmsImportDialog, password: e.target.value })}
              onKeyDown={(e) => { if (e.key === "Enter") inspectDmsFile(dmsImportDialog.file, dmsImportDialog.password); }}
              className="w-full px-2 py-1.5 text-base border border-stone-300 rounded mb-3"
            />

            {dmsImportError && (
              <div className="text-sm text-red-700 bg-red-50 border border-red-200 rounded p-2 mb-3 whitespace-pre-wrap">
                {dmsImportError}
              </div>
            )}

            <div className="flex gap-2 justify-end">
              <button
                onClick={() => { setDmsImportDialog(null); setDmsImportError(null); }}
                className="px-4 py-1.5 text-sm border border-stone-300 hover:bg-stone-100 rounded disabled:opacity-60"
              >
                {t("取消", "Cancel")}
              </button>
              <button
                onClick={() => inspectDmsFile(dmsImportDialog.file, dmsImportDialog.password)}
                disabled={!dmsImportDialog.password}
                className="px-4 py-1.5 text-sm bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-60"
              >
                {t("继续", "Continue")}
              </button>
            </div>
          </div>
        </div>
      )}

      {dmsImportDialog && !dmsImportDialog.needsPassword && (
        <div
          className="fixed inset-0 bg-stone-900/70 z-50 flex items-center justify-center p-4"
          onClick={(e) => e.stopPropagation()}
        >
          <div className="bg-white w-full max-w-md rounded shadow-2xl p-5">
            <div className="text-[12px] tracking-[0.2em] uppercase text-stone-700 mb-1">
              {t("导入项目", "Import project")}
            </div>
            <h2 className="text-xl font-semibold text-stone-900 mb-2">
              {t("请选择文件保存位置", "Choose where to save the files")}
            </h2>
            <p className="text-sm text-stone-700 mb-4">
              {t("正在导入", "Importing")} <strong className="font-mono">{dmsImportDialog.file.name}</strong>
              （{Math.round(dmsImportDialog.file.size / 1024)} KB）
              {dmsImportDialog.projectName && (
                <> — {t("项目", "project")} <strong>{dmsImportDialog.projectName}</strong></>
              )}
            </p>

            <div className="space-y-3 mb-4">
              {dmsImportDialog.sourcePath && dmsImportDialog.sourcePath !== dmsImportDialog.currentPath && (
                <label className="flex items-start gap-2.5 cursor-pointer p-2.5 rounded border border-transparent hover:bg-stone-50 hover:border-stone-200">
                  <input
                    type="radio"
                    name="dmsPathMode"
                    value="source"
                    checked={dmsImportDialog.chosenPathMode === "source"}
                    onChange={() => setDmsImportDialog({ ...dmsImportDialog, chosenPathMode: "source" })}
                    className="mt-0.5 accent-amber-600"
                  />
                  <div>
                    <div className="text-sm font-medium text-stone-800">{t("使用 .dms 文件中的原始路径", "Use the original path from the .dms file")}</div>
                    <div className="text-[13px] font-mono text-amber-700 break-all mt-0.5">
                      {dmsImportDialog.sourcePath}
                    </div>
                    <div className="text-[12px] text-stone-600 mt-0.5">{t("还原此项目至其原来保存的位置", "Restore this project to where it was originally saved")}</div>
                  </div>
                </label>
              )}

              <label className="flex items-start gap-2.5 cursor-pointer p-2.5 rounded border border-transparent hover:bg-stone-50 hover:border-stone-200">
                <input
                  type="radio"
                  name="dmsPathMode"
                  value="current"
                  checked={dmsImportDialog.chosenPathMode === "current"}
                  onChange={() => setDmsImportDialog({ ...dmsImportDialog, chosenPathMode: "current" })}
                  className="mt-0.5 accent-amber-600"
                />
                <div>
                  <div className="text-sm font-medium text-stone-800">
                    {dmsImportDialog.sourcePath && dmsImportDialog.sourcePath !== dmsImportDialog.currentPath
                      ? t("保留当前路径", "Keep the current path") : t("保存到当前路径", "Save to the current path")}
                  </div>
                  <div className="text-[13px] font-mono text-stone-700 break-all mt-0.5">
                    {dmsImportDialog.currentPath || t("（未配置）", "(not configured)")}
                  </div>
                </div>
              </label>

              <label className="flex items-start gap-2.5 cursor-pointer p-2.5 rounded border border-transparent hover:bg-stone-50 hover:border-stone-200">
                <input
                  type="radio"
                  name="dmsPathMode"
                  value="custom"
                  checked={dmsImportDialog.chosenPathMode === "custom"}
                  onChange={() => setDmsImportDialog({ ...dmsImportDialog, chosenPathMode: "custom" })}
                  className="mt-0.5 accent-amber-600"
                />
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-medium text-stone-800 mb-1">{t("自定义路径", "Custom path")}</div>
                  <input
                    type="text"
                    placeholder={isMacDMS ? "/Users/yourname/DMS_Imported" : "C:\\DMS_Imported"}
                    value={dmsImportDialog.customPath}
                    onClick={() => setDmsImportDialog({ ...dmsImportDialog, chosenPathMode: "custom" })}
                    onChange={(e) => setDmsImportDialog({ ...dmsImportDialog, chosenPathMode: "custom", customPath: e.target.value })}
                    className="w-full px-2 py-1 text-sm border border-stone-300 rounded font-mono focus:outline-none focus:border-amber-500"
                  />
                </div>
              </label>
            </div>

            <div className="text-[13px] text-stone-600 bg-stone-50 border border-stone-200 rounded px-3 py-2 mb-4">
              {t("导入只恢复文件夹树结构（index），不会删除磁盘上已有的文件。", "Import only restores the folder tree structure (index); it doesn't delete any existing files on disk.")}
            </div>

            {dmsImportError && (
              <div className="text-sm text-red-700 bg-red-50 border border-red-200 rounded p-2 mb-3 whitespace-pre-wrap">
                {dmsImportError}
              </div>
            )}

            <div className="flex gap-2 justify-end">
              <button
                onClick={() => { setDmsImportDialog(null); setDmsImportError(null); }}
                disabled={dmsImportBusy}
                className="px-4 py-1.5 text-sm border border-stone-300 hover:bg-stone-100 rounded disabled:opacity-60"
              >
                {t("取消", "Cancel")}
              </button>
              <button
                onClick={doImportFromDialog}
                disabled={dmsImportBusy || (dmsImportDialog.chosenPathMode === "custom" && !dmsImportDialog.customPath.trim())}
                className="px-4 py-1.5 text-sm bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-60"
              >
                {dmsImportBusy ? t("导入中…", "Importing…") : t("导入并切换", "Import and switch")}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// A `?popout=plot&key=...` URL (opened by FolderPlotDialog's "pop out"
// button, see popOut() there) renders just the standalone chart window
// instead of the full app -- this is a separate top-level browser window,
// not part of the main app's UI tree.
const _popoutParams = new URLSearchParams(location.search);
const root = ReactDOM.createRoot(document.getElementById("root"));
if (_popoutParams.get("popout") === "plot") {
  root.render(<PlotPopoutApp storageKey={_popoutParams.get("key") || ""} />);
} else {
  root.render(<Root />);
}

// Startup banner
console.log("%c[DMS] Document Management System loaded — build 2026-06-02-text-tree","color:#b45309;font-weight:bold;font-size:14px");
console.log("[DMS] Storage backend: REST API (Python server)");
console.log("[DMS] To diagnose storage, run: dmsDiag()");

// Global diagnostic helper — type dmsDiag() in console to inspect state
window.dmsDiag = async function() {
  console.group("[DMS] Diagnostic report");
  try {
    const settings = await StorageAdapter.getSettings();
    console.log("Settings:", settings);
    const res = await fetch("/api/diag");
    const diag = await res.json();
    console.log("Server diagnostic:", diag);
    if (diag.files_in_root && diag.files_in_root.length) {
      console.log("Files in storage root:", diag.files_in_root);
    }
    if (diag.files_in_docs && diag.files_in_docs.length) {
      console.log(`Files in docs/ subfolder (${diag.files_in_docs.length}):`, diag.files_in_docs);
    }
  } catch (e) {
    console.error("Diagnostic failed:", e);
  }
  console.groupEnd();
};
</script>
</body>
</html>
