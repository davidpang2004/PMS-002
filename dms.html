const CombineFolderModal = ({ node, docIndex, formatBytes, onClose, onSaved }) => {
  const { t } = useLang();
  const [includeSubfolders, setIncludeSubfolders] = useState(false);
  const [title, setTitle] = useState(node.name || "Combined Documents");
  const [selectedKeys, setSelectedKeys] = useState(new Set());
  const [generating, setGenerating] = useState(false);
  const [error, setError] = useState(null);

  const docsById = useMemo(() => new Map(docIndex.map((d) => [d.id, d])), [docIndex]);

  const docEntries = useMemo(() => {
    const entries = [];
    for (const d of (node.documents || [])) {
      entries.push({ nodeId: node.id, docId: d.id, nodeName: node.name });
    }
    if (includeSubfolders) {
      const walkChildren = (n) => {
        for (const child of (n.children || [])) {
          for (const d of (child.documents || [])) {
            entries.push({ nodeId: child.id, docId: d.id, nodeName: child.name });
          }
          walkChildren(child);
        }
      };
      walkChildren(node);
    }
    return entries;
  }, [node, includeSubfolders]);

  useEffect(() => {
    setSelectedKeys(new Set(docEntries.map((e) => e.nodeId + ":" + e.docId)));
  }, [docEntries]);

  const toggle = (nodeId, docId) => {
    const k = nodeId + ":" + docId;
    setSelectedKeys((prev) => {
      const n = new Set(prev);
      if (n.has(k)) n.delete(k); else n.add(k);
      return n;
    });
  };

  const generate = async () => {
    setError(null);
    setGenerating(true);
    try {
      const nodeDocMap = new Map();
      for (const e of docEntries) {
        if (selectedKeys.has(e.nodeId + ":" + e.docId)) {
          if (!nodeDocMap.has(e.nodeId)) nodeDocMap.set(e.nodeId, []);
          nodeDocMap.get(e.nodeId).push(e.docId);
        }
      }
      const selection = Array.from(nodeDocMap.entries()).map(([nodeId, docIds]) => ({ nodeId, docIds }));
      if (!selection.length) { setError(t("请至少选择一份文档", "Select at least one document")); setGenerating(false); return; }

      const res = await fetch("/api/docs/combine-to-folder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          node_id: node.id,
          title: title.trim() || node.name,
          selection,
        }),
      });
      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try { msg = (await res.json()).error || msg; } catch {}
        throw new Error(msg);
      }
      await res.json();
      onSaved();
    } catch (e) {
      setError(e.message);
    } finally {
      setGenerating(false);
    }
  };

  return (
    <div
      className="fixed inset-0 bg-stone-900/70 z-50 flex items-center justify-center p-4"
      onClick={() => !generating && onClose()}
    >
      <div
        className="bg-white w-full max-w-lg rounded shadow-2xl flex flex-col max-h-[88vh]"
        onClick={(e) => e.stopPropagation()}
      >
        {/* Header */}
        <div className="flex items-center justify-between px-5 pt-5 pb-3 border-b border-stone-200">
          <div>
            <div className="text-[12px] tracking-[0.2em] uppercase text-stone-700 mb-0.5">{t("合并文档", "Merge documents")}</div>
            <h2 className="text-lg font-semibold text-stone-900">{node.name}</h2>
          </div>
          <button onClick={onClose} disabled={generating} className="text-stone-600 hover:text-stone-700 p-1">
            <X size={16} />
          </button>
        </div>

        {/* Options */}
        <div className="px-5 py-3 border-b border-stone-200 space-y-3">
          <div>
            <label className="text-[12px] uppercase tracking-wider text-stone-700 block mb-1">{t("输出文件名", "Output filename")}</label>
            <input
              type="text"
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              className="w-full text-base border border-stone-300 rounded px-2 py-1.5 focus:outline-none focus:border-amber-500"
              placeholder={t("合并文档标题", "Merged document title")}
            />
          </div>
          <label className="flex items-center gap-2 text-base text-stone-700 cursor-pointer select-none">
            <input
              type="checkbox"
              checked={includeSubfolders}
              onChange={(e) => setIncludeSubfolders(e.target.checked)}
              className="accent-amber-600"
            />
            {t("包含子文件夹中的文档", "Include documents in subfolders")}
          </label>
        </div>

        {/* Document list */}
        <div className="flex-1 overflow-auto px-5 py-2">
          {docEntries.length === 0 ? (
            <div className="text-base text-stone-700 py-6 text-center">
              {includeSubfolders ? t("此文件夹及子文件夹中暂无文档", "No documents in this folder or its subfolders") : t("此文件夹中暂无文档", "No documents in this folder")}
            </div>
          ) : (
            <>
              <div className="flex items-center justify-between mb-2">
                <span className="text-[13px] text-stone-700">
                  {t("已选", "Selected")} <span className="font-mono tabular-nums">{selectedKeys.size}</span> / {docEntries.length} {t("份", "")}
                </span>
                <div className="flex gap-3">
                  <button
                    onClick={() => setSelectedKeys(new Set(docEntries.map((e) => e.nodeId + ":" + e.docId)))}
                    className="text-[13px] text-amber-700 hover:text-amber-900"
                  >{t("全选", "Select all")}</button>
                  <button
                    onClick={() => setSelectedKeys(new Set())}
                    className="text-[13px] text-stone-700 hover:text-stone-700"
                  >{t("清除", "Clear")}</button>
                </div>
              </div>
              <div className="space-y-0.5">
                {docEntries.map((entry) => {
                  const doc = docsById.get(entry.docId);
                  const k = entry.nodeId + ":" + entry.docId;
                  const checked = selectedKeys.has(k);
                  return (
                    <div
                      key={k}
                      onClick={() => toggle(entry.nodeId, entry.docId)}
                      className={`flex items-center gap-2 px-2 py-1.5 rounded cursor-pointer text-base ${checked ? "bg-amber-50" : "hover:bg-stone-50"}`}
                    >
                      <span className="shrink-0">
                        {checked
                          ? <CheckSquare size={13} className="text-amber-700" />
                          : <Square size={13} className="text-stone-600" />}
                      </span>
                      {doc?.mime?.startsWith("image/")
                        ? <ImageIcon size={12} className="text-stone-600 shrink-0" />
                        : <FileText size={12} className="text-stone-600 shrink-0" />}
                      <span className="truncate flex-1 text-stone-700">{doc?.name || entry.docId}</span>
                      {includeSubfolders && entry.nodeName !== node.name && (
                        <span className="text-[12px] text-stone-600 shrink-0 italic">{entry.nodeName}</span>
                      )}
                      {doc && (
                        <span className="text-[12px] text-stone-600 shrink-0 font-mono">{formatBytes(doc.size)}</span>
                      )}
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>

        {/* Footer */}
        <div className="px-5 py-4 border-t border-stone-200">
          {error && (
            <div className="text-sm text-red-600 bg-red-50 border border-red-200 rounded px-3 py-2 mb-3">{error}</div>
          )}
          <button
            onClick={generate}
            disabled={generating || selectedKeys.size === 0}
            className="w-full px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white text-base font-medium rounded disabled:opacity-40 flex items-center justify-center gap-2"
          >
            {generating ? <Loader size={14} className="animate-spin" /> : <Save size={14} />}
            {generating ? t("合并中…", "Merging…") : t(`合并 ${selectedKeys.size} 份文档并保存至此文件夹`, `Merge ${selectedKeys.size} documents and save to this folder`)}
          </button>
          <p className="text-[12px] text-stone-700 text-center mt-1.5">
            {t("合并后的 PDF 保存在当前文件夹，原始文档从文件夹中移除（文件仍保留在文件库中）", "The merged PDF is saved to the current folder; the original documents are removed from the folder (files remain in the library)")}
          </p>
        </div>
      </div>
    </div>
  );
};


const SendToPhoneDialog = ({ doc, onClose }) => {
  const { t } = useLang();
  const isMac = typeof navigator !== "undefined" && /Mac|iPhone|iPad/.test(navigator.platform);
  const saved = typeof localStorage !== "undefined" ? localStorage.getItem("pms_last_phone") || "" : "";
  const [phone, setPhone] = useState(saved);
  const [status, setStatus] = useState(null); // null | { ok, msg, url, method, local_ip, port, is_tunnel }
  const [busy, setBusy] = useState(false);
  const [urlCopied, setUrlCopied] = useState(false);
  const [showFirewallHelp, setShowFirewallHelp] = useState(false);

  const send = async () => {
    const p = phone.trim();
    if (!p) { setStatus({ ok: false, msg: t("请输入手机号码。", "Please enter a phone number.") }); return; }
    setBusy(true);
    setStatus({ pending: true, msg: t("正在建立安全通道，请稍候（约 15 秒）…", "Establishing a secure tunnel, please wait (about 15 seconds)…") });
    try {
      const r = await fetch("/api/send-to-phone", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ doc_id: doc.id, phone: p }),
      });
      const data = await r.json();
      if (data.ok) {
        localStorage.setItem("pms_last_phone", p);
        const methodMsg =
          data.method === "messages"   ? t(`已通过「信息」App 发送至 ${p}`, `Sent to ${p} via the Messages app`) :
          data.method === "phone_link" ? t(`已尝试通过 Phone Link 打开短信至 ${p}`, `Tried opening an SMS to ${p} via Phone Link`) :
                                         t("链接已生成，请手动复制发送：", "Link generated — please copy and send it manually:");
        setStatus({ ok: true, msg: methodMsg, url: data.url, method: data.method,
                    local_ip: data.local_ip, port: data.port, is_tunnel: data.is_tunnel });
      } else {
        setStatus({ ok: false, msg: data.error || t("发送失败。", "Send failed.") });
      }
    } catch (e) {
      setStatus({ ok: false, msg: t("网络错误：", "Network error: ") + e.message });
    } finally { setBusy(false); }
  };

  const copyUrl = async () => {
    if (!status?.url) return;
    try {
      await navigator.clipboard.writeText(status.url);
      setUrlCopied(true);
      setTimeout(() => setUrlCopied(false), 1500);
    } catch { /* clipboard blocked */ }
  };

  const openWeChat = async () => {
    if (!status?.url) return;
    try { await navigator.clipboard.writeText(status.url); } catch {}
    const a = document.createElement('a');
    a.href = 'weixin://';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setStatus(s => ({ ...s, msg: t("链接已复制，请在微信中粘贴发送给对方。", "Link copied — paste it in WeChat to send.") }));
  };

  return (
    <div className="fixed inset-0 bg-stone-900/60 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded shadow-2xl w-full max-w-md p-5" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2 text-stone-800">
            <Phone size={15} className="text-amber-600" />
            <span className="text-base font-semibold">{t("发送至手机", "Send to phone")}</span>
          </div>
          <button onClick={onClose} className="text-stone-600 hover:text-stone-700"><X size={15} /></button>
        </div>
        <div className="text-sm text-stone-700 mb-3 truncate" title={doc.name}>{doc.name}</div>
        <label className="block text-[12px] uppercase tracking-wider text-stone-700 mb-1">{t("手机号码", "Phone number")}</label>
        <input
          autoFocus
          type="tel"
          value={phone}
          onChange={(e) => setPhone(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") send(); if (e.key === "Escape") onClose(); }}
          placeholder="+86 138 0000 0000"
          className="w-full px-3 py-2 border border-stone-300 rounded text-base focus:outline-none focus:border-amber-500 mb-3"
        />

        {status && (
          <div className={`text-sm rounded px-3 py-2 mb-3 ${status.pending ? "bg-amber-50 text-amber-800 border border-amber-200" : status.ok ? "bg-green-50 text-green-800 border border-green-200" : "bg-red-50 text-red-700 border border-red-200"}`}>
            <div>{status.msg}</div>
            {status.ok && status.url && (
              <div className="mt-2 space-y-1.5">
                <div className="flex items-center gap-1.5">
                  <span className="font-mono text-[12px] truncate flex-1 text-green-900 select-all">{status.url}</span>
                  <button onClick={copyUrl} className="shrink-0 text-[12px] px-2 py-0.5 border border-green-400 rounded hover:bg-green-100">
                    {urlCopied ? t("已复制", "Copied") : t("复制", "Copy")}
                  </button>
                </div>
                {!isMac && (
                  <button onClick={openWeChat} className="w-full text-[12px] px-2 py-1 bg-green-600 text-white rounded hover:bg-green-700">
                    {t("复制链接并打开微信", "Copy link and open WeChat")}
                  </button>
                )}
              </div>
            )}
            {/* Show network requirement notice when using local IP */}
            {status.ok && !status.is_tunnel && status.local_ip && (
              <div className="mt-2 pt-2 border-t border-green-200 space-y-1">
                <div className="text-[12px] text-green-700">
                  {t("链接使用本地 IP", "The link uses the local IP")} <span className="font-mono font-bold">{status.local_ip}:{status.port}</span>{t("，需满足：", " — this requires:")}
                </div>
                <div className="text-[12px] text-green-700">{t("① 手机与此 Mac 连接在", "① The phone is connected to ")}<strong>{t("同一 Wi-Fi", "the same Wi-Fi")}</strong>{t(" ", " as this Mac")}</div>
                <div className="text-[12px] text-green-700">{t("② macOS 防火墙已允许 DMS.app 接受连接", "② The macOS firewall allows DMS.app to accept connections")}</div>
                <button
                  onClick={() => setShowFirewallHelp(!showFirewallHelp)}
                  className="text-[12px] text-amber-700 underline mt-0.5"
                >
                  {showFirewallHelp ? t("收起", "Collapse") : t("链接打不开？查看解决方法 ▾", "Link won't open? See troubleshooting ▾")}
                </button>
                {showFirewallHelp && (
                  <div className="mt-1 text-[12px] text-stone-700 bg-amber-50 border border-amber-200 rounded p-2 space-y-1.5 leading-relaxed">
                    <div className="font-semibold text-amber-800">{t("「找不到服务器」的常见原因：", "Common reasons for “server not found”:")}</div>
                    <div className="font-medium text-stone-800">{t("① 手机未连 Wi-Fi（最常见）", "① Phone isn't connected to Wi-Fi (most common)")}</div>
                    <div className="pl-2">{t("→ 打开手机「设置」→「Wi-Fi」，确认已连接且", "→ Open the phone's Settings → Wi-Fi, and confirm it's connected and ")}<strong>{t("与此 Mac 在同一网络", "on the same network as this Mac")}</strong>{t("，而非使用蜂窝数据。", ", not using cellular data.")}</div>

                    <div className="pl-2">{t("→ 系统设置 → 网络 → 防火墙 → 选项…", "→ System Settings → Network → Firewall → Options…")}</div>

                    <div className="pl-2">{t("→ 登录路由器管理页，关闭「AP 隔离」/「客户端隔离」。", "→ Log into the router's admin page and turn off “AP isolation” / “client isolation”.")}</div>
                    <div className="pt-1 text-amber-700 font-medium">{t("以上都试过还是不行？使用 Launcher 窗口中的「Remote Upload」，通过公网发送，不受 Wi-Fi 限制。", "Still not working after trying all of these? Use “Remote Upload” in the Launcher window to send over the public internet, unaffected by Wi-Fi restrictions.")}</div>

          </div>
        )}

        <div className="text-[12px] text-stone-600 mb-3">
          {isMac
            ? t("通过 Mac「信息」App 以 iMessage 或短信发送 1 小时有效的下载链接。", "Sends a download link valid for 1 hour via the Mac Messages app, as iMessage or SMS.")
            : t("点击「发送链接」生成下载链接，再点「复制链接并打开微信」粘贴发送给对方。", "Click “Send link” to generate a download link, then click “Copy link and open WeChat” to paste and send it.")}
        </div>
        <div className="flex gap-2">
          <button onClick={onClose} className="flex-1 px-3 py-1.5 text-sm border border-stone-300 hover:bg-stone-100 rounded">{t("取消", "Cancel")}</button>

            onClick={send}
            disabled={busy}
            className="flex-1 px-3 py-1.5 text-sm bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-50 flex items-center justify-center gap-1.5"
          >
            <Phone size={11} /> {busy ? t("发送中…", "Sending…") : t("发送链接", "Send link")}

const SendEmailDialog = ({ doc, onClose, onOpenEmailSettings }) => {
  const { t } = useLang();
  const savedTo = typeof localStorage !== "undefined" ? localStorage.getItem("pms_last_email") || "" : "";
  const [to, setTo] = useState(savedTo);
  const [subject, setSubject] = useState(doc?.name || "");
  const [body, setBody] = useState("");
  const [status, setStatus] = useState(null); // null | {ok, msg}
  const [busy, setBusy] = useState(false);
  const [smtpConfigured, setSmtpConfigured] = useState(null); // null=loading, true/false
  const isMac = typeof navigator !== "undefined" && /Mac|iPhone|iPad/.test(navigator.platform);

  useEffect(() => {
    fetch("/api/email-settings")
      .then((r) => r.json())
      .then((d) => setSmtpConfigured(!!d.configured))
      .catch(() => setSmtpConfigured(false));
  }, []);

  const send = async () => {
    const addr = to.trim();
    if (!addr) { setStatus({ ok: false, msg: t("请输入收件人邮箱地址。", "Please enter the recipient's email address.") }); return; }
    if (!addr.includes("@")) { setStatus({ ok: false, msg: t("邮箱地址格式不正确。", "The email address format is invalid.") }); return; }
    setBusy(true); setStatus(null);
    try {
      const r = await fetch("/api/send-email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ doc_id: doc.id, to: addr, subject: subject.trim(), body: body.trim() }),
      });
      const data = await r.json();
      if (data.ok) {
        localStorage.setItem("pms_last_email", addr);
        const successMsg = data.method === "smtp"
          ? t("邮件已成功发送。", "Email sent successfully.")
          : t("已在 Mail 应用中打开新邮件，请检查并发送。", "A new email has been opened in Mail — please review and send it.");
        setStatus({ ok: true, msg: successMsg });
      } else {
        setStatus({ ok: false, msg: data.error || t("发送失败。", "Send failed.") });
      }
    } catch (e) {
      setStatus({ ok: false, msg: t("网络错误：", "Network error: ") + e.message });
    } finally { setBusy(false); }
  };

  const methodNote = smtpConfigured === null
    ? t("正在检查邮件设置…", "Checking email settings…")
    : smtpConfigured
      ? t("邮件将通过 SMTP 直接发送至收件人。", "The email will be sent directly to the recipient via SMTP.")
      : isMac
        ? t("未配置 SMTP，将在 Mail 应用中打开一封带附件的新邮件，您可以检查后手动发送。", "SMTP isn't configured — a new email with the attachment will open in Mail for you to review and send manually.")
        : t("未配置 SMTP 邮件设置，无法在 Windows 上发送邮件。", "SMTP email isn't configured, so email can't be sent on Windows.");

  const buttonLabel = smtpConfigured
    ? (busy ? t("正在发送…", "Sending…") : t("发送邮件", "Send email"))
    : (busy ? t("正在准备…", "Preparing…") : isMac ? t("通过 Mail App 准备", "Prepare via Mail app") : t("发送邮件", "Send email"));

  return (
    <div className="fixed inset-0 bg-stone-900/60 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded shadow-2xl w-full max-w-sm p-5" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2 text-stone-800">
            <Mail size={15} className="text-amber-600" />
            <span className="text-base font-semibold">{t("通过邮件发送", "Send by email")}</span>
          </div>
          <button onClick={onClose} className="text-stone-600 hover:text-stone-700"><X size={15} /></button>
        </div>
        <div className="text-sm text-stone-700 mb-3 truncate" title={doc.name}>{doc.name}</div>

        <label className="block text-[12px] uppercase tracking-wider text-stone-700 mb-1">{t("收件人", "Recipient")}</label>
        <input
          autoFocus
          type="email"
          value={to}
          onChange={(e) => setTo(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") send(); if (e.key === "Escape") onClose(); }}
          placeholder="example@email.com"
          className="w-full px-3 py-2 border border-stone-300 rounded text-base focus:outline-none focus:border-amber-500 mb-2"
        />

        <label className="block text-[12px] uppercase tracking-wider text-stone-700 mb-1">{t("主题", "Subject")}</label>
        <input
          type="text"
          value={subject}
          onChange={(e) => setSubject(e.target.value)}
          placeholder={t("邮件主题", "Email subject")}
          className="w-full px-3 py-2 border border-stone-300 rounded text-base focus:outline-none focus:border-amber-500 mb-2"
        />

        <label className="block text-[12px] uppercase tracking-wider text-stone-700 mb-1">{t("正文（可选）", "Body (optional)")}</label>
        <textarea
          value={body}
          onChange={(e) => setBody(e.target.value)}
          placeholder={t("请见附件。", "Please see attached.")}
          rows={2}
          className="w-full px-3 py-2 border border-stone-300 rounded text-base focus:outline-none focus:border-amber-500 mb-3 resize-none"
        />

        {status && (
          <div className={`text-sm rounded px-3 py-2 mb-3 ${status.ok ? "bg-green-50 text-green-800 border border-green-200" : "bg-red-50 text-red-700 border border-red-200"}`}>
            {status.msg}
          </div>
        )}
        <div className="text-[12px] text-stone-600 mb-3 flex items-center justify-between gap-2">
          <span>{methodNote}</span>
          {!smtpConfigured && onOpenEmailSettings && (
            <button
              onClick={() => { onClose(); onOpenEmailSettings(); }}
              className="text-amber-600 hover:underline whitespace-nowrap"
            >
              {t("配置 SMTP", "Configure SMTP")}
            </button>
          )}
        </div>
        <div className="flex gap-2">
          <button onClick={onClose} className="flex-1 px-3 py-1.5 text-sm border border-stone-300 hover:bg-stone-100 rounded">{t("取消", "Cancel")}</button>
          <button
            onClick={send}
            disabled={busy || (!smtpConfigured && !isMac)}
            className="flex-1 px-3 py-1.5 text-sm bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-50 flex items-center justify-center gap-1.5"

  );

/* A small, draggable, non-blocking preview panel — unlike DocumentViewer
 * (a full modal) or window.open (a separate OS window), this floats over
 * the current page so a document stays visible while its metadata fields,
 * elsewhere in the same window, stay focusable and editable. */
const FLOATING_PREVIEW_MIN_W = 260;
const FLOATING_PREVIEW_MIN_H = 180;

/* =============================================================================
 * FUZZY TEXT SEARCH — used by the floating preview's "find in document" bar.
 * Matches don't need to be exact (OCR misreads a character, the user isn't
 * sure of the exact wording, ...): a candidate passage is accepted once it's
 * at least `threshold` similar to the query, by normalized edit distance.
 * =============================================================================
 */
const FUZZY_MATCH_THRESHOLD = 0.7; // "70% similar", per the feature request

// Classic iterative Levenshtein distance, O(n*m) — only ever run here on
// short strings (a query-sized window of text), never a whole document.
const _levenshtein = (a, b) => {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  let prev = new Array(n + 1);
  let curr = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    curr[0] = i;
    const ca = a.charCodeAt(i - 1);
    for (let j = 1; j <= n; j++) {
      const cost = ca === b.charCodeAt(j - 1) ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
    }
    const tmp = prev; prev = curr; curr = tmp;
  }
  return prev[n];
};

const _similarity = (a, b) => {
  const maxLen = Math.max(a.length, b.length);
  return maxLen === 0 ? 1 : 1 - _levenshtein(a, b) / maxLen;
};

// Two passes: (1) every literal case-insensitive occurrence of `query` is
// matched outright — this is what lets a partial word/phrase like "chole"
// find "cholesterol" even when it's far below `threshold`; (2) a fuzzy pass
// slides a window across `text` — sized to the query's word count, plus a
// +/-1-word variant to tolerate OCR dropping or inserting a stray token —
// and keeps every position at least `threshold` similar to `query`, for
// typo tolerance. Returns matches in document order: [{ start, end, text:
// <actual matched substring>, score }]. `text` is scanned once for the
// substring pass plus once per window size, never a full O(n*m) scan.
const fuzzyFindAll = (text, query, threshold = FUZZY_MATCH_THRESHOLD) => {
  const q = (query || "").trim();
  if (!q || !text) return [];
  const qLower = q.toLowerCase();
  const qWords = q.split(/\s+/).filter(Boolean).length;

  const candidates = [];

  // Plain substring pass — a literal case-insensitive occurrence of the
  // query (e.g. "chole" inside "cholesterol", or a partial phrase) is
  // always accepted, regardless of `threshold`. This is what makes partial
  // words/phrases findable even at a strict similarity setting; the
  // window-based fuzzy pass below is only needed for typo tolerance.
  const textLower = text.toLowerCase();
  let searchFrom = 0, idx;
  while ((idx = textLower.indexOf(qLower, searchFrom)) !== -1) {
    candidates.push({ start: idx, end: idx + q.length, text: text.slice(idx, idx + q.length), score: 1 });
    searchFrom = idx + 1;
  }

  const tokens = [];
  const re = /\S+/g;
  let m;
  while ((m = re.exec(text))) tokens.push({ start: m.index, end: m.index + m[0].length });

  const windowSizes = new Set([qWords, qWords + 1, Math.max(1, qWords - 1)]);
  for (const wsize of windowSizes) {
    for (let i = 0; i + wsize <= tokens.length; i++) {
      const start = tokens[i].start;
      const end = tokens[i + wsize - 1].end;
      const slice = text.slice(start, end);
      const score = _similarity(slice.toLowerCase(), qLower);
      if (score >= threshold) candidates.push({ start, end, text: slice, score });
    }
  }

  // Sort by position, then collapse overlapping windows (the +/-1-word
  // sizes above deliberately produce overlapping candidates around a single
  // real match) down to the best-scoring one per overlapping cluster.
  candidates.sort((a, b) => a.start - b.start || b.score - a.score);
  const matches = [];
  for (const c of candidates) {
    const last = matches[matches.length - 1];
    if (last && c.start < last.end) {
      if (c.score > last.score) matches[matches.length - 1] = c;
      continue;
    }
    matches.push(c);
  }
  return matches;
};

// A short window of plain text around a match, for display in the search
// bar (whitespace collapsed so a match spanning a line break still reads as
// one line).
const snippetAround = (text, start, end, radius = 50) => ({
  before: text.slice(Math.max(0, start - radius), start).replace(/\s+/g, " ").trimStart(),
  match: text.slice(start, end),
  after: text.slice(end, end + radius).replace(/\s+/g, " ").trimEnd(),
});

// Map a character offset in the extracted text back to the PDF page it came
// from, using the page_ranges info returned alongside the text (see
// extract_text_from_pdf in pdf_extraction.py) -- lets the floating preview
// jump the embedded viewer to the right page for a match. Returns the
// 1-based page number, or null if there's no range info to go on.
const pageForOffset = (pageRanges, offset) => {
  if (!pageRanges || !pageRanges.length) return null;
  for (const r of pageRanges) {
    if (offset >= r.start && offset < r.end) return r.page;
  }
  // Offset landed in the "\n\n" gap between two pages' text (or past the
  // end) -- attribute it to the nearest following page, or the last page.
  for (const r of pageRanges) {
    if (offset < r.start) return r.page;
  }
  return pageRanges[pageRanges.length - 1].page;
};

/* =============================================================================
 * PDF.JS-BASED PDF VIEWER — used inside the floating preview so a search
 * match can be highlighted and scrolled to on the actual rendered page
 * (Chrome's built-in PDF viewer is an opaque plugin our JS can't draw on
 * top of or script into -- confirmed while building the page-jump feature).
 * Vendored under vendor/pdfjs/ (Mozilla's pdf.js, Apache-2.0): pdf.min.mjs
 * (core), pdf.worker.min.mjs, and the official pdf_viewer.mjs/.css "viewer
 * components" build, which is the same EventBus/PDFViewer/PDFFindController
 * wiring Firefox's own PDF viewer uses -- see
 * https://github.com/mozilla/pdf.js/blob/master/examples/components/.
 * All three files must stay on the SAME pdf.js version (pdf_viewer.mjs
 * hard-checks it against pdf.min.mjs's version at construction time).
 * =============================================================================
 */
let _pdfjsLoadPromise = null;
const loadPdfJs = () => {
  if (!_pdfjsLoadPromise) {
    _pdfjsLoadPromise = (async () => {
      const pdfjsLib = await import(`${API_BASE}/vendor/pdfjs/pdf.min.mjs`);
      pdfjsLib.GlobalWorkerOptions.workerSrc = `${API_BASE}/vendor/pdfjs/pdf.worker.min.mjs`;
      // Must load AFTER pdf.min.mjs: pdf_viewer.mjs reads pdf.js core off
      // globalThis.pdfjsLib (set as a side effect of the import above)
      // rather than importing it itself.
      const pdfjsViewer = await import(`${API_BASE}/vendor/pdfjs/pdf_viewer.mjs`);
      // The official stylesheet is a full "viewer app" CSS file (toolbar,
      // sidebar, annotation editor, ...) we don't use most of -- rather than
      // hand-trim it (fragile against pdf.js updates), load it wrapped in
      // @scope so none of its selectors can ever apply outside our own
      // viewer's DOM subtree, regardless of how generic a class name it uses.
      if (!document.getElementById("pdfjs-viewer-css")) {
        const res = await fetch(`${API_BASE}/vendor/pdfjs/pdf_viewer.css`);
        const cssText = await res.text();
        const style = document.createElement("style");
        style.id = "pdfjs-viewer-css";
        style.textContent = `@scope (.pdfjs-viewer-root) {\n${cssText}\n}`;
        document.head.appendChild(style);
      }
      return { pdfjsLib, pdfjsViewer };
    })();
  }
  return _pdfjsLoadPromise;
};

// jumpToPage/highlightText/jumpNonce mirror the same contract the old
// iframe-hash approach used (see FloatingDocPreview) -- jumpToPage is the
// authoritative target (from the server-side, OCR-capable text search) and
// always takes effect; highlightText additionally asks pdf.js's own find
// controller to highlight the exact occurrence, which only lights up when
// this page has pdf.js's own embedded text layer (silently does nothing for
// a scanned/OCR-only page -- the page jump above already got the user
// there, so nothing regresses).
const PdfViewerPanel = ({ url, jumpToPage, highlightText, jumpNonce }) => {
  const { t } = useLang();
  const containerRef = useRef(null);
  const viewerDivRef = useRef(null);
  const instanceRef = useRef(null);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState("");
  const [pageInfo, setPageInfo] = useState({ page: 1, count: 0 });
  const [scalePct, setScalePct] = useState(100);
  const [pageInput, setPageInput] = useState("1");

  useEffect(() => {
    let cancelled = false;
    setReady(false);
    setError("");
    (async () => {
      try {
        const { pdfjsLib, pdfjsViewer } = await loadPdfJs();
        if (cancelled) return;

        const eventBus = new pdfjsViewer.EventBus();
        const linkService = new pdfjsViewer.PDFLinkService({ eventBus });
        const findController = new pdfjsViewer.PDFFindController({ eventBus, linkService });
        const pdfViewer = new pdfjsViewer.PDFViewer({
          container: containerRef.current,
          viewer: viewerDivRef.current,
          eventBus, linkService, findController,
        });
        linkService.setViewer(pdfViewer);

        eventBus.on("pagesinit", () => {
          if (cancelled) return;
          pdfViewer.currentScaleValue = "page-width";
        });
        eventBus.on("pagechanging", (e) => {
          if (cancelled) return;
          setPageInfo((p) => ({ ...p, page: e.pageNumber }));
          setPageInput(String(e.pageNumber));
        });
        eventBus.on("scalechanging", (e) => {
          if (cancelled) return;
          setScalePct(Math.round(e.scale * 100));
        });

        instanceRef.current = { pdfjsLib, pdfjsViewer, eventBus, linkService, findController, pdfViewer };

        const doc = await pdfjsLib.getDocument({ url }).promise;
        if (cancelled) { doc.destroy(); return; }
        instanceRef.current.doc = doc;
        pdfViewer.setDocument(doc);
        linkService.setDocument(doc, null);
        setPageInfo({ page: 1, count: doc.numPages });
        setPageInput("1");
        setReady(true);
      } catch (e) {
        if (!cancelled) setError(e?.message || String(e));
      }
    })();
    return () => {
      cancelled = true;
      const inst = instanceRef.current;
      instanceRef.current = null;
      try { inst?.pdfViewer?.setDocument(null); } catch {}
      try { inst?.doc?.destroy(); } catch {}
    };
  }, [url]);

  useEffect(() => {
    const inst = instanceRef.current;
    if (!ready || !inst || !highlightText) return;
    if (jumpToPage) {
      try { inst.pdfViewer.currentPageNumber = jumpToPage; } catch {}
    }
    inst.eventBus.dispatch("find", {
      type: "", query: highlightText, phraseSearch: true,
      caseSensitive: false, entireWord: false, highlightAll: true, findPrevious: false,
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [ready, jumpToPage, highlightText, jumpNonce]);

  const zoomBy = (factor) => {
    const inst = instanceRef.current;
    if (!inst) return;
    inst.pdfViewer.currentScale = Math.max(0.25, Math.min(5, inst.pdfViewer.currentScale * factor));
  };
  const gotoPage = (n) => {
    const inst = instanceRef.current;
    if (!inst?.pdfViewer?.pagesCount) return;
    inst.pdfViewer.currentPageNumber = Math.max(1, Math.min(inst.pdfViewer.pagesCount, n));
  };

  return (
    <div className="w-full h-full flex flex-col">
      <div className="flex items-center gap-1.5 px-2 py-1 border-b border-stone-200 bg-stone-50 text-sm shrink-0">
        <button onClick={() => gotoPage(pageInfo.page - 1)} disabled={!ready || pageInfo.page <= 1}
          className="p-1 border border-stone-300 rounded disabled:opacity-30 hover:bg-white" title={t("上一页", "Previous page")}>
          <ChevronLeft size={12} />
        </button>
        <input
          type="text"
          value={pageInput}
          disabled={!ready}
          onChange={(e) => setPageInput(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") gotoPage(parseInt(pageInput, 10) || 1); }}
          onBlur={() => gotoPage(parseInt(pageInput, 10) || 1)}
          className="w-10 text-center px-1 py-0.5 border border-stone-300 rounded"
        />
        <span className="text-stone-600">/ {pageInfo.count || "—"}</span>
        <button onClick={() => gotoPage(pageInfo.page + 1)} disabled={!ready || pageInfo.page >= pageInfo.count}
          className="p-1 border border-stone-300 rounded disabled:opacity-30 hover:bg-white" title={t("下一页", "Next page")}>
          <ChevronRight size={12} />
        </button>
        <div className="w-px h-4 bg-stone-300 mx-1" />
        <button onClick={() => zoomBy(1 / 1.2)} disabled={!ready} className="w-6 h-6 leading-none border border-stone-300 rounded disabled:opacity-30 hover:bg-white" title={t("缩小", "Zoom out")}>−</button>
        <span className="text-stone-700 w-10 text-center">{scalePct}%</span>
        <button onClick={() => zoomBy(1.2)} disabled={!ready} className="w-6 h-6 leading-none border border-stone-300 rounded disabled:opacity-30 hover:bg-white" title={t("放大", "Zoom in")}>+</button>
      </div>

      <div className="relative flex-1 min-h-0 pdfjs-viewer-root bg-stone-200">
        <div ref={containerRef} className="absolute inset-0 overflow-auto">
          <div ref={viewerDivRef} className="pdfViewer" />
        </div>
        {!ready && !error && (
          <div className="absolute inset-0 flex items-center justify-center text-stone-600 text-sm bg-stone-100">
            {t("加载文档中…", "Loading document…")}
          </div>
        )}
        {error && (
          <div className="absolute inset-0 flex items-center justify-center text-red-500 text-sm bg-stone-100 p-4 text-center">
            {t("加载失败：", "Failed to load: ")}{error}
          </div>
        )}
      </div>
    </div>
  );
};

const FloatingDocPreview = ({ doc, onClose }) => {
  const { t } = useLang();
  const [pos, setPos] = useState({ x: null, y: null }); // null = default position (left edge)
  // Default to a large panel on the left -- big enough to actually read a
  // full document page while the metadata/list stays visible alongside it
  // on the right, rather than the old small bottom-right thumbnail size.
  const [size, setSize] = useState(() => ({
    w: typeof window !== "undefined" ? Math.round(window.innerWidth * 0.4) : 520,
    h: typeof window !== "undefined" ? Math.max(FLOATING_PREVIEW_MIN_H, window.innerHeight - 92) : 520,
  }));
  // True while a drag or resize is in progress — renders a transparent
  // overlay above the iframe so its own event handling can't swallow
  // mousemove/mouseup and freeze the drag mid-gesture.
  const [interacting, setInteracting] = useState(null); // null | "move" | "x" | "y" | "xy"
  const dragRef = useRef(null);

  // "Find in document" — fuzzy text search (see fuzzyFindAll above).
  const [showSearch, setShowSearch] = useState(false);
  const [query, setQuery] = useState("");
  const [docText, setDocText] = useState(null);     // lazily fetched/cached OCR'd text
  const [pageRanges, setPageRanges] = useState(null); // PDF only: text_parts' char ranges per page, for jump-to-page
  const [searching, setSearching] = useState(false);
  const [searchError, setSearchError] = useState("");
  const [matches, setMatches] = useState([]);
  const [matchIdx, setMatchIdx] = useState(-1);
  const [lastSearchedQuery, setLastSearchedQuery] = useState(null);
  // Bumped on every navigation to a match (fresh search or next/prev), even
  // when the resulting matchIdx repeats a previous value (e.g. two
  // different searches that both land on their own match #1) -- matchIdx
  // alone isn't enough to key the iframe reload below, since an unchanged
  // value wouldn't force one. See iframeSrc.
  const [jumpNonce, setJumpNonce] = useState(0);
  const searchInputRef = useRef(null);

  if (!doc) return null;

  const isImage = doc.mime?.startsWith("image/");
  const isPdf = doc.mime === "application/pdf";
  const _ext = (doc.name || "").split(".").pop().toLowerCase();
  const isHeic = doc.mime === "image/heic" || doc.mime === "image/heif" || _ext === "heic" || _ext === "heif";
  const url = isHeic
    ? `${API_BASE}/api/docs/${doc.id}/preview`
    : `${API_BASE}/api/docs/${doc.id}`;

  // Get the document's text once (cached for the life of this panel).
  // PDFs always go through a fresh extraction (never the pre-saved
  // doc.ocrText shortcut): only that call's `info.page_ranges` tells us
  // which page a match falls on, which is what lets the viewer actually
  // jump there -- see pageForOffset. Non-PDFs (images) have no page concept
  // to jump to, so they use the cheaper saved-text shortcut when available.
  const getDocText = async () => {
    if (docText != null) return docText;
    if (!isPdf && doc.ocrText && doc.ocrText.trim()) {
      setDocText(doc.ocrText);
      return doc.ocrText;
    }
    const r = await StorageAdapter.runOcr(doc.id);
    const text = r.text || "";
    setDocText(text);
    setPageRanges(isPdf ? (r.info?.page_ranges || null) : null);
    if (!text) {
      setSearchError(r.hint || t("此文档没有可供搜索的文本（可能需要先运行 OCR）。", "No searchable text could be read from this document (it may need OCR first)."));
    }
    return text;
  };

  const runSearch = async () => {
    const q = query.trim();
    if (!q) return;
    setSearchError("");
    setSearching(true);
    try {
      const text = await getDocText();
      setLastSearchedQuery(q);
      if (!text) { setMatches([]); setMatchIdx(-1); return; }
      const found = fuzzyFindAll(text, q, FUZZY_MATCH_THRESHOLD);
      setMatches(found);
      setMatchIdx(found.length ? 0 : -1);
      setJumpNonce((n) => n + 1);
      if (!found.length) {
        setSearchError(t(`未找到与 "${q}" 相似度 ≥70% 的内容。`, `No text found at least 70% similar to "${q}".`));
      }
    } catch (e) {
      setSearchError(e.message || String(e));
    } finally {
      setSearching(false);
    }
  };

  const goToMatch = (idx) => {
    if (!matches.length) return;
    setMatchIdx(((idx % matches.length) + matches.length) % matches.length);
    setJumpNonce((n) => n + 1);
  };
  const nextMatch = () => goToMatch(matchIdx + 1);
  const prevMatch = () => goToMatch(matchIdx - 1);

  const handleSearchKeyDown = (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    // Repeated Enter on an unchanged query cycles through matches, like a
    // browser find bar; a changed query re-searches from scratch.
    if (matches.length && query.trim() === lastSearchedQuery) nextMatch();
    else runSearch();
  };

  const currentMatch = matchIdx >= 0 ? matches[matchIdx] : null;
  // Which page to jump the PDF.js viewer to -- from the server-side (OCR-
  // capable) text search, so this stays reliable even for scanned pages
  // pdf.js's own text layer can't see. See PdfViewerPanel for how this and
  // the exact matched text (for its bonus in-page highlight) get used.
  const currentMatchPage = currentMatch ? pageForOffset(pageRanges, currentMatch.start) : null;

  const defaultLeft = 16; // pinned to the left edge by default, per user preference
  const curLeft = pos.x != null ? pos.x : defaultLeft;
  const curTop = pos.y != null ? pos.y : 72;

  const onDragStart = (e) => {
    e.preventDefault();
    dragRef.current = { startX: e.clientX, startY: e.clientY, origX: curLeft, origY: curTop };
    setInteracting("move");
    const onMove = (ev) => {
      const d = dragRef.current;
      if (!d) return;
      setPos({ x: d.origX + (ev.clientX - d.startX), y: d.origY + (ev.clientY - d.startY) });
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      dragRef.current = null;
      setInteracting(null);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  // axis: "x" (right edge, width only), "y" (bottom edge, height only),
  // or "xy" (corner, both at once).
  const onResizeStart = (axis) => (e) => {
    e.preventDefault();
    e.stopPropagation();
    dragRef.current = { startX: e.clientX, startY: e.clientY, origW: size.w, origH: size.h };
    setInteracting(axis);
    const onMove = (ev) => {
      const d = dragRef.current;
      if (!d) return;
      const dx = ev.clientX - d.startX;
      const dy = ev.clientY - d.startY;
      setSize((prev) => ({
        w: axis !== "y" ? Math.max(FLOATING_PREVIEW_MIN_W, d.origW + dx) : prev.w,
        h: axis !== "x" ? Math.max(FLOATING_PREVIEW_MIN_H, d.origH + dy) : prev.h,
      }));
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      dragRef.current = null;
      setInteracting(null);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  const interactCursor = interacting === "x" ? "ew-resize"
    : interacting === "y" ? "ns-resize"
    : interacting === "xy" ? "nwse-resize"
    : interacting === "move" ? "grabbing"
    : "default";

  return (
    <div
      className="fixed z-[60] bg-white border border-stone-300 rounded shadow-2xl flex flex-col"
      style={{ top: curTop, left: curLeft, width: size.w, height: size.h }}
    >
      <div
        className="flex items-center justify-between px-3 py-2 border-b border-stone-200 bg-stone-50 cursor-move shrink-0 select-none"
        onMouseDown={onDragStart}
      >
        <div className="text-base font-bold text-stone-700 truncate pr-2">{doc.name}</div>
        <div className="flex items-center gap-1 shrink-0">
          <button
            onClick={() => {
              const opening = !showSearch;
              setShowSearch(opening);
              if (opening) setTimeout(() => searchInputRef.current?.focus(), 0);
            }}
            onMouseDown={(e) => e.stopPropagation()}
            className={`p-1 ${showSearch ? "text-amber-700" : "text-stone-600 hover:text-stone-800"}`}
            title={t("在文档中查找文字（支持模糊匹配）", "Find text in this document (fuzzy matching supported)")}
          >
            <Search size={13} />
          </button>
          <a
            href={url}
            target="_blank"
            rel="noopener noreferrer"
            onMouseDown={(e) => e.stopPropagation()}
            className="text-stone-600 hover:text-stone-800 p-1"
            title={t("在新窗口打开", "Open in a new window")}
          >
            <ExternalLink size={13} />
          </a>
          <button
            onClick={onClose}
            onMouseDown={(e) => e.stopPropagation()}
            className="text-stone-600 hover:text-stone-800 p-1"
            title={t("关闭预览", "Close preview")}
          >
            <X size={14} />
          </button>
        </div>
      </div>

      {showSearch && (
        <div className="border-b border-stone-200 bg-amber-50/40 shrink-0" onMouseDown={(e) => e.stopPropagation()}>
          <div className="flex items-center gap-1 px-2 py-1.5">
            <input
              ref={searchInputRef}
              type="text"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              onKeyDown={handleSearchKeyDown}
              placeholder={t("查找文字…（可与原文不完全一致）", "Find text… (doesn't need to match exactly)")}
              className="flex-1 min-w-0 text-base font-bold px-2 py-1 border border-stone-300 rounded focus:outline-none focus:border-amber-600"
            />
            <button
              onClick={runSearch}
              disabled={searching || !query.trim()}
              className="text-sm font-bold px-2 py-1 border border-stone-300 rounded hover:bg-white disabled:opacity-40 shrink-0"
              title={t("查找", "Find")}
            >
              {searching ? <Loader size={12} className="animate-spin" /> : t("查找", "Find")}
            </button>
            <button
              onClick={prevMatch}
              disabled={matches.length === 0}
              className="p-1 border border-stone-300 rounded hover:bg-white disabled:opacity-30 shrink-0"
              title={t("上一个", "Previous match")}
            >
              <ChevronUp size={12} />
            </button>
            <button
              onClick={nextMatch}
              disabled={matches.length === 0}
              className="p-1 border border-stone-300 rounded hover:bg-white disabled:opacity-30 shrink-0"
              title={t("下一个", "Next match")}
            >
              <ChevronDown size={12} />
            </button>
          </div>

          {(matches.length > 0 || searchError) && (
            <div className="px-2 pb-1.5 text-base font-bold">
              {matches.length > 0 ? (
                <>
                  <div className="text-stone-700 mb-0.5">
                    {t(`第 ${matchIdx + 1} / ${matches.length} 处`, `Match ${matchIdx + 1} of ${matches.length}`)}
                    {currentMatch && currentMatch.score < 1 && (
                      <span className="text-stone-600"> · {t("相似度", "similarity")} {Math.round(currentMatch.score * 100)}%</span>
                    )}
                  </div>
                  {currentMatch && docText && (() => {
                    const s = snippetAround(docText, currentMatch.start, currentMatch.end);
                    return (
                      <div className="bg-white border border-stone-200 rounded px-2 py-1 text-stone-700 leading-snug">
                        {s.before && <span className="text-stone-600">…{s.before} </span>}
                        <mark className="bg-amber-200 text-stone-900 rounded px-0.5">{s.match}</mark>
                        {s.after && <span className="text-stone-600"> {s.after}…</span>}
                      </div>
                    );
                  })()}
                </>
              ) : (
                <div className="text-stone-700">{searchError}</div>
              )}
            </div>
          )}
        </div>
      )}

      <div className="flex-1 min-h-0 bg-stone-100 relative overflow-auto">
        {isPdf ? (
          <PdfViewerPanel
            url={url}
            jumpToPage={currentMatchPage}
            highlightText={currentMatch?.text || null}
            jumpNonce={jumpNonce}
          />
        ) : isHeic ? (
          <iframe src={url} title={doc.name} className="w-full h-full border-0" />
        ) : isImage ? (
          <img src={url} alt={doc.name} className="w-full h-full object-contain bg-white" />
        ) : (
          <div className="w-full h-full flex flex-col items-center justify-center gap-2 text-base font-bold text-stone-700 p-4 text-center">
            <div>{t("此文件类型无法直接预览。", "This file type can't be previewed inline.")}</div>
            <a href={url} target="_blank" rel="noopener noreferrer" className="text-amber-700 hover:text-amber-900 underline">
              {t("在新窗口打开", "Open in a new window")}
            </a>
          </div>
        )}
        {/* Captures mouse events over the iframe while dragging/resizing so
            the gesture can't get stuck mid-drag when the cursor crosses into
            the iframe's own (separate) event handling. */}
        {interacting && (
          <div className="absolute inset-0" style={{ cursor: interactCursor }} />
        )}
      </div>

      {/* Resize handles */}
      <div
        onMouseDown={onResizeStart("x")}
        className="absolute top-0 right-0 w-1.5 h-full cursor-ew-resize"
        title={t("水平拖动可调整宽度", "Drag to resize width")}
      />
      <div
        onMouseDown={onResizeStart("y")}
        className="absolute bottom-0 left-0 w-full h-1.5 cursor-ns-resize"
        title={t("垂直拖动可调整高度", "Drag to resize height")}
      />
      <div
        onMouseDown={onResizeStart("xy")}
        className="absolute bottom-0 right-0 w-4 h-4 cursor-nwse-resize"
        style={{
          background: "linear-gradient(135deg, transparent 0%, transparent 45%, #a8a29e 45%, #a8a29e 55%, transparent 55%, transparent 100%)",
        }}
        title={t("拖动可同时调整宽高", "Drag to resize both width and height")}
      />
    </div>
  );
};

const DocumentCard = ({
  doc, otherRefCount = 0, nodeSn = "",
  onOpen, onOpenNative, onDelete, onUpdateMeta, onUpdateName, onUpdateSn, onUpdateDueDate, onUpdateDocDate, formatBytes, keyParameters = [],
  onOpenEmailSettings,
  faceSelectMode = false, faceSelected = false, onToggleFaceSelect,
  // Generic bulk-select mode (currently used by the recycle bin's
  // "select multiple → permanently delete" toolbar). Kept separate from
  // faceSelectMode, which is image-only and drives a different action, but
  // shares the same checkbox-in-icon-slot presentation below.
  selectMode = false, selected = false, onToggleSelect,
  scheduleMode = false, urgency = null,
  onDragStart, onDragEnd, isDragging = false,
  // "Current document" tracking — lifted up to the parent so the highlight
  // survives after an inline editor closes (e.g. right after saving a due
  // date), or after the viewer is closed, and only moves once a *different*
  // document is opened or edited, instead of vanishing the moment this
  // card's own local editing state resets. Set on opening a document (in
  // the viewer or natively) as well as editing it -- see onOpen/onOpenNative
  // at this card's call site -- so it tracks "the document I'm focused on"
  // generally, not just active edits.
  isLastWorked = false, onMarkWorked,
}) => {
  const { t, lang } = useLang();
  // Always start collapsed — even documents that already have parameters
  // filled in should render as a single line by default. The toggle button
  // below still opens it on demand.
  const [showMeta, setShowMeta] = useState(false);
  const [editingName, setEditingName] = useState(false);
  const [nameDraft, setNameDraft] = useState("");
  const [renamingBusy, setRenamingBusy] = useState(false);
  const [renameError, setRenameError] = useState("");
  const [editingSn, setEditingSn] = useState(false);
  const [snDraft, setSnDraft] = useState("");
  const [editingDue, setEditingDue] = useState(false);
  const [dueDraft, setDueDraft] = useState("");
  const [editingDocDate, setEditingDocDate] = useState(false);
  const [docDateDraft, setDocDateDraft] = useState("");
  const [showSendPhone, setShowSendPhone] = useState(false);
  const [showSendEmail, setShowSendEmail] = useState(false);
  const [floatingPreview, setFloatingPreview] = useState(false);
  const isImage = doc.mime?.startsWith("image/");
  const Icon = isImage ? ImageIcon : FileText;

  // Effective SN: doc's own SN if set, otherwise the parent node's SN.
  const ownSn = (doc.sn || "").trim();
  const effectiveSn = ownSn || nodeSn;
  const isInherited = !ownSn && !!nodeSn;

  // Shows the document in a small floating, draggable panel (not a modal,
  // not a separate OS window) so it stays visible while the metadata fields
  // below/beside it, in this same window, remain focusable and editable.
  const openDocForReference = () => setFloatingPreview(true);

  const startEditName = (e) => {
    e.stopPropagation();
    setNameDraft(doc.name);
    setRenameError("");
    setEditingName(true);
    onMarkWorked && onMarkWorked();
  };
  const commitName = async () => {
    const trimmed = nameDraft.trim();
    if (!trimmed || trimmed === doc.name) { setEditingName(false); return; }
    setRenamingBusy(true);
    setRenameError("");
    try {
      await onUpdateName(trimmed);
      setEditingName(false);
    } catch (e) {
      setRenameError(e.message || String(e));
    } finally {
      setRenamingBusy(false);
    }
  };
  const cancelName = () => { setEditingName(false); setRenameError(""); };

  const startEditSn = (e) => {
    e.stopPropagation();
    setSnDraft(ownSn);
    setEditingSn(true);
    openDocForReference();
    onMarkWorked && onMarkWorked();
  };
  const commitSn = () => {
    onUpdateSn(snDraft);
    setEditingSn(false);
  };
  const cancelSn = () => setEditingSn(false);

  const startEditDue = (e) => {
    e.stopPropagation();
    setDueDraft(doc.dueDate || "");
    setEditingDue(true);
    openDocForReference();
    onMarkWorked && onMarkWorked();
  };
  const commitDue = () => {
    onUpdateDueDate(dueDraft);
    setEditingDue(false);
  };
  const cancelDue = () => setEditingDue(false);

  const pendingDateReview = doc.docDateSource === "auto" && !doc.docDateVerified;

  const startEditDocDate = (e) => {
    e.stopPropagation();
    setDocDateDraft(doc.docDate || "");
    setEditingDocDate(true);
    openDocForReference();
    onMarkWorked && onMarkWorked();
  };
  const commitDocDate = () => {
    onUpdateDocDate(docDateDraft);
    setEditingDocDate(false);
  };
  const cancelDocDate = () => setEditingDocDate(false);

  const cardUrgencyClass = scheduleMode && urgency ? URGENCY_ROW_CLASSES[urgency] : "";
  const showCheckbox = faceSelectMode || selectMode;
  const isChecked = faceSelectMode ? faceSelected : selected;
  const toggleChecked = faceSelectMode ? onToggleFaceSelect : onToggleSelect;

  // "Current document" indicator — true whenever this card has an inline
  // editor open (metadata, name, SN, due date, or doc date), OR it's the
  // document last opened/edited (isLastWorked, lifted to the parent) so the
  // highlight survives after saving/closing the editor or the viewer, and
  // only moves once a *different* document is opened or edited. Distinct
  // from the amber checkbox-selected/urgency colors so whichever document
  // you're currently focused on stands out even among several
  // similarly-named ones in the same folder.
  const isActivelyEditing = showMeta || editingName || editingSn || editingDue || editingDocDate;
  const isEditing = isActivelyEditing || isLastWorked;

  return (
    <div
      draggable={!faceSelectMode && !selectMode}
      onDragStart={(e) => {
        if (faceSelectMode || selectMode) return;
        e.stopPropagation();
        e.dataTransfer.effectAllowed = "move";
        // Custom MIME type marks this as an internal document drag so
        // folder tree nodes can tell it apart from OS file drops and
        // from folder-reorder drags (both use different data shapes).
        e.dataTransfer.setData("application/x-dms-doc", doc.id);
        e.dataTransfer.setData("text/plain", doc.id);
        onDragStart && onDragStart();
      }}
      onDragEnd={() => onDragEnd && onDragEnd()}
      title={showCheckbox ? undefined : t("拖拽到左侧文件夹树可移动此文档", "Drag onto a folder in the tree to move this document there")}
      className={`border rounded bg-white transition-opacity ${
        isDragging ? "opacity-40" :
        isEditing ? "border-indigo-400 bg-indigo-50/60 ring-1 ring-indigo-300" :
        showCheckbox && isChecked ? "border-amber-400 bg-amber-50" :
        cardUrgencyClass || "border-stone-200"
      }`}
    >
      {isEditing && (
        <div className="flex items-center gap-1 px-3 pt-2 text-[12px] font-medium text-indigo-700">
          <Edit2 size={10} /> {isActivelyEditing ? t("正在编辑", "Editing") : t("当前文档", "Current document")}
        </div>
      )}
      <div className="flex items-center gap-3 p-3">
        <div
          className={`w-10 h-10 rounded flex items-center justify-center shrink-0 relative ${showCheckbox ? "cursor-pointer" : "bg-stone-100 text-stone-700"}`}
          onClick={showCheckbox ? (e) => { e.stopPropagation(); toggleChecked && toggleChecked(); } : undefined}
        >
          {showCheckbox ? (
            <div className={`w-10 h-10 rounded border-2 flex items-center justify-center ${isChecked ? "border-amber-500 bg-amber-100" : "border-stone-300 bg-stone-100"}`}>
              {isChecked
                ? <CheckSquare size={18} className="text-amber-600" />
                : <Square size={18} className="text-stone-600" />
              }
            </div>
          ) : (
            <Icon size={18} />
          )}
        </div>
        <div className="flex-1 min-w-0 cursor-pointer" onClick={onOpen}>
          <div className="text-base font-medium text-stone-900 truncate hover:text-amber-700 flex items-center gap-1.5">
            {effectiveSn && (
              <span
                className={`text-sm font-mono px-1.5 py-0.5 rounded shrink-0 ${
                  isInherited
                    ? "bg-stone-100 text-stone-700 italic"
                    : "bg-amber-100 text-amber-800"
                }`}
                title={isInherited
                  ? t(`继承自父节点序列号：${nodeSn}\n点击下方 SN 按钮为此文档设置自定义序列号`, `Inherited from the parent node's serial number: ${nodeSn}\nClick the SN button below to set a custom serial number for this document`)
                  : t(`此文档的自定义序列号（覆盖节点序列号）`, `This document's custom serial number (overrides the node's serial number)`)}
              >
                {effectiveSn}
              </span>
            )}
            <span className="truncate">{doc.name}</span>
          </div>
          <div className="flex gap-2 text-[13px] text-stone-700 font-mono mt-0.5 flex-wrap">
            <span className="flex items-center gap-1"><Hash size={9} /> {doc.id}</span>
            <span>•</span>
            <span>{formatBytes(doc.size)}</span>
            <span>•</span>
            <span className="flex items-center gap-1">
              <Calendar size={9} /> {doc.uploadedAt ? new Date(doc.uploadedAt).toLocaleDateString(lang === "en" ? "en-US" : "zh-CN") : "—"}
            </span>
            {doc.dueDate && (
              <>
                <span>•</span>
                <span className={`flex items-center gap-1 px-1 rounded not-italic ${
                  scheduleMode && urgency ? URGENCY_ROW_CLASSES[urgency] : "text-stone-700"
                }`} title={scheduleMode && urgency ? t(URGENCY_LABELS[urgency].zh, URGENCY_LABELS[urgency].en) : t("到期日", "Due date")}>
                  <Clock size={9} /> {t("到期：", "Due: ")}{doc.dueDate}
                </span>
              </>
            )}
            {doc.docDate && (
              <>
                <span>•</span>
                <span
                  className={`flex items-center gap-1 px-1 rounded not-italic ${pendingDateReview ? "bg-amber-100 text-amber-800" : "text-stone-700"}`}
                  title={pendingDateReview
                    ? t(`此日期由文档内容自动识别（原文："${doc.docDateRaw || doc.docDate}"），尚待核实——点击下方"日期"按钮确认或修改。`, `Auto-detected from the document's own text (matched: "${doc.docDateRaw || doc.docDate}") — not yet verified. Click the Date button below to confirm or correct it.`)
                    : t("此文档的日期（用于参数-时间趋势图）", "This document's date (used by the parameter-vs-time plot)")}
                >
                  {pendingDateReview ? <AlertTriangle size={9} /> : <Calendar size={9} />} {t("日期：", "Date: ")}{doc.docDate}
                </span>
              </>
            )}
            {otherRefCount > 0 && (
              <>
                <span>•</span>
                <span className="text-amber-700 not-italic">
                  {t(`还被其他 ${otherRefCount} 个节点引用`, `Also referenced by ${otherRefCount} other node${otherRefCount === 1 ? "" : "s"}`)}
                </span>
              </>
            )}
          </div>
          {(() => {
            const loc = doc.metadata?.Location;
            const locStr = loc && typeof loc === "object" ? (loc.actual || loc.design) : (typeof loc === "string" ? loc : null);
            return locStr ? (
              <div className="flex items-center gap-1 text-[13px] text-stone-700 mt-0.5 font-sans">
                <MapPin size={9} className="text-amber-600 shrink-0" />
                <span className="truncate">{locStr}</span>
              </div>
            ) : null;
          })()}
        </div>

        {/* Rename button */}
        <button
          onClick={startEditName}
          className="text-[12px] px-2 py-1 border border-stone-300 text-stone-700 hover:bg-stone-100 rounded flex items-center gap-1"
          title={t("重命名此文档（同时更改磁盘上的文件名）", "Rename this document (also renames the file on disk)")}
        >
          <Edit2 size={11} /> {t("重命名", "Rename")}
        </button>

        {/* SN edit button */}
        <button
          onClick={startEditSn}
          className={`text-[12px] px-2 py-1 border rounded font-mono ${
            ownSn
              ? "border-amber-400 bg-amber-50 text-amber-800"
              : "border-stone-300 text-stone-700 hover:bg-stone-100"
          }`}
          title={
            ownSn
              ? t("编辑此文档的自定义序列号", "Edit this document's custom serial number")
              : nodeSn
                ? t("用自定义序列号覆盖继承的序列号", "Override the inherited serial number with a custom one")
                : t("为此文档设置自定义序列号", "Set a custom serial number for this document")
          }
        >
          SN
        </button>

        {/* Due-date edit button */}
        <button
          onClick={startEditDue}
          className={`text-[12px] px-2 py-1 border rounded flex items-center gap-1 ${
            doc.dueDate
              ? (scheduleMode && urgency ? URGENCY_ROW_CLASSES[urgency] : "border-amber-400 bg-amber-50 text-amber-800")
              : "border-stone-300 text-stone-700 hover:bg-stone-100"
          }`}
          title={doc.dueDate ? t("编辑到期日", "Edit due date") : t("为此文档设置到期日", "Set a due date for this document")}
        >
          <Clock size={11} /> {t("到期", "Due")}
        </button>

        {/* Document-date edit button (time axis for the parameter-vs-time plot) */}
        <button
          onClick={startEditDocDate}
          className={`text-[12px] px-2 py-1 border rounded flex items-center gap-1 ${
            pendingDateReview
              ? "border-amber-400 bg-amber-100 text-amber-800"
              : doc.docDate
                ? "border-amber-400 bg-amber-50 text-amber-800"
                : "border-stone-300 text-stone-700 hover:bg-stone-100"
          }`}
          title={pendingDateReview
            ? t("此日期为自动识别，尚待核实", "This date was auto-detected and hasn't been verified yet")
            : doc.docDate ? t("编辑此文档的日期", "Edit this document's date") : t("为此文档设置日期（用于趋势图）", "Set this document's date (used by the trend plot)")}
        >
          {pendingDateReview ? <AlertTriangle size={11} /> : <Calendar size={11} />} {t("日期", "Date")}
        </button>

        <button
          onClick={() => {
            const opening = !showMeta;
            setShowMeta(opening);
            if (opening) { openDocForReference(); onMarkWorked && onMarkWorked(); }
          }}
          className={`text-sm px-2 py-1 border rounded flex items-center gap-1 ${
            showMeta ? "border-amber-400 bg-amber-50 text-amber-800" : "border-stone-300 text-stone-700 hover:bg-stone-100"
          }`}
          title={t("编辑元数据（更改对所有引用此文档的节点生效）", "Edit metadata (changes apply everywhere this document is referenced)")}
        >
          <Tag size={11} /> {Object.keys(doc.metadata || {}).length || ""}
        </button>
        <button
          onClick={onOpenNative}
          className="text-stone-600 hover:text-blue-600 p-1"
          title={t("在本机应用中打开（Preview / 系统默认程序）", "Open in the native app (Preview / system default)")}
        >
          <ExternalLink size={14} />
        </button>
        <button
          onClick={() => setShowSendPhone(true)}
          className="text-stone-600 hover:text-amber-600 p-1"
          title={t("发送至手机（iMessage / 短信）", "Send to phone (iMessage / SMS)")}
        >
          <Phone size={14} />
        </button>
        <button
          onClick={() => setShowSendEmail(true)}
          className="text-stone-600 hover:text-amber-600 p-1"
          title={t("通过邮件发送（附件）", "Send by email (attachment)")}
        >
          <Mail size={14} />
        </button>
        <button
          onClick={onDelete}
          className="text-stone-600 hover:text-red-600 p-1"
          title={
            otherRefCount > 0
              ? t("仅从此节点取消链接（文档仍保留在其他节点）", "Unlink from this node only (the document remains on other nodes)")
              : t("取消链接此文档（将移至未引用列表，文件保留在磁盘上）", "Unlink this document (it will move to the unreferenced list; the file stays on disk)")
          }
        >
          <Trash2 size={14} />
        </button>
      </div>

      {showSendPhone && <SendToPhoneDialog doc={doc} onClose={() => setShowSendPhone(false)} />}
      {showSendEmail && <SendEmailDialog doc={doc} onClose={() => setShowSendEmail(false)} onOpenEmailSettings={onOpenEmailSettings} />}
      {floatingPreview && <FloatingDocPreview doc={doc} onClose={() => setFloatingPreview(false)} />}

      {/* Rename editor row */}
      {editingName && (
        <div className="px-3 pb-3 border-t border-indigo-100 bg-indigo-50/60">
          <div className="flex items-center justify-between mb-1.5 mt-2">
            <div className="text-[12px] uppercase tracking-wider text-stone-700">
              {t("文件名", "File name")}
            </div>
          </div>
          <div className="flex gap-1.5">
            <input
              autoFocus
              type="text"
              value={nameDraft}
              onChange={(e) => setNameDraft(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter") commitName();
                if (e.key === "Escape") cancelName();
              }}
              disabled={renamingBusy}
              className="flex-1 text-sm px-2 py-1 border border-stone-300 rounded font-mono focus:outline-none focus:border-amber-600 disabled:opacity-60"
            />
            <button
              onClick={commitName}
              disabled={renamingBusy}
              className="text-sm px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-50"
            >
              {renamingBusy ? t("保存中…", "Saving…") : t("保存", "Save")}
            </button>
            <button
              onClick={cancelName}
              disabled={renamingBusy}
              className="text-sm px-3 py-1 border border-stone-300 hover:bg-stone-100 rounded disabled:opacity-50"
            >
              {t("取消", "Cancel")}
            </button>
          </div>
          {renameError && (
            <div className="text-[12px] text-red-600 mt-1.5">{renameError}</div>
          )}
          <div className="text-[12px] text-stone-700 mt-1.5 leading-snug">
            {t("此更改会同时重命名磁盘上存储的文件。", "This also renames the actual file stored on disk.")}
          </div>
        </div>
      )}

      {/* SN editor row */}
      {editingSn && (
        <div className="px-3 pb-3 border-t border-indigo-100 bg-indigo-50/60">
          <div className="flex items-center justify-between mb-1.5 mt-2">
            <div className="text-[12px] uppercase tracking-wider text-stone-700">
              {t("此文档的自定义序列号", "This document's custom serial number")}
            </div>
            <button
              onClick={openDocForReference}
              className="text-[12px] text-amber-700 hover:text-amber-900 flex items-center gap-1 shrink-0"
              title={t("悬浮预览文档，以便核对文档上的序列号（不会离开此页面）", "Preview the document in a floating panel to check its serial number, without leaving this page")}
            >
              <ExternalLink size={10} /> {t("查看文档", "View document")}
            </button>
          </div>
          <div className="flex gap-1.5">
            <input
              autoFocus
              type="text"
              value={snDraft}
              onChange={(e) => setSnDraft(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter") commitSn();
                if (e.key === "Escape") cancelSn();
              }}
              placeholder={nodeSn ? t(`留空则继承 "${nodeSn}"`, `Leave blank to inherit "${nodeSn}"`) : t("如不适用请留空", "Leave blank if not applicable")}
              className="flex-1 text-sm px-2 py-1 border border-stone-300 rounded font-mono focus:outline-none focus:border-amber-600"
            />
            <button
              onClick={commitSn}
              className="text-sm px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded"
            >
              {t("保存", "Save")}
            </button>
            <button
              onClick={cancelSn}
              className="text-sm px-3 py-1 border border-stone-300 hover:bg-stone-100 rounded"
            >
              {t("取消", "Cancel")}
            </button>
          </div>
          <div className="text-[12px] text-stone-700 mt-1.5 leading-snug">
            {nodeSn
              ? <>{t("留空将继承父节点序列号：", "Leave blank to inherit the parent node's serial number: ")}<span className="font-mono text-amber-700">{nodeSn}</span></>
              : t("父节点未设置序列号；留空则表示无序列号。", "The parent node has no serial number set; leaving this blank means no serial number.")}
          </div>
        </div>
      )}

      {/* Due-date editor row */}
      {editingDue && (
        <div className="px-3 pb-3 border-t border-indigo-100 bg-indigo-50/60">
          <div className="flex items-center justify-between mb-1.5 mt-2">
            <div className="text-[12px] uppercase tracking-wider text-stone-700">
              {t("此文档的到期日", "This document's due date")}
            </div>
            <button
              onClick={openDocForReference}
