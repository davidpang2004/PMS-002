function Root() {
  const [phase, setPhase] = useState("loading"); // 'loading' | 'setup' | 'change' | 'ready'
  const [storagePath, setStoragePath] = useState("");

  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem("dms_lang") || "zh"; }
    catch { return "zh"; }
  });
  useEffect(() => {
    try { localStorage.setItem("dms_lang", lang); } catch {}
    document.documentElement.lang = lang === "en" ? "en" : "zh";
    document.title = lang === "en" ? "Document Management System (DMS)" : "文件管理系统(DMS)";
  }, [lang]);
  const t = useCallback((zh, en) => (lang === "en" ? en : zh), [lang]);
  const langCtx = useMemo(() => ({ lang, t, setLang }), [lang, t]);

  useEffect(() => {
    (async () => {
      try {
        const s = await StorageAdapter.getSettings();
        if (s.configured && s.exists && s.writable) {
          setStoragePath(s.resolved_path);
          setPhase("ready");
        } else {
          setPhase("setup");
        }
      } catch (e) {
        console.error("Could not reach the DMS server:", e);
        // Show the setup screen anyway — it has clearer error feedback
        setPhase("setup");
      }
    })();
  }, []);

  const handleSaved = () => {
    // Full reload (rather than just flipping phase to "ready") so the
    // server's auth gate gets a fresh chance to evaluate the newly-active
    // project — if it has its own password (see "Per-project identity &
    // password" in dms_server.py), this is what makes the lock screen show
    // up instead of silently rendering the previous project's UI shell.
    window.location.reload();
  };

  const handleChangeFolder = () => setPhase("change");
  const cancelChange = () => setPhase("ready");

  let body;
  if (phase === "loading") {
    body = (
      <div className="h-screen flex items-center justify-center bg-stone-50 text-stone-700 text-base">
        {t("正在连接 DMS 服务器…", "Connecting to the DMS server…")}
      </div>
    );
  } else if (phase === "setup") {
    body = <SettingsScreen isInitialSetup={true} onSaved={handleSaved} />;
  } else if (phase === "change") {
    body = (
      <SettingsScreen
        isInitialSetup={false}
        initialPath={storagePath}
        currentPath={storagePath}
        onSaved={handleSaved}
        onCancel={cancelChange}
      />
    );
  } else {
    body = <DMS storagePath={storagePath} onChangeFolder={handleChangeFolder} />;
  }

  return <LangContext.Provider value={langCtx}>{body}</LangContext.Provider>;
}

/* =============================================================================
 * UI: LINK PICKER MODAL
 * ---------------------------------------------------------------------------
 * Lets the user link an existing document to the current node. Two tabs:
 *   • Search — type a query, see matches across all documents
 *   • Browse — walk the tree and see what's attached to each node
 * Documents already linked to the current node are shown but disabled.
 * =============================================================================
 */
const LinkPicker = ({
  open, onClose, onLink, onLinkMany,
  docIndex, tree, refMap, currentNodeId, currentNodeName,
  formatBytes, getPathFor,
}) => {
  const { t } = useLang();
  const [tab, setTab] = useState("search");
  const [q, setQ] = useState("");
  const [browseNodeId, setBrowseNodeId] = useState(null);
  const [selectedIds, setSelectedIds] = useState(new Set());

  // Drag-to-link: entirely local to this modal, separate from the app-wide
  // drag-to-*move*-a-document feature (draggingDocIdRef/handleDocDragStart/
  // handleDocDropOnNode/moveDocToNode in the main DMS component, used on
  // the real sidebar tree). Dropping here calls onLink (add a reference),
  // never removes any existing link the way a move does.
  //
  // The dragged doc's id is tracked in a ref, not just state: dragover
  // fires continuously (many times a second) starting the instant the
  // cursor enters a drop target, which for a short real-world drag (this
  // rail sits right next to the doc list) can easily happen before React
  // has re-rendered with the dragstart's setDragDocId update -- a plain
  // state read in dragover/drop would then see a stale null and silently
  // ignore the whole drag. The ref is written synchronously in dragstart,
  // so it's always current regardless of render timing (same reasoning as
  // draggingDocIdRef above). `dragDocId` (state) is kept only to drive the
  // dragged row's opacity -- a cosmetic effect where a render's worth of
  // lag doesn't matter.
  const dragDocIdRef = useRef(null);
  const [dragDocId, setDragDocId] = useState(null);
  const [dragOverNodeId, setDragOverNodeId] = useState(null);
  const [linkFeedback, setLinkFeedback] = useState("");

  useEffect(() => {
    if (open) {
      setQ("");
      setBrowseNodeId(tree?.id || null);
      setSelectedIds(new Set());
      setTab("search");
      dragDocIdRef.current = null;
      setDragDocId(null);
      setDragOverNodeId(null);
      setLinkFeedback("");
    }
  }, [open, tree]);

  if (!open) return null;

  // Documents already linked to the current node — shown but not selectable
  const alreadyLinkedHere = new Set(
    (findNode(tree, currentNodeId)?.documents || []).map((d) => d.id)
  );

  const matchesQuery = (entry, words) => {
    if (!words.length) return true;
    const haystack = [
      entry.id,
      entry.name || "",
      entry.ocrText || "",
      ...Object.keys(entry.metadata || {}),
      ...Object.values(entry.metadata || {}).map((v) => {
        if (v && typeof v === "object") return `${v.design || ""} ${v.actual || ""}`;
        return String(v);
      }),
    ].join(" ").toLowerCase();
    return words.every((w) => haystack.includes(w));
  };

  const searchWords = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const searchResults = docIndex.filter((d) => matchesQuery(d, searchWords));

  // Browse mode: docs attached to the currently-browsed node
  const browseNode = browseNodeId ? findNode(tree, browseNodeId) : null;
  const browseDocs = browseNode
    ? (browseNode.documents || [])
        .map((ref) => docIndex.find((e) => e.id === ref.id))
        .filter(Boolean)
    : [];

  const toggleSelect = (id) => {
    if (alreadyLinkedHere.has(id)) return;
    setSelectedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const commit = async () => {
    // One batched call, not a loop of onLink calls -- looping would apply
    // each link against the same pre-commit tree snapshot and each save
    // would overwrite the last (see linkDocsToNode's comment).
    await onLinkMany(Array.from(selectedIds));
    onClose();
  };

  const renderRow = (doc) => {
    const refs = refMap.get(doc.id) || [];
    const linkedHere = alreadyLinkedHere.has(doc.id);
    const selected = selectedIds.has(doc.id);
    return (
      <div
        key={doc.id}
        onClick={() => toggleSelect(doc.id)}
        draggable
        onDragStart={(e) => {
          e.dataTransfer.effectAllowed = "link";
          e.dataTransfer.setData("text/plain", doc.id);
          dragDocIdRef.current = doc.id;
          setDragDocId(doc.id);
        }}
        onDragEnd={() => { dragDocIdRef.current = null; setDragDocId(null); }}
        title={t("也可将此项拖到右侧的文件夹上以链接", "You can also drag this onto a folder on the right to link it there")}
        className={`flex items-center gap-2 p-2 border rounded text-sm cursor-grab active:cursor-grabbing transition-colors ${
          dragDocId === doc.id ? "opacity-40" : ""
        } ${
          linkedHere
            ? "border-stone-200 bg-stone-50 opacity-60 cursor-not-allowed"
            : selected
              ? "border-amber-500 bg-amber-50"
              : "border-stone-200 hover:bg-stone-50 hover:border-stone-300"
        }`}
      >
        <input
          type="checkbox"
          readOnly
          disabled={linkedHere}
          checked={selected || linkedHere}
          className="shrink-0"
        />
        <div className="flex-1 min-w-0">
          <div className="font-medium text-stone-900 truncate">{doc.name}</div>
          <div className="text-[12px] font-mono text-stone-700 mt-0.5 flex flex-wrap gap-2">
            <span>{doc.id}</span>
            <span>· {formatBytes(doc.size)}</span>
            {refs.length === 0 && <span className="text-amber-700">· {t("未引用", "Unreferenced")}</span>}
            {refs.length > 0 && <span>· {t(`已链接至 ${refs.length} 个节点`, `Linked to ${refs.length} node(s)`)}</span>}
            {linkedHere && <span className="text-stone-700 font-semibold">· {t("已在此处链接", "Already linked here")}</span>}
          </div>
        </div>
      </div>
    );
  };

  // Recursive tree renderer, also used as the drag-to-link drop target: a
  // document row dragged from renderRow (either tab) and dropped on a
  // folder here calls onLink(docId, node.id) directly -- purely additive
  // (a new reference), no unlink/move involved, and unrelated to the
  // app-wide drag-to-move feature on the real sidebar tree.
  const renderBrowseTree = (node, depth = 0) => {
    const docCount = (node.documents || []).length;
    const isCurrent = node.id === browseNodeId;
    const isDropTarget = dragOverNodeId === node.id;
    return (
      <div key={node.id}>
        <div
          onClick={() => setBrowseNodeId(node.id)}
          // Unconditional preventDefault -- this tree only ever receives
          // drags originating from renderRow in this same modal, so there's
          // no real "is this a valid drop target" decision to make, and no
          // reason to gate it on state that might not have caught up yet
          // (see dragDocIdRef's comment above).
          onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = "link"; }}
          onDragEnter={(e) => { e.preventDefault(); setDragOverNodeId(node.id); }}
          onDragLeave={() => setDragOverNodeId((cur) => (cur === node.id ? null : cur))}
          onDrop={async (e) => {
            e.preventDefault();
            const docId = dragDocIdRef.current;
            dragDocIdRef.current = null;
            setDragOverNodeId(null);
            setDragDocId(null);
            if (!docId) return;
            await onLink(docId, node.id);
            setLinkFeedback(t(`已链接至 "${node.name}"`, `Linked to "${node.name}"`));
            setTimeout(() => setLinkFeedback(""), 1800);
          }}
          className={`flex items-center gap-1.5 py-1 px-2 cursor-pointer text-sm border-l-2 transition-colors ${
            isDropTarget
              ? "bg-amber-100 border-amber-600 ring-1 ring-inset ring-amber-500"
              : isCurrent
                ? "bg-amber-50 border-amber-600 text-stone-900"
                : "border-transparent text-stone-700 hover:bg-stone-100"
          }`}
          style={{ paddingLeft: `${depth * 12 + 8}px` }}
        >
          <Folder size={12} className="text-amber-700 shrink-0" />
          <span className="truncate flex-1">{node.name}</span>
          {docCount > 0 && (
            <span className="text-[11px] tabular-nums px-1 bg-stone-200 rounded">{docCount}</span>
          )}
        </div>
        {(node.children || []).map((c) => renderBrowseTree(c, depth + 1))}
      </div>
    );
  };

  return (
    <div
      className="fixed inset-0 bg-stone-900/70 z-50 flex items-center justify-center p-4"
      onClick={onClose}
    >
      <div
        className="bg-white w-full max-w-3xl h-[80vh] rounded shadow-2xl flex flex-col"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="px-4 py-3 border-b border-stone-200">
          <div className="flex items-center justify-between">
            <div>
              <div className="text-base font-semibold text-stone-900">{t("链接现有文档", "Link an existing document")}</div>
              <div className="text-[13px] text-stone-700">
                {t("添加至：", "Add to: ")}<span className="font-mono">{currentNodeName}</span>
              </div>
            </div>
            <button
              onClick={onClose}
              className="text-stone-700 hover:text-stone-900 p-1"
            >
              <X size={16} />
            </button>
          </div>
          <div className="flex gap-1 mt-3 text-sm">
            <button
              onClick={() => setTab("search")}
              className={`px-3 py-1.5 rounded ${
                tab === "search"
                  ? "bg-stone-900 text-white"
                  : "border border-stone-300 text-stone-700 hover:bg-stone-100"
              }`}
            >
              {t("搜索", "Search")}
            </button>
            <button
              onClick={() => setTab("browse")}
              className={`px-3 py-1.5 rounded ${
                tab === "browse"
                  ? "bg-stone-900 text-white"
                  : "border border-stone-300 text-stone-700 hover:bg-stone-100"
              }`}
            >
              {t("浏览树", "Browse tree")}
            </button>
          </div>
        </div>

        <div className="flex-1 overflow-hidden flex">
          {tab === "search" && (
            <>
              <div className="flex-1 flex flex-col p-3 gap-2 overflow-hidden">
                <div className="relative shrink-0">
                  <Search
                    size={14}
                    className="absolute left-2.5 top-1/2 -translate-y-1/2 text-stone-600"
                  />
                  <input
                    type="text"
                    autoFocus
                    value={q}
                    onChange={(e) => setQ(e.target.value)}
                    placeholder={t("按编号、文件名或元数据搜索…", "Search by number, filename, or metadata…")}
                    className="w-full pl-8 pr-3 py-1.5 text-sm border border-stone-300 rounded focus:outline-none focus:border-amber-600"
                  />
                </div>
                <div className="text-[13px] text-stone-700 shrink-0">
                  {t(`文件库中共 ${searchResults.length} 份文档`, `${searchResults.length} documents in the library`)}
                </div>
                <div className="flex-1 overflow-auto space-y-1.5">
                  {searchResults.length === 0 && (
                    <div className="text-sm text-stone-700 italic text-center py-8">
                      {docIndex.length === 0
                        ? t("尚未上传任何文档。请先上传文档，再来此处链接到其他节点。", "No documents uploaded yet. Upload a document first, then come back here to link it to other nodes.")
                        : t("没有与搜索条件匹配的文档。", "No documents match your search.")}
                    </div>
                  )}
                  {searchResults.map(renderRow)}
                </div>
              </div>
              {/* Persistent drop-target rail so a search result can be dragged
                  straight onto a folder without switching to the Browse tab. */}
              <div className="w-56 shrink-0 border-l border-stone-200 overflow-auto p-2">
                <div className="text-[11px] text-stone-600 uppercase tracking-wider mb-1.5 px-1">
                  {t("拖到此处以链接", "Drag here to link")}
                </div>
                {tree && renderBrowseTree(tree)}
              </div>
            </>
          )}

          {tab === "browse" && (
            <>
              <div className="w-1/3 border-r border-stone-200 overflow-auto">
                {tree && renderBrowseTree(tree)}
              </div>
              <div className="flex-1 p-3 overflow-auto">
                {browseNode && (
                  <>
                    <div className="text-[13px] font-mono text-stone-700 mb-2">
                      {getPathFor(browseNode.id)}
                    </div>
                    <div className="text-sm uppercase tracking-wider text-stone-700 mb-2">
                      {t("已附加文档", "Attached documents")}
                    </div>
                    <div className="space-y-1.5">
                      {browseDocs.length === 0 && (
                        <div className="text-sm text-stone-700 italic">
                          {t("此节点暂无附加文档。", "No documents attached to this node yet.")}
                        </div>
                      )}
                      {browseDocs.map(renderRow)}
                    </div>
                  </>
                )}
              </div>
            </>
          )}
        </div>

        <div className="px-4 py-3 border-t border-stone-200 flex items-center justify-between">
          <div className="text-sm text-stone-700">
            {linkFeedback
              ? <span className="text-green-700 font-medium">{linkFeedback}</span>
              : selectedIds.size > 0
                ? t(`已选择 ${selectedIds.size} 份文档`, `${selectedIds.size} documents selected`)
                : t("请选择一个或多个文档进行链接，或将其拖到右侧文件夹", "Select one or more documents to link, or drag one onto a folder on the right")}
          </div>
          <div className="flex gap-2">
            <button
              onClick={onClose}
              className="px-4 py-1.5 text-sm border border-stone-300 hover:bg-stone-100 rounded"
            >
              {t("取消", "Cancel")}
            </button>
            <button
              onClick={commit}
              disabled={selectedIds.size === 0}
              className="px-4 py-1.5 text-sm bg-amber-600 hover:bg-amber-700 text-white rounded disabled:opacity-40"
            >
              {t("链接", "Link")} {selectedIds.size > 0 ? `(${selectedIds.size})` : ""}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

/* =============================================================================
 * MAIN APP
 * =============================================================================
 */
function DMS({ storagePath, onChangeFolder }) {
  const { lang, t, setLang } = useLang();
  const importFileRef = useRef(null);

  const triggerImportAndRun = () => {
    if (importFileRef.current) {
      importFileRef.current.value = "";
      importFileRef.current.click();
    }
  };

  const isMacDMS = typeof navigator !== "undefined" && /Mac|iPhone|iPad/.test(navigator.platform);

  // Active project's password/name status (see "Per-project identity &
  // password" in dms_server.py) — used for the lock badge next to the
  // storage-path button below. ProjectMenu fetches its own copy too (for
  // its dialogs), independently of this one.
  const [projectAuthStatus, setProjectAuthStatus] = useState(null);
  useEffect(() => {
    fetch("/api/project-auth/status")
      .then((r) => r.json())
      .then((s) => setProjectAuthStatus(s))
      .catch(() => setProjectAuthStatus(null));
  }, []);

  const [dmsImportDialog, setDmsImportDialog] = useState(null);
  // { file, sourcePath, currentPath, chosenPathMode, customPath, mode,
  //   needsPassword, password }
  // chosenPathMode: "source" | "current" | "custom"
  // needsPassword: true while the .dms file is password-protected (see
  // ProjectMenu's export password dialog) and we haven't yet decrypted it
  // to read its manifest — the dialog shows a password prompt instead of
  // the path picker until inspect-dms succeeds with the right password.
  const [dmsImportBusy, setDmsImportBusy] = useState(false);
  const [dmsImportError, setDmsImportError] = useState(null);

  // Calls inspect-dms with the given password (may be ""); on success shows
  // the normal path-selection dialog, on a wrong/missing password shows the
  // password prompt (with an error once one has actually been tried).
  const inspectDmsFile = async (file, password) => {
    setDmsImportError(null);
    let inspectData = null;
    try {
      const inspectForm = new FormData();
      inspectForm.append("file", file);
      if (password) inspectForm.append("password", password);
      const inspectRes = await fetch("/api/project/inspect-dms", { method: "POST", body: inspectForm });
      inspectData = await inspectRes.json().catch(() => null);
    } catch {}

    // Still locked: either no password was given yet (backend returns
    // ok:true with no source_path), or the one just tried was wrong
    // (backend returns an error) — both carry encrypted:true.
    if (inspectData?.encrypted && !inspectData?.source_path) {
      setDmsImportDialog({ file, needsPassword: true, password: "" });
      if (password) setDmsImportError(inspectData.error || t("密码错误。", "Incorrect password."));
      return;
    }

    const sourcePath = inspectData?.source_path || "";
    const currentPath = storagePath || "";
    const pathsDiffer = sourcePath && sourcePath !== currentPath;
    setDmsImportDialog({
      file,
      sourcePath,
      currentPath,
      chosenPathMode: pathsDiffer ? "source" : "current",
      customPath: "",
      needsPassword: false,
      password,
      projectName: inspectData?.project_name || "",
    });
  };

  const onImportFileChosen = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    e.target.value = "";
    await inspectDmsFile(file, "");
  };

  const doImportFromDialog = async () => {
    if (!dmsImportDialog) return;
    const { file, sourcePath, currentPath, chosenPathMode, customPath, password } = dmsImportDialog;

    let targetPath = "";
    if (chosenPathMode === "source") targetPath = sourcePath;
    else if (chosenPathMode === "current") targetPath = currentPath;
    else targetPath = customPath;

    if (!targetPath.trim()) {
      setDmsImportError(t("请输入目标路径。", "Please enter a destination path."));
      return;
    }

    setDmsImportBusy(true);
    setDmsImportError(null);
    try {
      const form = new FormData();
      form.append("file", file);
      form.append("target_path", targetPath.trim());
      if (password) form.append("password", password);
      const res = await fetch("/api/project/import", { method: "POST", body: form });
      if (res.status === 413) { setDmsImportError(t("文件过大，服务器拒绝接收。请检查服务器配置。", "The file is too large and the server refused it. Please check the server configuration.")); return; }
      if (!res.ok && res.headers.get("content-type")?.includes("text/html")) { setDmsImportError(t(`服务器错误 (${res.status})，请检查终端日志。`, `Server error (${res.status}) — please check the terminal log.`)); return; }
      const data = await res.json();
      if (data.ok) {
        setDmsImportDialog(null);
        try {
          ["dms:databook-selection", "dms:databook-title", "dms:databook-subtitle"].forEach((k) => localStorage.removeItem(k));
        } catch {}
        window.location.reload();
      } else {
        setDmsImportError(data.error || t("导入失败。", "Import failed."));
      }
    } catch (err) {
      setDmsImportError(err.message || t("导入失败。", "Import failed."));
    } finally {
      setDmsImportBusy(false);
    }
  };

  const [tree, setTree] = useState(null);
  const [docIndex, setDocIndex] = useState([]);
  // Always-current mirror of docIndex, re-synced every render. Lets async
  // handlers (e.g. updateDocMetadata, fired once per keystroke) read the
  // latest index instead of a value captured in a stale closure, which
  // otherwise causes rapid successive edits to silently overwrite each other.
  const docIndexRef = useRef(docIndex);
  docIndexRef.current = docIndex;
  const [photoRootNodeId, setPhotoRootNodeId] = useState("");
  const [selectedId, setSelectedId] = useState(null);
  const [expandedIds, setExpandedIds] = useState(new Set());
  const [viewerDoc, setViewerDoc] = useState(null);
  const [loading, setLoading] = useState(true);
  const [editingNode, setEditingNode] = useState(false);
  const [loginPwDrafts, setLoginPwDrafts] = useState({}); // loginId -> password being typed, never persisted to tree state
  const [credCopied, setCredCopied] = useState(null);     // { loginId, type: "account" | "password" } | null — transient copy feedback
  useEffect(() => { setLoginPwDrafts({}); setEditingNode(false); }, [selectedId]);
  const [tab, setTab] = useState("tree");
  const [scheduleMode, setScheduleMode] = useState(false); // "日程" color-coding toggle
  const [showDueList, setShowDueList] = useState(false);   // due-documents list dialog
  const [quitConfirmed, setQuitConfirmed] = useState(false); // server shut down via "退出 DMS"

  // docId -> docIndex entry, for O(1) due-date lookups while walking the tree.
  const docIndexById = useMemo(() => new Map(docIndex.map((d) => [d.id, d])), [docIndex]);

  // nodeId -> most-urgent tier ("red" | "yellow" | "blue" | null) among that
  // node's OWN directly-attached documents only — deliberately NOT recursive
  // into subfolders, so a due date deep in the tree doesn't tint every
  // ancestor folder up to the root. Computed once per tree/docIndex change
  // rather than re-walked on every TreeNode render.
  const nodeUrgencyMap = useMemo(() => {
    const map = new Map();
    const walk = (node) => {
      if (!node) return;
      let worst = null;
      (node.documents || []).forEach((d) => {
        const t = urgencyTier(docIndexById.get(d.id)?.dueDate);
        if (t && (!worst || URGENCY_RANK[t] > URGENCY_RANK[worst])) worst = t;
      });
      map.set(node.id, worst);
      (node.children || []).forEach(walk);
    };
    if (tree) walk(tree);
    return map;
  }, [tree, docIndexById]);

  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [showTextTree, setShowTextTree] = useState(false);   // box-drawing tree view
  const [textTreeMeta, setTextTreeMeta] = useState(false);   // include SN + doc counts
  const [textTreeCopied, setTextTreeCopied] = useState(false);
  const [showPlotDialog, setShowPlotDialog] = useState(false); // parameter-vs-time chart
  const [verifyDatesQueue, setVerifyDatesQueue] = useState(null); // docs with an auto-detected date to confirm after upload

        `Downloaded ${res.count} document(s) to:\n${res.folder}` + (res.skipped?.length ? `\n\n${res.skipped.length} could not be found and were skipped.` : "")
      ));

  // Resizable sidebar — width in pixels, persisted in localStorage.
  // Min/max prevent absurdly small or huge sidebars.
  const SIDEBAR_MIN = 220;
  const SIDEBAR_MAX = 720;
  const SIDEBAR_DEFAULT = 320;
  const [sidebarWidth, setSidebarWidth] = useState(() => {
    try {
      const saved = parseInt(localStorage.getItem("dms:sidebar-width"), 10);

  const [resizing, setResizing] = useState(false);

  // While dragging, listen on the window so movement outside the handle still works
  useEffect(() => {
    if (!resizing) return;
    const onMove = (e) => {
      const w = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, e.clientX));
      setSidebarWidth(w);
    };
    const onUp = () => {
      setResizing(false);
      try { localStorage.setItem("dms:sidebar-width", String(sidebarWidth)); } catch {}
    };

    window.addEventListener("mouseup", onUp);

      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);

    };

  // Save width on every change after dragging ends
  useEffect(() => {
    if (resizing) return;
